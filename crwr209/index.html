<script id="data" type="application/json">{"code": "CRWR 209", "short": "CW", "sub": "Creative Writing · Fiction", "key": "crwr209", "prefix": "W", "unitWord": "", "unitZh": "周", "start": 8, "exams": [{"id": "s3", "label": "Story 3 Review", "units": [4, 5, 6, 7], "note": "Nov 17"}], "units": [{"n": 2, "en": "Beginning with Character", "zh": "人物与冲突", "tag": "", "notes": "<h2>1. 故事从哪里来？（Finding Stories）<\/h2>\n<div class=\"tw\"><table>\n<tr><th>来源<\/th><th>好处<\/th><th>要注意<\/th><\/tr>\n<tr><td class=\"h\">Family &amp; friends 家人朋友<\/td><td>听了一辈子的故事，最熟悉<\/td><td>写出家丑可能伤害身边的人；有些故事\"不是你的\"<\/td><\/tr>\n<tr><td class=\"h\">Overheard 偷听到的<\/td><td>陌生人不怕得罪，可以随意改编；能捡到好台词或一个瞬间<\/td><td>只记碎片，不要整段抄录别人的私事<\/td><\/tr>\n<tr><td class=\"h\">In the news 新闻<\/td><td>素材本身已经\"有趣\"<\/td><td>小心 <b>single story<\/b>（单一视角）：一个牵涉六个人的事件其实是六个故事。练习：从每个人的视角各写一遍<\/td><\/tr>\n<tr><td class=\"h\">Personal experience 亲身经历<\/td><td>最了解，没有版权和归属问题<\/td><td>最暴露自己；用第三人称写自己的一个晚上，再看其中的选择和背后的渴望<\/td><\/tr>\n<\/table><\/div>\n<p class=\"muted\">例：Kim Thúy《Vi》来自亲戚的故事；Tayari Jones 在商场偷听到一对情侣吵架，写成 <i>An American Marriage<\/i>；Emma Donoghue《Room》、《Jaws》来自新闻。<\/p>\n\n<h2>2. Writing from life vs. writing from the world<\/h2>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>Writing from life（写你知道的）<\/th><th>Writing from the world（写你不知道的）<\/th><\/tr>\n<tr><td class=\"h\">素材<\/td><td>自己和身边人的经历、文化<\/td><td>研究、想象，写你没当过的人<\/td><\/tr>\n<tr><td class=\"h\">优点<\/td><td>永远不缺素材；普通生活里就有初恋、离家、家庭冲突<\/td><td>自由无限，整个世界都能写<\/td><\/tr>\n<tr><td class=\"h\">责任<\/td><td>会不会伤害、冒犯身边的人？<\/td><td>什么时候可以讲别人的故事？要做多少研究才能写另一个种族、文化的人？<\/td><\/tr>\n<\/table><\/div>\n<p>两种都没有对错，关键是想清楚好处和你要负的责任。<\/p>\n\n<h2>3. 人物塑造（Character Development）<span class=\"hot\">高频考点<\/span><\/h2>\n<p>好的人物<b>多层次、复杂<\/b>，有天赋也有缺点，像真人一样。作者要比任何人都了解自己的人物：冲动、动机、焦虑、执念。<\/p>\n<ul>\n<li>可以从外在特征列起（年龄、外貌、喜欢吃什么），但要避开 <b>stereotype / cliché<\/b>（刻板印象：油嘴滑舌的二手车销售、学霸亚裔小孩……）<\/li>\n<li>真正要了解的是 <b>inner life<\/b>：情绪、信念、观点、逻辑。工具：<span class=\"k\">character self-questionnaire<\/span>（以人物身份回答问卷）<\/li>\n<li><span class=\"t\">Iceberg effect<\/span>（冰山效应）：人物塑造大部分是<b>幕后工作<\/b>。纸面上只露出精选的一小部分细节，但背后有全部功课的分量<\/li>\n<\/ul>\n<h3>作家们怎么看好人物<\/h3>\n<ul>\n<li><b>冲突<\/b>让人物动起来，才能挖出最深的一面；人物不是一幅静止的画<\/li>\n<li>人物有一个<b>伤口（wound）<\/b>，故事里伤口越来越痛<\/li>\n<li>人物不是单一的，内心有矛盾；句子层面也可以\"自我反驳\"（\"big but delicate\"）<\/li>\n<li>人物要<b>有趣<\/b>：知道他想要什么、怕什么；主角的声音要强<\/li>\n<li>人物有缺点，而且多少知道自己的缺点<\/li>\n<li>不要从\"鄙视\"出发写人物；幽默是好帮手<\/li>\n<\/ul>\n\n<h2>4. 主角（Protagonist）<span class=\"hot\">高频考点<\/span><\/h2>\n<p><span class=\"t\">Protagonist<\/span> = 主角：他的行动、选择和决定推动情节前进，他的情感旅程给故事深度。不一定是英雄，也不一定讨人喜欢，但他的命运必须是<b>读者最在乎<\/b>的。<\/p>\n<ul>\n<li><b>Agency<\/b>（能动性）：主角有没有做选择？选择有没有暴露性格、带来更多麻烦？<\/li>\n<li><span class=\"t\">Yearning<\/span>（渴望）：所有主角都<b>渴望<\/b>某样东西。可以是外在的（赢得烘焙比赛），也可以是内在的（摆脱内疚）。没有渴望就没有故事<\/li>\n<li>找不到主角？看<b>高潮（climax）<\/b>：谁在采取行动、顿悟、做决定，谁就是主角<\/li>\n<\/ul>\n\n<h2>5. 冲突与三层对抗（Antagonism）<span class=\"hot\">高频考点<\/span><\/h2>\n<p><b>Conflict is the engine of a story.<\/b> 主角追求渴望时遇到真正有威胁的阻碍 = 冲突。这些阻碍叫 <span class=\"t\">antagonisms<\/span>（对抗力量），它们的渴望和主角的渴望<b>正好相反<\/b>。对抗越强，主角越有意思。<\/p>\n<div class=\"tw\"><table>\n<tr><th>Level<\/th><th>意思<\/th><th>例子<\/th><\/tr>\n<tr><td class=\"h\">Internal（内在）<\/td><td>主角和<b>自己<\/b>斗：\"I am my own worst enemy\"<\/td><td>身材焦虑、贪婪、不肯相信善意。技巧：把最大的优点推到极端 → 自信变自恋、野心变冷酷、照顾人变成自我牺牲<\/td><\/tr>\n<tr><td class=\"h\">Interpersonal（人际）<\/td><td>主角的渴望和<b>其他人物<\/b>的渴望冲突<\/td><td>想当 CEO 的女儿 vs 想让她结婚生子的妈妈。对手不一定是坏人，只是想要相反的东西；可以贯穿全程，也可以只偶尔出现<\/td><\/tr>\n<tr><td class=\"h\">Societal（社会）<\/td><td>主角对抗社区或世界的<b>信念、法律、偏见<\/b><\/td><td>种族歧视、过时的文化要求、男性主导的环境<\/td><\/tr>\n<\/table><\/div>\n<div class=\"formula\">A compelling protagonist faces all three levels at the same time.<\/div>\n<ul>\n<li><b>为什么要三层同时？<\/b>人物只和他面对的阻碍一样有趣；阻碍要严重到让读者怀疑主角能否成功。对抗不够 = 无聊的主角。三层同时还能带来更多事件、张力和更深的主题<\/li>\n<li><b>对抗是一个\"观念\"<\/b>（比如资本主义、极权）怎么办？观念太抽象，要在三层里各找一个<b>具体<\/b>表现。例：种族歧视 → 社区里的歧视 + 有歧视的人物 + 她自己内心的偏见<\/li>\n<li>\"我不想要冲突，想像真实生活\"→ 不需要枪战车追，但一定要有冲突。从工作、钱、关系里的日常张力找<\/li>\n<\/ul>\n<p class=\"muted\">课堂阅读：Amy Hempel \"In the Cemetery Where Al Jolson Is Buried\"（作者写自己\"最不愿面对的秘密\"：觉得在好友临终时辜负了她）。思考：谁是主角、谁是对抗、他们渴望什么、哪些人物特征被写了、哪些被省略。<\/p>\n<div class=\"sum\">The protagonist's yearning drives the story; conflict comes from antagonisms that want the opposite. A compelling story puts internal, interpersonal and societal antagonism on the protagonist at the same time. Character development is mostly behind-the-scenes work (iceberg effect).<\/div>\n", "terms": [{"t": "Agency", "z": "能动性", "e": "The protagonist makes choices that move the story and reveal character."}, {"t": "Antagonism", "z": "对抗力量", "e": "A force whose yearning opposes the protagonist's; the stronger it is, the more interesting the protagonist."}, {"t": "Antagonism as an idea", "z": "把观念作为对抗", "e": "An abstract idea must show up concretely on all three levels of antagonism."}, {"t": "Character development", "z": "人物塑造", "e": "Behind-the-scenes work to understand a character's inner life: emotions, beliefs, logic."}, {"t": "Character self-questionnaire", "z": "人物自述问卷", "e": "A tool where the writer answers questions as the character to discover them."}, {"t": "Conflict", "z": "冲突：故事的引擎", "e": "Arises when the protagonist pursues a yearning and meets a real obstacle."}, {"t": "Iceberg effect", "z": "冰山效应", "e": "Only a small, chosen set of details shows on the page; the rest of the work stays below."}, {"t": "Inner life", "z": "内心世界", "e": "A character's emotions, beliefs, opinions, motivations and fears."}, {"t": "Internal antagonism", "z": "内在对抗", "e": "The protagonist battles something within themselves: \"I am my own worst enemy.\""}, {"t": "Interpersonal antagonism", "z": "人际对抗", "e": "The protagonist's yearning clashes with another character's; the antagonist need not be evil."}, {"t": "Protagonist", "z": "主角", "e": "The main character whose choices drive the plot and whose fate matters most to the reader."}, {"t": "Single story", "z": "单一视角的故事", "e": "Seeing an event from only one point of view; a story involving six people is six stories."}, {"t": "Societal antagonism", "z": "社会对抗", "e": "The protagonist battles beliefs, laws or prejudices in the community or world."}, {"t": "Stereotype", "z": "刻板印象（避免）", "e": "A one-dimensional shorthand character, e.g., the sleazy car salesman."}, {"t": "Wound", "z": "伤口", "e": "A character's pain that becomes more acute as the story goes on."}, {"t": "Writing from life", "z": "写你知道的", "e": "Drawing on your own experience and the people around you; risk: hurting or embarrassing them."}, {"t": "Writing from the world", "z": "写你不知道的", "e": "Using research and imagination to write people you have never been; responsibility: whose story is it to tell?"}, {"t": "Yearning", "z": "渴望", "e": "What the protagonist wants, external or internal; without yearning there is no story."}]}, {"n": 3, "en": "Microfiction", "zh": "微型小说", "tag": "", "notes": "<h2>1. 什么是 Microfiction？<span class=\"hot\">高频考点<\/span><\/h2>\n<p><span class=\"t\">Microfiction<\/span>（也叫 flash fiction、sudden fiction、short shorts、postcard fiction、palm-of-the-hand stories）：极短的小说，从 <b>6 个词<\/b>到约 <b>250–500 词<\/b>。短，但<b>不简单<\/b>。<\/p>\n<p>它有长篇小说的全部元素：<b>人物、冲突、张力、场景（setting）、开头中间结尾<\/b>；标题和正文一样重要；有严格的字数上限。<\/p>\n<p class=\"muted\">经典 6 词故事：\"For sale: baby shoes, never worn.\" 想想：它为什么算一个故事？<\/p>\n<div class=\"tw\"><table>\n<tr><th>是 microfiction<\/th><th>不是 microfiction<\/th><\/tr>\n<tr><td>完整的故事：有弧线，人物通常会<b>改变<\/b><\/td><td>只描写一个场景或一个人物 = <b>fragment / vignette<\/b>（片段）<\/td><\/tr>\n<tr><td>一句一句揭示新东西，像<b>俄罗斯套娃<\/b>，打开一层还有一层<\/td><td>笑话结构：全部铺垫只为最后一句\"骗到你了\"（\"原来是梦\"\"他早就死了\"）<\/td><\/tr>\n<\/table><\/div>\n\n<h2>2. 写作要点<\/h2>\n<ul>\n<li><b>Micro 的视角<\/b>：长篇写几代人的亲子关系；微型小说只写<b>一个小片段、一个瞬间<\/b>。在大主题里找一个能代表它的小时刻<\/li>\n<li><span class=\"t\">In medias res<\/span>：从中间开始，把读者直接丢进正在进行的事情里<\/li>\n<li><b>Images<\/b>（意象）：精选细节，让读者的想象补全世界。少用复杂比喻，多用<b>直接的感官体验<\/b>（听、摸、尝、闻）<\/li>\n<li>可以靠语言、意象或事件推动，但一定要有<b>弧线<\/b>：有东西<b>升级<\/b>，然后<b>转折<\/b>，揭示一个意外的真相<\/li>\n<li>不要太瘦以致让人看不懂；也不要说教、讲道理、解释，给读者留空间<\/li>\n<li>不能故意对读者藏东西，尤其是视角人物明明知道的事<\/li>\n<li>拒绝<b>现成的套话<\/b>：每个词都要问\"这是最准确、最具体、最有画面的词吗？\"拿掉一个词，整篇都会碎<\/li>\n<li>短不等于写得快：精炼的文字往往要更久；好处是可以改很多稿<\/li>\n<\/ul>\n<p class=\"muted\">课上例文：Amy McCarthy \"Nervous\"（55 词，结尾翻转）；Kim Chinquee \"Hey Baby\"（逛商场的情侣原来是要上前线的士兵）；Becky Robison \"Baby Dolls\"；Alex Kuo \"Growing Tomatoes\"：<b>番茄<\/b>这个意象反复出现（童年父亲榨番茄汁 → 自己种番茄却不吃 → 结尾番茄\"像血一样爆开\"），串起对亡父的感情。<\/p>\n\n<h2>3. 写作的两种脑子<\/h2>\n<div class=\"tw\"><table>\n<tr><th>Draft-writing mind（写初稿的脑）<\/th><th>Editorial mind（编辑的脑）<\/th><\/tr>\n<tr><td>自由、凭直觉、可以乱写、可以失败，常有大发现<\/td><td>精确、严格：找陈词滥调、弱点，推敲每个词<\/td><\/tr>\n<\/table><\/div>\n<p>两种脑子<b>不要混用<\/b>。写初稿时别让编辑脑捣乱；改稿时要承认第一个想法不一定最好。<b>好作家都是好的改稿者。<\/b>下面的风格建议是给<b>改稿<\/b>用的。<\/p>\n\n<h2>4. 更强的用词（Stronger word choices）<span class=\"hot\">高频考点<\/span><\/h2>\n<p>名词和动词是好文字的基础。多用<b>具体名词、准确的主动动词<\/b>，少用形容词、副词。<\/p>\n<div class=\"tw\"><table>\n<tr><th>避免<\/th><th>改前<\/th><th>改后<\/th><\/tr>\n<tr><td class=\"h\">泛泛的形容词（big, nice, ugly…）<\/td><td>his ugly and worn out shoes<\/td><td>his scuffed brown loafers<\/td><\/tr>\n<tr><td class=\"h\">形容词堆砌<\/td><td>the bright, glass-walled boardroom … the large, oak-veneered table … high-backed black leather chair<\/td><td>He entered the glass-walled boardroom and took the closest seat.<\/td><\/tr>\n<tr><td class=\"h\">泛泛的副词<\/td><td>He ran quickly.<\/td><td>He sprinted.<\/td><\/tr>\n<tr><td class=\"h\">中性动词（went, sat, moved, seemed）<\/td><td>The clerk went very quickly from room to room.<\/td><td>The clerk rushed from room to room.（但别用 rocketed：太夸张，melodrama 是大忌）<\/td><\/tr>\n<tr><td class=\"h\">程度副词（very, really, just, almost）<\/td><td>He almost nearly fell over the curb.<\/td><td>He tripped.<\/td><\/tr>\n<tr><td class=\"h\">中性数量词（some, many, someone）<\/td><td>Some soldiers stormed the garret.<\/td><td>Soldiers stormed the garret.<\/td><\/tr>\n<tr><td class=\"h\">抽象<\/td><td>A period of unfavourable weather set in.<\/td><td>It began to rain.<\/td><\/tr>\n<tr><td class=\"h\">用副词代替动作<\/td><td>\"I love you,\" he said unconvincingly.<\/td><td>\"I love you.\" He picked a seed from his teeth.<\/td><\/tr>\n<\/table><\/div>\n<p class=\"muted\">sat 可以换成 perched / slouched / hunched，每个情绪都不同。Flaubert：\"只有一个词能准确表达，去找它。\"<\/p>\n<h3>避免别扭的句子<\/h3>\n<ul>\n<li><b>不合逻辑<\/b>：His eyes fell to the floor. / He ran through the door.（字面意思很荒谬）<\/li>\n<li><b>少用 -ing<\/b>：She was watching TV while the baby was crying → She watched TV while the baby cried.<\/li>\n<li><b>不可能同时进行的动作<\/b>：Slamming the car door, he locked it… → He slammed the car door, locked it, and hurried into the house.<\/li>\n<li><b>不写拟声词<\/b>（BAM! CRASH!）：描述声音 → The loose shutters clattered in the wind.<\/li>\n<\/ul>\n\n<h2>5. Front-loading：更强的开头<\/h2>\n<p>作者常常要写一段才\"热身\"进入故事。初稿写完后问：<b>故事真正从哪里开始？读者需要知道什么？<\/b>长篇的背景交代、人物介绍、世界观铺陈会消耗读者耐心，尤其字数有限时。<\/p>\n<p><span class=\"t\">Front-loaded opening<\/span>：第一句就制造张力和悬念，抛出读者想知道答案的问题，同时交代人物、场景、处境和类型。<\/p>\n<p>例：<b>\"We'd been out of orbit for three weeks when the water filtration system died.\"<\/b>（14 词：太空、一群人、生存危机、科幻）<\/p>\n<p class=\"muted\">练习：写 10 个 front-loaded 的开头句。<\/p>\n<div class=\"sum\">Microfiction is a complete story in very few words, not a fragment or a joke with a twist. Focus on one moment, start in medias res, use concrete sensory images, and make something escalate and turn. Edit with specific nouns and precise verbs; front-load the opening.<\/div>\n", "terms": [{"t": "Adverbs of degree", "z": "程度副词（避免）", "e": "Very, really, just, almost; cut them."}, {"t": "Concrete sensory detail", "z": "具体感官细节", "e": "Details of sight, sound, touch, taste and smell instead of abstraction."}, {"t": "Draft-writing mind", "z": "写初稿的脑", "e": "Free, intuitive and messy; where discoveries happen."}, {"t": "Editorial mind", "z": "编辑的脑", "e": "Precise and uncompromising; hunts clichés and weak words during revision."}, {"t": "Escalate and turn", "z": "升级与转折", "e": "Something builds, then turns to reveal an unexpected truth."}, {"t": "Fragment / vignette", "z": "片段", "e": "A description of a scene or character without a story arc; not microfiction."}, {"t": "Front-loading", "z": "前置开头", "e": "An opening sentence that creates tension and establishes character, setting, situation and genre."}, {"t": "Generic adjectives", "z": "泛泛的形容词（避免）", "e": "Words like big, nice, ugly that build no image; use specific details instead."}, {"t": "Image", "z": "意象", "e": "A concrete sensory detail that lets the reader's imagination fill in the world and evokes emotion."}, {"t": "In medias res", "z": "从中间开始", "e": "Opening in the middle of the action, as if the story were already underway."}, {"t": "Joke structure", "z": "笑话结构（避免）", "e": "All misdirection with a \"fooled you\" ending, e.g., \"it was all a dream\"."}, {"t": "Matryoshka effect", "z": "套娃效果", "e": "Each sentence reveals something new, like nested dolls."}, {"t": "Melodrama", "z": "狗血、夸张", "e": "Overblown language or emotion; the kiss of death in fiction."}, {"t": "Microfiction", "z": "微型小说", "e": "A complete story in very few words (6 to about 500); also flash fiction or sudden fiction."}, {"t": "Neutral verbs", "z": "中性动词（避免）", "e": "Went, sat, moved, seemed; replace with precise verbs like perched or slouched."}, {"t": "Sound effects", "z": "拟声词（避免）", "e": "BAM! CRASH! Describe the sound instead: the shutters clattered."}]}, {"n": 4, "en": "Point of View", "zh": "视角", "tag": "", "notes": "<h2>1. 为什么视角这么重要？<\/h2>\n<p>电影电视大多用摄像机的外部视角，不在乎视角一致；小说里 <span class=\"t\">point of view (POV)<\/span> 是连接读者和人物的最重要工具，让读者觉得自己<b>住在<\/b>故事里，而不只是远远旁观。<\/p>\n<p>POV 要<b>有意选择、前后一致<\/b>，并由人物是谁来决定：他的品味、偏见、用词渗透到每一句。POV 就像一副<b>染上人物颜色的眼镜<\/b>。<\/p>\n<p>选 POV 的核心问题：<b>哪个视角让你（和读者）最深入地进入主角和故事的情感旅程？<\/b><\/p>\n\n<h2>2. Observation → Perception → Judgment<span class=\"hot\">高频考点<\/span><\/h2>\n<p>POV 不只是用哪个代词。把人物意识看成三步，就不用写一堆内心独白：<\/p>\n<div class=\"tw\"><table>\n<tr><th>步骤<\/th><th>问题<\/th><th>例：路边一个唱民谣的街头艺人<\/th><\/tr>\n<tr><td class=\"h\">Observation 观察<\/td><td>这个人物会注意到哪些<b>具体感官细节<\/b>？<\/td><td>音乐？一群女孩？吉他盒里的零钱？人行道太挤？<\/td><\/tr>\n<tr><td class=\"h\">Perception 理解<\/td><td>他怎么<b>解读<\/b>这些细节？<\/td><td>\"他在做自己热爱的事\" 还是 \"他已经跌到谷底\"？<\/td><\/tr>\n<tr><td class=\"h\">Judgment 判断<\/td><td>他得出什么<b>结论<\/b>，和自己的处境有什么关系？<\/td><td>\"有些人天生就穷\" 或 \"城市噪音里有人在拼命唱自己的歌\"<\/td><\/tr>\n<\/table><\/div>\n<p>这样，故事里所有描写都经过人物过滤。描写一场豪华婚礼，如果能揭示看婚礼的人物的新东西，效果要好得多。<\/p>\n\n<h2>3. 视角类型<span class=\"hot\">高频考点<\/span><\/h2>\n<div class=\"tw\"><table>\n<tr><th>POV<\/th><th>是什么<\/th><th>优点<\/th><th>难点<\/th><\/tr>\n<tr><td class=\"h\">First person protagonist \"I\"<\/td><td>叙述者就是主角，讲自己的事<\/td><td>最亲密；读者马上听到人物独特的声音；可以写成不可靠叙述者<\/td><td>只能写人物自己看得到、懂得到的（例：《Room》里 5 岁的 Jack）；声音容易变得千篇一律，要刻意让它独特<\/td><\/tr>\n<tr><td class=\"h\">First person witness \"I\"<\/td><td>\"我\"讲<b>别人<\/b>（主角）的故事（\"Call me Ishmael\"）<\/td><td>主角讲不了自己的故事时（死了、失踪）很有用；能客观看到主角的缺点；\"两段情感旅程\"<\/td><td>要给叙述者和主角<b>各写一条情感弧线<\/b>，而且两者分不开（拿掉叙述者故事就不成立）<\/td><\/tr>\n<tr><td class=\"h\">Third person limited \"he/she/they\"<\/td><td>第三人称，但只进入<b>一个<\/b>人物的内心<\/td><td><b>最常见、最灵活<\/b>：可远可近（narrative distance），可以在人物间切换<\/td><td>没深入人物时会像摄像机一样生硬。写的时候要像<b>演员<\/b>进入人物，不是摄像机<\/td><\/tr>\n<tr><td class=\"h\">Third person omniscient<\/td><td>全知：可以进入<b>多个<\/b>人物的内心<\/td><td>哪里都能去；适合情节驱动或讽刺小说<\/td><td>短篇里很少见；容易显得笨拙业余、写太多不必要的想法；读者难以和任何一个人深度连接。要<b>一贯使用<\/b>，不是偶尔滑进去<\/td><\/tr>\n<tr><td class=\"h\">Second person \"you\"<\/td><td>\"你\"可以指读者、某个人物，或叙述者过去的自己<\/td><td>有冲击力、实验性、有能量<\/td><td>要有情感和主题上的理由，否则显得噱头<\/td><\/tr>\n<tr><td class=\"h\">First person plural \"we\"<\/td><td>主角是<b>一群人<\/b>（罢工矿工、一群男孩）<\/td><td>同上<\/td><td>同上：为什么是一个群体？<\/td><\/tr>\n<\/table><\/div>\n<p class=\"muted\">新手写第三人称有限视角时，常常不小心滑进全知视角，要注意。全知视角例：Annie Proulx《The Shipping News》几句话里在三个人物之间流畅切换，非常克制。<\/p>\n\n<h2>4. 不可靠叙述者（Unreliable narrator）<\/h2>\n<p>每个第一人称都有点不可靠：人都有偏见、欲望、自欺。<span class=\"t\">Unreliable narrator<\/span> 是把这一点推得更远，制造\"读者该不该相信\"的张力。不要用老旧或冒犯性的分类（比如因为精神疾病所以不可靠）。用四个问题思考：<\/p>\n<ol>\n<li>不可靠是<b>无意的<\/b>（天真的孩子、局外人、不想看见真相）还是<b>有意的<\/b>（有隐藏目的、操纵读者同情、美化自己）？<\/li>\n<li>有没有读者<b>可以信任<\/b>的时刻？完全不可信会让读者失去情感连接、张力流失。弄清楚他在<b>什么事上<\/b>不可靠，能更深地理解他<\/li>\n<li>不可靠掩盖了什么<b>脆弱或伤口<\/b>？不可靠像一层盔甲，下面藏着什么？<\/li>\n<li>有没有避开<b>老套的反转<\/b>（\"我早就死了\"\"其实我有多重人格\"\"都是梦\"）？反转只能用一次（《Fight Club》《The Sixth Sense》已经用过了）。不可靠要<b>早点建立<\/b>，随故事发展，不要结尾才突然揭晓<\/li>\n<\/ol>\n\n<h2>5. 叙述 vs. 内心独白<span class=\"hot\">易错点<\/span><\/h2>\n<p><span class=\"t\">Interior monologue<\/span>（内心独白：直接写人物的想法）常常闯进叙述。要尽量用<b>POV 叙述<\/b>代替它，原因有两个：<\/p>\n<ol>\n<li><b>Show, don't tell<\/b>：内心独白在\"解释\"情绪，读者没画面可看，还被困在人物吵闹的脑子里<\/li>\n<li>造成<b>叙述声音分裂<\/b>：读者信任的叙述声音被打断<\/li>\n<\/ol>\n<div class=\"tw\"><table>\n<tr><th>版本<\/th><th>例子<\/th><\/tr>\n<tr><td class=\"h\">✗ 内心独白<\/td><td>Darn, here comes Shaun. Argh, I really hate him. Why is he talking to Sally???<\/td><\/tr>\n<tr><td class=\"h\">✓ POV 叙述<\/td><td>And there was Shaun, the gym bro, gold chain glinting behind the open V of his dress shirt, leaning down over Sally's desk.<\/td><\/tr>\n<\/table><\/div>\n<h3>怎么改<\/h3>\n<ul>\n<li>想法<b>不要加引号<\/b>，也<b>不要用斜体<\/b>；\"I thought to myself\" 多余（还能想给谁？）<\/li>\n<li>把想法<b>融进叙述声音<\/b>：I tried to look as if it didn't bother me, hoped he couldn't see how much we needed the money.<\/li>\n<li>删掉 <b>felt / heard / saw<\/b> 这类过滤词：She felt the sun warm on her face → <b>The sun warmed her face.<\/b><\/li>\n<li>第三人称里内心独白特别突兀（突然冒出\"I\"）。<br>更好：He looked hung-over. Was he drinking again? Should she say something?<br>最好：Her boss hunched in his chair, eyes bloodshot, skin a greyish hue. <b>Back on the drink?<\/b>（保留一点人物声音）<\/li>\n<\/ul>\n<div class=\"sum\">POV should be deliberate and consistent, filtering everything through observation, perception and judgment. Third person limited is the most common and flexible POV; first person is intimate but limited. Replace interior monologue with integrated POV narration: no quotation marks, no italics, no \"she thought\".<\/div>\n", "terms": [{"t": "Filter words", "z": "过滤词（删掉）", "e": "Felt, heard, saw: \"The sun warmed her face\" instead of \"She felt the sun.\""}, {"t": "First person plural", "z": "第一人称复数", "e": "\"We\": the protagonist is a group."}, {"t": "First person protagonist", "z": "第一人称主角", "e": "\"I\" tells their own story; intimate but limited to what they know."}, {"t": "First person witness", "z": "第一人称见证者", "e": "\"I\" tells another character's story; needs an emotional arc for both."}, {"t": "Gimmicky twist", "z": "噱头式反转（避免）", "e": "E.g., \"I was dead all along\"; works only once."}, {"t": "Integrated narration", "z": "融合式叙述", "e": "Character thought blended into the narrative voice, without quotation marks or italics."}, {"t": "Interior monologue", "z": "内心独白", "e": "Directly reported character thoughts; tends to tell, not show."}, {"t": "Judgment", "z": "判断", "e": "The conclusions the character forms and relates to their own situation."}, {"t": "Narrative distance", "z": "叙述距离", "e": "How close or far the narration is from the character; third person can zoom in and out."}, {"t": "Observation", "z": "观察", "e": "The concrete sensory details a character notices."}, {"t": "Perception", "z": "理解", "e": "How the character interprets the details."}, {"t": "Point of view (POV)", "z": "视角", "e": "The character's consciousness through which the reader experiences the story; deliberate and consistent."}, {"t": "Second person", "z": "第二人称", "e": "\"You\" addresses the reader, a character or the narrator's past self."}, {"t": "Show, don't tell", "z": "展示，而非告知", "e": "Let the reader experience emotion through concrete detail instead of explanation."}, {"t": "Third person limited", "z": "第三人称有限", "e": "Enters one character's mind; the most common and flexible POV."}, {"t": "Third person omniscient", "z": "第三人称全知", "e": "Enters many characters' minds; rare in short fiction and must be consistent."}, {"t": "Unreliable narrator", "z": "不可靠叙述者", "e": "A narrator the reader cannot fully trust, intentionally or unintentionally."}]}, {"n": 5, "en": "Story Design", "zh": "故事设计", "tag": "", "notes": "<h2>1. 故事设计：两套共生系统<\/h2>\n<p>\"故事设计\"不是公式，而是<b>骨架<\/b>：每个人骨头一样，外表完全不同。<\/p>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>Internal journey（内在旅程）<\/th><th>External journey（外在旅程）<\/th><\/tr>\n<tr><td class=\"h\">是什么<\/td><td>穿越<b>情绪<\/b>的旅程：信念系统的变化<\/td><td>穿越<b>事件<\/b>的旅程：发生了什么<\/td><\/tr>\n<tr><td class=\"h\">关键部件<\/td><td>Opening belief → challenges → closing belief<\/td><td>Inciting incident → rising action → crisis → climax → denouement<\/td><\/tr>\n<tr><td class=\"h\">从哪入手<\/td><td>先想人物的信念会怎么变<\/td><td>先排情节：导火索、危机、高潮<\/td><\/tr>\n<\/table><\/div>\n<p>两者是<b>共生<\/b>的，不是两个分开的模型。快节奏惊悚小说偏重外在旅程，靠内在旅程提供情感深度；内省、抒情的小说偏重内在旅程，但要有足够的外在旅程维持节奏。<\/p>\n\n<h2>2. 内在旅程：信念系统的变化<span class=\"hot\">高频考点<\/span><\/h2>\n<div class=\"formula\">Opening belief system → Challenges (deeper and deeper) → Closing belief system<\/div>\n<h3>课程例子：丧妻的父亲<\/h3>\n<div class=\"tw\"><table>\n<tr><th>阶段<\/th><th>发生了什么<\/th><\/tr>\n<tr><td class=\"h\">Inciting incident<\/td><td>妻子去世；葬礼后的招待会上他几乎无法正常说话，在浴室盯着药瓶<\/td><\/tr>\n<tr><td class=\"h\">Opening belief<\/td><td>\"没有妻子，活着没有意义\"<\/td><\/tr>\n<tr><td class=\"h\">Challenge 1：工作<\/td><td>同事很支持他，但他看别人说笑只觉得更孤独，甚至开始搞砸工作 → 被劝休假。信念没变<\/td><\/tr>\n<tr><td class=\"h\">Challenge 2：朋友<\/td><td>朋友做饭、照顾孩子，但他觉得他们不像他那样懂她；被劝把她的衣服捐掉 → 疏远朋友。挑战更深，信念仍没变<\/td><\/tr>\n<tr><td class=\"h\">Challenge 3：互助小组的女人<\/td><td>同样丧偶，终于有人懂他，甚至能笑了 → 最深的挑战。但她想合并两家人、一起过圣诞，他发现她不是妻子 → 退回原来的信念<\/td><\/tr>\n<tr><td class=\"h\">Challenge 4：孩子（真正改变他的）<\/td><td>看见孩子们在后院挖坑玩\"葬礼\"游戏，才意识到孩子也在受苦；第二天想做早餐却失控吼女儿 → 躲进衣柜看老照片，彻底崩溃，明白妻子会希望他照顾好孩子<\/td><\/tr>\n<tr><td class=\"h\">Closing belief<\/td><td>\"没有她的生活也许不值得，但我要为孩子活下去\"；结尾和孩子一起耙落叶，不是一夜变好，但他们在一起<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li>挑战要一个比一个<b>更深<\/b>；选择什么做挑战，显示人物<b>到底是谁<\/b><\/li>\n<li>写的时候不会按\"工作一章、朋友一章\"顺序写，而是<b>穿插<\/b>不同挑战的场景<\/li>\n<li><b>信念不变怎么办？<\/b>如果面对越来越深的挑战仍然不变 → 读起来是<b>悲剧<\/b>（麦克白、奥赛罗）。人物可以抗拒改变，但要写出抗拒的挣扎，以及他为此<b>牺牲或承受了什么<\/b>，结尾他还是和开头不同<\/li>\n<\/ul>\n<p class=\"muted\">练习：写下主角的 opening belief、3–4 个挑战、哪个挑战最终改变了他、closing belief。<\/p>\n\n<h2>3. 外在旅程：三幕结构<span class=\"hot\">高频考点<\/span><\/h2>\n<p>课程用《三只小猪》讲解：<\/p>\n<div class=\"tw\"><table>\n<tr><th>部件<\/th><th>意思<\/th><th>三只小猪<\/th><\/tr>\n<tr><td class=\"h\">Status quo<\/td><td>故事开始前的常态<\/td><td>在妈妈家的树洞里看电视、吃妈妈做的饭<\/td><\/tr>\n<tr><td class=\"h\">Inciting incident（导火索）<\/td><td>打破常态的事件；回答\"<b>为什么是现在？<\/b>\"<\/td><td>被赶出家门，必须自己闯世界<\/td><\/tr>\n<tr><td class=\"h\">Rising action（上升动作）<\/td><td>事件的<b>规模和严重性必须越来越大<\/b><\/td><td>狼先吹倒稻草屋，再吹倒木棍屋（顺序反过来就没有张力）<\/td><\/tr>\n<tr><td class=\"h\">Hope &amp; despair（希望与绝望的拉扯）<\/td><td>好事坏事交替，读者猜不到结果；全是坏事或全是好事都会无聊<\/td><td>房子倒了（绝望）→ 逃到兄弟家（希望）<\/td><\/tr>\n<tr><td class=\"h\">Crisis（危机）<\/td><td>主角和对手的渴望撞到一起，<b>必须有一方改变<\/b>；主角最低谷 = <b>Dark Night of the Soul<\/b><\/td><td>三只猪躲在砖房里，狼在门外<\/td><\/tr>\n<tr><td class=\"h\">Climax（高潮）<\/td><td>主角<b>采取行动、做决定、顿悟<\/b>；最好版本的主角<\/td><td>第三只猪让狼从烟囱进来，掉进滚烫的汤锅<\/td><\/tr>\n<tr><td class=\"h\">Denouement（结局）<\/td><td>展现<b>新的常态<\/b><\/td><td>从此幸福生活<\/td><\/tr>\n<\/table><\/div>\n<p class=\"muted\">课堂阅读：Alicia Elliott \"Unearth\"（殖民历史、寄宿学校与代际创伤）。练习找出：开头信念、各个挑战、导致改变的挑战、结尾信念；导火索、上升动作、危机、高潮、结局。<\/p>\n<div class=\"sum\">A story balances an internal journey (opening belief → deepening challenges → closing belief) and an external journey (inciting incident → rising action with hope and despair → crisis → climax → denouement). If the belief never changes, the story reads as tragedy.<\/div>\n", "terms": [{"t": "Challenges to belief", "z": "信念的挑战", "e": "Deeper and deeper tests of the opening belief."}, {"t": "Climax", "z": "高潮", "e": "The protagonist acts, decides or has an epiphany; the character at their best."}, {"t": "Closing belief system", "z": "结尾信念", "e": "What the character believes at the end after the decisive challenge."}, {"t": "Crisis", "z": "危机", "e": "Protagonist's and antagonist's yearnings collide and something must give; the lowest point."}, {"t": "Dark Night of the Soul", "z": "灵魂的至暗时刻", "e": "The protagonist's lowest moment at the crisis."}, {"t": "Denouement", "z": "结局", "e": "Shows the new status quo after the climax."}, {"t": "External journey", "z": "外在旅程", "e": "The journey through events: what happens."}, {"t": "Hope and despair", "z": "希望与绝望的拉扯", "e": "Positive and negative events alternate so the reader can't predict the outcome."}, {"t": "Inciting incident", "z": "导火索事件", "e": "The event that breaks the status quo and answers \"why now?\""}, {"t": "Internal journey", "z": "内在旅程", "e": "The emotional journey: a change in the character's belief system."}, {"t": "Opening belief system", "z": "开头信念", "e": "What the character believes at the start, often faulty."}, {"t": "Rising action", "z": "上升动作", "e": "Events must increase in magnitude and severity."}, {"t": "Status quo", "z": "常态", "e": "Life before the story's change begins."}, {"t": "Story design", "z": "故事设计", "e": "A skeleton of internal and external journeys, not a formula."}, {"t": "Tragedy", "z": "悲剧：信念不变", "e": "When a character clings to the opening belief despite every challenge (Macbeth, Othello)."}]}, {"n": 6, "en": "Scene, Summary & Backstory", "zh": "场景、概括与背景故事", "tag": "", "notes": "<h2>1. 四种叙述方式<span class=\"hot\">高频考点<\/span><\/h2>\n<div class=\"tw\"><table>\n<tr><th>方式<\/th><th>时间<\/th><th>用来做什么<\/th><\/tr>\n<tr><td class=\"h\"><b>Scene<\/b>（场景）<\/td><td><b>实时<\/b><\/td><td>通过对话和动作近距离呈现；戏剧化冲突、关系变化、情感转变。<b>所有重要时刻都要写成场景<\/b><\/td><\/tr>\n<tr><td class=\"h\"><b>Narrative summary<\/b>（叙述概括）<\/td><td><b>压缩时间<\/b><\/td><td>快速带过次要事件、时间流逝、一段 backstory<\/td><\/tr>\n<tr><td class=\"h\"><b>Exposition / description<\/b>（说明/描写）<\/td><td>暂停<\/td><td>Exposition <b>解释<\/b>（背景、历史、社会规则），description <b>描绘<\/b>（地点、人物）<\/td><\/tr>\n<tr><td class=\"h\"><b>Half scene<\/b>（半场景）<\/td><td>概括里插一个瞬间<\/td><td>在概括中落到一个具体时刻，让读者短暂\"在场\"<\/td><\/tr>\n<\/table><\/div>\n\n<h2>2. 场景（Scene）<\/h2>\n<ul>\n<li>不是生活里每件事都值得写成场景：日常琐事、时间流逝、寒暄都不需要<\/li>\n<li>写成场景 = 告诉读者\"要发生重要的事了\"。<b>删掉这个场景对故事没影响？那就删掉或重写<\/b><\/li>\n<li>场景需要：<b>情绪状态发生转变<\/b>，或展示对故事很核心的事<\/li>\n<\/ul>\n<h3>作家们的建议<\/h3>\n<ul>\n<li>场景要有<b>动感<\/b>（kinetic）：人物在动，手上在做事；每个场景都必不可少<\/li>\n<li>好场景有让人<b>意外<\/b>的动作；幽默的根源也是意外<\/li>\n<li><b>Start later, end earlier<\/b>：大多数场景开始得比你想的晚、结束得比你想的早<\/li>\n<li>每个场景本身有一个小<b>弧线<\/b>：开头和结尾怎么呼应？读者看到什么变化？<\/li>\n<\/ul>\n<h3>欲望与冲突<\/h3>\n<p>人物由他<b>想要<\/b>什么定义。<span class=\"t\">Conflict<\/span> = 两个人物相反的欲望在较量，<b>必须被解决<\/b>。例：想睡懒觉 vs 早上 8 点有课；想点 flat white，咖啡师只做拿铁还没牛奶了。读者不关心\"接下来会怎样\"，就不会关心你的故事，文字再美也没用。<\/p>\n\n<h2>3. 概括、说明、描写<\/h2>\n<ul>\n<li><b>Narrative summary<\/b>：好的概括仍要<b>有画面<\/b>，靠具体感官细节（例：Donna Tartt《The Secret History》开头：雪在融化、州警、染料厂停工）。但<b>永远不要用概括写关键事件<\/b>；概括太多故事会显得浅、远、仓促<\/li>\n<li><b>Exposition / description<\/b>：要丰富故事世界、加深对人物的理解，最好也服务主题（例：Faulkner《As I Lay Dying》里的小路和棉花房）。危险是<b>很快变无聊<\/b>。把描写和人物<b>当下的情绪<\/b>连起来：两个没受过教育的兄弟会用什么词描写荒野？一个恼火的银行职员会怎么解释他的工作？<\/li>\n<li><b>Half scene<\/b>：例：Jennifer Egan《A Visit from the Goon Squad》：概括 Stephanie 一年来被邻居冷落，然后落在一个瞬间：一个金发妈妈给她一个\"你是谁来着？\"的勉强微笑。半场景让概括变得生动直接，但它<b>仍然是概括<\/b>，节奏快，不适合写情感转变，那要用完整场景<\/li>\n<\/ul>\n<h3>场景 vs 概括的常见错误<\/h3>\n<ul>\n<li>人物从不说话，或只用间接对话<\/li>\n<li>人物什么都不<b>做<\/b>（行动是展示动机的关键）<\/li>\n<li>看不出场景在<b>哪里<\/b>发生<\/li>\n<li>概括太多：在解释、告诉，而不是展示<\/li>\n<li>场景<b>没有冲突<\/b>（初稿最常见的错误）<\/li>\n<\/ul>\n\n<h2>4. 三拍场景（Three-beat scene）<span class=\"hot\">高频考点<\/span><\/h2>\n<p>场景像故事一样有开头、中间、结尾。课程例子（80 词）：咖啡馆，她迟到了；他一直刷手机；她拿勺子敲手心，从包里拿出一张折好的纸递给他，说 \"Read it later.\"，门在她身后砰地关上。<\/p>\n<div class=\"tw\"><table>\n<tr><th>Beat<\/th><th>他<\/th><th>她<\/th><\/tr>\n<tr><td class=\"h\">1 开头<\/td><td>刷手机、无视她；也许气她迟到<\/td><td>沉默，等他放下手机<\/td><\/tr>\n<tr><td class=\"h\">2 中间：冲突<\/td><td>想要她道歉<\/td><td>想要他注意她；敲勺子<\/td><\/tr>\n<tr><td class=\"h\">3 结尾：改变<\/td><td>措手不及（或松了口气）<\/td><td>从不耐烦变成愤怒：\"Read it later.\"<\/td><\/tr>\n<\/table><\/div>\n<p><b>两个人物的情绪状态在结尾都和开头不同。<\/b>细节也在说话：\"whined\" 形容咖啡机，不是轻松的动词；\"常坐的桌子\"说明他们认识很久。<\/p>\n<p class=\"muted\">练习：写一个主角和另一人物的三拍场景，检查两人是否都有完整的三拍情绪弧线，再加入感官细节来确立 POV、暗示情绪。<\/p>\n\n<h2>5. Backstory、回忆与倒叙<span class=\"hot\">易错点<\/span><\/h2>\n<p>作者要非常了解人物的过去，但纸面上只用<b>冰山原则<\/b>：露出的一小部分暗示下面的全部。<b>Backstory 常常是张力的敌人<\/b>：读者不喜欢被拉离紧张的当下去慢慢逛过去。<\/p>\n<h3>Memory（回忆）：最自然的 backstory 工具<\/h3>\n<div class=\"tw\"><table>\n<tr><th>真实的回忆是这样<\/th><th>写的时候<\/th><\/tr>\n<tr><td class=\"h\">在<b>脑子有空<\/b>时出现（洗碗、开车）<\/td><td>不要让人物在手术台前抢救病人时长篇回忆<\/td><\/tr>\n<tr><td class=\"h\">由当下的<b>感官触发<\/b>（气味、声音、一句话）<\/td><td>当前场景里放一个触发物<\/td><\/tr>\n<tr><td class=\"h\">回忆时人还是<b>清醒<\/b>的，和周围有连接<\/td><td>让当下的细节插进回忆，别让人物像入定<\/td><\/tr>\n<tr><td class=\"h\"><b>短暂<\/b>的<\/td><td>几秒钟的回忆不要写 10 页<\/td><\/tr>\n<tr><td class=\"h\"><b>碎片化<\/b>：感觉、片段话语、图像、气味<\/td><td>别写成完整的长场景；别让人物\"解释\"回忆<\/td><\/tr>\n<tr><td class=\"h\"><b>多米诺效应<\/b>：一个回忆引出另一个<\/td><td>可以用自由联想做出一条从浅到深的弧线；可以回到当下，也可以停在一个记忆画面上<\/td><\/tr>\n<\/table><\/div>\n<p class=\"muted\">例：《The Shipping News》里 Quoyle 看别人给父亲的墓刷漆 → 想起自己父亲对水果的痴迷（梨核、葡萄梗、桃核）→ 更深的回忆：摘蓝莓被冤枉挨打。都是碎片和感官细节，最后回到当下。<\/p>\n<p><b>回忆不能做的事：<\/b>不能代替戏剧性行动；不要用\"失忆\"当情节工具（除非故事就是关于记忆，而且要做研究）。<\/p>\n<h3>Flashback（倒叙）的问题<\/h3>\n<p>本课对 flashback 的定义：由当下触发、前后用当下夹住的<b>长篇、完整场景<\/b>（有对话、动作、细节），长到当下的时间像被<b>暂停<\/b>了（像《Wayne's World》里屏幕一扭就进入幻想）。问题：<\/p>\n<ol><li>忽视人物的真实意识（从雪坡滚下来时不会想童年暑假）<\/li><li>违反记忆的规律：太完整、太长、太详细<\/li><li>忽视当下场景：其他人这时候在干什么？<\/li><\/ol>\n<p><b>三种改法：<\/b><\/p>\n<ul>\n<li>改写成简短的<b>回忆<\/b><\/li>\n<li><b>Alternating past/present narrative<\/b>（过去现在交替叙述）：两条线各有<b>完整的故事弧线<\/b>，用分节或分章切换（例：Anne Enright《The Gathering》）。如果现在线只是\"上楼读日记\"，那就删掉现在线<\/li>\n<li><b>Narration that moves easily through time<\/b>（在时间里自由移动的叙述）：由<b>叙述<\/b>而不是人物的思考带我们去过去，可以在场景中途转换（例：Bob 在收银台打开空钱包 → 三天前在赛马场遇到的女孩 → 两个月前妻子离开 → 回到家门口）<\/li>\n<\/ul>\n<p class=\"muted\">课堂阅读：Souvankham Thammavongsa \"How to Pronounce Knife\"。思考：开头信念、挑战、改变、结尾信念；多少是概括、多少是场景；多少是 backstory。<\/p>\n<div class=\"sum\">Write every key moment as a scene with conflict; use summary to compress time and half scenes to anchor summary in a moment. A three-beat scene changes both characters' emotions. Handle backstory with brief, sensory, fragmented memories, not long flashbacks.<\/div>\n", "terms": [{"t": "Alternating past/present narrative", "z": "过去现在交替叙述", "e": "Two narrative lines, each with its own full story arc."}, {"t": "Backstory", "z": "背景故事", "e": "A character's past; often the enemy of tension."}, {"t": "Description", "z": "描写", "e": "Paints a picture of place or character; link it to the character's emotional state."}, {"t": "Domino effect (memory)", "z": "回忆的多米诺效应", "e": "One memory leads to another, creating an arc from shallow to deep."}, {"t": "Exposition", "z": "说明", "e": "Explains context: history, social rules, backstory."}, {"t": "Flashback", "z": "倒叙（问题写法）", "e": "A long, fully staged past scene that freezes the present and defies how memory works."}, {"t": "Half scene", "z": "半场景", "e": "A brief scenic moment anchoring summary; still fast-paced."}, {"t": "Kinetic scene", "z": "有动感的场景", "e": "Characters move and do things with their hands."}, {"t": "Memory", "z": "回忆", "e": "Brief, fragmented, sensory, triggered by the present; the natural way to show backstory."}, {"t": "Narration moving through time", "z": "在时间里移动的叙述", "e": "The narration, not the character's thinking, carries the reader into the past."}, {"t": "Narrative summary", "z": "叙述概括：压缩时间", "e": "Moves quickly through lesser events; never use it for a pivotal event."}, {"t": "Scene", "z": "场景：实时", "e": "Real-time action and dialogue; where conflict and emotional change are dramatized."}, {"t": "Start late, end early", "z": "晚开始，早结束", "e": "Most scenes start later and end earlier than the first draft."}, {"t": "Three-beat scene", "z": "三拍场景", "e": "Beginning, middle (conflict), end; both characters' emotions change."}, {"t": "Trigger", "z": "触发物", "e": "Something sensory in the present scene that sparks a memory."}]}, {"n": 7, "en": "Talk to Me: Dialogue", "zh": "对话写作", "tag": "Nov 3 lecture", "notes": "<p class=\"muted\">本周 = Week 7 模块 + Nov 3 课堂（Talk to Me: Dialogue）。Story 3 review：Nov 17 课上。<\/p>\n\n<h2>1. 对话是用来干什么的？<span class=\"hot\">高频考点<\/span><\/h2>\n<p>一句话：<span class=\"t\">Dialogue is the music of character<\/span>（对话是人物的音乐），也是好场景的主力。日常说话充满寒暄和废话，小说里的对话必须<b>有目的<\/b>。而且对话透露的，总比人物本想透露的<b>更多<\/b>。<\/p>\n<h3>六项功能（W7 模块）<\/h3>\n<ol>\n<li><b>Dramatize conflict<\/b>：把冲突戏剧化。不同人物想要不同的东西<\/li>\n<li><b>Reveal inner workings through subtext<\/b>：通过潜台词揭示内心<\/li>\n<li><b>Let us \"hear\" characters<\/b>：让读者\"听见\"人物<\/li>\n<li><b>Show origins, background, status, intellect<\/b>：透露出身、背景、地位、学识<\/li>\n<li><b>Illustrate relationships<\/b>：呈现人物关系和权力关系<\/li>\n<li><b>Enhance atmosphere, texture, pacing<\/b>：增强氛围、质感和节奏<\/li>\n<\/ol>\n<div class=\"formula\">Every line of dialogue should do 2+ of these jobs.<\/div>\n<p class=\"muted\">课堂版（Nov 3）是四项：打断大段叙述、制造强调、展现人物、推动故事（戏剧化冲突、加张力）。好对话至少做到其中两项。<\/p>\n<h3>怎么用对话显示人物（自己记的例子）<\/h3>\n<div class=\"tw\"><table>\n<tr><th>想显示<\/th><th>说法 A<\/th><th>说法 B<\/th><\/tr>\n<tr><td class=\"h\">背景、学识<\/td><td>\"Nice shirt.\"<\/td><td>\"That shirt is absolutely marvelous.\"<\/td><\/tr>\n<tr><td class=\"h\">和老板的关系<\/td><td>\"I'm taking the day off.\"（平等、有底气）<\/td><td>\"Would it be OK if I took the day off?\"（地位低、小心）<\/td><\/tr>\n<tr><td class=\"h\">氛围<\/td><td>吵闹酒吧：大喊、听岔、只说半句<\/td><td>会议室外：简短、生硬<\/td><\/tr>\n<\/table><\/div>\n<div class=\"sum\">Dialogue dramatizes conflict, reveals character through subtext and voice, shows relationships and power, and controls pacing and mood. Every line should do at least two jobs.<\/div>\n\n<h2>2. 三种对话类型<span class=\"hot\">高频考点<\/span><\/h2>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>Direct dialogue（直接）<\/th><th>Indirect dialogue（间接）<\/th><th>Summary dialogue（概括）<\/th><\/tr>\n<tr><td class=\"h\">样子<\/td><td>有引号，实时呈现<\/td><td>没有引号，用叙述<b>转述<\/b>内容，但还听得出说话人的语气<\/td><td>只说\"他们谈过了\"，<b>不<\/b>写具体内容<\/td><\/tr>\n<tr><td class=\"h\">例子（自编）<\/td><td>\"I'm not going,\" she said.<\/td><td>She wasn't going, she told him. Not this year, not with her mother sick.<\/td><td>They argued about the trip for most of the week.<\/td><\/tr>\n<tr><td class=\"h\">什么时候用<\/td><td><b>关键时刻<\/b>：放慢节奏、加强重点、让读者\"在场\"；对话会导向冲突、决定、结果<\/td><td>保留人物声音又不用写成整场戏；带过不太重要的信息；处理 backstory；场景之间喘口气<\/td><td>压缩大量谈话；快速进入场景核心；处理 backstory<\/td><\/tr>\n<\/table><\/div>\n<p><b>用 indirect / summary 的典型情况：<\/b>人物要告诉另一个人<b>读者已经知道<\/b>的事；或者这段谈话的情绪重点恰恰是它<b>很无聊<\/b>。<\/p>\n<p class=\"muted\">课上例文：直接对话 = Sally Rooney《Normal People》车里道歉那段；间接对话 = Tobias Wolff \"Smokers\"（话痨乘客，转述同时暴露了叙述者对他的看法）；概括对话 = Joan Wickersham \"Commuter Marriage\"。Aimee Bender \"The Rememberer\" 三种都用了。<\/p>\n\n<h2>3. 潜台词（Subtext）<span class=\"hot\">高频考点<\/span><\/h2>\n<p><span class=\"t\">Subtext<\/span> 之于文本，就像<b>暗流<\/b>之于水面：场景里存在、但没被说出来的一切。人们很少直说真实意思，而是用对话去试探、操纵、影响、引诱或防御。<\/p>\n<h3>人物意识的三个层次<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Level<\/th><th>对应<\/th><th>是什么<\/th><\/tr>\n<tr><td class=\"h\">Spoken（说出口的）<\/td><td>对话的<b>文本<\/b><\/td><td>愿意公开说的话<\/td><\/tr>\n<tr><td class=\"h\">Unspoken（没说出口的）<\/td><td>对话的<b>潜台词<\/b><\/td><td>只跟亲近的人承认的想法、恐惧、欲望；会从话里<b>漏出来<\/b><\/td><\/tr>\n<tr><td class=\"h\">Unspeakable（说不出口的）<\/td><td>对话中<b>隐藏的真相<\/b><\/td><td>连对自己都很难承认的最深恐惧和动机<\/td><\/tr>\n<\/table><\/div>\n<div class=\"tw\"><table>\n<tr><th>Spoken<\/th><th>Unspoken<\/th><th>Unspeakable<\/th><\/tr>\n<tr><td>\"Do you want another drink?\"<\/td><td>\"Should you have another drink?\"<\/td><td>\"Maybe you've been drinking a lot lately.\"<\/td><\/tr>\n<tr><td>\"Fine, I'll go to the party.\"<\/td><td>我一点都不想去<\/td><td>—<\/td><\/tr>\n<tr><td>\"Who were you talking to?\"<\/td><td>I feel jealous and suspicious.<\/td><td>I fear that you'll leave me.<\/td><\/tr>\n<\/table><\/div>\n<p>同一个话题（夫妻争论该谁洗碗），潜台词可以完全不同：家务分工 / 回避另一场更大的争吵 / 调情。<b>潜台词决定了文本的语言、语气和措辞。<\/b><\/p>\n<p class=\"muted\">例文：Ivan Coyote \"Open Sesame\"（邻居小女孩借麦克风架，表面轻松，底下是叙述者没说出口的顾虑）；Laurie Morris \"Community Life\"（问\"你在跟谁说话\"，底下是嫉妒和不安）；《傲慢与偏见》开篇：Bennet 太太几乎没有潜台词，Bennet 先生是潜台词高手。分析时问：<b>谁想要什么？水面上是什么，水面下是什么？<\/b><\/p>\n<div class=\"sum\">Subtext is what is present but unsaid. Spoken = the text, unspoken = the subtext, unspeakable = the hidden truth. The best dialogue carries all three levels; on-the-nose dialogue has none.<\/div>\n\n<h2>4. 常见错误<span class=\"hot\">易错点<\/span><\/h2>\n<div class=\"tw\"><table>\n<tr><th>错误<\/th><th>怎么改<\/th><\/tr>\n<tr><td class=\"h\">人物说对方<b>早就知道<\/b>的事（\"你还记得 Jim 吗？跟你结婚十年的那个\"）<\/td><td>相信读者能推断；删掉<\/td><\/tr>\n<tr><td class=\"h\">重复：动作已经展示过又用对话复述；同一句话说两遍<\/td><td>换措辞、换角度，或删掉<\/td><\/tr>\n<tr><td class=\"h\"><b>Exposition in disguise<\/b>：借对话向读者交代情节信息<\/td><td>这件事应该更早在场景里<b>展示<\/b>出来<\/td><\/tr>\n<tr><td class=\"h\"><b>Leading dialogue<\/b>：A 只是不停问\"然后呢？\"来提示 B<\/td><td><b>测试：把 A 的台词全划掉，意思没少？那就删。<\/b>让 B 直接说，给 A 一个目的<\/td><\/tr>\n<tr><td class=\"h\">所有人物听起来都一样；用词和年龄、语言能力不符<\/td><td>靠用词、句子长短、句式区分声音<\/td><\/tr>\n<tr><td class=\"h\"><b>On-the-nose<\/b>：人物把感受全说出来（\"我感到很受伤\"）→ 像肥皂剧<\/td><td>加潜台词：绕着说<\/td><\/tr>\n<tr><td class=\"h\">寒暄、结巴、说一半重来、填充词<\/td><td>真实说话要听，但写的时候删掉<\/td><\/tr>\n<tr><td class=\"h\">方言用撇号、按发音拼写，难读<\/td><td>用<b>用词和句子结构<\/b>表现口音（George Saunders \"Bohemians\"）<\/td><\/tr>\n<tr><td class=\"h\">太长、格式不清楚<\/td><td>剪短；按格式规则排<\/td><\/tr>\n<\/table><\/div>\n<p class=\"muted\">Review 3 里标的 #1 错误：<b>no subtext<\/b>。<\/p>\n\n<h2>5. 格式规则<span class=\"hot\">高频考点<\/span><\/h2>\n<p>格式只有一个目的：<b>让读者清楚是谁在说话<\/b>。<\/p>\n<h3>必须记住的三条<\/h3>\n<ol>\n<li>同一个人物的<b>动作和台词放在一起<\/b>（同一段）<\/li>\n<li>只在必要时标明说话人；能删的对话标签尽量删<\/li>\n<li>标明说话人时只用 <b>\"said\"<\/b>：不用 whined、snapped 等别的动词，也不加<b>副词<\/b>（said nastily ✗）<\/li>\n<\/ol>\n<h3>其他要点<\/h3>\n<ul>\n<li><b>换人说话 = 另起一段<\/b>（缩进）。动作或台词换到另一个人，也另起一段<\/li>\n<li>两人对话时，每隔几行标一次就够<\/li>\n<li>能用动作表明是谁在说，就不用标签：<br>\"Nice to meet you,\" he said. He shook her hand. → <b>\"Nice to meet you.\" He shook her hand.<\/b><\/li>\n<li>不要 said + -ing（暗示同时进行和因果）：<br>\"…,\" he said, drying the dog. → <b>\"…\" He dried the dog.<\/b><\/li>\n<li>对话后别再解释情绪（\"This angered me.\" ✗）<\/li>\n<\/ul>\n<h3>标点<\/h3>\n<div class=\"tw\"><table>\n<tr><th>情况<\/th><th>写法<\/th><\/tr>\n<tr><td class=\"h\">台词 + 标签（一个句子）<\/td><td>\"I left the dog at the store,\" she said.<br>逗号在引号内，标签小写，句号结尾<\/td><\/tr>\n<tr><td class=\"h\">问句 / 感叹<\/td><td>\"Did you leave the dog?\" he asked.<br>问号后标签仍小写（asked 其实多余）<\/td><\/tr>\n<tr><td class=\"h\">没有标签，用动作<\/td><td>\"You left the dog at the store.\" He shook his head. \"That's just like you.\"<br>台词自成一句，动作句首字母大写<\/td><\/tr>\n<\/table><\/div>\n<h3>四种排版风格<\/h3>\n<div class=\"tw\"><table>\n<tr><th>风格<\/th><th>效果<\/th><th>例<\/th><\/tr>\n<tr><td class=\"h\">Quotation marks 引号<\/td><td>像<b>外放音箱<\/b>：说话人清楚；说的和想的可以矛盾 → 反讽<\/td><td>Esi Edugyan, <i>Half Blood Blues<\/i><\/td><\/tr>\n<tr><td class=\"h\">No quotation marks 无引号<\/td><td>像<b>耳机<\/b>：更私密，话和想法、内外界限变模糊；但容易分不清谁在说<\/td><td>雨中帐篷布道片段<\/td><\/tr>\n<tr><td class=\"h\">Screenplay / theatre 剧本体<\/td><td>极简又高度风格化；不需要副词和动作；像布莱希特的<b>间离效果<\/b>，拆掉\"第四堵墙\"<\/td><td>Michael Winter, <i>This All Happened<\/i><\/td><\/tr>\n<tr><td class=\"h\">Em-dash 破折号 —<\/td><td>欧洲惯例；直接、有力、快，适合幽默；清晰度介于有引号和无引号之间<\/td><td>Schofield, <i>Malarky<\/i><\/td><\/tr>\n<\/table><\/div>\n<div class=\"sum\">Keep one character's action and words together, start a new paragraph for each new speaker, tag only when needed, and use only \"said\" with no adverbs. An action beat can replace a tag.<\/div>\n\n<h2>6. Story 3 怎么写（对话场景）<\/h2>\n<div class=\"formula\">Want vs. Want → Said / Unsaid / Unspeakable → Pressure ↑ → Turning Line → Decision<\/div>\n<p>两个人想要不同的东西 → 他们不直说真实意思 → 压力一句句升高 → 一句话击中要害 → 有人做了决定，事情变了。Story 2 的公式（信念变化 + 三拍场景）照样成立，Story 3 是让<b>对话<\/b>来推动这个变化。<\/p>\n<ol>\n<li><b>开头<\/b>：跳过寒暄，直接进入冲突（start late）<\/li>\n<li><b>中间<\/b>：双方各有 want，轮流出招（讲道理、让对方内疚、讨价还价、回避），压力升高<\/li>\n<li><b>潜台词<\/b>：绕着说，不直接说感受<\/li>\n<li><b>转折<\/b>：一句说到痛处的话 → 决定<\/li>\n<li><b>结尾<\/b>：用一个动作或画面收住，不解释<\/li>\n<\/ol>\n<h3>Process notes 模板（6 条）<\/h3>\n<ol>\n<li><b>Conflict<\/b>：In the dialogue, ___ wants ___, but ___ wants ___.<\/li>\n<li><b>Subtext<\/b>：When ___ says, \"___,\" the real meaning is ___.<\/li>\n<li><b>Types of dialogue<\/b>：I used direct dialogue for ___ because it is the key moment. I used summary / indirect dialogue for ___ to move faster.<\/li>\n<li><b>Character voice<\/b>：___ speaks in ___ sentences, which shows ___. ___ speaks ___, which shows ___.<\/li>\n<li><b>Formatting<\/b>：I started a new paragraph for each speaker. I used \"said\" or an action instead of other tags and adverbs.<\/li>\n<li><b>Change<\/b>：At first, ___ believes ___. At the end, ___. The line \"___\" shows this change.<\/li>\n<\/ol>\n\n<h2>7. 课堂练习：订婚一周的情侣<\/h2>\n<p>一个想取消婚约，一个不想。动笔前先定：<b>POV<\/b>（决定结尾谁说服谁）、两人各自的 <b>want<\/b>、每人一句 <b>spoken / unspoken / unspeakable<\/b>、取消的理由（外地工作、发现隐瞒、家人反对、订婚宴上的小事）。<\/p>\n<div class=\"tw\"><table>\n<tr><th>Step<\/th><th>要求<\/th><th>要点<\/th><\/tr>\n<tr><td class=\"h\">1 纯对话<\/td><td>写一页，只有对话，不写描写、动作、心理；结尾一人说服另一人<\/td><td>没有标签，所以两人说话方式要不同（一个句子短、一个爱解释；一个爱问、一个爱躲）<\/td><\/tr>\n<tr><td class=\"h\">2 概括<\/td><td>同一场景，一句对话都不用<\/td><td>保留起因、关键那句话的意思、最后的决定。对比：summary 快，但读者\"不在场\"<\/td><\/tr>\n<tr><td class=\"h\">3 加料<\/td><td>回到 Step 1，加少量动作、描写、心理<\/td><td>对话仍是主角；用动作代替标签：\"I need more time.\" She twisted the ring.（转戒指 = 潜台词）；心理融入叙述，不写 \"she thought\"<\/td><\/tr>\n<\/table><\/div>\n<h3>写完自查<\/h3>\n<ul>\n<li>每句对话至少做到 2 件事？有没有 leading dialogue？<\/li>\n<li>有没有人说对方早就知道的事？有没有太直白的句子？<\/li>\n<li>两个人的声音听得出区别？至少一处说的和想的不一样？<\/li>\n<li>换人 = 换段？只用 said、删了副词？删了寒暄、结巴、方言拼写？<\/li>\n<li>结尾有没有变化：有人做了决定？<\/li>\n<\/ul>\n", "terms": [{"t": "Action beat", "z": "动作代替标签", "e": "An action next to the line shows who is speaking: \"Nice to meet you.\" He shook her hand."}, {"t": "Adverbs in tags", "z": "标签里的副词（避免）", "e": "E.g., \"said nastily\"; cut them and let the words show the tone."}, {"t": "Backstory", "z": "背景故事", "e": "Events from before the story; often handled with indirect or summary dialogue."}, {"t": "Character voice", "z": "人物声音", "e": "Word choice, sentence length and phrasing that show who a character is."}, {"t": "Dialect spelling", "z": "方言拼写（避免）", "e": "Apostrophes and phonetic spelling are hard to read; show voice through word choice and syntax."}, {"t": "Dialogue", "z": "对话：人物的音乐", "e": "The music of character and the workhorse of strong scenes; every line should do 2+ jobs."}, {"t": "Dialogue tag", "z": "对话标签", "e": "Words that name the speaker, such as \"she said\"; use sparingly and only \"said\"."}, {"t": "Direct dialogue", "z": "直接对话：有引号、实时", "e": "Speech shown in real time inside quotation marks; use for key moments, emphasis and slowing the pace."}, {"t": "Distancing effect", "z": "间离效果（布莱希特）", "e": "Brecht's Verfremdungseffekt: denies immersion and breaks the fourth wall."}, {"t": "Em-dash style", "z": "破折号格式", "e": "European convention; direct, fast, good for humour; halfway in clarity."}, {"t": "Exposition in disguise", "z": "伪装成对话的说明", "e": "Using dialogue to deliver plot information to the reader."}, {"t": "Filler", "z": "填充词、结巴（删掉）", "e": "Stammers, false starts and filler words from real speech; edit them out."}, {"t": "Indirect dialogue", "z": "间接对话：叙述转述", "e": "Speech reported through narration without quotation marks; keeps the voice and handles less important information or backstory."}, {"t": "Leading dialogue", "z": "引导式对话", "e": "Character A only prompts Character B; test: cross out A's lines and nothing is lost."}, {"t": "New speaker, new paragraph", "z": "换人说话就换段", "e": "Start a new indented paragraph whenever speech or action moves to another character."}, {"t": "No quotation marks style", "z": "无引号格式：耳机", "e": "More intimate; blurs speech and thought, but can confuse who is speaking."}, {"t": "On-the-nose dialogue", "z": "太直白的对话", "e": "Characters state every feeling directly, so it sounds like a soap opera."}, {"t": "Pacing", "z": "节奏", "e": "How fast the story moves; direct dialogue slows it, summary speeds it up."}, {"t": "Pleasantries", "z": "客套寒暄（删掉）", "e": "Everyday small talk such as hello and how are you; cut it and start late."}, {"t": "Power dynamics", "z": "权力关系", "e": "Who is above or below whom, shown by how characters speak to each other."}, {"t": "Process notes", "z": "创作说明", "e": "Six notes on conflict, subtext, dialogue types, voice, formatting and change."}, {"t": "Quotation marks style", "z": "引号格式：外放音箱", "e": "Speaker is clear; thought can contradict speech, creating irony."}, {"t": "Said", "z": "只用 said", "e": "The only tag to use; avoid whined, snapped, and similar verbs."}, {"t": "Said + -ing", "z": "said 加 -ing（避免）", "e": "Implies continuous, causal action; write a separate action sentence instead."}, {"t": "Screenplay style", "z": "剧本体格式", "e": "Minimal and stylized, like a script; creates a distancing effect."}, {"t": "Spoken", "z": "说出口的：对话的文本", "e": "What characters say and freely share in public."}, {"t": "Start late", "z": "晚点开场", "e": "Skip the greetings and enter the scene at the conflict."}, {"t": "Subtext", "z": "潜台词：水面下的暗流", "e": "Everything present in a scene but not said out loud."}, {"t": "Summary dialogue", "z": "概括对话：只说谈过了", "e": "Tells that a conversation happened without giving its words; condenses talk and gets to the core fast."}, {"t": "Turning line", "z": "转折台词", "e": "The one line that hits hard and leads to a decision."}, {"t": "Unspeakable", "z": "说不出口的：隐藏的真相", "e": "Deepest fears and motives a character can barely admit even to themselves."}, {"t": "Unspoken", "z": "没说出口的：潜台词", "e": "Private thoughts and feelings that leak out through what characters say."}]}, {"n": 8, "en": "Setting", "zh": "场景与世界构建", "tag": "", "notes": "<style>\n.f9{margin:12px 0 16px;overflow-x:auto}\n.f9 svg{display:block;width:100%;max-width:640px;height:auto;font-family:var(--body)}\n.f9 figcaption{font-size:13px;color:var(--muted);margin-top:4px}\n.f9 rect,.f9 circle,.f9 path{stroke-width:1}\n.f9 .bk{fill:var(--ink)} .f9 .tbk{fill:var(--bg);font-weight:700}\n.f9 .b1{fill:var(--kbg)} .f9 .b2{fill:var(--green-bg);stroke:var(--green)} .f9 .b3{fill:var(--th);stroke:var(--muted);stroke-opacity:.5} .f9 .b1{stroke:var(--blue);stroke-opacity:.35}\n.f9 .bs{fill:var(--chip);stroke:var(--muted);stroke-dasharray:3 2} .f9 .bh{fill:var(--tbg)}\n.f9 .hl{fill:var(--gold-bg);stroke:var(--gold);stroke-width:2.5} .f9 .hl2{fill:var(--tbg);stroke:var(--bg);stroke-width:2}\n.f9 .tb1,.f9 .tb2,.f9 .tb3,.f9 .tbh,.f9 .thl{fill:var(--fg)} .f9 .tbs{fill:var(--muted)}\n.f9 .tb{fill:var(--fg);font-weight:700} .f9 .tl{fill:var(--ink);font-weight:700} .f9 .tm{fill:var(--muted)}\n.f9 .ln{stroke:var(--blue);stroke-width:1.5;fill:none} .f9 .dash{stroke:var(--blue);stroke-width:2;stroke-dasharray:6 4;fill:none}\n.f9 .thick{stroke:var(--hot);stroke-width:2.5} .f9 .thin{stroke:var(--line);stroke-width:1}\n.f9 .arr,.f9 .arrh{stroke:var(--hot);stroke-width:1.6;fill:none} .f9 .arr2,.f9 .arrh2{stroke:var(--green);stroke-width:1.6;fill:none}\n<\/style><h2>1. 场景不只是地点（Setting: more than place）<span class=\"hot\">高频考点<\/span><\/h2>\n<p>很多人以为 <span class=\"t\">setting<\/span> 只是故事发生的时间和地点。其实它影响故事的方方面面，是让读者<b>相信、沉浸<\/b>的关键工具，科幻、奇幻和现实主义小说都一样。但<b>世界构建（world building）不能盖过故事<\/b>：故事世界要为人物服务，去界定、加强、复杂化他们的弧线。<\/p>\n<figure class=\"f9\"><svg viewBox=\"0 0 620 282\" role=\"img\" aria-label=\"What setting includes\"><circle class=\"hl\" cx=\"310\" cy=\"140\" r=\"58\"/><text class=\"tl\" x=\"310\" y=\"136\" font-size=\"14\" text-anchor=\"middle\" >SETTING<\/text><text class=\"tm\" x=\"310\" y=\"154\" font-size=\"10\" text-anchor=\"middle\" >more than place<\/text><line class=\"thin\" x1=\"310.0\" y1=\"82.0\" x2=\"310.0\" y2=\"55.0\"/><rect class=\"b1\" x=\"220.0\" y=\"13.0\" width=\"180\" height=\"44\" rx=\"4\"/><text class=\"tb1\" x=\"310.0\" y=\"33.0\" font-size=\"10\" text-anchor=\"middle\">Time<\/text><text class=\"tb1\" x=\"310.0\" y=\"44.0\" font-size=\"10\" text-anchor=\"middle\">historical? now? future?<\/text><line class=\"thin\" x1=\"360.2294734194974\" y1=\"111.0\" x2=\"496.19546181365433\" y2=\"97.5\"/><rect class=\"b2\" x=\"406.19546181365433\" y=\"65.5\" width=\"180\" height=\"44\" rx=\"4\"/><text class=\"tb2\" x=\"496.19546181365433\" y=\"85.5\" font-size=\"10\" text-anchor=\"middle\">Place<\/text><text class=\"tb2\" x=\"496.19546181365433\" y=\"96.5\" font-size=\"10\" text-anchor=\"middle\">rural · city · spaceship<\/text><line class=\"thin\" x1=\"360.2294734194974\" y1=\"169.0\" x2=\"496.19546181365433\" y2=\"182.5\"/><rect class=\"hl\" x=\"406.19546181365433\" y=\"170.5\" width=\"180\" height=\"44\" rx=\"4\"/><text class=\"thl\" x=\"496.19546181365433\" y=\"190.5\" font-size=\"10\" text-anchor=\"middle\">Social & moral rules<\/text><text class=\"thl\" x=\"496.19546181365433\" y=\"201.5\" font-size=\"10\" text-anchor=\"middle\">what is allowed here?<\/text><line class=\"thin\" x1=\"310.0\" y1=\"198.0\" x2=\"310.0\" y2=\"225.0\"/><rect class=\"bs\" x=\"220.0\" y=\"223.0\" width=\"180\" height=\"44\" rx=\"4\"/><text class=\"tbs\" x=\"310.0\" y=\"243.0\" font-size=\"10\" text-anchor=\"middle\">Senses<\/text><text class=\"tbs\" x=\"310.0\" y=\"254.0\" font-size=\"10\" text-anchor=\"middle\">look · smell · sound · taste<\/text><line class=\"thin\" x1=\"259.7705265805026\" y1=\"169.00000000000003\" x2=\"123.80453818634572\" y2=\"182.50000000000003\"/><rect class=\"bh\" x=\"33.804538186345724\" y=\"170.50000000000003\" width=\"180\" height=\"44\" rx=\"4\"/><text class=\"tbh\" x=\"123.80453818634572\" y=\"190.5\" font-size=\"10\" text-anchor=\"middle\">Protagonist's place<\/text><text class=\"tbh\" x=\"123.80453818634572\" y=\"201.5\" font-size=\"10\" text-anchor=\"middle\">edge or centre? status?<\/text><line class=\"thin\" x1=\"259.7705265805026\" y1=\"111.0\" x2=\"123.8045381863457\" y2=\"97.49999999999999\"/><rect class=\"b3\" x=\"33.804538186345695\" y=\"65.49999999999999\" width=\"180\" height=\"44\" rx=\"4\"/><text class=\"tb3\" x=\"123.8045381863457\" y=\"85.5\" font-size=\"10\" text-anchor=\"middle\">Objects<\/text><text class=\"tb3\" x=\"123.8045381863457\" y=\"96.5\" font-size=\"10\" text-anchor=\"middle\">what they keep says who they are<\/text><\/svg><figcaption>场景不只是地点：时间、地点、社会和道德规则、感官、主角在这个世界的位置，以及人物身边的物品。<\/figcaption><\/figure>\n<h3>构建世界时要问的问题<\/h3>\n<ul>\n<li><b>时间<\/b>：历史、当代还是未来？（开头写\"留胡子的年轻人在搅黄油\"：是 1880 年代的拓荒者，还是 2015 年的文艺青年？）<\/li>\n<li><b>地点<\/b>：乡村、城市街区，还是宇宙飞船？<\/li>\n<li><b>社会和道德规则<\/b>：在这里，有人闯进你的地你能开枪吗？用错叉子算罪过吗？<\/li>\n<li><b>感官<\/b>：看起来、闻起来、听起来是什么样？空气里能尝到什么？<\/li>\n<li><b>最重要：主角在这个世界的位置<\/b>：在边缘还是中心？地位如何？怎么走到这一步的？她怎么看这个世界？<\/li>\n<\/ul>\n<p>好的起点是 W2 讲过的 <b>social antagonism<\/b>（社会对抗）：人物和社区、世界的规则之间有什么冲突。<\/p>\n<h3>用场景制造反讽张力<\/h3>\n<p>把人物放进\"不对劲\"的环境里，张力立刻出来：性解放的年代，主角却极度害羞；一对夫妻去热带天堂度假，婚姻却快破裂了。<\/p>\n\n<h2>2. 物品：人物的\"证据\"<\/h2>\n<p>生活里没有一个冰箱贴、手机壳、桌上的照片是<b>中性或随机<\/b>的。比较一下你的卧室、好朋友的卧室、祖父母的卧室，那把椅子、那块地毯、那些照片都在讲这个人是谁。处理过逝者遗物的人都知道，集邮册、火车模型、留着的信件都是一个人生活的见证。<\/p>\n<p class=\"muted\">课程例子：一个人物壁炉台上有块普通的石头。它来自她和从小一起长大的狗常去的山坡，那是她最平静的地方，也是她去年撒狗骨灰的地方，她每次需要平静都会去爬。作者不一定要在故事里讲出这段历史，但这块石头和场景里其他精选的物品，让人物清楚得多。<\/p>\n\n<h2>3. 怎么写场景（How to create setting）<span class=\"hot\">高频考点<\/span><\/h2>\n<ul>\n<li>用描写、<b>感官细节<\/b>、时间和地点的线索来营造<\/li>\n<li><b>分散<\/b>在全文里，不要一次全倒出来；<b>Less often means more<\/b>：目的是制造\"真实的错觉\"<\/li>\n<li>好的场景和情节紧密相连：<b>这件事只可能在这个场景里这样发生<\/b>（例：《权力的游戏》里人物永远身处危险，正是因为那个时代和环境）<\/li>\n<li>场景可以<b>反映人物的心理状态<\/b>：人怎么看周围，深受他当下的情绪和心事影响<\/li>\n<li>要<b>克制<\/b>：用精选的、出人意料的真实感官细节去暗示心情，不要用\"天空在哭泣\"\"办公楼阴森地逼近\"这种夸张比喻，会显得卡通、业余<\/li>\n<li>场景不是人物在前面走来走去的<b>平面背景板<\/b>；细节一点点累积，影响才会越来越大<\/li>\n<\/ul>\n<figure class=\"f9\"><svg viewBox=\"0 0 620 204\" role=\"img\" aria-label=\"Same setting seen through two states of mind\"><rect class=\"b3\" x=\"220\" y=\"6\" width=\"180\" height=\"36\" rx=\"4\"/><text class=\"tb3\" x=\"310.0\" y=\"28.2\" font-size=\"12\" text-anchor=\"middle\">Same place: Hawaii<\/text><path class=\"ln\" d=\"M310 42 L160 62 M164.8 58.5 L160 62 L165.6 64.2\"/><rect class=\"b2\" x=\"20\" y=\"64\" width=\"280\" height=\"108\" rx=\"6\"/><text class=\"tl\" x=\"160\" y=\"86\" font-size=\"12\" text-anchor=\"middle\" >Long-awaited vacation<\/text><text class=\"tm\" x=\"160\" y=\"110\" font-size=\"10\" text-anchor=\"middle\" >· bright turquoise water<\/text><text class=\"tm\" x=\"160\" y=\"128\" font-size=\"10\" text-anchor=\"middle\" >· warm air, flower smell<\/text><text class=\"tm\" x=\"160\" y=\"146\" font-size=\"10\" text-anchor=\"middle\" >· everything feels new<\/text><path class=\"ln\" d=\"M310 42 L470 62 M464.4 64.2 L470 62 L465.1 58.5\"/><rect class=\"bh\" x=\"330\" y=\"64\" width=\"280\" height=\"108\" rx=\"6\"/><text class=\"tl\" x=\"470\" y=\"86\" font-size=\"12\" text-anchor=\"middle\" >Son's funeral<\/text><text class=\"tm\" x=\"470\" y=\"110\" font-size=\"10\" text-anchor=\"middle\" >· the same sun feels too bright<\/text><text class=\"tm\" x=\"470\" y=\"128\" font-size=\"10\" text-anchor=\"middle\" >· tourists laughing<\/text><text class=\"tm\" x=\"470\" y=\"146\" font-size=\"10\" text-anchor=\"middle\" >· everything feels wrong<\/text><text class=\"tl\" x=\"310\" y=\"194\" font-size=\"10\" text-anchor=\"middle\" >Setting reflects the character's state of mind (subtle, not \"the sky wept\")<\/text><\/svg><figcaption>同一个地方，人物的心情不同，看到的细节就不同。要含蓄，不要写成\"天空在哭泣\"这种夸张比喻。<\/figcaption><\/figure>\n\n<h2>4. 世界构建的挑战（Challenges of world building）<span class=\"hot\">易错点<\/span><\/h2>\n<table>\n<tr><th>挑战<\/th><th>怎么处理<\/th><\/tr>\n<tr><td class=\"h\">Striving for balance 求平衡<\/td><td>细节要够让读者建起世界，但不能多到读者不用想象。不停描写和解释会把读者挡在故事外，变成被动接收信息。世界构建是<b>作者的功课<\/b>，最后放进稿子的只是一小部分<\/td><\/tr>\n<tr><td class=\"h\">Character context 和人物有关<\/td><td>做了复杂的社会政治系统、大量历史研究、专业知识，就忍不住塞进去 → <b>info dump<\/b>（信息倾倒）。问自己：<b>这条信息对这个人物在这一刻关键吗？<\/b>通常不是<\/td><\/tr>\n<tr><td class=\"h\">Familiar worlds too 熟悉的世界也要构建<\/td><td>写家、办公室、校园也不能\"通用化\"。场景是人物的投射：不要写一个普通的咖啡馆，而要写<b>这个人物眼中的<\/b>咖啡馆<\/td><\/tr>\n<tr><td class=\"h\">Narrative momentum 保持推进<\/td><td>描写总会让故事暂停。读者跳读通常就是因为这个。要<b>精选（curation）<\/b>最能唤起感受的细节，要<b>节省（economy）<\/b>：用 2–3 个细节，而不是 10–12 个<\/td><\/tr>\n<\/table>\n<figure class=\"f9\"><svg viewBox=\"0 0 620 222\" role=\"img\" aria-label=\"World-building iceberg\"><path class=\"b1\" d=\"M220 62 L310 4 L400 62 Z\"/><line class=\"dash\" x1=\"20\" y1=\"62\" x2=\"600\" y2=\"62\"/><text class=\"tm\" x=\"596\" y=\"56\" font-size=\"9\" text-anchor=\"end\" >the page<\/text><text class=\"tl\" x=\"310\" y=\"48\" font-size=\"10\" text-anchor=\"middle\" >2–3 chosen details<\/text><text class=\"tm\" x=\"420\" y=\"26\" font-size=\"10\" text-anchor=\"start\" >what the story needs right now<\/text><path class=\"b2\" d=\"M170 62 L450 62 L520 196 L100 196 Z\" opacity=\".85\"/><text class=\"tl\" x=\"310\" y=\"92\" font-size=\"11\" text-anchor=\"middle\" >history & research<\/text><text class=\"tl\" x=\"310\" y=\"116\" font-size=\"11\" text-anchor=\"middle\" >political / social systems<\/text><text class=\"tl\" x=\"310\" y=\"140\" font-size=\"11\" text-anchor=\"middle\" >maps, rules, technology<\/text><text class=\"tl\" x=\"310\" y=\"164\" font-size=\"11\" text-anchor=\"middle\" >specialist knowledge<\/text><text class=\"tm\" x=\"310\" y=\"214\" font-size=\"10\" text-anchor=\"middle\" >World building is the writer's process; most of it stays under water (no info dump)<\/text><\/svg><figcaption>世界构建的冰山：作者知道的很多，但纸面上只放对这一刻人物最重要的几个细节，避免\"信息倾倒\"。<\/figcaption><\/figure>\n<figure class=\"f9\"><svg viewBox=\"0 0 640 134\" role=\"img\" aria-label=\"One setting detail judged three ways reveals character\"><rect class=\"b3\" x=\"20\" y=\"40\" width=\"150\" height=\"44\" rx=\"4\"/><text class=\"tb3\" x=\"95.0\" y=\"60.0\" font-size=\"10\" text-anchor=\"middle\">Café chairs:<\/text><text class=\"tb3\" x=\"95.0\" y=\"71.0\" font-size=\"10\" text-anchor=\"middle\">rickety, paint-splattered<\/text><path class=\"ln\" d=\"M170 62 L216 24 M213.8 29.6 L216 24 L210.1 25.1\"/><rect class=\"b2\" x=\"220\" y=\"6\" width=\"200\" height=\"34\" rx=\"4\"/><text class=\"tb2\" x=\"320.0\" y=\"26.5\" font-size=\"10\" text-anchor=\"middle\">\"Quaint\"<\/text><text class=\"tm\" x=\"430\" y=\"27\" font-size=\"10\" text-anchor=\"start\" >→ a romantic, easygoing person<\/text><path class=\"ln\" d=\"M170 62 L216 66 M210.5 68.4 L216 66 L211.0 62.7\"/><rect class=\"bh\" x=\"220\" y=\"48\" width=\"200\" height=\"34\" rx=\"4\"/><text class=\"tbh\" x=\"320.0\" y=\"68.5\" font-size=\"10\" text-anchor=\"middle\">\"Sloppy\"<\/text><text class=\"tm\" x=\"430\" y=\"69\" font-size=\"10\" text-anchor=\"start\" >→ a critical perfectionist<\/text><path class=\"ln\" d=\"M170 62 L216 108 M210.2 106.3 L216 108 L214.3 102.2\"/><rect class=\"hl\" x=\"220\" y=\"90\" width=\"200\" height=\"34\" rx=\"4\"/><text class=\"thl\" x=\"320.0\" y=\"110.5\" font-size=\"10\" text-anchor=\"middle\">\"An accident waiting to happen\"<\/text><text class=\"tm\" x=\"430\" y=\"111\" font-size=\"10\" text-anchor=\"start\" >→ an anxious, cautious person<\/text><\/svg><figcaption>同一个细节，人物怎么评价它，就暴露了他是什么样的人（连接 W4 的观察 → 理解 → 判断）。<\/figcaption><\/figure>\n\n<h2>5. 场景与开头（Setting and a story's opening）<span class=\"hot\">高频考点<\/span><\/h2>\n<p>开头是把故事世界落地的机会：交代时间、地点、氛围和社会秩序，把读者需要的信息<b>前置（front-load）<\/b>。通过精选、\"伪装\"好的线索，让读者马上感觉到：<\/p>\n<figure class=\"f9\"><svg viewBox=\"0 0 620 174\" role=\"img\" aria-label=\"Six things a story opening should signal\"><rect class=\"b1\" x=\"10\" y=\"10\" width=\"194\" height=\"58\" rx=\"6\"/><text class=\"tl\" x=\"24\" y=\"36\" font-size=\"13\" text-anchor=\"start\" >1  Era<\/text><text class=\"tm\" x=\"24\" y=\"54\" font-size=\"10\" text-anchor=\"start\" >when?<\/text><rect class=\"b2\" x=\"216\" y=\"10\" width=\"194\" height=\"58\" rx=\"6\"/><text class=\"tl\" x=\"230\" y=\"36\" font-size=\"13\" text-anchor=\"start\" >2  Location<\/text><text class=\"tm\" x=\"230\" y=\"54\" font-size=\"10\" text-anchor=\"start\" >where?<\/text><rect class=\"bs\" x=\"422\" y=\"10\" width=\"194\" height=\"58\" rx=\"6\"/><text class=\"tl\" x=\"436\" y=\"36\" font-size=\"13\" text-anchor=\"start\" >3  Genre<\/text><text class=\"tm\" x=\"436\" y=\"54\" font-size=\"10\" text-anchor=\"start\" >what are the rules?<\/text><rect class=\"hl\" x=\"10\" y=\"80\" width=\"194\" height=\"58\" rx=\"6\"/><text class=\"tl\" x=\"24\" y=\"106\" font-size=\"13\" text-anchor=\"start\" >4  Character<\/text><text class=\"tm\" x=\"24\" y=\"124\" font-size=\"10\" text-anchor=\"start\" >who is it about?<\/text><rect class=\"bh\" x=\"216\" y=\"80\" width=\"194\" height=\"58\" rx=\"6\"/><text class=\"tl\" x=\"230\" y=\"106\" font-size=\"13\" text-anchor=\"start\" >5  Conflict<\/text><text class=\"tm\" x=\"230\" y=\"124\" font-size=\"10\" text-anchor=\"start\" >what is at stake?<\/text><rect class=\"b3\" x=\"422\" y=\"80\" width=\"194\" height=\"58\" rx=\"6\"/><text class=\"tl\" x=\"436\" y=\"106\" font-size=\"13\" text-anchor=\"start\" >6  Theme<\/text><text class=\"tm\" x=\"436\" y=\"124\" font-size=\"10\" text-anchor=\"start\" >what is it about?<\/text><text class=\"tl\" x=\"310\" y=\"166\" font-size=\"10\" text-anchor=\"middle\" >A strong opening plants clues to all six in the first paragraph or two<\/text><\/svg><figcaption>开头的六个线索：时代、地点、类型、人物、冲突、主题。<\/figcaption><\/figure>\n<table>\n<tr><th>#<\/th><th>线索<\/th><th>问题<\/th><\/tr>\n<tr><td class=\"h\">1<\/td><td>Era 时代<\/td><td>故事发生在什么时候？<\/td><\/tr>\n<tr><td class=\"h\">2<\/td><td>Location 地点<\/td><td>在哪里？<\/td><\/tr>\n<tr><td class=\"h\">3<\/td><td>Genre 类型<\/td><td>这个世界的规则是什么？<\/td><\/tr>\n<tr><td class=\"h\">4<\/td><td>Character 人物<\/td><td>故事关于谁？谁会卷进来？<\/td><\/tr>\n<tr><td class=\"h\">5<\/td><td>Conflict 冲突<\/td><td>世界里什么造成张力？什么利害攸关？<\/td><\/tr>\n<tr><td class=\"h\">6<\/td><td>Theme 主题<\/td><td>故事最终可能关于什么？<\/td><\/tr>\n<\/table>\n<p class=\"muted\">课程阅读的短篇开头：Rachel Heng \"The Game\"、Dylan Brown \"Alien Hunters\"、Gwendolyn Paradice \"As Close as We Dare\"（切尔诺贝利）、Ruth Joffre \"A Girl Turns to Stone\"。长篇开头：Jeff VanderMeer《Annihilation》、Ian McEwan《Enduring Love》、Mark Haddon《The Curious Incident of the Dog in the Night-Time》、Donna Tartt《The Secret History》、Anne Enright《What Are You Like》。读的时候对照上面六个问题，看作者怎样用感官细节和潜台词给出答案。短篇作家要在一两段里打好场景基础，长篇作家也会在头一两页做到。<\/p>\n<div class=\"sum\">Setting is more than place: time, place, social and moral rules, sensory detail and the protagonist's position in the world. Use objects as clues to character, scatter a few curated details instead of info dumps, let setting reflect the character's state of mind with restraint, and use the opening to signal era, location, genre, character, conflict and theme.<\/div>\n", "terms": [{"t": "Curation", "z": "精选", "e": "Choosing the single most evocative detail."}, {"t": "Economy", "z": "节省", "e": "Evoking place with two or three details instead of ten or twelve."}, {"t": "Flat backdrop", "z": "平面背景板（避免）", "e": "Setting that does nothing but sit behind the characters."}, {"t": "Front-loading the setting", "z": "开头前置场景", "e": "Using the opening to ground era, place, atmosphere and social order."}, {"t": "Iceberg (world building)", "z": "世界构建的冰山", "e": "Vast world building under the surface; only curated details appear on the page."}, {"t": "Info dump", "z": "信息倾倒（避免）", "e": "Weighing the story down with research or world-building detail the moment does not need."}, {"t": "Ironic tension", "z": "反讽张力", "e": "Placing a character in a setting at odds with them, e.g., a tropical holiday during a failing marriage."}, {"t": "Less is more", "z": "少即是多", "e": "Scatter a few telling details throughout instead of describing everything at once."}, {"t": "Melodramatic description", "z": "夸张描写（避免）", "e": "E.g., \"rain that weeps from the sky\"; use subtle, real sensory details instead."}, {"t": "Narrative momentum", "z": "叙事推进力", "e": "The forward movement of the story, which description pauses."}, {"t": "Objects as clues", "z": "物品作为线索", "e": "The things characters keep are tangible clues to who they are."}, {"t": "Protagonist's place in the world", "z": "主角在世界中的位置", "e": "Is the protagonist on the edge or at the centre; what is their status?"}, {"t": "Sensory details", "z": "感官细节", "e": "Sight, smell, sound, taste and touch that build the story world."}, {"t": "Setting", "z": "场景（不只是地点）", "e": "Time, place, social rules, sensory detail and the protagonist's place in the world."}, {"t": "Setting as projection of character", "z": "场景是人物心理的投射", "e": "How a character sees the surroundings reflects their state of mind."}, {"t": "Six opening clues", "z": "开头六线索", "e": "Era, location, genre, character, conflict, theme."}, {"t": "Social and moral rules", "z": "社会和道德规则", "e": "What is allowed and forbidden in the story world."}, {"t": "World building", "z": "世界构建", "e": "The writer's process of inventing and knowing the story world; most of it stays off the page."}]}]}</script>
<script>
const CFG=JSON.parse(document.getElementById('data').textContent);const D=CFG.units;const K=CFG.key;
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let known=new Set(store.get(K+'-known',[]));
const keyOf=(n,t)=>n+'|'+t;
const pad=n=>CFG.prefix+String(n).padStart(2,'0');
const examsOf=n=>CFG.exams.filter(x=>x.units.includes(n));
const scopeUnits=(s,L)=>s==='lesson'?[L]:s==='all'?D:D.filter(l=>(CFG.exams.find(x=>x.id===s)||{units:[]}).units.includes(l.n));
let cur=CFG.start, viewName='notes';
$('#brand').innerHTML=`${CFG.code} · ${CFG.short}<small>${CFG.sub}</small>`;
$('#examtag').innerHTML=CFG.exams.map(x=>`<b>${x.label}</b> = ${x.units.length?x.units.map(pad).join(', '):'—'}${x.note?` <em>${x.note}</em>`:''}`).join('<br>');

// lecture list
$('#lessons').innerHTML=D.map(l=>`<li><button data-n="${l.n}"><span class="no">${pad(l.n)}</span><span class="nm">${l.en}<em>${l.zh}</em></span></button></li>`).join('');
$('#lessons').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(+b.dataset.n,viewName)});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(cur,b.dataset.v)});

function go(n,v){location.hash=`l${n}`+(v==='notes'?'':'-'+v)}
function route(){
  const m=/^#l(\d+)(?:-(terms|cards))?$/.exec(location.hash);
  if(m&&D.some(l=>l.n===+m[1])){cur=+m[1];viewName=m[2]||'notes'} else {const s=store.get(K+'-last',CFG.start);cur=D.some(l=>l.n===s)?s:CFG.start;viewName='notes'}
  store.set(K+'-last',cur);render();
}
window.addEventListener('hashchange',()=>{route();window.scrollTo({top:0})});

function render(){
  const L=D.find(l=>l.n===cur);
  document.querySelectorAll('#lessons button').forEach(b=>b.setAttribute('aria-current',+b.dataset.n===cur));
  const act=document.querySelector(`#lessons button[data-n="${cur}"]`);act&&act.scrollIntoView({block:'nearest',inline:'center'});
  $('#eyebrow').textContent=[`${CFG.unitWord} ${pad(cur)}`.trim(),L.tag,...examsOf(cur).map(x=>x.label)].filter(Boolean).join(' · ');
  $('#title').textContent=L.en; $('#titlezh').textContent=L.zh; $('#ct').textContent=L.terms.length;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===viewName));
  if(viewName==='notes') renderNotes(L); else if(viewName==='terms') renderTerms(L); else renderCards(L);
}

function renderNotes(L){
  const v=$('#view'); v.innerHTML=`<article class="notes">${L.notes}</article>`;
  v.querySelectorAll('.notes table').forEach(t=>{if(t.parentElement.classList.contains('tw')||t.classList.contains('je'))return;const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t)});
}

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(s,q){s=esc(s);if(!q)return s;const i=s.toLowerCase().indexOf(q.toLowerCase());return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length)}
function renderTerms(L){
  const v=$('#view');
  v.innerHTML=`<div class="tools"><input class="search" id="q" type="search" placeholder="搜索关键词（英文或中文）" autocomplete="off"><label class="chk"><input type="checkbox" id="allq"> 搜全部 ${D.length} ${CFG.unitZh}</label><span class="count" id="n"></span></div><ul class="gl" id="gl"></ul>`;
  const draw=()=>{
    const q=$('#q').value.trim(), all=$('#allq').checked;
    const src=(all?D:[L]).flatMap(l=>l.terms.map(t=>({...t,n:l.n})));
    const rows=q?src.filter(t=>(t.t+' '+t.z+' '+t.e).toLowerCase().includes(q.toLowerCase())):src;
    $('#n').textContent=`${rows.length} 个`;
    $('#gl').innerHTML=rows.length?rows.map(t=>`<li><div><span class="gt">${all?`<span class="lsn">${pad(t.n)}</span>`:''}${hl(t.t,q)}</span><span class="gz">${hl(t.z,q)}</span></div><div class="ge">${hl(t.e,q)}</div></li>`).join(''):`<li class="empty">没有找到“${esc(q)}”。试试勾选“搜全部 ${D.length} ${CFG.unitZh}”。</li>`;
  };
  $('#q').addEventListener('input',draw);$('#allq').addEventListener('change',draw);draw();
}

// flashcards
let fc={scope:'lesson',rev:false,onlyNew:false,deck:[],i:0,flip:false};
function buildDeck(L){
  const src=scopeUnits(fc.scope,L);
  let deck=src.flatMap(l=>l.terms.map(t=>({...t,n:l.n})));
  if(fc.onlyNew) deck=deck.filter(t=>!known.has(keyOf(t.n,t.t)));
  fc.deck=deck; fc.i=0; fc.flip=false;
}
function renderCards(L){
  buildDeck(L);
  const v=$('#view');
  v.innerHTML=`<div class="fc-wrap">
   <div class="tools">
    <div class="seg" id="scope">${[['lesson','本课'],...CFG.exams.filter(x=>x.units.length>1).map(x=>[x.id,x.label]),['all','全部']].map(([k,t])=>`<button data-s="${k}" aria-pressed="${fc.scope===k}">${t}</button>`).join('')}</div>
    <label class="chk"><input type="checkbox" id="rev" ${fc.rev?'checked':''}> 反向（看释义猜词）</label>
    <label class="chk"><input type="checkbox" id="onlyNew" ${fc.onlyNew?'checked':''}> 只看还不熟的</label>
   </div>
   <div id="cardbox"></div>
   <p class="keys"><kbd>空格</kbd> 翻面 · <kbd>←</kbd><kbd>→</kbd> 上一张/下一张 · <kbd>1</kbd> 还不熟 · <kbd>2</kbd> 记住了</p>
  </div>`;
  $('#scope').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;fc.scope=b.dataset.s;renderCards(L)});
  $('#rev').addEventListener('change',e=>{fc.rev=e.target.checked;fc.flip=false;drawCard()});
  $('#onlyNew').addEventListener('change',e=>{fc.onlyNew=e.target.checked;renderCards(L)});
  drawCard();
}
function drawCard(){
  const box=$('#cardbox'); if(!box)return;
  const N=fc.deck.length, kn=fc.deck.filter(t=>known.has(keyOf(t.n,t.t))).length;
  if(!N){box.innerHTML=`<div class="done"><b>这一组都记住了</b>取消“只看还不熟的”，或换一个范围继续复习。<br><br><button class="btn" id="reset">清除这组的“记住了”标记</button></div>`;
    $('#reset').onclick=()=>{const L=D.find(l=>l.n===cur);fc.onlyNew=false;
      const src=scopeUnits(fc.scope,L);
      src.forEach(l=>l.terms.forEach(t=>known.delete(keyOf(l.n,t.t))));store.set(K+'-known',[...known]);renderCards(L)};return}
  if(fc.i>=N){box.innerHTML=`<div class="done"><b>这一轮看完了</b>${N} 张里记住了 ${kn} 张。<br><br><button class="btn" id="again">再来一轮</button> <button class="btn ghost" id="sh">打乱顺序再来</button></div>`;
    $('#again').onclick=()=>{fc.i=0;fc.flip=false;drawCard()};$('#sh').onclick=()=>{shuffle();drawCard()};return}
  const t=fc.deck[fc.i], isK=known.has(keyOf(t.n,t.t));
  const termSide=`<div class="big">${esc(t.t)}</div>`;
  const defSide=`<div class="zhbig">${esc(t.z)}</div><div class="def">${esc(t.e)}</div>`;
  const corner=`<div class="corner"><span>${pad(t.n)}</span><span>${isK?'<span class="known">✓ 记住了</span>':''}</span></div>`;
  box.innerHTML=`<div class="card${fc.flip?' flip':''}" id="card" role="button" tabindex="0" aria-label="翻面">
    <div class="card-in">
      <div class="face front">${corner}${fc.rev?defSide:termSide}<div class="hint">点卡片翻面</div></div>
      <div class="face back">${corner}${fc.rev?termSide+defSide.replace('<div class="def">'+esc(t.e)+'</div>',''):termSide+defSide}</div>
    </div></div>
   <div class="fc-bar">
    <button class="btn ghost" id="prev" ${fc.i===0?'disabled':''}>← 上一张</button>
    <span style="display:flex;gap:8px"><button class="btn no" id="no">还不熟</button><button class="btn yes" id="yes">记住了</button></span>
    <button class="btn ghost" id="shuf">打乱</button>
   </div>
   <div class="prog"><i style="width:${(fc.i/N*100).toFixed(1)}%"></i></div>
   <div class="fc-meta"><span>${fc.i+1} / ${N}</span><span>记住 ${kn} / ${N}</span></div>`;
  $('#card').onclick=flip; $('#card').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();flip()}};
  $('#prev').onclick=()=>step(-1); $('#no').onclick=()=>mark(false); $('#yes').onclick=()=>mark(true);
  $('#shuf').onclick=()=>{shuffle();drawCard()};
}
function flip(){fc.flip=!fc.flip;const c=$('#card');c&&c.classList.toggle('flip',fc.flip)}
function step(d){fc.i=Math.max(0,fc.i+d);fc.flip=false;drawCard()}
function mark(ok){const t=fc.deck[fc.i];if(!t)return;const k=keyOf(t.n,t.t);ok?known.add(k):known.delete(k);store.set(K+'-known',[...known]);step(1)}
function shuffle(){for(let i=fc.deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fc.deck[i],fc.deck[j]]=[fc.deck[j],fc.deck[i]]}fc.i=0;fc.flip=false}
document.addEventListener('keydown',e=>{
  if(viewName!=='cards'||e.target.matches('input,textarea'))return;
  if(e.key===' '){e.preventDefault();flip()} else if(e.key==='ArrowRight')step(1); else if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='1')mark(false); else if(e.key==='2')mark(true);
});
route();
</script>

</body>
