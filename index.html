<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Master of Management Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one column, name block then a grid of course cards that link into each course */
:root{--bg:#f3f5f8;--panel:#ffffff;--ink:#13213a;--fg:#1d2433;--muted:#667085;--line:#e0e5ec;--term:#c2006b;--chip:#e8ecf3;
 --display:"Archivo","Noto Sans SC",system-ui,sans-serif;--body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e131d;--panel:#161d2b;--ink:#e7ebf3;--fg:#d9dee8;--muted:#97a1b4;--line:#273044;--term:#ff5aaa;--chip:#222b3c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e131d;--panel:#161d2b;--ink:#e7ebf3;--fg:#d9dee8;--muted:#97a1b4;--line:#273044;--term:#ff5aaa;--chip:#222b3c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15.5px;line-height:1.6;margin:0}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:clamp(36px,8vw,80px) 60px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--term)}
h1{font-family:var(--display);font-weight:800;color:var(--ink);font-size:clamp(34px,6vw,52px);line-height:1.05;letter-spacing:-.02em;margin:8px 0 10px;text-wrap:balance}
.lead{color:var(--muted);max-width:46ch;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:36px}
.course{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.course:hover{border-color:var(--term);transform:translateY(-2px)}
.course:focus-visible{outline:2px solid var(--term);outline-offset:2px}
.code{font-family:var(--mono);font-size:13px;color:var(--term);letter-spacing:.06em}
.name{font-family:var(--display);font-weight:800;font-size:24px;color:var(--ink);line-height:1.2}
.zh{color:var(--muted);font-size:14px}
.meta{font-size:13.5px;margin-top:10px}.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.units{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.units i{font-style:normal;font-family:var(--mono);font-size:11.5px;background:var(--chip);border-radius:999px;padding:2px 9px;color:var(--fg)}
.foot{margin-top:40px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.course{transition:none}.course:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">UBC Sauder · 2026W1</div>
  <h1>Master of Management 复习站</h1>
  <div class="grid"><a class="course" href="comm320/"><span class="code">COMM 320</span><span class="name">Financial Accounting</span><span class="zh">财务会计 · Scott Sinclair</span>
<span class="meta"><b>8</b> 单元 · <b>183</b> 个关键词</span>
<span class="units"><i>U01</i><i>U02</i><i>U03</i><i>U04</i><i>U05</i><i>U06</i><i>U07</i><i>U08</i></span></a><a class="course" href="comm321/"><span class="code">COMM 321</span><span class="name">Organizational Behaviour</span><span class="zh">组织行为学 · Dr Svedic</span>
<span class="meta"><b>8</b> 课 · <b>252</b> 个关键词</span>
<span class="units"><i>L01</i><i>L02</i><i>L03</i><i>L04</i><i>L05</i><i>L06</i><i>L07</i><i>L08</i></span></a></div>
  <p class="foot">个人学习笔记 · 闪卡进度只保存在这台设备的浏览器里</p>
</div>

</body>
</html>
