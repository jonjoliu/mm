<style>
/* Layout: lecture rail (left, desktop) / chip row (phone) + one reading column; three views per lecture: notes · terms · flashcards */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#13213a; --fg:#1d2433; --muted:#667085; --line:#e0e5ec;
  --term:#c2006b; --accent:#13213a; --green:#3f8a22; --green-bg:#eef7e6; --green-line:#d3e8c1;
  --hot:#c0392b; --tbg:#f9d4d0; --kbg:#d3e3fb; --blue:#1f5fa8; --blue-bg:#f1f6fd; --th:#e9edf4; --zebra:#f8f9fb;
  --chip:#e8ecf3; --gold:#a77800; --gold-bg:#fbf1d3;
  --display:"Archivo","Noto Sans SC",system-ui,sans-serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131d; --panel:#161d2b; --ink:#e7ebf3; --fg:#d9dee8; --muted:#97a1b4; --line:#273044;
  --term:#ff5aaa; --accent:#9db7ea; --green:#86c766; --green-bg:#18261a; --green-line:#2b4426;
  --hot:#ff7b6b; --tbg:#4a2328; --kbg:#1f3456; --blue:#8db8ee; --blue-bg:#152236; --th:#1f2839; --zebra:#1a2231;
  --chip:#222b3c; --gold:#e6bb4a; --gold-bg:#3a3018; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131d; --panel:#161d2b; --ink:#e7ebf3; --fg:#d9dee8; --muted:#97a1b4; --line:#273044;
  --term:#ff5aaa; --accent:#9db7ea; --green:#86c766; --green-bg:#18261a; --green-line:#2b4426;
  --hot:#ff7b6b; --tbg:#4a2328; --kbg:#1f3456; --blue:#8db8ee; --blue-bg:#152236; --th:#1f2839; --zebra:#1a2231;
  --chip:#222b3c; --gold:#e6bb4a; --gold-bg:#3a3018; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15.5px;line-height:1.7;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--term);outline-offset:2px;border-radius:4px}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1180px;margin:0 auto;gap:36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 60px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start}
.brand{font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink);letter-spacing:-.01em;line-height:1.15}
.brand small{display:block;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.lessons{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.lessons button{width:100%;display:grid;grid-template-columns:38px 1fr;align-items:baseline;gap:4px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.lessons button:hover{background:var(--chip)}
.lessons .no{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lessons .nm{font-size:14px;line-height:1.35;color:var(--fg)}
.lessons .nm em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.lessons button[aria-current="true"]{background:var(--panel);box-shadow:inset 3px 0 0 var(--term),0 1px 0 var(--line)}
.lessons button[aria-current="true"] .no{color:var(--term)}
.quiz-tag{margin:18px 10px 0;font-size:12px;color:var(--muted);line-height:1.5}
.quiz-tag b{color:var(--fg)}

main{min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:1px solid var(--line);padding-bottom:16px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--term);text-transform:uppercase}
h1{font-family:var(--display);font-weight:800;color:var(--ink);font-size:clamp(26px,4vw,36px);line-height:1.12;margin:4px 0 2px;text-wrap:balance;letter-spacing:-.015em}
.h1zh{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:10px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs .ct{font-family:var(--mono);font-size:11px;margin-left:4px;opacity:.75}
.view{padding-top:22px}

/* ---------- notes ---------- */
.notes{max-width:760px}
.notes h2{font-family:var(--display);font-weight:800;font-size:21px;color:var(--ink);margin:34px 0 10px;line-height:1.3;text-wrap:balance;padding-top:14px;border-top:2px solid var(--ink)}
.notes h2:first-child{margin-top:0}
.notes h3,.notes h4{display:inline-block;font-size:15.5px;color:var(--ink);background:var(--green-bg);border-left:4px solid var(--green);padding:1px 10px;margin:18px 0 8px;border-radius:0 4px 4px 0;line-height:1.5}
.notes p{margin:0 0 10px}
.notes ul,.notes ol{margin:0 0 12px;padding-left:22px}
.notes li{margin-bottom:3px}
.notes b{font-weight:700;color:var(--ink)}
.notes .t{background:var(--tbg);padding:0 4px;border-radius:3px}
.notes .k{background:var(--kbg);padding:0 4px;border-radius:3px}
.notes .hot{color:var(--hot);font-weight:700;font-size:13px;margin-left:6px;white-space:nowrap}
.notes .hot::before{content:"⚠ "}
.notes .sum{background:var(--green-bg);border:1px solid var(--green-line);border-radius:8px;padding:10px 14px;margin:12px 0 6px;font-size:14.5px}
.notes .sum::before{content:"✎ Exam summary · ";font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--green);font-weight:500}
.notes .formula{background:var(--th);border-radius:8px;text-align:center;font-weight:700;padding:10px;margin:8px 0 12px;color:var(--ink)}
.notes .muted{color:var(--muted);font-size:14px}
.notes .zh{color:var(--muted);font-size:.9em}
.notes p.zh,.notes div.zh{background:var(--zebra);border-radius:6px;padding:6px 10px}
.notes .bk{color:var(--blue);background:var(--blue-bg);border-radius:6px;padding:6px 10px}
.notes .bk::before{content:"课本 ";font-family:var(--mono);font-size:11px;font-weight:500}
.notes .bbox{color:var(--fg);border:1px solid var(--blue);border-radius:8px;padding:8px 12px;margin:10px 0;background:var(--blue-bg)}
.notes .bbox b{color:var(--blue)}
.notes .src{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--blue);border:1px solid currentColor;padding:0 5px;border-radius:4px;vertical-align:3px;white-space:nowrap}
.notes .trap{color:var(--hot)}
.notes .ans{color:var(--green);font-weight:700}
.tw{overflow-x:auto;margin:6px 0 14px;border:1px solid var(--line);border-radius:8px}
.notes table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px;background:var(--panel)}
.notes th{background:var(--th);text-align:left;font-weight:700;color:var(--ink);padding:7px 10px;border-bottom:1px solid var(--line)}
.notes td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.notes tr:nth-child(even) td{background:var(--zebra)}
.notes td.h{font-weight:700;color:var(--ink);white-space:nowrap}
.notes .grid2{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0 12px;font-size:14px}
.notes .grid2 div{padding:8px 12px;border:1px solid var(--line);min-width:0}
.notes .grid2 .lab{font-weight:700;color:var(--ink);border:0;padding:0}
/* L06 figures */
.tkifig{display:grid;grid-template-columns:22px 1fr;gap:4px;max-width:520px;margin:10px auto 14px}
.tkifig .yax{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.tkifig .xax{text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.quad{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.cell{border-radius:8px;padding:10px 12px;min-height:84px;display:flex;flex-direction:column;font-size:13px;background:var(--th)}
.cell b{font-size:15px;color:var(--ink)}
.cell.r{background:var(--tbg)} .cell.r b{color:var(--hot)}
.cell.g{background:var(--green-bg)} .cell.g b{color:var(--green)}
.ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1.5px solid var(--gold);border-radius:999px;padding:4px 12px;text-align:center;font-size:12.5px;white-space:nowrap;line-height:1.35}
.ctr b{color:var(--gold)}
.zfig{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 22px;margin:8px 0 6px}
.zfig svg{display:block;font-family:var(--mono)}
.zfig svg text[fill="#13213a"],.zfig svg text:not([fill]){fill:var(--fg)}
.zfig svg line[stroke="#333"]{stroke:var(--fg)}
.zfig svg text[fill="#8a5a00"]{fill:var(--gold)}
.zfig svg rect[fill="#f2b134"]{fill:var(--gold)}
.zfig + p{font-size:13px!important}

/* ---------- terms ---------- */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 12px;font:inherit;font-size:15px;color:var(--fg)}
.count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.gl{list-style:none;margin:0;padding:0;max-width:880px}
.gl li{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr);gap:4px 22px;padding:10px 0;border-bottom:1px solid var(--line)}
.gl .gt{color:var(--term);font-weight:700;line-height:1.35}
.gl .gz{display:block;color:var(--muted);font-size:13px;line-height:1.45;margin-top:2px}
.gl .ge{line-height:1.55}
.gl mark{background:var(--gold-bg);color:inherit;border-radius:2px}
.gl .lsn{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}
.empty{color:var(--muted);padding:20px 0}

/* ---------- flashcards ---------- */
.fc-wrap{max-width:640px}
.seg{display:inline-flex;gap:2px;background:var(--chip);padding:3px;border-radius:9px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:700}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.card{position:relative;margin:14px 0 12px;perspective:1400px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card-in{position:relative;display:grid;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:300px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 28px;display:flex;flex-direction:column;justify-content:center;gap:10px;box-shadow:0 1px 0 var(--line),0 10px 28px -18px rgba(19,33,58,.35)}
.face.back{transform:rotateY(180deg)}
.face .corner{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.face .big{font-family:var(--display);font-weight:800;font-size:clamp(24px,5vw,34px);color:var(--term);line-height:1.15;text-wrap:balance;text-align:center}
.face .zhbig{font-size:18px;color:var(--muted);text-align:center}
.face .def{font-size:17px;line-height:1.6;color:var(--fg);text-align:center;text-wrap:pretty}
.face .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.face .known{color:var(--green)}
@media (prefers-reduced-motion: reduce){.card-in{transition:none}}
.fc-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 16px;cursor:pointer;font-size:14.5px}
.btn:hover{border-color:var(--muted)}
.btn.no{color:var(--hot)} .btn.yes{color:var(--green)}
.btn.ghost{background:none}
.prog{height:4px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;background:var(--term);width:0;transition:width .25s}
.fc-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px}
.keys{font-size:12px;color:var(--muted);margin-top:14px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel)}
.done{text-align:center;padding:40px 10px}
.done b{font-family:var(--display);font-size:24px;color:var(--ink);display:block;margin-bottom:6px}

.home{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none;margin-bottom:10px}
.home:hover{color:var(--term)}
.quiz-tag em{font-style:normal;color:var(--term)}
.notes .je{font-family:var(--mono);font-size:13.5px;background:var(--zebra);border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:6px 0 14px;max-width:520px}
.notes .je div{display:grid;grid-template-columns:30px 1fr auto;gap:8px}
.notes .je div.cr{padding-left:26px}
.notes .je span{color:var(--muted)}
.notes .je em{font-style:normal;font-variant-numeric:tabular-nums;text-align:right}
.notes .je p{margin:2px 0 6px;color:var(--muted);font-size:12px;font-family:var(--body)}
/* ---------- phone ---------- */
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0;padding-block:14px 48px}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:8px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line)}
  .brand{font-size:17px}.brand small{display:none}
  .lessons{flex-direction:row;overflow-x:auto;margin-top:8px;gap:6px;scrollbar-width:none}
  .lessons::-webkit-scrollbar{display:none}
  .lessons button{display:block;width:auto;background:var(--chip);padding:5px 11px;border-radius:999px;white-space:nowrap}
  .lessons .nm{display:none}
  .lessons .no{color:var(--fg);font-size:13px}
  .lessons button[aria-current="true"]{background:var(--ink);box-shadow:none}
  .lessons button[aria-current="true"] .no{color:var(--bg)}
  .quiz-tag{display:none}
  .home{margin-bottom:4px}
  .head{padding-top:14px}
  .gl li{grid-template-columns:minmax(0,1fr)}
  .face{min-height:260px;padding:26px 18px}
}
</style>
