</div>

<script id="data" type="application/json">{"code": "COMM 320", "short": "FA", "sub": "Financial Accounting · Scott Sinclair", "key": "fa320", "prefix": "U", "unitWord": "", "unitZh": "单元", "start": 7, "exams": [{"id": "oq1", "label": "Online Quiz 1", "units": [1, 2]}, {"id": "oq2", "label": "Online Quiz 2", "units": [3, 4, 5]}, {"id": "iq", "label": "In-class Quiz", "units": [2, 3, 4, 5, 6]}, {"id": "final", "label": "Final", "units": [7, 8], "note": "+ Ch 5, 11, 12 待补"}], "units": [{"n": 1, "en": "Introduction to Financial Reporting", "zh": "财务报告概述", "tag": "Ch 1", "notes": "<h2>1. 财务报表是给谁看的？<\/h2>\n<p>财务报表的目的：给<b>现在和潜在的投资人（investors）、贷款人（lenders）和其他债权人（creditors）<\/b>提供有用的信息，帮他们决定要不要把钱投给或借给这家公司。<\/p>\n<p><b>Users（使用者）<\/b>分为 internal（内部，比如管理层）和 external（外部）。外部使用者包括 owners（股东）、potential investors / creditors（潜在投资人、债权人）、government agencies（政府机构，比如税务局）。<\/p>\n<p class=\"muted\">不同使用者想看的东西不一样，所以一套报表很难同时满足所有人。<\/p>\n<p>这门课主要讲给<b>外部使用者<\/b>看的会计 = <span class=\"t\">financial accounting<\/span>（财务会计）。给内部管理层做决策用的叫 managerial accounting（管理会计）。<\/p>\n\n<h2>2. 四张财务报表<span class=\"hot\">高频考点<\/span><\/h2>\n<div class=\"tw\"><table>\n<tr><th>报表<\/th><th>别名<\/th><th>时间<\/th><th>回答什么问题<\/th><\/tr>\n<tr><td class=\"h\">Statement of Financial Position<\/td><td>Balance Sheet（资产负债表）<\/td><td><b>某一个时间点<\/b>（point in time）<\/td><td>公司有什么、欠什么？<\/td><\/tr>\n<tr><td class=\"h\">Statement of Comprehensive Income<\/td><td>Income Statement / Statement of Earnings（利润表）<\/td><td><b>一段时间<\/b>（period）<\/td><td>这段时间赚了多少？<\/td><\/tr>\n<tr><td class=\"h\">Statement of Changes in Equity<\/td><td>（私营公司做 Statement of Retained Earnings）<\/td><td>一段时间<\/td><td>股东权益怎么变的？<\/td><\/tr>\n<tr><td class=\"h\">Statement of Cash Flows<\/td><td>现金流量表<\/td><td>一段时间<\/td><td>现金从哪来、花到哪？<\/td><\/tr>\n<\/table><\/div>\n<p>再加上 <span class=\"k\">Notes to the financial statements<\/span>（报表附注）：写公司用了哪些会计政策（accounting policies），以及报表里放不下的细节，比如正在打的官司。<\/p>\n<div class=\"sum\">The balance sheet shows a point in time; the income statement, statement of changes in equity and cash flow statement each cover a period. Notes explain accounting policies and extra details.<\/div>\n\n<h2>3. 会计等式与资产负债表<\/h2>\n<div class=\"formula\">Assets = Liabilities + Shareholders' Equity<\/div>\n<p>这个等式<b>永远要平衡<\/b>。分析任何交易时，都要想：哪一边变了？另一边怎么跟着变？<\/p>\n<h3>Asset（资产）的三个条件<\/h3>\n<ol><li>是一项<b>现在的经济资源<\/b>（present economic resource）<\/li><li>被公司<b>控制<\/b>（controlled by the entity）<\/li><li>来自<b>过去的事件<\/b>（result of a past event）<\/li><\/ol>\n<p>资产按<b>流动性<\/b>（liquidity，多快能变成现金）从高到低排列。一般按 <span class=\"t\">cost principle<\/span>（成本原则）记账：按买的时候付的钱记录，不按市价。少数资产例外，比如上市公司的有价证券、生物资产会用市价。<\/p>\n<h3>Liability（负债）的三个条件<\/h3>\n<ol><li>是一项<b>现在的义务<\/b>（present obligation）<\/li><li>来自<b>过去的交易<\/b><\/li><li>将来要<b>交出经济资源<\/b>（比如付钱）<\/li><\/ol>\n<h3>Shareholders' Equity（股东权益）的三部分<\/h3>\n<ul>\n<li><b>Contributed capital / Share capital<\/b>（投入资本/股本）：股东投进来的钱<\/li>\n<li><b>Retained earnings<\/b>（留存收益）：公司成立以来赚的钱，减去已经分给股东的股利（dividends）<\/li>\n<li><b>Other components<\/b>（其他部分）：资产、负债价值变化带来的调整<\/li>\n<\/ul>\n\n<h2>4. 利润表（Income Statement）<\/h2>\n<p>利润表报告一段时间内的经营结果：<b>Revenues − Expenses = Net earnings（净利润）<\/b>。第二部分是 other comprehensive income（其他综合收益），中级会计才细讲。<\/p>\n<p><span class=\"t\">Operating cycle<\/span>（营业周期）：从付钱给供应商和员工，到从客户那里收回现金的时间。<span class=\"t\">Periodicity assumption<\/span>（会计分期假设）：可以把公司的经营结果切成更短的期间（月、季度）来报告。管理层不能等一整年才看业绩。<\/p>\n<p>做报表要决定两件事：<b>Recognition<\/b>（什么时候记）和 <b>Measurement<\/b>（记多少钱）。<\/p>\n<h3>利润表从上到下<\/h3>\n<div class=\"tw\"><table>\n<tr><th>项目<\/th><th>意思<\/th><\/tr>\n<tr><td class=\"h\">Sales<\/td><td>主营业务收入<\/td><\/tr>\n<tr><td class=\"h\">− Cost of sales<\/td><td>卖出去的货的成本（COGS）<\/td><\/tr>\n<tr><td class=\"h\">= Gross margin / profit<\/td><td>毛利，零售业特别看重<\/td><\/tr>\n<tr><td class=\"h\">− Operating expenses<\/td><td>日常经营费用：工资、房租、水电<\/td><\/tr>\n<tr><td class=\"h\">= Operating income<\/td><td>营业利润<\/td><\/tr>\n<tr><td class=\"h\">± Other income / expenses<\/td><td>非主营：投资收益、利息费用、卖资产的 gain/loss<\/td><\/tr>\n<tr><td class=\"h\">= Earnings before income taxes<\/td><td>税前利润<\/td><\/tr>\n<tr><td class=\"h\">− Income tax expense<\/td><td>所得税也是经营成本<\/td><\/tr>\n<tr><td class=\"h\">= Earnings from continuing operations<\/td><td>持续经营利润（有预测价值）<\/td><\/tr>\n<tr><td class=\"h\">± Discontinued operations (net of tax)<\/td><td>已经关掉或卖掉的业务，以后不会再有<\/td><\/tr>\n<\/table><\/div>\n<p><span class=\"t\">Earnings per share (EPS)<\/span>（每股收益）= Net earnings ÷ <b>weighted average<\/b> number of common shares outstanding（加权平均流通普通股数）。<\/p>\n<p class=\"muted\">为什么要单独列 discontinued operations？如果混在一起，读者会以为这些收入和费用明年还会有。<\/p>\n\n<h2>5. 股东权益变动表 &amp; 现金流量表<\/h2>\n<h3>Retained earnings 怎么算<span class=\"hot\">高频考点<\/span><\/h3>\n<div class=\"formula\">Ending RE = Opening RE + Net earnings (− Net loss) − Dividends declared<\/div>\n<p>例：年初留存收益 $80,000，今年净利润 $30,000，宣告股利 $10,000 → 年末 = 80,000 + 30,000 − 10,000 = <b>$100,000<\/b>。年初数要等于去年资产负债表上的数，年末数要等于今年资产负债表上的数。<\/p>\n<h3>Statement of Cash Flows 三部分<\/h3>\n<ul>\n<li><b>Operating<\/b>（经营活动）：日常经营收到和付出的现金<\/li>\n<li><b>Investing<\/b>（投资活动）：买卖长期资产、投资<\/li>\n<li><b>Financing<\/b>（筹资活动）：借钱还钱、发股票、付股利<\/li>\n<\/ul>\n<p class=\"muted\">公司必须产生足够的现金才能活下去。现金流量表在 Final 范围内（Ch 5）。<\/p>\n\n<h2>6. 加拿大的会计规则<\/h2>\n<p>加拿大的报表要遵守 <span class=\"t\">GAAP<\/span>（Generally Accepted Accounting Principles，公认会计原则）。规则由 CPA Canada 的 <b>Accounting Standards Board (AcSB)<\/b> 制定，过程中会听取证监会和各方意见，所以是一个\"政治过程\"。<\/p>\n<p><b>为什么需要会计准则？<\/b>让报表做法一致、信息质量高、减少操纵、保护公众。<\/p>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>IFRS<\/th><th>ASPE<\/th><\/tr>\n<tr><td class=\"h\">谁用<\/td><td>Publicly accountable entities（上市公司）<\/td><td>Private enterprises（私营公司）<\/td><\/tr>\n<tr><td class=\"h\">全称<\/td><td>International Financial Reporting Standards<\/td><td>Accounting Standards for Private Enterprises<\/td><\/tr>\n<tr><td class=\"h\">报表<\/td><td>Statement of comprehensive income + Statement of changes in equity<\/td><td>Income statement + Statement of retained earnings<\/td><\/tr>\n<\/table><\/div>\n<h3>管理层和审计师的责任<\/h3>\n<p><b>管理层（management）<\/b>对报表负责，要保证信息完整、真实反映交易（faithful representation）。上市公司的报表必须由<b>独立审计师（independent auditor）<\/b>审计。审计意见（audit opinion）不是\"保证全对\"，而是说报表在所有<b>重大方面（material respects）<\/b>公允反映。<\/p>\n\n<h2>7. 企业形式 &amp; 职业道德<\/h2>\n<div class=\"tw\"><table>\n<tr><th>形式<\/th><th>所有者<\/th><th>责任<\/th><th>特点<\/th><\/tr>\n<tr><td class=\"h\">Proprietorship（独资）<\/td><td>1 个人<\/td><td>Unlimited liability（无限责任）<\/td><td>容易成立<\/td><\/tr>\n<tr><td class=\"h\">Partnership（合伙）<\/td><td>2 人以上<\/td><td>Unlimited liability<\/td><td>容易成立<\/td><\/tr>\n<tr><td class=\"h\">Corporation（公司）<\/td><td>股东<\/td><td><b>Limited liability（有限责任）<\/b><\/td><td>独立法人，股份容易转让，有税务优势；有 share capital 和 retained earnings<\/td><\/tr>\n<\/table><\/div>\n<p><b>Ethics（职业道德）<\/b>是会计职业的基础。重要规则：<b>confidentiality<\/b>（保密）、<b>competence<\/b>（胜任）、遵守 CPA Handbook、不和明知虚假的信息扯上关系、维护职业声誉。<\/p>\n<div class=\"sum\">Canadian public companies use IFRS; private companies may use ASPE. Management is responsible for the financial statements; an independent audit gives reasonable assurance, not a guarantee. Corporations have limited liability.<\/div>\n", "terms": [{"t": "Accounting equation", "z": "会计等式", "e": "Assets = Liabilities + Shareholders' Equity; it must always balance."}, {"t": "ASPE", "z": "私营企业会计准则", "e": "Accounting Standards for Private Enterprises; prepare an income statement and statement of retained earnings."}, {"t": "Asset", "z": "资产：现在的资源、被控制、来自过去", "e": "A present economic resource controlled by the entity as a result of a past event."}, {"t": "Contributed capital", "z": "投入资本/股本", "e": "Permanent investments by shareholders (share capital)."}, {"t": "Corporation", "z": "公司：有限责任", "e": "Separate legal entity; limited liability; shares are easy to transfer."}, {"t": "Cost principle", "z": "成本原则", "e": "Record assets at the amount paid to acquire them, not market value."}, {"t": "Discontinued operations", "z": "终止经营", "e": "Results of a segment that was closed or sold; shown separately, net of tax."}, {"t": "Earnings per share (EPS)", "z": "每股收益", "e": "Net earnings ÷ weighted average number of common shares outstanding."}, {"t": "Financial accounting", "z": "财务会计：给外部使用者", "e": "Accounting that reports to external users such as investors and creditors."}, {"t": "GAAP", "z": "公认会计原则", "e": "Generally Accepted Accounting Principles; Canadian statements must follow them."}, {"t": "Gross margin", "z": "毛利", "e": "Sales minus cost of sales."}, {"t": "IFRS", "z": "国际财务报告准则（上市公司）", "e": "International Financial Reporting Standards, used by publicly accountable entities in Canada."}, {"t": "Independent auditor", "z": "独立审计师", "e": "Gives an opinion that statements are fairly presented in all material respects; not a guarantee."}, {"t": "Liability", "z": "负债：现在的义务、来自过去、要付出资源", "e": "A present obligation from past transactions that requires transferring an economic resource."}, {"t": "Managerial accounting", "z": "管理会计：给内部管理层", "e": "Accounting for internal decision-making by managers."}, {"t": "Notes to the financial statements", "z": "报表附注", "e": "Accounting policies and extra details, such as lawsuits, not shown in the statements."}, {"t": "Operating cycle", "z": "营业周期", "e": "Time from paying suppliers and employees to collecting cash from customers."}, {"t": "Partnership", "z": "合伙企业：无限责任", "e": "Two or more partners; easy to form; unlimited liability."}, {"t": "Periodicity assumption", "z": "会计分期假设", "e": "Results can be split into shorter periods such as months or quarters."}, {"t": "Proprietorship", "z": "独资企业：无限责任", "e": "Owned by one person; easy to form; unlimited liability."}, {"t": "Retained earnings", "z": "留存收益", "e": "Earnings kept by the company since it started, not paid out as dividends."}, {"t": "Statement of cash flows", "z": "现金流量表", "e": "Sources and uses of cash: operating, investing and financing activities."}, {"t": "Statement of changes in equity", "z": "股东权益变动表", "e": "Reconciles opening to ending share capital, retained earnings and other components."}, {"t": "Statement of comprehensive income", "z": "综合收益表（期间）", "e": "Shows revenues minus expenses (net earnings) plus other comprehensive income for a period."}, {"t": "Statement of financial position", "z": "资产负债表（时点）", "e": "Balance sheet: assets, liabilities and equity at a point in time."}, {"t": "Users of financial statements", "z": "报表使用者", "e": "Owners, potential investors and creditors, and government agencies (internal and external)."}]}, {"n": 2, "en": "Recording & Adjusting", "zh": "记账与期末调整", "tag": "Ch 2–3", "notes": "<h2>1. 好的财务信息有什么特点？<span class=\"hot\">高频考点<\/span><\/h2>\n<h3>Fundamental characteristics（基本特征）<\/h3>\n<ul>\n<li><span class=\"t\">Relevance<\/span>（相关性）：能帮助预测未来（predictive value）或确认过去的判断（confirmatory value）<\/li>\n<li><span class=\"t\">Faithful representation<\/span>（如实反映）：<b>complete<\/b>（完整）、<b>neutral<\/b>（中立、不偏）、<b>free from material error<\/b>（没有重大错误）。重大错误 = 会影响使用者决策的错误。要反映交易的<b>实质<\/b>（substance）<\/li>\n<\/ul>\n<h3>Enhancing characteristics（增强特征）<\/h3>\n<ul>\n<li><b>Comparability<\/b>（可比性）：每年用一致的方法<\/li>\n<li><b>Verifiability<\/b>（可验证性）：独立的会计师能核实<\/li>\n<li><b>Timeliness<\/b>（及时性）：信息要及时<\/li>\n<li><b>Understandability<\/b>（可理解性）：清楚简洁；假设读者对商业有基本了解<\/li>\n<\/ul>\n<p><span class=\"t\">Cost constraint<\/span>（成本约束）：只有当信息带来的好处大于提供它的成本时，才值得提供。<\/p>\n\n<h2>2. 基本假设和会计原则<\/h2>\n<div class=\"tw\"><table>\n<tr><th>Assumptions（假设）<\/th><th>意思<\/th><\/tr>\n<tr><td class=\"h\">Separate entity<\/td><td>公司的账和老板个人的账分开<\/td><\/tr>\n<tr><td class=\"h\">Stable monetary unit<\/td><td>用本国货币记账，不按通货膨胀调整<\/td><\/tr>\n<tr><td class=\"h\">Going concern / Continuity<\/td><td>假设公司在可预见的将来会继续经营<\/td><\/tr>\n<\/table><\/div>\n<div class=\"tw\"><table>\n<tr><th>Principles（原则）<\/th><th>意思<\/th><\/tr>\n<tr><td class=\"h\">Historical cost<\/td><td>资产大多按实际成本记录（IFRS 允许部分资产用别的计量）<\/td><\/tr>\n<tr><td class=\"h\">Prudence（谨慎）<\/td><td>小心不要<b>高估<\/b>资产和收入，也不要<b>低估<\/b>负债和费用<\/td><\/tr>\n<tr><td class=\"h\">Revenue recognition<\/td><td>收入在<b>赚到（earned）<\/b>时确认<\/td><\/tr>\n<tr><td class=\"h\">Matching<\/td><td>费用要和它帮助产生的收入记在<b>同一期<\/b><\/td><\/tr>\n<\/table><\/div>\n\n<h2>3. Cash basis vs. Accrual basis<span class=\"hot\">高频考点<\/span><\/h2>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>Cash basis（现金制）<\/th><th>Accrual basis（权责发生制）<\/th><\/tr>\n<tr><td class=\"h\">收入<\/td><td>收到现金时记<\/td><td><b>赚到时<\/b>记（earned）<\/td><\/tr>\n<tr><td class=\"h\">费用<\/td><td>付出现金时记<\/td><td><b>发生时<\/b>记（incurred）<\/td><\/tr>\n<tr><td class=\"h\">GAAP？<\/td><td>✗ 不符合<\/td><td>✓ 符合，本课用这个<\/td><\/tr>\n<tr><td class=\"h\">问题<\/td><td>管理层可以靠推迟或提前收付款来操纵利润；资产负债表不完整<\/td><td>需要期末调整（adjusting entries）<\/td><\/tr>\n<\/table><\/div>\n<p>例：12 月给客户做完 $2,000 的服务，客户 1 月才付钱。Accrual：<b>12 月<\/b>记收入；Cash：1 月才记。<\/p>\n\n<h2>4. 记录交易：借和贷<\/h2>\n<p><b>Event<\/b>（事件）会对公司有经济影响；<b>transaction<\/b>（交易）是<b>马上<\/b>影响会计等式的事件。只有 transaction 才记账。签一份 6 个月后才交货的合同：<b>不记账<\/b>，因为现在资产、负债、权益都没变。<\/p>\n<p><span class=\"t\">Account<\/span>（账户）：记录某一项目变化的地方。<span class=\"t\">Chart of accounts<\/span>（会计科目表）：所有账户的清单，顺序是 Assets → Liabilities → Equity → Revenues → Expenses。<\/p>\n<h3>借贷规则（一定要背熟）<\/h3>\n<div class=\"tw\"><table>\n<tr><th>账户类型<\/th><th>增加<\/th><th>减少<\/th><th>正常余额<\/th><\/tr>\n<tr><td class=\"h\">Asset 资产<\/td><td><b>Dr<\/b><\/td><td>Cr<\/td><td>Debit<\/td><\/tr>\n<tr><td class=\"h\">Expense 费用 / Loss 损失<\/td><td><b>Dr<\/b><\/td><td>Cr<\/td><td>Debit<\/td><\/tr>\n<tr><td class=\"h\">Dividends declared<\/td><td><b>Dr<\/b><\/td><td>Cr<\/td><td>Debit<\/td><\/tr>\n<tr><td class=\"h\">Liability 负债<\/td><td>Cr<\/td><td><b>Dr<\/b><\/td><td>Credit<\/td><\/tr>\n<tr><td class=\"h\">Equity 权益<\/td><td>Cr<\/td><td><b>Dr<\/b><\/td><td>Credit<\/td><\/tr>\n<tr><td class=\"h\">Revenue 收入 / Gain 利得<\/td><td>Cr<\/td><td><b>Dr<\/b><\/td><td>Credit<\/td><\/tr>\n<\/table><\/div>\n<p class=\"muted\">记忆法：<b>DEAD CLIC<\/b>：Debit 增加 = Dividends, Expenses, Assets；Credit 增加 = Liabilities, Income (revenue), Capital (equity)。Debit = 左边，Credit = 右边，没有好坏之分。<\/p>\n<h3>Journal entry 格式<\/h3>\n<p>先写借方，再写贷方（贷方缩进），借贷总额必须相等，最后写一句说明。<\/p>\n<div class=\"je\"><div><span>Dr<\/span>Equipment<em>5,000<\/em><\/div><div class=\"cr\"><span>Cr<\/span>Cash<em>2,000<\/em><\/div><div class=\"cr\"><span>Cr<\/span>Notes payable<em>3,000<\/em><\/div><p>(Bought equipment: $2,000 cash, $3,000 note)<\/p><\/div>\n<p><b>Journal<\/b>（日记账）按日期记录分录；<b>posting<\/b>（过账）= 把分录转到各个账户。<b>T-account<\/b>：左边 Debit，右边 Credit，用来分析交易。<b>Trial balance<\/b>（试算平衡表）：列出每个账户的余额，借方合计 = 贷方合计。<\/p>\n\n<h2>5. 期末调整（Adjusting entries）<span class=\"hot\">高频考点<\/span><\/h2>\n<p>因为用权责发生制，期末总会有些交易没记或记得不对，所以要做调整。从 <b>unadjusted trial balance<\/b> 开始，调整完得到 <b>adjusted trial balance<\/b>，再做报表。<\/p>\n<p class=\"t\" style=\"display:inline-block\">调整分录永远不涉及 Cash！<\/p>\n<div class=\"tw\"><table>\n<tr><th>情况<\/th><th>调整分录<\/th><th>叫法<\/th><\/tr>\n<tr><td class=\"h\">收入已赚但没记（服务做完，还没开账单）<\/td><td>Dr Trade receivable / Cr Sales revenue<\/td><td>Accrued revenue（应计收入）<\/td><\/tr>\n<tr><td class=\"h\">预收款里有一部分已经赚到<\/td><td>Dr Unearned revenue / Cr Sales revenue<\/td><td>Deferred revenue 转收入<\/td><\/tr>\n<tr><td class=\"h\">费用已发生但还没收到账单<\/td><td>Dr Expense / Cr Accounts payable 或 Accrued liabilities<\/td><td>Accrued expense（应计费用）<\/td><\/tr>\n<tr><td class=\"h\">资产被用掉一部分<\/td><td>Dr Depreciation expense / Cr Accumulated depreciation<\/td><td>Internal allocation（内部分摊）<\/td><\/tr>\n<\/table><\/div>\n<p>故意提前确认还没赚到的收入 = <b>fraudulent financial reporting<\/b>（财务造假），应该冲回。<\/p>\n<h3>Straight-line depreciation（直线法折旧）<\/h3>\n<div class=\"formula\">Annual depreciation = (Cost − Residual value) ÷ Useful life<\/div>\n<p>例：设备 $50,000，残值 $5,000，用 5 年 → 每年折旧 = 45,000 ÷ 5 = <b>$9,000<\/b>。<\/p>\n<p><span class=\"t\">Accumulated depreciation<\/span>（累计折旧）是 <span class=\"k\">contra account<\/span>（备抵账户）：抵减相关资产，正常是贷方余额。<\/p>\n\n<h2>6. 结账（Closing entries）<\/h2>\n<p>只在<b>年底<\/b>结账：把 <b>temporary accounts<\/b>（临时账户）清零，余额转到 retained earnings。<\/p>\n<ul>\n<li><b>Permanent accounts<\/b>（永久账户，不结）：assets、liabilities、equity（share capital、retained earnings）<\/li>\n<li><b>Temporary accounts<\/b>（临时账户，要结）：revenues、expenses、gains、losses、dividends declared<\/li>\n<\/ul>\n<ol>\n<li>把每个收入账户结转到 Income Summary<\/li>\n<li>把每个费用账户结转到 Income Summary<\/li>\n<li>Income Summary 的余额（= 净利润）转到 Retained Earnings<\/li>\n<li>Dividends declared 直接结转到 Retained Earnings<\/li>\n<\/ol>\n<div class=\"sum\">Accrual accounting records revenue when earned and expenses when incurred. Debits increase assets, expenses and dividends; credits increase liabilities, equity and revenue. Adjusting entries never involve cash. Temporary accounts are closed to retained earnings at year end.<\/div>\n", "terms": [{"t": "Accrual basis", "z": "权责发生制（符合 GAAP）", "e": "Revenue when earned; expenses when incurred."}, {"t": "Accrued expense", "z": "应计费用", "e": "Expense incurred but not yet recorded: Dr Expense, Cr Payable/Accrued liability."}, {"t": "Accrued revenue", "z": "应计收入", "e": "Revenue earned but not yet recorded: Dr Receivable, Cr Revenue."}, {"t": "Adjusting entries", "z": "调整分录：永远不涉及现金", "e": "End-of-period entries to update accounts under accrual accounting."}, {"t": "Cash basis", "z": "现金制（不符合 GAAP）", "e": "Revenue when cash is received; expenses when cash is paid."}, {"t": "Chart of accounts", "z": "会计科目表", "e": "List of all accounts: assets, liabilities, equity, revenues, expenses."}, {"t": "Closing entries", "z": "结账分录", "e": "Year-end entries that set temporary accounts to zero and move balances to retained earnings."}, {"t": "Comparability", "z": "可比性", "e": "Information is prepared on a consistent basis."}, {"t": "Contra account", "z": "备抵账户", "e": "Offsets a related account, e.g., accumulated depreciation offsets the asset."}, {"t": "Cost constraint", "z": "成本约束", "e": "Provide information only if benefits exceed the cost."}, {"t": "Credit", "z": "贷方（右边）", "e": "Increases liabilities, equity, revenue and gains."}, {"t": "Debit", "z": "借方（左边）", "e": "Increases assets, expenses, losses and dividends."}, {"t": "Faithful representation", "z": "如实反映", "e": "Complete, neutral and free from material error; reflects substance."}, {"t": "Going concern", "z": "持续经营假设", "e": "Assume the entity will keep operating in the foreseeable future."}, {"t": "Journal entry", "z": "会计分录", "e": "Records a transaction; debits listed first, credits indented; debits = credits."}, {"t": "Matching principle", "z": "配比原则", "e": "Record expenses in the same period as the revenue they help earn."}, {"t": "Material error", "z": "重大错误", "e": "An error that would change a user's decision."}, {"t": "Permanent accounts", "z": "永久账户（不结账）", "e": "Assets, liabilities and equity accounts."}, {"t": "Posting", "z": "过账", "e": "Transferring journal entry amounts to the accounts."}, {"t": "Prudence", "z": "谨慎原则", "e": "Avoid overstating assets and revenue or understating liabilities and expenses."}, {"t": "Relevance", "z": "相关性", "e": "Information has predictive and/or confirmatory value."}, {"t": "Separate entity assumption", "z": "会计主体假设", "e": "Keep the company's records separate from the owners' personal ones."}, {"t": "Stable monetary unit", "z": "货币计量假设", "e": "Report in national currency with no inflation adjustment."}, {"t": "Straight-line depreciation", "z": "直线法折旧", "e": "(Cost − residual value) ÷ useful life."}, {"t": "T-account", "z": "T 型账户", "e": "Tool to analyze an account: debits on the left, credits on the right."}, {"t": "Temporary accounts", "z": "临时账户（要结账）", "e": "Revenues, expenses, gains, losses and dividends declared."}, {"t": "Timeliness", "z": "及时性", "e": "Information is available in time to affect decisions."}, {"t": "Transaction", "z": "交易：马上影响会计等式", "e": "An event with an immediate effect on assets, liabilities or equity; only these are recorded."}, {"t": "Trial balance", "z": "试算平衡表", "e": "List of all account balances; total debits must equal total credits."}, {"t": "Understandability", "z": "可理解性", "e": "Clear and concise for users with reasonable business knowledge."}, {"t": "Unearned revenue", "z": "预收收入（负债）", "e": "Cash received before the revenue is earned; a liability."}, {"t": "Verifiability", "z": "可验证性", "e": "Independent accountants could verify the information."}]}, {"n": 3, "en": "Revenue Recognition & Income Statement", "zh": "收入确认与利润表", "tag": "Ch 4", "notes": "<h2>1. 收入：确认和计量<\/h2>\n<p><span class=\"t\">Revenue<\/span>（收入）= 公司<b>日常经营活动<\/b>带来的经济利益增加。<span class=\"t\">Gain<\/span>（利得）= 日常经营<b>以外<\/b>的活动带来的增加，比如卖掉旧设备赚的钱。<\/p>\n<p>使用者关心收入的<b>数量和趋势<\/b>，也关心<b>质量<\/b>：收入从哪来、能不能持续。<\/p>\n<p><b>Recognition<\/b>（确认）= 什么时候记；<b>Measurement<\/b>（计量）= 记多少。客户在收入条件满足之前先付钱 → 记成负债 <span class=\"k\">unearned / deferred revenue<\/span>（预收/递延收入）。所有公司都要在附注里披露收入确认政策。<\/p>\n\n<h2>2. 两种收入确认方法<span class=\"hot\">高频考点<\/span><\/h2>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>ASPE：Earnings-based approach<\/th><th>IFRS 15：Contract-based approach<\/th><\/tr>\n<tr><td class=\"h\">核心<\/td><td>重大<b>风险和报酬<\/b>（risks and rewards）转移给买方<\/td><td>商品或服务的<b>控制权<\/b>（control）转移给客户<\/td><\/tr>\n<tr><td class=\"h\">条件 / 步骤<\/td><td>① 风险报酬已转移（通常是法定所有权转移）<br>② 卖方不再参与管理、不再控制货物<br>③ 收入金额能可靠计量<br>④ 经济利益很可能流入卖方<br>⑤ 相关成本能可靠计量<\/td><td>① Identify the <b>contract<\/b><br>② Identify the <b>performance obligations<\/b>（履约义务）<br>③ Determine the <b>transaction price<\/b><br>④ <b>Allocate<\/b> the price to each obligation<br>⑤ <b>Recognize<\/b> revenue when each obligation is satisfied<\/td><\/tr>\n<\/table><\/div>\n<h3>为什么要出 IFRS 15？<\/h3>\n<ul>\n<li>统一成<b>一个<\/b>适用所有行业的 5 步模型<\/li>\n<li>从\"风险报酬\"改为看\"<b>控制权<\/b>\"，更贴近经济实质<\/li>\n<li>提高可比性，披露更详细<\/li>\n<li>指引更清楚，<b>减少操纵收入<\/b>的空间<\/li>\n<li>和美国 FASB 合作，与 US GAAP 一致<\/li>\n<\/ul>\n<p>例：手机套餐 = 手机（第 1 个义务）+ 2 年服务（第 2 个义务）。总价要分摊到两个义务上：手机部分交货时确认，服务部分在 2 年里慢慢确认。<\/p>\n\n<h2>3. 销售折扣、退货和折让<\/h2>\n<div class=\"formula\">Net sales = Gross sales − Sales discounts − Sales returns − Sales allowances<\/div>\n<p>这三个都是 <span class=\"k\">contra revenue accounts<\/span>（收入的备抵账户），借方余额，单独记账方便管理层追踪。<\/p>\n<h3>Sales discount（现金折扣：早付款给折扣）<\/h3>\n<p>例：卖货 $1,000，条件 <b>2/10, n/30<\/b>（10 天内付款打 98 折，否则 30 天内付全款）。客户第 8 天付款：<\/p>\n<div class=\"je\"><div><span>Dr<\/span>Cash<em>980<\/em><\/div><div><span>Dr<\/span>Sales discount<em>20<\/em><\/div><div class=\"cr\"><span>Cr<\/span>Trade receivables<em>1,000<\/em><\/div><\/div>\n<h3>Sales return（退货）：要做两笔<\/h3>\n<div class=\"je\"><div><span>Dr<\/span>Sales returns<em>XX<\/em><\/div><div class=\"cr\"><span>Cr<\/span>Trade receivables<em>XX<\/em><\/div><p>(按售价冲收入)<\/p><div><span>Dr<\/span>Inventory<em>XX<\/em><\/div><div class=\"cr\"><span>Cr<\/span>Cost of sales<em>XX<\/em><\/div><p>(按成本把货收回库存)<\/p><\/div>\n<h3>Sales allowance（折让：货有问题但客户留下，给降价）<\/h3>\n<div class=\"je\"><div><span>Dr<\/span>Sales allowances<em>XX<\/em><\/div><div class=\"cr\"><span>Cr<\/span>Trade receivables<em>XX<\/em><\/div><\/div>\n<p class=\"muted\">注意：退货和折让借记的是 Sales returns / Sales allowances，<b>不是直接借记 Sales<\/b>。<\/p>\n<h3>Gross margin percentage（毛利率）<\/h3>\n<div class=\"formula\">Gross margin % = Gross profit ÷ Net sales<\/div>\n<p>例：净销售 $200,000，销售成本 $120,000 → 毛利 $80,000 → 毛利率 <b>40%<\/b>。越高说明越赚钱。<\/p>\n\n<h2>4. 保修（Warranties）<\/h2>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>Assurance warranty（基本保修）<\/th><th>Service warranty（延保）<\/th><\/tr>\n<tr><td class=\"h\">是什么<\/td><td>包含在售价里，不单独收费<\/td><td>客户另外花钱买的延长保修<\/td><\/tr>\n<tr><td class=\"h\">卖出时<\/td><td>估计保修费用：<br>Dr Warranty expense / Cr Provision for warranty liability<\/td><td>收到钱先记负债：<br>Dr Cash / Cr Deferred revenue<\/td><\/tr>\n<tr><td class=\"h\">之后<\/td><td>客户来修：<br>Dr Provision for warranty liability / Cr Inventory 或 Cash<\/td><td>随时间确认收入：Dr Deferred revenue / Cr Revenue<br>有维修时：Dr Warranty claims expense / Cr Cash<\/td><\/tr>\n<\/table><\/div>\n\n<h2>5. 收入造假 &amp; 利润表格式<\/h2>\n<p>美国 SEC 发现的主要会计违规：<\/p>\n<ul>\n<li><b>Improper revenue recognition<\/b>（不当确认收入，约 43%）：提前确认、虚构销售、<b>channel stuffing<\/b>（塞货：给经销商发超出他们能卖的货来虚增销售）<\/li>\n<li><b>Earnings management<\/b>（盈余管理）：调整确认时间来达到分析师预期<\/li>\n<li><b>Reserves manipulation<\/b>（操纵准备，约 28%）：\"<b>cookie jar reserves<\/b>\"：好年景多提准备，差年景再冲回来增加利润<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<tr><th>Single-step income statement<\/th><th>Multi-step income statement<\/th><\/tr>\n<tr><td>所有收入 − 所有费用 = 净利润<\/td><td>分三步：<b>gross profit → operating income → net income<\/b>；把经营和非经营项目分开，更能看出经营效率<\/td><\/tr>\n<\/table><\/div>\n<p class=\"muted\">费用可以按 <b>function<\/b>（功能：销售、管理）或按 <b>nature<\/b>（性质：工资、折旧）列示。<\/p>\n<div class=\"sum\">Revenue comes from ordinary activities; gains come from outside them. ASPE uses risks and rewards; IFRS 15 uses the five-step, control-based model. Net sales = gross sales − discounts − returns − allowances. Improper revenue recognition is the most common accounting abuse.<\/div>\n", "terms": [{"t": "Assurance warranty", "z": "基本保修（含在售价里）", "e": "Included in the price; estimate warranty expense and a provision at the time of sale."}, {"t": "Channel stuffing", "z": "塞货", "e": "Shipping customers more goods than they can sell to inflate sales."}, {"t": "Contract-based approach", "z": "合同法（IFRS 15）：控制权转移", "e": "Five steps: contract, performance obligations, price, allocate, recognize."}, {"t": "Cookie jar reserves", "z": "饼干罐准备", "e": "Over-reserving in good years and reversing into income in bad years."}, {"t": "Earnings management", "z": "盈余管理", "e": "Changing the timing of revenue or expenses to hit earnings targets."}, {"t": "Earnings-based approach", "z": "收益法（ASPE）：风险报酬转移", "e": "Recognize revenue when risks and rewards transfer, amounts are reliable and collection is probable."}, {"t": "Gain", "z": "利得：日常经营以外", "e": "Increase in economic benefits from activities outside ordinary operations."}, {"t": "Gross margin percentage", "z": "毛利率", "e": "Gross profit ÷ net sales."}, {"t": "IFRS 15", "z": "客户合同收入准则", "e": "Revenue from Contracts with Customers; applies from January 1, 2018."}, {"t": "Measurement", "z": "计量：记多少", "e": "The amount at which an item is recorded."}, {"t": "Multi-step income statement", "z": "多步式利润表", "e": "Shows gross profit, operating income and net income separately."}, {"t": "Net sales", "z": "净销售额", "e": "Gross sales − sales discounts − returns − allowances."}, {"t": "Performance obligation", "z": "履约义务", "e": "A promise in a contract to transfer a good or service to the customer."}, {"t": "Recognition", "z": "确认：什么时候记", "e": "When an item is recorded in the statements."}, {"t": "Revenue", "z": "收入：日常经营带来", "e": "Increase in economic benefits from ordinary activities."}, {"t": "Sales allowances", "z": "销售折让", "e": "Price reduction for damaged or wrong goods the customer keeps."}, {"t": "Sales discount", "z": "现金折扣：早付款", "e": "Discount for early payment, e.g., 2/10, n/30; a contra revenue account."}, {"t": "Sales returns", "z": "销售退回", "e": "Customer returns goods; a contra revenue account. Also return inventory to stock."}, {"t": "Service warranty", "z": "延保（另外收费）", "e": "Extended warranty sold separately; record as deferred revenue first."}, {"t": "Single-step income statement", "z": "单步式利润表", "e": "All revenues minus all expenses equals net income."}, {"t": "Transaction price", "z": "交易价格", "e": "The amount the company expects to receive for the goods or services."}]}, {"n": 4, "en": "Internal Controls, Fraud & Cash", "zh": "内部控制、舞弊与现金", "tag": "Ch 6", "notes": "<h2>1. 内部控制是什么？<\/h2>\n<p>管理层对报表内容负责。加拿大和美国发生过几起大型财务造假后，政府加强了要求：美国有 <b>Sarbanes-Oxley Act<\/b>（萨班斯法案），加拿大有证券法规。现在上市公司要接受<b>对财务报告内部控制的审计<\/b>。<\/p>\n<p><span class=\"t\">Internal controls<\/span>（内部控制）= 公司用来保护资产、减少欺诈和错误、产生可靠财务信息的政策和程序。公司越大，内控越重要。<\/p>\n<h3>内控的四个目的<\/h3>\n<ul><li>Safeguard assets（保护资产）<\/li><li>Enhance the reliability of accounting records（让会计记录可靠）<\/li><li>Increase the efficiency of operations（提高经营效率）<\/li><li>Ensure compliance with laws and regulations（遵守法律法规）<\/li><\/ul>\n<p class=\"muted\">再好的内控也不可能 100% 有效。<\/p>\n\n<h2>2. Error vs. Fraud<span class=\"hot\">高频考点<\/span><\/h2>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>Error（错误）<\/th><th>Fraud（欺诈）<\/th><\/tr>\n<tr><td class=\"h\">是否故意<\/td><td><b>无意<\/b>的失误：算错、用错会计准则<\/td><td><b>故意<\/b>用欺骗手段获得不正当利益<\/td><\/tr>\n<\/table><\/div>\n<div class=\"tw\"><table>\n<tr><th>Financial reporting fraud（财务报告舞弊）<\/th><th>Misappropriation of assets（侵占资产）<\/th><\/tr>\n<tr><td>高估资产价值 · 隐瞒负债 · 虚构销售 · 少记费用<\/td><td>公司信用卡私用 · 偷库存 · 私用公司资产<\/td><\/tr>\n<\/table><\/div>\n<h3>Fraud triangle（舞弊三角）：为什么会有人舞弊？<\/h3>\n<ol>\n<li><b>Incentive / Pressure<\/b>（动机/压力）：比如欠债、要完成业绩<\/li>\n<li><b>Opportunity<\/b>（机会）：内控有漏洞<\/li>\n<li><b>Rationalization<\/b>（合理化/借口）：\"公司欠我的\"\"只是借一下\"<\/li>\n<\/ol>\n<p class=\"muted\">公司最能控制的是 <b>opportunity<\/b>，靠的就是内部控制。<\/p>\n\n<h2>3. 内部控制的五个组成部分<span class=\"hot\">高频考点<\/span><\/h2>\n<div class=\"tw\"><table>\n<tr><th>Component<\/th><th>问自己<\/th><\/tr>\n<tr><td class=\"h\">Control environment（控制环境）<\/td><td>高层重视内控吗？（tone at the top）<\/td><\/tr>\n<tr><td class=\"h\">Risk assessment（风险评估）<\/td><td>管理层有没有找出和分析风险？<\/td><\/tr>\n<tr><td class=\"h\">Control activities（控制活动）<\/td><td>针对风险设计了政策和程序吗？<\/td><\/tr>\n<tr><td class=\"h\">Information and communication（信息与沟通）<\/td><td>信息有没有在内部和对外传达？<\/td><\/tr>\n<tr><td class=\"h\">Monitoring（监控）<\/td><td>有没有检查控制是否有效？重大缺陷有没有报告给高层和董事会？<\/td><\/tr>\n<\/table><\/div>\n<h3>Control activities 的六种做法<\/h3>\n<ul>\n<li><b>Establishment of responsibility<\/b>：每项工作有明确负责人<\/li>\n<li><b>Segregation of duties<\/b>（职责分离）：一个人不能从头管到尾<\/li>\n<li><b>Documentation procedures<\/b>：单据编号、留记录<\/li>\n<li><b>Physical controls<\/b>：保险柜、门禁、监控<\/li>\n<li><b>Independent internal verification<\/b>：由别人独立核对<\/li>\n<li><b>Human resource controls<\/b>：背景调查、轮岗、强制休假<\/li>\n<\/ul>\n<h3>内控的局限<\/h3>\n<ul>\n<li>要考虑成本（cost-benefit）<\/li>\n<li>由人执行，会出错<\/li>\n<li>管理层可以凌驾于内控之上（<b>management override<\/b>）<\/li>\n<li>两个人串通（<b>collusion<\/b>）可以绕过职责分离<\/li>\n<li>对不常见的交易、新情况可能无效<\/li>\n<\/ul>\n\n<h2>4. 现金的内部控制<\/h2>\n<p>现金流动性最强，最容易被偷，所以要严格保护。核心是<b>职责分离<\/b>：一个人不能同时负责收钱、付钱和记账。<\/p>\n<ul>\n<li>每天把现金和支票存进银行<\/li>\n<li>限制接触现金的人<\/li>\n<li>所有支出用支票支付，发票要经管理层批准<\/li>\n<li>每张支票要<b>两个人签字<\/b><\/li>\n<li>定期核对现金余额，特别是做 <span class=\"t\">bank reconciliation<\/span>（银行对账）<\/li>\n<\/ul>\n<p>现金一般是流动资产，除非有使用限制（restricted cash）。<\/p>\n\n<h2>5. 银行对账（Bank reconciliation）<span class=\"hot\">高频考点<\/span><\/h2>\n<p>目的：让<b>公司账上的现金<\/b>和<b>银行对账单上的余额<\/b>对得上。差异来自两类：<b>timing differences<\/b>（时间差）和 <b>errors<\/b>（错误）。最好由不经手现金的人来做，每月做一次。<\/p>\n<div class=\"tw\"><table>\n<tr><th>调整 Bank 这一边（公司<b>不用<\/b>做分录）<\/th><th>调整 Book 这一边（公司<b>要<\/b>做分录）<\/th><\/tr>\n<tr><td>\n<b>+ Deposits in transit<\/b>（在途存款）：公司记了，银行还没入账<br>\n<b>− Outstanding cheques<\/b>（未兑现支票）：公司开了，银行还没付<br>\n<b>± Bank errors<\/b>（银行的错）：比如把别人的支票扣到你的账户\n<\/td><td>\n<b>+<\/b> 银行代收的款、<b>利息收入<\/b>（公司还没记）<br>\n<b>−<\/b> 银行<b>手续费<\/b>、自动扣款（公司还没记）<br>\n<b>− NSF cheques<\/b>（空头支票：客户账户没钱，被退回）<br>\n<b>±<\/b> 公司自己记错的数\n<\/td><\/tr>\n<\/table><\/div>\n<div class=\"formula\">Adjusted bank balance = Adjusted book balance<\/div>\n<h3>小例子<\/h3>\n<p>银行对账单余额 $8,400；公司账上 $7,950。在途存款 $1,200，未兑现支票 $1,800，银行手续费 $30，客户 NSF 支票 $120。<\/p>\n<div class=\"tw\"><table>\n<tr><th>Bank side<\/th><th><\/th><th>Book side<\/th><th><\/th><\/tr>\n<tr><td>Balance per bank<\/td><td>8,400<\/td><td>Balance per books<\/td><td>7,950<\/td><\/tr>\n<tr><td>+ Deposit in transit<\/td><td>1,200<\/td><td>− Bank service charge<\/td><td>(30)<\/td><\/tr>\n<tr><td>− Outstanding cheques<\/td><td>(1,800)<\/td><td>− NSF cheque<\/td><td>(120)<\/td><\/tr>\n<tr><td><b>Adjusted bank<\/b><\/td><td><b>7,800<\/b><\/td><td><b>Adjusted books<\/b><\/td><td><b>7,800<\/b><\/td><\/tr>\n<\/table><\/div>\n<p>公司要做的分录只针对 Book side：<\/p>\n<div class=\"je\"><div><span>Dr<\/span>Bank charges expense<em>30<\/em><\/div><div><span>Dr<\/span>Trade receivables<em>120<\/em><\/div><div class=\"cr\"><span>Cr<\/span>Cash<em>150<\/em><\/div><p>(NSF 支票重新挂回客户的应收账款)<\/p><\/div>\n<div class=\"sum\">Internal controls safeguard assets and make records reliable, but can never be 100% effective. The fraud triangle is pressure, opportunity and rationalization. In a bank reconciliation, only book-side items (bank charges, NSF cheques, company errors, items collected by the bank) need journal entries.<\/div>\n", "terms": [{"t": "Bank reconciliation", "z": "银行对账", "e": "Matching the company's cash balance to the bank statement balance."}, {"t": "Bank service charge", "z": "银行手续费（从账面余额减）", "e": "Fee on the bank statement not yet recorded by the company."}, {"t": "Collusion", "z": "串通", "e": "Two or more employees working together to get around controls."}, {"t": "Control activities", "z": "控制活动", "e": "Policies and procedures that respond to identified risks."}, {"t": "Control environment", "z": "控制环境", "e": "Does top management care about internal control?"}, {"t": "Deposit in transit", "z": "在途存款（加到银行余额）", "e": "Recorded by the company but not yet by the bank."}, {"t": "Error", "z": "错误：无意的", "e": "An unintentional mistake, such as a wrong calculation."}, {"t": "Financial reporting fraud", "z": "财务报告舞弊", "e": "E.g., fictitious sales, unrecorded liabilities, understated expenses."}, {"t": "Fraud", "z": "欺诈：故意的", "e": "An intentional act of deception to gain an unjust or illegal advantage."}, {"t": "Fraud triangle", "z": "舞弊三角", "e": "Incentive/pressure, opportunity and rationalization."}, {"t": "Independent internal verification", "z": "独立内部核查", "e": "Someone else checks the work."}, {"t": "Information and communication", "z": "信息与沟通", "e": "Capturing and sharing information inside and outside the organization."}, {"t": "Internal controls", "z": "内部控制", "e": "Policies and procedures that protect assets, reduce fraud and error, and give reliable information."}, {"t": "Management override", "z": "管理层凌驾", "e": "Managers bypassing the controls."}, {"t": "Misappropriation of assets", "z": "侵占资产", "e": "Theft or personal use of company assets."}, {"t": "Monitoring", "z": "监控", "e": "Checking that controls work and reporting deficiencies to the board."}, {"t": "NSF cheque", "z": "空头支票（从账面余额减）", "e": "Customer cheque returned for not sufficient funds; needs a journal entry."}, {"t": "Outstanding cheque", "z": "未兑现支票（从银行余额减）", "e": "Written by the company but not yet processed by the bank."}, {"t": "Risk assessment", "z": "风险评估", "e": "Identifying and analyzing risks to the entity."}, {"t": "Sarbanes-Oxley Act", "z": "萨班斯法案（美国）", "e": "US law requiring stronger internal control over financial reporting at public companies."}, {"t": "Segregation of duties", "z": "职责分离", "e": "No one person should handle a transaction from start to finish."}]}, {"n": 5, "en": "Accounts Receivable", "zh": "应收账款", "tag": "Ch 6", "notes": "<h2>1. 应收账款从哪来？<\/h2>\n<p>公司给客户<b>赊账<\/b>（credit，比如 30 天或 60 天后付款）就会产生 <span class=\"t\">trade receivables / accounts receivable<\/span>（应收账款）。注意：课本说的 credit sales 是公司自己给的赊账，<b>不是<\/b>客户刷信用卡。<\/p>\n<div class=\"tw\"><table>\n<tr><th>现金销售<\/th><th>赊销<\/th><\/tr>\n<tr><td>Dr Cash / Cr Sales revenue<\/td><td>Dr Trade receivables / Cr Sales revenue<\/td><\/tr>\n<\/table><\/div>\n<p class=\"muted\">（永续盘存制下还要另做一笔 Dr Cost of sales / Cr Inventory，见 Unit 6。）应收账款通常是流动资产，要和非贸易应收款分开列。<\/p>\n\n<h2>2. 收不回来的账怎么处理？<span class=\"hot\">高频考点<\/span><\/h2>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>Direct write-off method（直接核销法）<\/th><th>Allowance method（备抵法）<\/th><\/tr>\n<tr><td class=\"h\">做法<\/td><td>确定收不回来时才直接冲掉<\/td><td><b>每期先估计<\/b>坏账，建立备抵<\/td><\/tr>\n<tr><td class=\"h\">分录<\/td><td>Dr Credit losses / Cr Trade receivables<\/td><td>Dr Credit losses / Cr Allowance for expected credit losses<\/td><\/tr>\n<tr><td class=\"h\">问题 / 优点<\/td><td>✗ 违反 <b>matching principle<\/b>（损失和销售不在同一期）；✗ 何时核销由管理层决定，容易操纵<\/td><td>✓ 符合 matching，大多数公司用<\/td><\/tr>\n<\/table><\/div>\n<p><span class=\"k\">Allowance for expected credit losses<\/span>（预期信用损失备抵，也叫 allowance for doubtful accounts）是应收账款的 <b>contra account<\/b>，贷方余额。<\/p>\n<h3>备抵法的三笔分录<\/h3>\n<div class=\"tw\"><table>\n<tr><th>事件<\/th><th>分录<\/th><th>对净应收的影响<\/th><\/tr>\n<tr><td class=\"h\">期末估计坏账<\/td><td>Dr Credit losses / Cr Allowance<\/td><td>减少；同时有费用<\/td><\/tr>\n<tr><td class=\"h\">确认某客户收不回，核销<\/td><td>Dr Allowance / Cr Trade receivables<\/td><td><b>不变<\/b>，也没有费用<\/td><\/tr>\n<tr><td class=\"h\">核销后客户又能付了，恢复<\/td><td>Dr Trade receivables / Cr Allowance<br>（再记收款：Dr Cash / Cr Trade receivables）<\/td><td>恢复<\/td><\/tr>\n<\/table><\/div>\n<p class=\"muted\">年中 Allowance 可能变成借方余额，但年底调整后<b>不能<\/b>是借方余额。<\/p>\n\n<h2>3. 两种估计方法<\/h2>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>Percentage of credit sales（销售百分比法）<\/th><th>Aging of trade receivables（账龄分析法）<\/th><\/tr>\n<tr><td class=\"h\">着眼点<\/td><td><b>Income statement<\/b>：直接算出今年的费用<\/td><td><b>Balance sheet<\/b>：算出 Allowance 的<b>期末应有余额<\/b><\/td><\/tr>\n<tr><td class=\"h\">怎么算<\/td><td>Credit losses = 赊销额 × 估计坏账率（没有赊销额就用净销售）<\/td><td>账越老，坏账率越高；算出应有余额后，减去调整前余额 = 本期费用<\/td><\/tr>\n<\/table><\/div>\n<h3>例题<span class=\"hot\">易错点<\/span><\/h3>\n<p><b>销售百分比法：<\/b>今年赊销 $200,000，估计 1% 收不回 → Credit losses = <b>$2,000<\/b>（不管 Allowance 原来有多少）。<\/p>\n<p><b>账龄法：<\/b>账龄分析算出 Allowance 年末应该是 <b>$3,500<\/b>。<\/p>\n<ul>\n<li>调整前 Allowance 是贷方 $1,000 → 本期费用 = 3,500 − 1,000 = <b>$2,500<\/b><\/li>\n<li>调整前 Allowance 是借方 $500 → 本期费用 = 3,500 + 500 = <b>$4,000<\/b><\/li>\n<\/ul>\n<div class=\"formula\">Net trade receivables = Trade receivables − Allowance for expected credit losses<\/div>\n<p class=\"muted\">估计需要大量判断。管理层通常倾向于<b>少提<\/b>备抵，结果是高估净应收。核销太多说明赊账给了信用差的客户，或者催收不力。<\/p>\n\n<h2>4. 应收票据（Notes receivable）<\/h2>\n<p>客户签一张 <b>promissory note<\/b>（本票）：书面承诺在某天付一定金额，通常带利息。比普通应收账款的法律效力更强。<\/p>\n<div class=\"formula\">Interest = Principal × Annual rate × (Days ÷ 365)<\/div>\n<p>例：卖货收到一张 $10,000、年利率 6%、90 天的票据。利息 = 10,000 × 6% × 90/365 = <b>$147.95<\/b>。到期收款：<\/p>\n<div class=\"je\"><div><span>Dr<\/span>Cash<em>10,147.95<\/em><\/div><div class=\"cr\"><span>Cr<\/span>Notes receivable<em>10,000.00<\/em><\/div><div class=\"cr\"><span>Cr<\/span>Interest revenue / receivable<em>147.95<\/em><\/div><\/div>\n\n<h2>5. 比率分析<span class=\"hot\">高频考点<\/span><\/h2>\n<div class=\"formula\">Receivables turnover = Net credit sales ÷ Average net trade receivables<\/div>\n<div class=\"formula\">Average collection period = 365 ÷ Receivables turnover<\/div>\n<p>例：赊销 $600,000，年初净应收 $45,000、年末 $55,000 → 平均 $50,000 → 周转率 = <b>12 次<\/b> → 平均收款期 = 365 ÷ 12 ≈ <b>30 天<\/b>。<\/p>\n<p>周转率<b>越高越好<\/b>，收款天数<b>越低越好<\/b>。要和公司往年、同行业竞争对手比较。<\/p>\n<div class=\"sum\">The allowance method matches credit losses to the period of the sale; the direct write-off method does not. Percentage of credit sales gives the expense directly; aging gives the ending allowance balance. Writing off an account does not change net receivables.<\/div>\n", "terms": [{"t": "Aging of receivables method", "z": "账龄分析法（看资产负债表）", "e": "Estimate the ending allowance; expense = required balance − existing balance."}, {"t": "Allowance for expected credit losses", "z": "预期信用损失备抵", "e": "Contra account to trade receivables; must not end the year with a debit balance."}, {"t": "Allowance method", "z": "备抵法", "e": "Estimate credit losses each period to match them with sales."}, {"t": "Average collection period", "z": "平均收款期（越低越好）", "e": "365 ÷ receivables turnover."}, {"t": "Credit losses", "z": "信用损失（坏账费用）", "e": "Expense for receivables that will not be collected."}, {"t": "Credit sale", "z": "赊销", "e": "Sale where the company lets the customer pay later (not a credit-card sale)."}, {"t": "Direct write-off method", "z": "直接核销法（违反配比）", "e": "Write off an account only when known to be uncollectible; not widely accepted."}, {"t": "Net trade receivables", "z": "净应收账款", "e": "Trade receivables − allowance for expected credit losses."}, {"t": "Notes receivable", "z": "应收票据", "e": "Receivable backed by a promissory note; stronger legal claim."}, {"t": "Percentage of credit sales method", "z": "销售百分比法（看利润表）", "e": "Credit loss expense = credit sales × estimated %."}, {"t": "Promissory note", "z": "本票", "e": "Written promise to pay a set amount on demand or on a set date, usually with interest."}, {"t": "Receivables turnover", "z": "应收账款周转率（越高越好）", "e": "Net credit sales ÷ average net trade receivables."}, {"t": "Reinstatement", "z": "恢复已核销账款", "e": "Dr Trade receivables, Cr Allowance, then record the cash collection."}, {"t": "Trade receivables", "z": "应收账款", "e": "Amounts owed by customers from credit sales; usually current assets."}, {"t": "Write-off", "z": "核销", "e": "Dr Allowance, Cr Trade receivables; net receivables do not change."}]}, {"n": 6, "en": "Inventory", "zh": "存货", "tag": "Ch 7", "notes": "<h2>1. 为什么存货难管？<\/h2>\n<p>存货（<span class=\"t\">inventory<\/span>）常常是资产负债表上<b>最大的流动资产<\/b>。存货太少 → 丢销售、客户不满意；存货太多 → 利息和仓储成本高，还容易过时、坏掉。<\/p>\n<p>大多数公司用 <span class=\"t\">perpetual inventory system<\/span>（永续盘存制），随时知道库存多少。但年底仍要做 <b>physical count<\/b>（实地盘点），核对账面记录，找出差异原因。<\/p>\n\n<h2>2. 年底截止（Cutoff）和所有权<span class=\"hot\">高频考点<\/span><\/h2>\n<p>权责发生制要求本年的交易算在本年，明年的不算。分错年份 = <span class=\"t\">cutoff error<\/span>（截止错误）。<\/p>\n<h3>盘点时要注意<\/h3>\n<ul><li>货物摆放整齐、标签清楚，盘点人员认得出产品<\/li><li>两人一组、有人监督<\/li><li>仔细检查<b>在途货物<\/b>（goods in transit），包括采购和销售<\/li><li><b>Consignment goods<\/b>（寄售商品：放在你这里但属于别人）<b>不算<\/b>你的存货<\/li><li>找出过时、损坏、变质的货<\/li><\/ul>\n<h3>在途货物算谁的？看 FOB 条款<\/h3>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>FOB shipping point（起运点交货）<\/th><th>FOB destination（目的地交货）<\/th><\/tr>\n<tr><td class=\"h\">所有权何时转移<\/td><td>货一<b>发出<\/b>就归买方<\/td><td>货<b>到达<\/b>买方才归买方<\/td><\/tr>\n<tr><td class=\"h\">你是买方，货在路上<\/td><td>✓ 算你的，<b>计入<\/b>盘点<\/td><td>✗ 不算你的，不计入<\/td><\/tr>\n<tr><td class=\"h\">你是卖方，货在路上<\/td><td>✗ 已经是客户的，不计入<\/td><td>✓ 还是你的，<b>计入<\/b>盘点<\/td><\/tr>\n<\/table><\/div>\n<p class=\"muted\">记法：在途期间，<b>shipping point = 买方的<\/b>，<b>destination = 卖方的<\/b>。<\/p>\n\n<h2>3. 永续盘存制的分录<\/h2>\n<p>Perpetual（永续）：每笔交易后马上更新存货和销售成本。Periodic（定期）：通常年底才更新。本课以永续为主。<\/p>\n<div class=\"tw\"><table>\n<tr><th>买货<\/th><th>卖货（两笔）<\/th><\/tr>\n<tr><td>Dr Inventory / Cr Cash 或 Accounts payable（按成本）<\/td><td>Dr Trade receivables / Cr Sales（按售价）<br>Dr Cost of goods sold / Cr Inventory（按成本）<\/td><\/tr>\n<\/table><\/div>\n\n<h2>4. 成本流转假设（Cost flow assumptions）<span class=\"hot\">高频考点<\/span><\/h2>\n<p>问题：同样的货不同时间买、价格不一样，卖出去的那件算哪个成本？这些方法只是<b>成本<\/b>怎么分配，不一定和货物<b>实际<\/b>怎么流动一样。<\/p>\n<div class=\"tw\"><table>\n<tr><th>方法<\/th><th>做法<\/th><th>适用 / 备注<\/th><\/tr>\n<tr><td class=\"h\">Specific identification（个别计价）<\/td><td>每件货跟着自己的实际成本<\/td><td>贵重、独特的货（车、珠宝）；信息成本高<\/td><\/tr>\n<tr><td class=\"h\">FIFO（先进先出）<\/td><td>最早买的先卖出<\/td><td>物价上涨时：COGS 最低，<b>利润最高，期末存货最高<\/b><\/td><\/tr>\n<tr><td class=\"h\">Weighted average（加权平均）<\/td><td>平均单价 = 可供销售成本 ÷ 可供销售数量；永续制下每次进货后重算 = <b>moving weighted average<\/b><\/td><td>永续和定期算出来<b>不一样<\/b><\/td><\/tr>\n<tr><td class=\"h\">LIFO（后进先出）<\/td><td>最近买的先卖出<\/td><td>✗ <b>加拿大 GAAP 不允许<\/b>（美国允许）；物价上涨时利润最低、税最少<\/td><\/tr>\n<\/table><\/div>\n<h3>同一组数字比较（物价上涨）<\/h3>\n<p>期初 100 件 × $10；然后买进 100 件 × $12；之后卖出 150 件。可供销售 = 200 件，成本 $2,200。<\/p>\n<div class=\"tw\"><table>\n<tr><th>方法<\/th><th>COGS<\/th><th>期末存货（50 件）<\/th><\/tr>\n<tr><td class=\"h\">FIFO<\/td><td>100×10 + 50×12 = <b>1,600<\/b><\/td><td>50×12 = <b>600<\/b><\/td><\/tr>\n<tr><td class=\"h\">Moving weighted average<\/td><td>单价 2,200÷200 = 11 → 150×11 = <b>1,650<\/b><\/td><td>50×11 = <b>550<\/b><\/td><\/tr>\n<tr><td class=\"h\">LIFO（仅供对比）<\/td><td>100×12 + 50×10 = <b>1,700<\/b><\/td><td>50×10 = <b>500<\/b><\/td><\/tr>\n<\/table><\/div>\n<p class=\"muted\">COGS + 期末存货永远 = 2,200。选哪种方法是管理层的专业判断，目标是最如实反映（representationally faithful）；选定后要<b>保持一致<\/b>。不同类别的存货可以用不同方法。<\/p>\n\n<h2>5. 成本与可变现净值孰低（LCNRV）<\/h2>\n<p>存货一般按成本列示。如果卖不回成本，根据<b>谨慎原则<\/b>要减值到 <span class=\"t\">net realizable value (NRV)<\/span>（可变现净值）= 预计售价 − 销售费用。<\/p>\n<p>例：存货成本 $5,000，预计售价 $4,600，销售费用 $200 → NRV = $4,400 → 减值 <b>$600<\/b>：<\/p>\n<div class=\"je\"><div><span>Dr<\/span>Cost of goods sold (or Inventory write-down)<em>600<\/em><\/div><div class=\"cr\"><span>Cr<\/span>Inventory<em>600<\/em><\/div><\/div>\n<p class=\"muted\">存货不能往上调到超过原始成本；但以前的减值如果售价回升，可以转回（中级会计再讲）。<\/p>\n\n<h2>6. 存货错误（Inventory errors）<span class=\"hot\">易错点<\/span><\/h2>\n<div class=\"formula\">COGS = Opening inventory + Purchases − Ending inventory<\/div>\n<p>期末存货高估 → COGS 低估 → 净利润高估。而今年的期末存货就是明年的期初存货，所以错误会影响<b>两年<\/b>：<\/p>\n<div class=\"tw\"><table>\n<tr><th>今年期末存货<b>高估<\/b> $1,000<\/th><th>今年<\/th><th>明年<\/th><th>明年年底<\/th><\/tr>\n<tr><td class=\"h\">Ending / Opening inventory<\/td><td>期末 +1,000<\/td><td>期初 +1,000<\/td><td rowspan=\"3\">Retained earnings <b>正确<\/b>（自动更正，<b>self-correcting<\/b>），但两年利润分配错了<\/td><\/tr>\n<tr><td class=\"h\">COGS<\/td><td>−1,000（低估）<\/td><td>+1,000（高估）<\/td><\/tr>\n<tr><td class=\"h\">Net income<\/td><td><b>+1,000<\/b>（高估）<\/td><td><b>−1,000<\/b>（低估）<\/td><\/tr>\n<\/table><\/div>\n\n<h2>7. 比率分析<\/h2>\n<div class=\"formula\">Inventory turnover = Cost of goods sold ÷ Average inventory<\/div>\n<div class=\"formula\">Days to sell inventory = 365 ÷ Inventory turnover<\/div>\n<p>例：COGS $480,000，平均存货 $60,000 → 周转率 <b>8 次<\/b> → 约 <b>46 天<\/b>卖完。<\/p>\n<p>周转率高 = 卖得快。周转率低或下降、天数变长 → 可能存货太多，或有过时、损坏的货。<\/p>\n<div class=\"sum\">Under FOB shipping point the buyer owns goods in transit; under FOB destination the seller does. In rising prices FIFO gives the lowest COGS and highest income; LIFO is not allowed in Canada. Inventory is written down to NRV if NRV is below cost. An inventory error reverses itself over two years.<\/div>\n", "terms": [{"t": "Consignment goods", "z": "寄售商品（不算你的）", "e": "Goods in your possession owned by someone else; exclude from the count."}, {"t": "Cost of goods sold (COGS)", "z": "销售成本", "e": "Cost of the inventory sold in the period."}, {"t": "Cutoff error", "z": "截止错误", "e": "Recording a transaction in the wrong year."}, {"t": "Days to sell inventory", "z": "存货周转天数", "e": "365 ÷ inventory turnover."}, {"t": "FIFO", "z": "先进先出", "e": "First costs in are first to COGS; in rising prices, highest income and inventory."}, {"t": "FOB destination", "z": "目的地交货：到货时归买方", "e": "Ownership passes to the buyer when goods arrive."}, {"t": "FOB shipping point", "z": "起运点交货：发货时归买方", "e": "Ownership passes to the buyer when goods are shipped."}, {"t": "Goods in transit", "z": "在途货物", "e": "Goods shipped but not yet received; ownership depends on FOB terms."}, {"t": "Inventory", "z": "存货", "e": "Goods held for sale; often the largest current asset."}, {"t": "Inventory turnover", "z": "存货周转率", "e": "COGS ÷ average inventory."}, {"t": "LCNRV", "z": "成本与可变现净值孰低", "e": "Lower of cost and net realizable value; write inventory down if NRV < cost."}, {"t": "LIFO", "z": "后进先出（加拿大不允许）", "e": "Latest costs go to COGS first; allowed in the US, not under Canadian GAAP."}, {"t": "Moving weighted average", "z": "移动加权平均", "e": "Recalculate average unit cost after each purchase (perpetual)."}, {"t": "Net realizable value (NRV)", "z": "可变现净值", "e": "Expected selling price minus costs to sell."}, {"t": "Periodic inventory system", "z": "定期盘存制", "e": "Inventory and COGS updated periodically, usually at year end."}, {"t": "Perpetual inventory system", "z": "永续盘存制", "e": "Inventory and COGS updated after every transaction."}, {"t": "Physical count", "z": "实地盘点", "e": "Counting inventory to check the perpetual records."}, {"t": "Self-correcting error", "z": "自动更正的错误", "e": "An inventory error reverses over two years; retained earnings correct after year two."}, {"t": "Specific identification", "z": "个别计价法", "e": "Track the actual cost of each specific item; for expensive or unique goods."}]}, {"n": 7, "en": "Long-Term & Intangible Assets", "zh": "长期资产与无形资产", "tag": "Ch 8", "notes": "<h2>1. 长期资产有哪些？<\/h2>\n<p><span class=\"t\">Long-term assets<\/span>（长期资产，也叫 long-lived / capital assets）：为了在日常经营中<b>长期使用<\/b>而买入、建造或开发的资产，不是为了卖。<\/p>\n<div class=\"tw\"><table>\n<tr><th>类别<\/th><th>例子 / 特点<\/th><\/tr>\n<tr><td class=\"h\">Tangible（有形）：Property, plant &amp; equipment (PP&amp;E)<\/td><td>土地、厂房、设备<\/td><\/tr>\n<tr><td class=\"h\">Intangible（无形）<\/td><td>专利、版权、商标、许可证、特许经营权、客户名单<\/td><\/tr>\n<tr><td class=\"h\">Goodwill（商誉）<\/td><td>收购别的公司时产生<\/td><\/tr>\n<tr><td class=\"h\">Right-of-use assets（使用权资产）<\/td><td>租用 1 年以上的资产<\/td><\/tr>\n<tr><td class=\"h\">Natural resources（自然资源）<\/td><td>森林、石油天然气、矿产<\/td><\/tr>\n<tr><td class=\"h\">Biological assets（生物资产）<\/td><td>被管理生长的动植物：葡萄藤、鱼、牲畜<\/td><\/tr>\n<\/table><\/div>\n\n<h2>2. 成本里包括什么？<span class=\"hot\">高频考点<\/span><\/h2>\n<p>根据 cost principle，<b>买入并让资产达到可使用状态<\/b>的所有支出都要 <span class=\"t\">capitalize<\/span>（资本化，计入资产成本）：买价、法律费、运费、安装费。买二手资产后花大钱翻新，这部分也资本化。<\/p>\n<ul>\n<li>用非现金资产交换：成本 = 换出资产或换入资产的<b>公允价值<\/b>，哪个更清楚用哪个<\/li>\n<li>自建资产：人工、材料、分摊的制造费用可以资本化；<b>建造期间<\/b>借款的利息也可以资本化（这是例外）。建好投入使用后，利息全部记费用<\/li>\n<li><b>Basket purchase<\/b>（一揽子购买）：一次付一个总价买好几项资产，按各项的<b>相对公允价值<\/b>分摊成本。因为土地不折旧、房子要折旧，所以一定要分开<\/li>\n<\/ul>\n<p>例：花 $900,000 买土地 + 房子，评估价土地 $400,000、房子 $600,000（合计 $1,000,000）→ 土地 = 900,000 × 40% = <b>$360,000<\/b>，房子 = 900,000 × 60% = <b>$540,000<\/b>。<\/p>\n<h3>Capitalize 还是 Expense？<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Expense（记费用）<\/th><th>Capitalize（资本化）<\/th><\/tr>\n<tr><td>日常维修保养（repairs &amp; maintenance）：金额小、例行、不延长寿命<\/td><td><b>Betterment<\/b>（改良）：大修、升级、重建主要部件，能延长寿命、提高产能或降低运行成本<\/td><\/tr>\n<\/table><\/div>\n\n<h2>3. 折旧（Depreciation）<span class=\"hot\">高频考点<\/span><\/h2>\n<p>根据 matching principle，资产帮助产生收入，就要把它的成本<b>有系统地分摊<\/b>到使用的各期。折旧是<b>成本分摊<\/b>，<b>不是<\/b>估值。<\/p>\n<div class=\"je\"><div><span>Dr<\/span>Depreciation expense<em>XX<\/em><\/div><div class=\"cr\"><span>Cr<\/span>Accumulated depreciation<em>XX<\/em><\/div><p>(不影响现金)<\/p><\/div>\n<p><b>Residual value<\/b>（残值）= 用完后估计能收回的钱；<b>Useful life<\/b>（使用寿命）= 估计能用多久。两者都靠管理层判断。<b>Carrying value / Net book value<\/b>（账面价值）= Cost − Accumulated depreciation。<\/p>\n<h3>三种方法：同一个例子<\/h3>\n<p>机器成本 $100,000，残值 $10,000，用 4 年，估计一共生产 45,000 件（第 1 年生产 15,000 件）。<\/p>\n<div class=\"tw\"><table>\n<tr><th>方法<\/th><th>公式<\/th><th>结果<\/th><\/tr>\n<tr><td class=\"h\">Straight-line（直线法）<\/td><td>(Cost − Residual) ÷ Life<\/td><td>90,000 ÷ 4 = <b>$22,500 / 年<\/b><\/td><\/tr>\n<tr><td class=\"h\">Units-of-production（工作量法）<\/td><td>(Cost − Residual) ÷ Total units × Units this year<\/td><td>$2 / 件 → 第 1 年 15,000 × 2 = <b>$30,000<\/b><\/td><\/tr>\n<tr><td class=\"h\">Double-declining-balance（双倍余额递减）<\/td><td>Rate = 2 × (1 ÷ Life)；× 期初<b>账面价值<\/b>（<b>不减残值<\/b>）<\/td><td>Rate = 50%（见下表）<\/td><\/tr>\n<\/table><\/div>\n<div class=\"tw\"><table>\n<tr><th>DDB<\/th><th>期初账面价值<\/th><th>折旧<\/th><th>期末账面价值<\/th><\/tr>\n<tr><td class=\"h\">Year 1<\/td><td>100,000<\/td><td>50,000<\/td><td>50,000<\/td><\/tr>\n<tr><td class=\"h\">Year 2<\/td><td>50,000<\/td><td>25,000<\/td><td>25,000<\/td><\/tr>\n<tr><td class=\"h\">Year 3<\/td><td>25,000<\/td><td>12,500<\/td><td>12,500<\/td><\/tr>\n<tr><td class=\"h\">Year 4<\/td><td>12,500<\/td><td><b>2,500<\/b>（只能折到残值）<\/td><td>10,000<\/td><\/tr>\n<\/table><\/div>\n<p class=\"muted\">Declining-balance 的单倍率 = 1 ÷ Life；double 就是乘 2。账面价值<b>永远不能低于残值<\/b>，最后一年要小心不要多折。直线法按<b>时间<\/b>，工作量法按<b>使用量<\/b>。<\/p>\n<h3>年中买入 &amp; 估计变更<\/h3>\n<ul>\n<li><b>年中买入<\/b>：年折旧 × 使用月数 ÷ 12。课上惯例：月中以前买的算整月，月中以后买的当月不算。考试一定要写出计算过程<\/li>\n<li><span class=\"t\">Change in estimate<\/span>（估计变更）：寿命或残值改了，<b>不改以前年度<\/b>，只改以后：新年折旧 = (当时账面价值 − 新残值) ÷ 剩余寿命<\/li>\n<\/ul>\n<p>例：上面的机器用直线法折了 2 年，账面价值 = 100,000 − 45,000 = 55,000。现在估计还能再用 3 年、残值改成 $4,000 → 新年折旧 = (55,000 − 4,000) ÷ 3 = <b>$17,000<\/b>。<\/p>\n<p class=\"muted\"><b>Capital cost allowance (CCA)<\/b>：税法上加拿大税务局（CRA）允许扣的折旧，和会计折旧通常不同。<\/p>\n\n<h2>4. 减值（Impairment）<\/h2>\n<p>资产实际价值低于账面价值 = <span class=\"t\">impairment<\/span>（减值）。原因：技术变化、法规变化、物理损坏、停用某些流程。<\/p>\n<ul>\n<li><b>Fair value<\/b>（公允价值）：两个知情、自愿的买卖双方之间的成交价<\/li>\n<li><b>Value in use<\/b>（使用价值）：继续使用能带来的未来现金流的现值<\/li>\n<li><b>Recoverable amount<\/b>（可收回金额）= <b>max<\/b>（fair value − costs to sell，value in use）<\/li>\n<\/ul>\n<div class=\"formula\">Carrying value &gt; Recoverable amount → Impaired<\/div>\n<p>例：账面价值 $80,000，公允价值减出售费用 $60,000，使用价值 $65,000 → 可收回金额 = $65,000 → 减值损失 <b>$15,000<\/b>：<\/p>\n<div class=\"je\"><div><span>Dr<\/span>Loss due to impairment<em>15,000<\/em><\/div><div class=\"cr\"><span>Cr<\/span>Accumulated impairment losses<em>15,000<\/em><\/div><\/div>\n\n<h2>5. 处置资产（Disposal）<span class=\"hot\">易错点<\/span><\/h2>\n<p>第一步：<b>先把折旧补提到处置日<\/b>。然后比较卖价和账面价值：卖价 &gt; 账面价值 → gain；卖价 &lt; 账面价值 → loss（只会有一个）。<\/p>\n<p>例：设备成本 $40,000，处置日累计折旧 $30,000（账面价值 $10,000），卖了 $7,000 → 损失 $3,000：<\/p>\n<div class=\"je\"><div><span>Dr<\/span>Cash<em>7,000<\/em><\/div><div><span>Dr<\/span>Accumulated depreciation<em>30,000<\/em><\/div><div><span>Dr<\/span>Loss on disposal<em>3,000<\/em><\/div><div class=\"cr\"><span>Cr<\/span>Equipment<em>40,000<\/em><\/div><\/div>\n\n<h2>6. 无形资产、商誉、自然资源<\/h2>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>摊销？<\/th><th>减值测试<\/th><\/tr>\n<tr><td class=\"h\">Intangible，<b>有限<\/b>寿命（finite）<\/td><td>✓ 直线法 <b>amortize<\/b><\/td><td>有迹象时测<\/td><\/tr>\n<tr><td class=\"h\">Intangible，<b>无限<\/b>寿命（indefinite）<\/td><td>✗ 不摊销<\/td><td>✓ <b>每年<\/b>测<\/td><\/tr>\n<tr><td class=\"h\">Goodwill（商誉）<\/td><td>✗ 不摊销<\/td><td>✓ <b>每年<\/b>测<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li>无形资产一般只有<b>买来的<\/b>才按成本入账<\/li>\n<li><span class=\"t\">Goodwill<\/span> = 收购价 − 被收购公司可辨认净资产的公允价值。来自管理能力、声誉、客户忠诚度。<b>自创商誉不入账<\/b>，因为不能可靠计量<\/li>\n<li><b>Right-of-use asset<\/b>：租期超过 1 年的资产要入账，同时记一笔负债，按租期折旧<\/li>\n<li><b>Biological assets<\/b>：年底按公允价值减出售费用计量，变动记入利润表<\/li>\n<\/ul>\n<h3>Depletion（折耗）：自然资源被开采、砍伐<\/h3>\n<div class=\"formula\">Depletion per unit = (Total cost − Salvage value) ÷ Total estimated units<\/div>\n<p>例：矿山成本 $5,000,000，残值 $200,000，估计储量 1,200,000 吨 → 每吨 $4。今年开采 150,000 吨 → 折耗 <b>$600,000<\/b>：Dr Depletion expense / Cr Accumulated depletion。<\/p>\n\n<h2>7. 比率分析<\/h2>\n<div class=\"formula\">Asset turnover = Net sales ÷ Average net property &amp; equipment<\/div>\n<div class=\"formula\">Average age of assets = Total accumulated depreciation ÷ (Total property &amp; equipment − Land)<\/div>\n<p>Asset turnover 高或上升 → 资产用得有效率；低或下降 → 可能在长期资产上投太多。第二个比率显示资产已经\"用旧\"了多少（土地不折旧，所以减掉）。<\/p>\n<div class=\"sum\">Capitalize all costs to get an asset ready for use; expense routine repairs but capitalize betterments. Depreciation allocates cost and never takes carrying value below residual value. A change in estimate affects only future years. Update depreciation before recording a disposal. Goodwill and indefinite-life intangibles are not amortized but are tested for impairment every year.<\/div>\n", "terms": [{"t": "Amortization", "z": "摊销", "e": "Allocating the cost of a finite-life intangible, usually straight-line."}, {"t": "Asset turnover", "z": "资产周转率", "e": "Net sales ÷ average net property and equipment."}, {"t": "Basket purchase", "z": "一揽子购买", "e": "Buying several assets for one price; allocate by relative fair values."}, {"t": "Betterment", "z": "改良（资本化）", "e": "Major improvement that extends life or capacity; capitalized."}, {"t": "Biological assets", "z": "生物资产", "e": "Living plants or animals; measured at fair value less costs to sell."}, {"t": "Capital cost allowance (CCA)", "z": "资本成本扣除（税务折旧）", "e": "Tax depreciation allowed by CRA; often differs from accounting depreciation."}, {"t": "Capitalize", "z": "资本化：计入资产成本", "e": "Add a cost to the asset instead of expensing it."}, {"t": "Carrying value", "z": "账面价值", "e": "Cost − accumulated depreciation (net book value)."}, {"t": "Change in estimate", "z": "估计变更（只改以后）", "e": "New depreciation = (carrying value − new residual) ÷ remaining life."}, {"t": "Depletion", "z": "折耗", "e": "Using up natural resources; usually units-of-production."}, {"t": "Depreciation", "z": "折旧：成本分摊，不是估值", "e": "Systematic allocation of an asset's cost over its useful life."}, {"t": "Double-declining-balance", "z": "双倍余额递减法", "e": "2 × (1 ÷ life) × opening carrying value; ignore residual value until the end."}, {"t": "Gain or loss on disposal", "z": "处置利得或损失", "e": "Proceeds − carrying value, after updating depreciation to the disposal date."}, {"t": "Goodwill", "z": "商誉：不摊销，每年测减值", "e": "Price paid for a business above the fair value of its identifiable net assets."}, {"t": "Impairment", "z": "减值", "e": "Carrying value is greater than the recoverable amount."}, {"t": "Intangible assets", "z": "无形资产", "e": "Long-lived assets with no physical substance, e.g., patents, trademarks, copyrights."}, {"t": "Long-term assets", "z": "长期资产", "e": "PP&E and intangibles acquired for long-term use, not for resale."}, {"t": "Property, plant and equipment (PP&E)", "z": "不动产、厂房和设备", "e": "Tangible long-term assets such as land, buildings and equipment."}, {"t": "Recoverable amount", "z": "可收回金额", "e": "Higher of fair value less costs to sell and value in use."}, {"t": "Repairs and maintenance", "z": "日常维修（记费用）", "e": "Routine, small costs that do not extend useful life; expensed."}, {"t": "Residual value", "z": "残值", "e": "Estimated amount recovered at the end of the asset's useful life."}, {"t": "Right-of-use asset", "z": "使用权资产", "e": "Asset leased for more than one year, with a related lease liability."}, {"t": "Units-of-production method", "z": "工作量法", "e": "(Cost − residual) ÷ total estimated units × units used."}, {"t": "Useful life", "z": "使用寿命", "e": "Estimated period the asset will be useful to the entity."}, {"t": "Value in use", "z": "使用价值", "e": "Present value of future cash flows from using the asset."}]}, {"n": 8, "en": "Liabilities, Provisions & Contingencies", "zh": "负债、预计负债与或有事项", "tag": "Ch 9–10", "notes": "<h2>1. 负债的三种类型<span class=\"hot\">高频考点<\/span><\/h2>\n<p><span class=\"t\">Current liabilities<\/span>（流动负债）= 在一个营业周期或资产负债表日后 <b>1 年内<\/b>（取较长者）要还的短期义务。本课一般按 1 年算。<\/p>\n<div class=\"tw\"><table>\n<tr><th>类型<\/th><th>意思<\/th><th>例子<\/th><\/tr>\n<tr><td class=\"h\">Actual liabilities（确定负债）<\/td><td>金额确定、债权人明确<\/td><td>应付账款、应付税、应付工资<\/td><\/tr>\n<tr><td class=\"h\">Provisions（预计负债/准备）<\/td><td><b>金额或时间不确定<\/b><\/td><td>保修、法律纠纷、关店重组<\/td><\/tr>\n<tr><td class=\"h\">Contingent liabilities（或有负债）<\/td><td><b>可能<\/b>的负债：来自过去的事件，要等将来的事件发生或不发生才能确定<\/td><td>官司、税务重新评估、环境问题、贷款担保<\/td><\/tr>\n<\/table><\/div>\n\n<h2>2. 常见流动负债<\/h2>\n<ul>\n<li><b>Accounts payable<\/b>：欠供应商的货款<\/li>\n<li><b>Accrued liabilities<\/b>：费用已发生但还没付（常是服务费）<\/li>\n<li><b>Income tax payable<\/b>：欠 CRA 的所得税；还有 <b>GST / PST<\/b> 等其他税<\/li>\n<li><b>Payroll liabilities<\/b>：欠员工的工资<\/li>\n<li><b>Interest payable<\/b>：欠的利息<\/li>\n<li><b>Notes payable<\/b>：签了本票的借款，约定日期和利率<\/li>\n<li><b>Unearned (deferred) revenue<\/b>：预收款，预计 12 个月内会赚到的部分<\/li>\n<li><b>Current portion of long-term debt<\/b>：长期借款里 1 年内要还的部分<\/li>\n<\/ul>\n\n<h2>3. Provisions（预计负债）<\/h2>\n<p>同时满足三个条件才确认 provision：<\/p>\n<ol><li>因为<b>过去的事件<\/b>，现在有义务<\/li><li><b>很可能（probable）<\/b>要付钱或其他资产<\/li><li>金额能<b>可靠估计<\/b><\/li><\/ol>\n<p><b>保修<\/b>是典型的 provision：卖出产品时就估计并建立负债（matching），以后客户来修再冲减。修理时用了零件 → 贷 Inventory；用了人工 → 贷 Salaries payable；付现金 → 贷 Cash。新产品没有历史数据，估计会更难，常要靠工程部门判断。<\/p>\n\n<h2>4. 或有负债怎么处理？<span class=\"hot\">高频考点<\/span><\/h2>\n<div class=\"tw\"><table>\n<tr><th>可能性 / 能否计量<\/th><th>处理<\/th><\/tr>\n<tr><td class=\"h\"><b>Probable<\/b>（很可能）且金额能合理计量<\/td><td><b>Accrue<\/b>：在资产负债表上记负债<\/td><\/tr>\n<tr><td class=\"h\">不确定会不会发生，或金额无法计量<\/td><td><b>Disclose<\/b>：在附注里披露<\/td><\/tr>\n<tr><td class=\"h\"><b>Remote<\/b>（可能性很小）<\/td><td><b>Ignore<\/b>：不记也不披露<\/td><\/tr>\n<\/table><\/div>\n<p>例：公司被客户起诉。律师说很可能输，大约赔 $200,000 → 记负债。律师说不好说 → 附注披露。律师说几乎不可能输 → 不处理。<\/p>\n<p><span class=\"t\">Commitments<\/span>（承诺）：已经签了合同、将来要做的交易（比如明年买设备）。还没发生交换，所以<b>不记账<\/b>，但对预测未来现金流有用，一般在附注里说明。<\/p>\n\n<h2>5. 礼品卡、积分、租赁、养老金<\/h2>\n<ul>\n<li><b>Gift cards<\/b>（礼品卡）：卖卡收到的钱先记 <b>unearned revenue<\/b>（负债）；客户用卡时再确认收入。按历史经验估计永远不会被用掉的部分（breakage），也确认为收入<\/li>\n<li><b>Loyalty programs<\/b>（积分计划）：客户获得积分 = 公司将来有履约义务 → 销售额里分一部分记 unearned revenue；积分兑换时再确认收入<\/li>\n<li><b>Leases<\/b>（租赁）：承租人（lessee）要像向银行借钱买资产一样记账：记 <b>right-of-use asset<\/b> 和 <b>lease liability<\/b>，金额 = 租金的现值；资产折旧；每期租金拆成还本 + 利息<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<tr><th>Defined benefit plan（设定受益）<\/th><th>Defined contribution plan（设定提存）<\/th><\/tr>\n<tr><td>保证退休后每年领多少；公司负责确保有足够的钱，<b>风险在公司<\/b><\/td><td>雇主和员工每年交固定金额，退休能领多少看投资结果；雇主交完就没有进一步责任，<b>风险在员工<\/b><\/td><\/tr>\n<\/table><\/div>\n<p class=\"muted\">Hybrid plan 结合两者。租赁、养老金的细节在中级会计讲。<\/p>\n\n<h2>6. 长期融资：贷款和债券<\/h2>\n<p>公司扩张要融资：发<b>长期债务<\/b>（Ch 10）或发<b>股票<\/b>（Ch 11）。小公司买长期资产应该用长期贷款或按揭（mortgage），用短期贷款风险大。长期贷款通常每月还本付息（blended payments），分 20–25 年还。<\/p>\n<p>政府债券更安全，所以利率比公司债低。<\/p>\n<h3>债券（老师说明：不考细节，帮助理解）<\/h3>\n<ul>\n<li><b>Bond indenture<\/b>（债券契约）：借贷双方的正式协议<\/li>\n<li><b>Bond covenants<\/b>（限制条款）：限制股利、奖金、资本支出，要求最低流动比率等<\/li>\n<li><b>Face / par value<\/b>（面值）：到期要还的本金<\/li>\n<li><b>Stated / coupon rate<\/b>（票面利率）：每期利息 = 面值 × 票面利率<\/li>\n<li><b>Market / yield rate<\/b>（市场利率）：投资人现在要求的利率<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<tr><th>关系<\/th><th>发行价<\/th><th>利息费用 vs 付现利息<\/th><\/tr>\n<tr><td class=\"h\">Market = Stated<\/td><td>按<b>面值<\/b>（at par）<\/td><td>相等<\/td><\/tr>\n<tr><td class=\"h\">Market &gt; Stated<\/td><td><b>折价<\/b>（at a discount），收的钱少于面值<\/td><td>利息费用 &gt; 付现利息；账面价值逐年上升<\/td><\/tr>\n<tr><td class=\"h\">Market &lt; Stated<\/td><td><b>溢价<\/b>（at a premium），收的钱多于面值<\/td><td>利息费用 &lt; 付现利息；账面价值逐年下降<\/td><\/tr>\n<\/table><\/div>\n<p class=\"muted\">发行价 = 利息的现值 + 面值的现值，都用<b>发行时的市场利率<\/b>折现。半年付息时利率要除以 2。利息费用 = 期初账面价值 × 市场利率（effective-interest method）。<\/p>\n<div class=\"sum\">Provisions are liabilities with uncertain amount or timing; record them when an obligation is probable and can be estimated. Contingencies: accrue if probable and measurable, disclose if uncertain, ignore if remote. Commitments are not recorded. Gift cards and loyalty points start as unearned revenue.<\/div>\n", "terms": [{"t": "Accrue (contingency)", "z": "确认入账：很可能且能计量", "e": "Record a liability when it is probable and measurable."}, {"t": "Accrued liabilities", "z": "应计负债", "e": "Expenses incurred but not yet paid."}, {"t": "Actual liabilities", "z": "确定负债", "e": "Specific amounts owed to identifiable creditors."}, {"t": "Bond covenants", "z": "债券限制条款", "e": "Restrictions on the borrower, e.g., on dividends or a minimum current ratio."}, {"t": "Bond discount", "z": "折价发行：市场利率 > 票面利率", "e": "Bond sells below face value; interest expense > cash interest."}, {"t": "Bond indenture", "z": "债券契约", "e": "Formal agreement between the borrower and the lender."}, {"t": "Bond premium", "z": "溢价发行：市场利率 < 票面利率", "e": "Bond sells above face value; interest expense < cash interest."}, {"t": "Commitment", "z": "承诺：不记账", "e": "A contract for a future transaction; not recorded until an exchange happens."}, {"t": "Contingent liability", "z": "或有负债", "e": "A possible obligation from past events, confirmed only by uncertain future events."}, {"t": "Current liabilities", "z": "流动负债", "e": "Obligations due within one year or the operating cycle, whichever is longer."}, {"t": "Current portion of long-term debt", "z": "一年内到期的长期负债", "e": "The part of long-term debt due within one year."}, {"t": "Defined benefit plan", "z": "设定受益计划（风险在公司）", "e": "Guarantees a set pension; the employer must fund it."}, {"t": "Defined contribution plan", "z": "设定提存计划（风险在员工）", "e": "Set contributions each year; pension depends on investment returns."}, {"t": "Disclose (contingency)", "z": "附注披露：不确定或无法计量", "e": "Explain in the notes when uncertain or not measurable."}, {"t": "Face (par) value", "z": "面值", "e": "Principal amount repaid at maturity."}, {"t": "Gift card liability", "z": "礼品卡负债", "e": "Cash from gift cards is unearned revenue until redeemed."}, {"t": "Lease liability", "z": "租赁负债", "e": "Present value of lease payments, recorded with a right-of-use asset."}, {"t": "Loyalty program", "z": "积分计划", "e": "Part of sales is unearned revenue until points are redeemed."}, {"t": "Market (yield) rate", "z": "市场利率", "e": "Rate investors currently require on similar bonds."}, {"t": "Notes payable", "z": "应付票据", "e": "Amounts owed under a promissory note with a set date and interest rate."}, {"t": "Provision", "z": "预计负债：金额或时间不确定", "e": "Recognize if there is a present obligation, outflow is probable and amount can be estimated."}, {"t": "Remote", "z": "可能性很小：不处理", "e": "Neither record nor disclose."}, {"t": "Stated (coupon) rate", "z": "票面利率", "e": "Rate in the indenture; interest paid = face value × stated rate."}, {"t": "Warranty liability", "z": "保修负债", "e": "A provision set up at the time of sale and reduced as claims are paid."}]}]}</script>
<script>
const CFG=JSON.parse(document.getElementById('data').textContent);const D=CFG.units;const K=CFG.key;
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let known=new Set(store.get(K+'-known',[]));
const keyOf=(n,t)=>n+'|'+t;
const pad=n=>CFG.prefix+String(n).padStart(2,'0');
const examsOf=n=>CFG.exams.filter(x=>x.units.includes(n));
const scopeUnits=(s,L)=>s==='lesson'?[L]:s==='all'?D:D.filter(l=>(CFG.exams.find(x=>x.id===s)||{units:[]}).units.includes(l.n));
let cur=CFG.start, viewName='notes';
$('#brand').innerHTML=`${CFG.code} · ${CFG.short}<small>${CFG.sub}</small>`;
$('#examtag').innerHTML=CFG.exams.map(x=>`<b>${x.label}</b> = ${x.units.length?x.units.map(pad).join(', '):'—'}${x.note?` <em>${x.note}</em>`:''}`).join('<br>');

// lecture list
$('#lessons').innerHTML=D.map(l=>`<li><button data-n="${l.n}"><span class="no">${pad(l.n)}</span><span class="nm">${l.en}<em>${l.zh}</em></span></button></li>`).join('');
$('#lessons').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(+b.dataset.n,viewName)});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(cur,b.dataset.v)});

function go(n,v){location.hash=`l${n}`+(v==='notes'?'':'-'+v)}
function route(){
  const m=/^#l(\d+)(?:-(terms|cards))?$/.exec(location.hash);
  if(m&&D.some(l=>l.n===+m[1])){cur=+m[1];viewName=m[2]||'notes'} else {const s=store.get(K+'-last',CFG.start);cur=D.some(l=>l.n===s)?s:CFG.start;viewName='notes'}
  store.set(K+'-last',cur);render();
}
window.addEventListener('hashchange',()=>{route();window.scrollTo({top:0})});

function render(){
  const L=D.find(l=>l.n===cur);
  document.querySelectorAll('#lessons button').forEach(b=>b.setAttribute('aria-current',+b.dataset.n===cur));
  const act=document.querySelector(`#lessons button[data-n="${cur}"]`);act&&act.scrollIntoView({block:'nearest',inline:'center'});
  $('#eyebrow').textContent=[`${CFG.unitWord} ${pad(cur)}`.trim(),L.tag,...examsOf(cur).map(x=>x.label)].filter(Boolean).join(' · ');
  $('#title').textContent=L.en; $('#titlezh').textContent=L.zh; $('#ct').textContent=L.terms.length;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===viewName));
  if(viewName==='notes') renderNotes(L); else if(viewName==='terms') renderTerms(L); else renderCards(L);
}

function renderNotes(L){
  const v=$('#view'); v.innerHTML=`<article class="notes">${L.notes}</article>`;
  v.querySelectorAll('.notes table').forEach(t=>{if(t.parentElement.classList.contains('tw')||t.classList.contains('je'))return;const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t)});
}

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(s,q){s=esc(s);if(!q)return s;const i=s.toLowerCase().indexOf(q.toLowerCase());return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length)}
function renderTerms(L){
  const v=$('#view');
  v.innerHTML=`<div class="tools"><input class="search" id="q" type="search" placeholder="搜索关键词（英文或中文）" autocomplete="off"><label class="chk"><input type="checkbox" id="allq"> 搜全部 ${D.length} ${CFG.unitZh}</label><span class="count" id="n"></span></div><ul class="gl" id="gl"></ul>`;
  const draw=()=>{
    const q=$('#q').value.trim(), all=$('#allq').checked;
    const src=(all?D:[L]).flatMap(l=>l.terms.map(t=>({...t,n:l.n})));
    const rows=q?src.filter(t=>(t.t+' '+t.z+' '+t.e).toLowerCase().includes(q.toLowerCase())):src;
    $('#n').textContent=`${rows.length} 个`;
    $('#gl').innerHTML=rows.length?rows.map(t=>`<li><div><span class="gt">${all?`<span class="lsn">${pad(t.n)}</span>`:''}${hl(t.t,q)}</span><span class="gz">${hl(t.z,q)}</span></div><div class="ge">${hl(t.e,q)}</div></li>`).join(''):`<li class="empty">没有找到“${esc(q)}”。试试勾选“搜全部 ${D.length} ${CFG.unitZh}”。</li>`;
  };
  $('#q').addEventListener('input',draw);$('#allq').addEventListener('change',draw);draw();
}

// flashcards
let fc={scope:'lesson',rev:false,onlyNew:false,deck:[],i:0,flip:false};
function buildDeck(L){
  const src=scopeUnits(fc.scope,L);
  let deck=src.flatMap(l=>l.terms.map(t=>({...t,n:l.n})));
  if(fc.onlyNew) deck=deck.filter(t=>!known.has(keyOf(t.n,t.t)));
  fc.deck=deck; fc.i=0; fc.flip=false;
}
function renderCards(L){
  buildDeck(L);
  const v=$('#view');
  v.innerHTML=`<div class="fc-wrap">
   <div class="tools">
    <div class="seg" id="scope">${[['lesson','本课'],...CFG.exams.filter(x=>x.units.length>1).map(x=>[x.id,x.label]),['all','全部']].map(([k,t])=>`<button data-s="${k}" aria-pressed="${fc.scope===k}">${t}</button>`).join('')}</div>
    <label class="chk"><input type="checkbox" id="rev" ${fc.rev?'checked':''}> 反向（看释义猜词）</label>
    <label class="chk"><input type="checkbox" id="onlyNew" ${fc.onlyNew?'checked':''}> 只看还不熟的</label>
   </div>
   <div id="cardbox"></div>
   <p class="keys"><kbd>空格</kbd> 翻面 · <kbd>←</kbd><kbd>→</kbd> 上一张/下一张 · <kbd>1</kbd> 还不熟 · <kbd>2</kbd> 记住了</p>
  </div>`;
  $('#scope').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;fc.scope=b.dataset.s;renderCards(L)});
  $('#rev').addEventListener('change',e=>{fc.rev=e.target.checked;fc.flip=false;drawCard()});
  $('#onlyNew').addEventListener('change',e=>{fc.onlyNew=e.target.checked;renderCards(L)});
  drawCard();
}
function drawCard(){
  const box=$('#cardbox'); if(!box)return;
  const N=fc.deck.length, kn=fc.deck.filter(t=>known.has(keyOf(t.n,t.t))).length;
  if(!N){box.innerHTML=`<div class="done"><b>这一组都记住了</b>取消“只看还不熟的”，或换一个范围继续复习。<br><br><button class="btn" id="reset">清除这组的“记住了”标记</button></div>`;
    $('#reset').onclick=()=>{const L=D.find(l=>l.n===cur);fc.onlyNew=false;
      const src=scopeUnits(fc.scope,L);
      src.forEach(l=>l.terms.forEach(t=>known.delete(keyOf(l.n,t.t))));store.set(K+'-known',[...known]);renderCards(L)};return}
  if(fc.i>=N){box.innerHTML=`<div class="done"><b>这一轮看完了</b>${N} 张里记住了 ${kn} 张。<br><br><button class="btn" id="again">再来一轮</button> <button class="btn ghost" id="sh">打乱顺序再来</button></div>`;
    $('#again').onclick=()=>{fc.i=0;fc.flip=false;drawCard()};$('#sh').onclick=()=>{shuffle();drawCard()};return}
  const t=fc.deck[fc.i], isK=known.has(keyOf(t.n,t.t));
  const termSide=`<div class="big">${esc(t.t)}</div>`;
  const defSide=`<div class="zhbig">${esc(t.z)}</div><div class="def">${esc(t.e)}</div>`;
  const corner=`<div class="corner"><span>${pad(t.n)}</span><span>${isK?'<span class="known">✓ 记住了</span>':''}</span></div>`;
  box.innerHTML=`<div class="card${fc.flip?' flip':''}" id="card" role="button" tabindex="0" aria-label="翻面">
    <div class="card-in">
      <div class="face front">${corner}${fc.rev?defSide:termSide}<div class="hint">点卡片翻面</div></div>
      <div class="face back">${corner}${fc.rev?termSide+defSide.replace('<div class="def">'+esc(t.e)+'</div>',''):termSide+defSide}</div>
    </div></div>
   <div class="fc-bar">
    <button class="btn ghost" id="prev" ${fc.i===0?'disabled':''}>← 上一张</button>
    <span style="display:flex;gap:8px"><button class="btn no" id="no">还不熟</button><button class="btn yes" id="yes">记住了</button></span>
    <button class="btn ghost" id="shuf">打乱</button>
   </div>
   <div class="prog"><i style="width:${(fc.i/N*100).toFixed(1)}%"></i></div>
   <div class="fc-meta"><span>${fc.i+1} / ${N}</span><span>记住 ${kn} / ${N}</span></div>`;
  $('#card').onclick=flip; $('#card').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();flip()}};
  $('#prev').onclick=()=>step(-1); $('#no').onclick=()=>mark(false); $('#yes').onclick=()=>mark(true);
  $('#shuf').onclick=()=>{shuffle();drawCard()};
}
function flip(){fc.flip=!fc.flip;const c=$('#card');c&&c.classList.toggle('flip',fc.flip)}
function step(d){fc.i=Math.max(0,fc.i+d);fc.flip=false;drawCard()}
function mark(ok){const t=fc.deck[fc.i];if(!t)return;const k=keyOf(t.n,t.t);ok?known.add(k):known.delete(k);store.set(K+'-known',[...known]);step(1)}
function shuffle(){for(let i=fc.deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fc.deck[i],fc.deck[j]]=[fc.deck[j],fc.deck[i]]}fc.i=0;fc.flip=false}
document.addEventListener('keydown',e=>{
  if(viewName!=='cards'||e.target.matches('input,textarea'))return;
  if(e.key===' '){e.preventDefault();flip()} else if(e.key==='ArrowRight')step(1); else if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='1')mark(false); else if(e.key==='2')mark(true);
});
route();
</script>

</body>
</html>
