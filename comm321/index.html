/tr>\n<\/table>\n<div class=\"sum\">Transactional leaders exchange rewards for performance; transformational leaders inspire change through the 4 I's. Choose the style that fits the staff and the situation.<\/div>\n\n<h2>3. Leadership Theories（领导理论，p.13–26）<\/h2>\n<p>三类理论回答三个问题：<span class=\"k\">Traits → Who?<\/span>　<span class=\"k\">Behaviour → How?<\/span>　<span class=\"k\">Situation → When?<\/span><\/p>\n\n<h3>Trait Theory（Who?）<\/h3>\n<p>最重要的领导特质：<b>Extraversion<\/b>（最能预测谁会<b>成为<\/b>领导，leadership emergence）、Conscientiousness、Emotional stability、Openness、Emotional intelligence / empathy、Intelligence。<\/p>\n<p class=\"muted\">注意：特质更能预测\"谁当上领导\"，而不是\"谁领导得好\"；效果还取决于行为、下属和情境。<\/p>\n\n<h3>Behavioural Theory（How?）<\/h3>\n<p>两类行为：<b>People-oriented<\/b>（关系导向）和 <b>Task-oriented<\/b>（任务导向）。<\/p>\n\n<h3>Blake &amp; Mouton's Managerial Grid（p.18–19）<span class=\"hot\">高频考点<\/span><\/h3>\n<p>横轴 = Concern for Production（关注任务），纵轴 = Concern for People（关注人）。<\/p>\n<table>\n<tr><th>风格<\/th><th>坐标<\/th><th>特点<\/th><\/tr>\n<tr><td class=\"h\">Impoverished<\/td><td>1,1<\/td><td>只付出保住工作的最低努力<\/td><\/tr>\n<tr><td class=\"h\">Country Club<\/td><td>1,9<\/td><td>很照顾人的需要 → 舒适友好的氛围<\/td><\/tr>\n<tr><td class=\"h\">Authority-Obedience<\/td><td>9,1<\/td><td>尽量排除情绪等人的因素，只看绩效<\/td><\/tr>\n<tr><td class=\"h\">Middle-of-the-Road<\/td><td>5,5<\/td><td>完成工作和维持士气之间取平衡<\/td><\/tr>\n<tr><td class=\"h\">Team<\/td><td>9,9<\/td><td>员工投入、利益共享 → 信任与尊重（最理想）<\/td><\/tr>\n<\/table>\n<div class=\"sum\">Trait theories ask who leads (extraversion predicts emergence); behavioural theories ask how leaders act (people- vs task-oriented); the Managerial Grid's ideal is Team (9,9).<\/div>\n\n<h3>Path-Goal Theory（When?，p.21–23）<span class=\"hot\">高频考点<\/span><\/h3>\n<p>领导调整自己的行为，帮员工<b>扫清通往目标的障碍<\/b>。<\/p>\n<ul>\n<li><b>Directive<\/b>：给工作提供结构、讲清怎么做（task-oriented）<\/li>\n<li><b>Supportive<\/b>：给心理支持、关心员工（people-oriented）<\/li>\n<li><b>Participative<\/b>：鼓励员工参与、听取建议<\/li>\n<li><b>Achievement-oriented<\/b>：通过目标设定和积极的 self-fulfilling prophecy 激发最佳表现<\/li>\n<\/ul>\n<table>\n<tr><th>Subordinate contingencies 下属因素<\/th><th>Environmental contingencies 环境因素<\/th><th>Outcomes 结果<\/th><\/tr>\n<tr><td>Ability level · Locus of control · Motivation<\/td><td>Role ambiguity · Stress level · Unpleasant tasks<\/td><td>Employee motivation · performance · satisfaction<\/td><\/tr>\n<\/table>\n\n<h3>Situational Leadership Theory（Hersey-Blanchard，p.24–26）<span class=\"hot\">易错点<\/span><\/h3>\n<p>关注下属的 <span class=\"t\">readiness<\/span> = 完成某项任务的 <span class=\"k\">ability（能力）<\/span> 和 <span class=\"k\">willingness（意愿）<\/span>。下属可以接受或拒绝领导，效果取决于下属的反应（像父母随孩子长大逐步放手）。<\/p>\n<div class=\"grid2\">\n<div><span class=\"lab\">3 Participating<\/span>（能力够、意愿低）<br>Low task · High relationship：支持 + 参与<\/div>\n<div><span class=\"lab\">4 Delegating<\/span>（能力够、意愿高）<br>Low task · Low relationship：放手（laissez-faire）<\/div>\n<div><span class=\"lab\">1 Telling<\/span>（没能力、没意愿）<br>High task · Low relationship：给清楚具体的指令<\/div>\n<div><span class=\"lab\">2 Selling<\/span>（没能力、有意愿）<br>High task · High relationship：说服下属\"买账\"<\/div>\n<\/div>\n<p class=\"muted\">纵轴 = Ability（competence），横轴 = Willingness（commitment）。<\/p>\n<div class=\"sum\">Path-Goal: the leader picks directive, supportive, participative or achievement-oriented behaviour to fit the employee and the environment. Situational Leadership: match Telling, Selling, Participating or Delegating to follower ability and willingness.<\/div>\n\n<h2>4. Leaders &amp; Followers（p.27）<\/h2>\n<p>无效的追随者可能比无效的领导者<b>更拖累<\/b>组织。有效追随者的特点：<\/p>\n<ul>\n<li>Manage themselves well（自我管理好）<\/li>\n<li>Committed to a purpose outside themselves（为更大的目标投入）<\/li>\n<li>Build competence and focus efforts for maximum impact（提升能力、集中发力）<\/li>\n<li>Courageous, honest, and credible（勇敢、诚实、可信）<\/li>\n<\/ul>\n<div class=\"sum\">Effective followers manage themselves, commit to a shared purpose, build competence, and are courageous, honest and credible.<\/div>\n\n<h2>5. Power（权力，p.32–41）<\/h2>\n<p><span class=\"t\">Power<\/span> = the capacity of a person, team, or organization to <span class=\"k\">influence<\/span> others（影响他人的能力）。<\/p>\n<h3>Sources of Power<span class=\"hot\">高频考点<\/span><\/h3>\n<table>\n<tr><th>Positional 职位权力（p.34）<\/th><th>Personal 个人权力（p.35）<\/th><\/tr>\n<tr><td><b>Coercive<\/b>：能惩罚别人<\/td><td><b>Expert<\/b>：专业知识和技能<\/td><\/tr>\n<tr><td><b>Reward<\/b>：能给奖励（如奖金）<\/td><td><b>Referent<\/b>：别人欣赏、认同你<\/td><\/tr>\n<tr><td><b>Legitimate<\/b>：正式职位带来的权力<\/td><td><b>Information<\/b>：掌握别人需要的信息<\/td><\/tr>\n<\/table>\n<p class=\"muted\">课件这两页只有图片和名称，上面的定义是通用教材的标准解释。<\/p>\n<h3>Your Power Will Increase if…（p.41）<\/h3>\n<ul>\n<li><b>Important<\/b>：你控制的资源有价值（importance）<\/li>\n<li><b>Scarce<\/b>：资源稀缺、独特（scarcity）<\/li>\n<li><b>No substitutes<\/b>：找不到同样好用的替代品（substitutability）<\/li>\n<\/ul>\n<div class=\"sum\">Power is the capacity to influence others. Positional power: coercive, reward, legitimate. Personal power: expert, referent, information. Power grows when resources are important, scarce and non-substitutable.<\/div>\n\n<h2>6. Influence（影响，p.44–46）<\/h2>\n<p><span class=\"t\">Influence<\/span> = 任何试图改变别人态度或行为的行为。<b>Influence tactics<\/b> = 人们如何运用自己的权力基础。<\/p>\n<h3>三种结果<\/h3>\n<ul>\n<li><b>Commitment<\/b>：热情接受，认真完成（最好）<\/li>\n<li><b>Compliance<\/b>：勉强照做，只出最少力气<\/li>\n<li><b>Resistance<\/b>：反对，设法逃避（最差）<\/li>\n<\/ul>\n<h3>Influence Tactics Use and Outcomes（p.46）<span class=\"hot\">易错点<\/span><\/h3>\n<table>\n<tr><th>Tactic<\/th><th>使用频率<\/th><th>Resistance<\/th><th>Compliance<\/th><th>Commitment<\/th><\/tr>\n<tr><td class=\"h\">Rational persuasion<\/td><td><b>54%<\/b><\/td><td><b>47%<\/b><\/td><td>30%<\/td><td>23%<\/td><\/tr>\n<tr><td class=\"h\">Legitimating<\/td><td>13%<\/td><td>44%<\/td><td>56%<\/td><td>0%<\/td><\/tr>\n<tr><td class=\"h\">Personal appeals<\/td><td>7%<\/td><td>25%<\/td><td>33%<\/td><td>42%<\/td><\/tr>\n<tr><td class=\"h\">Exchange<\/td><td>7%<\/td><td>24%<\/td><td>41%<\/td><td>35%<\/td><\/tr>\n<tr><td class=\"h\">Ingratiation<\/td><td>6%<\/td><td>41%<\/td><td>28%<\/td><td>31%<\/td><\/tr>\n<tr><td class=\"h\">Pressure<\/td><td>6%<\/td><td>56%<\/td><td>41%<\/td><td>3%<\/td><\/tr>\n<tr><td class=\"h\">Coalitions<\/td><td>3%<\/td><td>53%<\/td><td>44%<\/td><td>3%<\/td><\/tr>\n<tr><td class=\"h\">Inspirational appeals<\/td><td><b>2%<\/b><\/td><td>0%<\/td><td>10%<\/td><td><b>90%<\/b><\/td><\/tr>\n<tr><td class=\"h\">Consultation<\/td><td>2%<\/td><td>18%<\/td><td>27%<\/td><td>55%<\/td><\/tr>\n<\/table>\n<p>记住反差：<b>Rational persuasion<\/b> 用得最多（54%），但抵制也最多（47%）；<b>Inspirational appeals<\/b> 用得最少（2%），但 commitment 最高（90%）；<b>Legitimating<\/b> 的 commitment 是 0%。<\/p>\n<div class=\"sum\">Influence tactics lead to commitment, compliance or resistance. Rational persuasion is used most but meets the most resistance; inspirational appeals are used least but create the most commitment.<\/div>\n\n<h2>7. Politics（组织政治，p.42–50）<\/h2>\n<p><span class=\"t\">Political behaviour<\/span> = 影响或试图影响组织内<span class=\"k\">利益与不利分配<\/span>（distribution of advantages and disadvantages）的活动。<\/p>\n<h3>Types of Political Activity（p.48）<\/h3>\n<ul>\n<li>Impression management（印象管理）<\/li>\n<li>Attacking or blaming others（攻击或甩锅）<\/li>\n<li>Withholding or distorting information（隐瞒或歪曲信息）<\/li>\n<li>Building support for ideas（为想法争取支持）<\/li>\n<li>Praising others（称赞别人）<\/li>\n<li>Building coalitions（结盟）<\/li>\n<li>Associating with influential people（接近有影响力的人）<\/li>\n<li>Creating obligations（制造人情）<\/li>\n<\/ul>\n<h3>The Abuse of Power（p.49）<\/h3>\n<ul>\n<li><b>Workplace bullying<\/b>：physical、verbal、social、cyber；可以发生在任何层级之间，也可以在同事之间<\/li>\n<li><b>Sexual harassment<\/b>：工作场所中不受欢迎的性相关行为，影响工作环境或带来不利的工作后果。例如不必要的身体接触、侵入个人空间、多次被拒仍邀约、附带承诺或威胁的性要求<\/li>\n<\/ul>\n<h3>Controlling Political Behaviour（p.50）<\/h3>\n<ul>\n<li>Ensure sufficient resources（资源充足）<\/li>\n<li>Keep employees informed（信息透明）<\/li>\n<li>Empower employees（给员工授权）<\/li>\n<li>Foster norms to reject self-serving political behaviour（建立拒绝自私政治的规范）<\/li>\n<li>Be a good role model（以身作则）<\/li>\n<\/ul>\n<p class=\"muted\">课堂案例：Case 07 · Leadership Crisis at Meridian Manufacturing。<\/p>\n<div class=\"sum\">Political behaviour tries to influence who gets advantages. Managers can limit harmful politics with enough resources, open information, empowerment, clear norms and good role modelling.<\/div>\n\n", "terms": [{"t": "Achievement-oriented", "z": "成就导向：设定有挑战的目标（Path-Goal）", "e": "Path-Goal style: sets challenging goals and expects the best performance."}, {"t": "Associating with influential people", "z": "接近有影响力的人（政治行为）", "e": "A political activity: spending time with powerful people to gain advantage."}, {"t": "Attacking or blaming others", "z": "攻击或甩锅（政治行为）", "e": "A political activity: blaming others to avoid responsibility."}, {"t": "Authority-obedience (9,1)", "z": "权威-服从型：只看绩效", "e": "Managerial Grid: high concern for production, low for people; only results matter."}, {"t": "Autocratic", "z": "专制型：领导一人做决定", "e": "Lewin style: \"Do X\"; the leader makes all decisions. Motivation = fear of punishment; use with many inexperienced staff."}, {"t": "Building coalitions", "z": "结盟（政治行为）", "e": "A political activity: forming groups that support your position."}, {"t": "Building support for ideas", "z": "为想法争取支持（政治行为）", "e": "A political activity: getting others to back your ideas before a decision."}, {"t": "Coercive power", "z": "强制权：能惩罚", "e": "Positional power based on the ability to punish."}, {"t": "Commitment", "z": "承诺：热情接受、认真做", "e": "Best influence outcome: the person agrees and works hard on the request."}, {"t": "Compliance", "z": "服从：勉强照做", "e": "Influence outcome: the person does the request but with minimal effort."}, {"t": "Consultation", "z": "咨询：让对方参与（55% commitment）", "e": "Influence tactic: asking for the other person's input; often leads to commitment."}, {"t": "Contingent reward", "z": "权变奖励：表现好就奖励", "e": "Transactional behaviour: exchanging rewards for effort and good performance."}, {"t": "Country club (1,9)", "z": "乡村俱乐部型：只照顾人", "e": "Managerial Grid: high concern for people, low for production; friendly but little work."}, {"t": "Creating obligations", "z": "制造人情（政治行为）", "e": "A political activity: doing favours so others owe you."}, {"t": "Delegating (S4)", "z": "授权：能力够、意愿高", "e": "Situational style for able and willing followers: low task, low relationship."}, {"t": "Democratic", "z": "民主型：一起决定", "e": "Lewin style: \"Which is best, X or Y?\"; decisions with the team. Use with experienced professionals."}, {"t": "Directive", "z": "指导型：给结构、讲清怎么做（Path-Goal）", "e": "Path-Goal style: gives structure and tells employees how to do the work."}, {"t": "Expert power", "z": "专家权：专业知识技能", "e": "Personal power based on skills and knowledge."}, {"t": "Extraversion", "z": "外向性：最能预测谁当领导", "e": "The trait that best predicts leadership emergence (who becomes a leader)."}, {"t": "Idealized influence", "z": "理想化影响：愿景、信任（4 I's）", "e": "Transformational: gives vision and a sense of mission; earns respect and trust."}, {"t": "Impoverished (1,1)", "z": "贫乏型：最低努力", "e": "Managerial Grid: low concern for both; minimum effort to keep the job."}, {"t": "Impression management", "z": "印象管理（政治行为）", "e": "A political activity: controlling how others see you."}, {"t": "Individual consideration", "z": "个别关怀：一对一辅导（4 I's）", "e": "Transformational: gives personal attention, coaching and advice to each employee."}, {"t": "Influence", "z": "影响：改变别人的态度或行为", "e": "Any behaviour that tries to change another person's attitudes or behaviour."}, {"t": "Influence tactics", "z": "影响策略：如何使用权力", "e": "How people use their power bases to influence others."}, {"t": "Information power", "z": "信息权：掌握别人需要的信息", "e": "Personal power from having information that others need."}, {"t": "Inspirational appeals", "z": "感召：用得最少（2%）、commitment 最高（90%）", "e": "Influence tactic that appeals to values and emotions; used least but creates the most commitment."}, {"t": "Inspirational motivation", "z": "鼓舞激励：高期望（4 I's）", "e": "Transformational: communicates high expectations and important goals simply."}, {"t": "Intellectual stimulation", "z": "智力激发：理性解决问题（4 I's）", "e": "Transformational: encourages rational thinking and careful problem solving."}, {"t": "Laissez-faire", "z": "放任型：几乎不管", "e": "Lewin: \"Do X or Y as you see fit\"; in the full range model, the leader avoids responsibility and decisions."}, {"t": "Leadership", "z": "领导：带领一群人或组织", "e": "The act of leading a group of people or an organization."}, {"t": "Leadership emergence", "z": "领导涌现：谁会成为领导", "e": "Who becomes a leader; best predicted by extraversion."}, {"t": "Legitimate power", "z": "法定权：正式职位", "e": "Positional power from a formal position in the organization."}, {"t": "Legitimating", "z": "合法化：commitment 为 0%", "e": "Influence tactic: using authority or rules to justify a request; 0% commitment."}, {"t": "Management by exception (active)", "z": "主动例外管理：主动找偏差", "e": "Transactional: actively looks for mistakes and corrects them early."}, {"t": "Management by exception (passive)", "z": "被动例外管理：出问题才管", "e": "Transactional: acts only after standards are not met."}, {"t": "Manager vs. leader", "z": "管理者 vs 领导者", "e": "Managers: stability, work, \"doing things right\"; leaders: change, people, \"doing the right things\"."}, {"t": "Managerial Grid", "z": "管理方格（Blake & Mouton）", "e": "Model with concern for production (x) and concern for people (y); best style = Team (9,9)."}, {"t": "Middle-of-the-road (5,5)", "z": "中庸型：两边平衡", "e": "Managerial Grid: balances getting work done with keeping morale."}, {"t": "Participating (S3)", "z": "参与：能力够、意愿低", "e": "Situational style for able but unwilling followers: low task, high relationship."}, {"t": "Participative", "z": "参与型：让员工参与（Path-Goal）", "e": "Path-Goal style: asks for and uses employees' suggestions."}, {"t": "Path-Goal Theory", "z": "路径-目标理论：帮员工扫清障碍", "e": "The leader changes behaviour to clear the path to goals, based on subordinate and environmental contingencies."}, {"t": "Political behaviour", "z": "政治行为：争夺利益分配", "e": "Activities that influence the distribution of advantages and disadvantages in an organization."}, {"t": "Power", "z": "权力：影响他人的能力", "e": "The capacity of a person, team or organization to influence others."}, {"t": "Rational persuasion", "z": "理性说服：用得最多（54%）、抵制最多（47%）", "e": "Influence tactic using logic and facts; used most but meets the most resistance."}, {"t": "Readiness", "z": "准备度 = 能力 + 意愿", "e": "In Situational Leadership: the follower's ability and willingness to do a task."}, {"t": "Referent power", "z": "参照权：别人欣赏你", "e": "Personal power based on others liking and admiring you."}, {"t": "Resistance", "z": "抵制：反对、逃避", "e": "Worst influence outcome: the person opposes or avoids the request."}, {"t": "Reward power", "z": "奖赏权：能给奖励", "e": "Positional power based on the ability to give rewards."}, {"t": "Selling (S2)", "z": "推销：没能力、有意愿", "e": "Situational style for unable but willing followers: high task, high relationship."}, {"t": "Situational Leadership", "z": "情境领导（Hersey-Blanchard）", "e": "Match the style (telling, selling, participating, delegating) to the follower's readiness."}, {"t": "Supportive", "z": "支持型：关心员工（Path-Goal）", "e": "Path-Goal style: gives psychological support and care; good for stress or unpleasant tasks."}, {"t": "Team (9,9)", "z": "团队型：最理想", "e": "Managerial Grid: high concern for both; committed people and trust. The best style."}, {"t": "Telling (S1)", "z": "告知：没能力、没意愿", "e": "Situational style for unable and unwilling followers: high task, low relationship."}, {"t": "Trait theory", "z": "特质理论：谁当领导（Who?）", "e": "Looks at personal traits of leaders; better predicts emergence than effectiveness."}, {"t": "Transactional leadership", "z": "交易型领导：奖励换表现", "e": "Leading by exchanging rewards for performance (contingent reward, MBE)."}, {"t": "Transformational leadership", "z": "变革型领导：4 个 I", "e": "Leading change by inspiring people through the 4 I's."}, {"t": "Withholding or distorting information", "z": "隐瞒或歪曲信息（政治行为）", "e": "A political activity: hiding or changing information to gain advantage."}, {"t": "Workplace bullying", "z": "职场霸凌：身体、言语、社交、网络", "e": "Abuse of power: physical, verbal, social or cyber bullying at any level."}]}, {"n": 8, "en": "Decision-Making", "zh": "决策", "notes": "\n\n\n<h2>1. Rational Decision-Making Model（理性决策模型，p.3–8）<\/h2>\n<p>理想情况下，决策按 <span class=\"t\">6 个步骤<\/span>进行：<\/p>\n<table>\n<tr><th>Step<\/th><th>Model<\/th><th>课件例子：招一名会计<\/th><\/tr>\n<tr><td class=\"h\">1<\/td><td>Define the problem（定义问题）<\/td><td>Hire a new accountant<\/td><\/tr>\n<tr><td class=\"h\">2<\/td><td>Identify the criteria（确定标准）· What is important?<\/td><td>certificate · work experience · education level · interpersonal skills<\/td><\/tr>\n<tr><td class=\"h\">3<\/td><td>Allocate weights to the criteria（给标准分配权重）· How important?<\/td><td>证书和经验 = 很重要；学历 = 重要；人际能力 = 不太重要<\/td><\/tr>\n<tr><td class=\"h\">4<\/td><td>Develop alternatives（列出备选方案）· What are the options?<\/td><td>100 job candidates<\/td><\/tr>\n<tr><td class=\"h\">5<\/td><td>Evaluate the alternatives（评估方案）<\/td><td>按 4 个加权标准给每位候选人打分<\/td><\/tr>\n<tr><td class=\"h\">6<\/td><td>Select the best alternative（选出最佳方案）<\/td><td>算总分，选分数最高的人<\/td><\/tr>\n<\/table>\n\n<h3>Decision Matrix（决策矩阵）<span class=\"hot\">高频考点<\/span><\/h3>\n<ul>\n<li>列出所有 <b>options<\/b>（备选方案）和 <b>criteria<\/b>（标准）<\/li>\n<li>给每个标准一个 <b>weight<\/b>，例如 1–3（1 = 不重要，3 = 很重要）<\/li>\n<li>给每个方案在每个标准上打 <b>rating<\/b>，例如 1–3（1 = 不理想，3 = 理想）<\/li>\n<li><b>Score = Weight × Rating<\/b>，加总后 <b>分数最高的方案胜出<\/b><\/li>\n<\/ul>\n<div class=\"formula\">Total score = Σ（Weight × Rating）<\/div>\n<p>课件例子：选餐厅<\/p>\n<table>\n<tr><th>Criteria<\/th><th>Weight<\/th><th>Thai（rating → score）<\/th><th>Pizza<\/th><th>Greek<\/th><\/tr>\n<tr><td class=\"h\">Allergies<\/td><td>3<\/td><td>3 → 9<\/td><td>1 → 3<\/td><td>2 → 6<\/td><\/tr>\n<tr><td class=\"h\">Cost<\/td><td>2<\/td><td>2 → 4<\/td><td>3 → 6<\/td><td>3 → 6<\/td><\/tr>\n<tr><td class=\"h\">Distance<\/td><td>3<\/td><td>1 → 3<\/td><td>2 → 6<\/td><td>1 → 3<\/td><\/tr>\n<tr><td class=\"h\">Cuisine<\/td><td>1<\/td><td>3 → 3<\/td><td>2 → 2<\/td><td>2 → 2<\/td><\/tr>\n<tr><td class=\"h\">Reviews<\/td><td>2<\/td><td>3 → 6<\/td><td>1 → 2<\/td><td>2 → 4<\/td><\/tr>\n<tr><td class=\"h\">Total<\/td><td><\/td><td><b>25 ✔<\/b><\/td><td>19<\/td><td>21<\/td><\/tr>\n<\/table>\n<p>结果：<b>Thai 得分最高（25）<\/b>，所以选 Thai。考试如果给数据，记得<b>先乘权重再加总<\/b>，不要直接加 rating。<\/p>\n<div class=\"sum\">The rational model has six steps: define the problem, identify criteria, weight criteria, develop alternatives, evaluate them, and select the best. A decision matrix multiplies each rating by its weight and picks the highest total.<\/div>\n\n<h2>2. How We Actually Make Decisions（现实中的决策，p.10–13）<\/h2>\n<h3>理性的局限<\/h3>\n<ul>\n<li><b>Bounded rationality（有限理性）<\/b>：人的信息、时间和处理能力有限，只能在简化的范围内做\"理性\"决定<\/li>\n<li><b>Satisficing（满意即可）<\/b>：找到第一个\"够好\"的方案就停，而不是找最优方案<\/li>\n<li><b>Intuition（直觉）<\/b>：根据经验快速做判断，不经过完整的分析<\/li>\n<\/ul>\n<p class=\"muted\">课件这三页只有图片和名称，上面是标准解释。<\/p>\n\n<h3>Judgment Shortcuts / Heuristics（判断捷径与偏差）<span class=\"hot\">高频考点<\/span><\/h3>\n<table>\n<tr><th>Bias<\/th><th>意思<\/th><th>一句话辨认<\/th><\/tr>\n<tr><td class=\"h\">Overconfidence bias<\/td><td>太相信自己的判断，尤其是在自己不擅长的领域<\/td><td>\"我肯定没问题\"<\/td><\/tr>\n<tr><td class=\"h\">Anchoring bias<\/td><td>以最先得到的信息为基准做后续判断<\/td><td>被第一个数字\"锚住\"<\/td><\/tr>\n<tr><td class=\"h\">Confirmation bias<\/td><td>只挑选支持自己决定的事实<\/td><td>只看对自己有利的证据<\/td><\/tr>\n<tr><td class=\"h\">Availability bias<\/td><td>重视手边最容易想到的信息<\/td><td>最近、最印象深刻的事<\/td><\/tr>\n<tr><td class=\"h\">Escalation of commitment<\/td><td>明明证据显示决定错了，还继续加大投入，<b>尤其当自己对决定负责时<\/b><\/td><td>\"已经投了这么多，不能停\"<\/td><\/tr>\n<tr><td class=\"h\">Randomness error<\/td><td>给随机事件强加意义，比如迷信<\/td><td>\"穿这件衣服就会赢\"<\/td><\/tr>\n<tr><td class=\"h\">Risk aversion<\/td><td>宁愿要确定的结果，也不要有风险的结果<\/td><td>\"稳一点比较好\"<\/td><\/tr>\n<tr><td class=\"h\">Hindsight bias<\/td><td>结果出来后，觉得自己早就能预测到<\/td><td>\"我早就知道会这样\"<\/td><\/tr>\n<\/table>\n<p>易混：<b>Confirmation<\/b> 是\"挑证据\"，<b>Anchoring<\/b> 是\"被第一个信息锚住\"，<b>Availability<\/b> 是\"用最容易想到的信息\"。<\/p>\n<div class=\"sum\">Real decisions use bounded rationality, satisficing and intuition, and are distorted by biases such as overconfidence, anchoring, confirmation, availability, escalation of commitment, randomness error, risk aversion and hindsight.<\/div>\n\n<h2>3. Group Decision-Making（群体决策，p.18–21）<\/h2>\n<h3>Individual vs. Group<\/h3>\n<table>\n<tr><th>Individual<\/th><th>Homogeneous group（同质群体）<\/th><th>Heterogeneous group（异质群体）<\/th><\/tr>\n<tr><td>最快 · 最 <b>efficient<\/b><br>用于最清楚的问题<\/td><td>介于两者之间<\/td><td>最慢 · 最 <b>effective<\/b><br>用于最复杂的问题<\/td><\/tr>\n<\/table>\n\n<h3>Group Decision-Making：优点与缺点<\/h3>\n<table>\n<tr><th>Strengths 优点<\/th><th>Weaknesses 缺点<\/th><\/tr>\n<tr><td><b>Synergy<\/b>：互相借鉴想法，降低不确定性<\/td><td><b>More time-consuming<\/b>：更花时间<\/td><\/tr>\n<tr><td><b>Resource pooling<\/b>：汇集不同的技能、知识和想法<\/td><td><b>Conformity pressures<\/b>：从众压力<\/td><\/tr>\n<tr><td><b>Easier implementation<\/b>：大家更理解、更接受决定<\/td><td>讨论被 1–2 个人主导<\/td><\/tr>\n<tr><td><\/td><td><b>Diffusion of responsibility<\/b>：责任分散<\/td><\/tr>\n<tr><td><\/td><td><b>Groupshift（group polarization）<\/b>：群体决策比个人更极端<\/td><\/tr>\n<tr><td><\/td><td><b>Groupthink<\/b>：为了和谐不去批判性评估<\/td><\/tr>\n<\/table>\n\n<h3>Individual vs. Group Decisions（谁更好？）<span class=\"hot\">易错点<\/span><\/h3>\n<table>\n<tr><th>标准<\/th><th>更好的是<\/th><\/tr>\n<tr><td class=\"h\">Accuracy 准确性<\/td><td>Group decisions<\/td><\/tr>\n<tr><td class=\"h\">Speed 速度<\/td><td>Individual decisions<\/td><\/tr>\n<tr><td class=\"h\">Creativity 创造性<\/td><td>Group decisions<\/td><\/tr>\n<tr><td class=\"h\">Acceptance 接受度<\/td><td>Group decisions<\/td><\/tr>\n<tr><td class=\"h\">Efficiency 效率<\/td><td>Individual decisions<\/td><\/tr>\n<\/table>\n<p>口诀：<b>速度和效率 → 个人<\/b>；<b>准确、创造、接受 → 群体<\/b>。<\/p>\n<div class=\"sum\">Individuals decide faster and more efficiently; groups are more accurate, creative and accepted, but risk conformity, diffusion of responsibility, groupshift and groupthink.<\/div>\n\n<h2>4. Creative Decision-Making（创造性决策，p.24–25）<\/h2>\n<p><span class=\"t\">Creativity<\/span> = the ability to produce <span class=\"k\">novel<\/span> and <span class=\"k\">useful<\/span> ideas（产生新颖且有用的想法的能力）。<\/p>\n<h3>衡量创造力的三个维度<\/h3>\n<ul>\n<li><b>Fluency（流畅性）<\/b>：想法的<b>数量<\/b>（number of ideas）<\/li>\n<li><b>Flexibility（灵活性）<\/b>：想法的<b>多样性<\/b>（variety of ideas）<\/li>\n<li><b>Originality（独创性）<\/b>：想法的<b>独特性<\/b>（uniqueness of ideas）<\/li>\n<\/ul>\n<h3>影响创造力的因素<\/h3>\n<table>\n<tr><th>Traits 特质<\/th><th>Attributes 个人条件<\/th><th>Context 环境<\/th><\/tr>\n<tr><td>Openness to experience · Risk taking<\/td><td>Expertise · Imagination · Motivation<\/td><td>Encouragement · Time pressure · Environment<\/td><\/tr>\n<\/table>\n<div class=\"sum\">Creativity is producing novel and useful ideas, measured by fluency (number), flexibility (variety) and originality (uniqueness), and shaped by traits, attributes and context.<\/div>\n\n<h2>5. Ethical Decision-Making（道德决策，p.27–41）<\/h2>\n<p>三个圈的交集：<b>What you can do<\/b>（能做的）∩ <b>What you may legally do<\/b>（合法的）∩ <b>What you can morally do<\/b>（道德的）= <span class=\"t\">What you should do<\/span>。<\/p>\n\n<h3>Influences of Ethical Decisions（影响道德决策的 6 个因素）<\/h3>\n<ol>\n<li><b>Consequences<\/b>：决定带来的伤害或好处<\/li>\n<li><b>Society's opinion<\/b>：别人怎么看<\/li>\n<li><b>Likelihood of effect<\/b>：发生伤害或好处的概率<\/li>\n<li><b>Time to consequences<\/b>：后果多快出现<\/li>\n<li><b>Relatedness<\/b>：你和受影响的人有多亲近<\/li>\n<li><b>Reach of result<\/b>：会影响多少人<\/li>\n<\/ol>\n\n<h3>Ethics Criteria for Decision-Making（四种道德标准）<span class=\"hot\">高频考点<\/span><\/h3>\n<table>\n<tr><th>Criterion<\/th><th>核心<\/th><th>意思<\/th><\/tr>\n<tr><td class=\"h\">Utilitarian<\/td><td>Consequences 结果<\/td><td>为最多的人带来最大的\"好\"<\/td><\/tr>\n<tr><td class=\"h\">Rights<\/td><td>Duties 义务<\/td><td>保障每个人的基本自由和权利<\/td><\/tr>\n<tr><td class=\"h\">Justice<\/td><td>Fairness 公平<\/td><td>公平地按规则分配利益和成本<\/td><\/tr>\n<tr><td class=\"h\">Care<\/td><td>Relationships 关系<\/td><td>特别照顾和你关系亲近的人<\/td><\/tr>\n<\/table>\n\n<h3>Ethical Decision-Making Framework（三个问题，p.35）<\/h3>\n<ol>\n<li><b>Is the decision motivated by self-serving interests?<\/b>（出于私利吗？）→ Yes = <b>Unethical<\/b>；No → 问题 2<\/li>\n<li><b>Does the decision respect the rights of the individuals affected?<\/b>（尊重相关人的权利吗？）→ No = <b>Unethical<\/b>；Yes → 问题 3<\/li>\n<li><b>Is the decision fair and equitable?<\/b>（公平吗？）→ Yes = <b>Ethical<\/b>；No = <b>Unethical<\/b><\/li>\n<\/ol>\n<h3>Additional Ethics Checks（p.40）<\/h3>\n<ul>\n<li>How would I feel if my <b>family<\/b> found out?（家人知道了我会怎么想？）<\/li>\n<li>How would I feel if it were splashed across the <b>front page of the newspaper<\/b>?（上了报纸头版我会怎么想？）<\/li>\n<\/ul>\n\n<h3>Culture and Ethics（p.41）<\/h3>\n<ul>\n<li>没有全球统一的道德标准（no global ethical standards）<\/li>\n<li>西方国家对对错的标准更清楚；在亚洲，很多问题不是非黑即白，而是灰色地带<\/li>\n<li>在很多国家，贿赂（bribery）很常见，被当作做生意的方式<\/li>\n<li>跨国公司制定道德原则时，可能需要根据当地文化规范调整<\/li>\n<\/ul>\n<p class=\"muted\">课堂案例：Case 08 · DataSecure Technologies — Navigating Ethical Decision-Making in Crisis。<\/p>\n<div class=\"sum\">Ethical decisions are judged by utilitarian (consequences), rights (duties), justice (fairness) and care (relationships) criteria. A decision is ethical only if it is not self-serving, respects people's rights, and is fair and equitable.<\/div>\n", "terms": [{"t": "Acceptance", "z": "接受度：群体决策更好", "e": "How much people agree with and support a decision. Group decisions are better."}, {"t": "Accuracy", "z": "准确性：群体决策更好", "e": "How correct a decision is. Group decisions are better for accuracy."}, {"t": "Allocate weights", "z": "给标准分配权重（理性模型第 3 步）", "e": "Step 3 of the rational model: decide how important each criterion is."}, {"t": "Anchoring bias", "z": "锚定偏差：被第一个信息“锚住”", "e": "Using early, first received information as the basis for making later judgments."}, {"t": "Availability bias", "z": "可得性偏差：只用手边/最近的信息", "e": "Emphasizing information that is most readily at hand."}, {"t": "Bounded rationality", "z": "有限理性：信息和时间有限", "e": "Making decisions with limited information, time and ability, so we simplify the problem."}, {"t": "Bribery", "z": "贿赂：在很多国家很常见", "e": "Giving money or gifts to get an unfair advantage; commonplace in many countries."}, {"t": "Care criterion", "z": "关怀标准：照顾关系亲近的人", "e": "Ethics criterion (relationships): especially consider those to whom you are closely connected."}, {"t": "Confirmation bias", "z": "确认偏差：只找支持自己的事实", "e": "Selecting and using only facts that support our decision."}, {"t": "Conformity pressure", "z": "从众压力：群体决策的缺点", "e": "Pressure to agree with the group; a weakness of group decision-making."}, {"t": "Consequences", "z": "后果：伤害或好处", "e": "An influence on ethical decisions: the harm or benefit from the decision."}, {"t": "Creativity", "z": "创造力：新颖且有用的想法", "e": "The ability to produce novel and useful ideas."}, {"t": "Criteria", "z": "标准：什么是重要的", "e": "What is important when choosing between alternatives (rational model step 2)."}, {"t": "Decision matrix", "z": "决策矩阵：权重 × 评分，加总最高者胜", "e": "Rate each option on each weighted criterion; multiply rating × weight, add up; highest score wins."}, {"t": "Diffusion of responsibility", "z": "责任分散：没人觉得要负责", "e": "In a group, no single person feels responsible for the decision."}, {"t": "Effective", "z": "有效：异质群体决策", "e": "Leads to the best result; heterogeneous groups are slowest but most effective."}, {"t": "Efficiency", "z": "效率：个人决策更好", "e": "Getting a decision with the least time and resources. Individual decisions are better."}, {"t": "Escalation of commitment", "z": "承诺升级：明知错了还继续投入", "e": "Increasing commitment to a decision despite evidence that it is wrong, especially if responsible for it."}, {"t": "Ethics", "z": "伦理/道德：对与错", "e": "Rules about right vs. wrong; what you should do = can do ∩ may legally do ∩ can morally do."}, {"t": "Flexibility", "z": "灵活性：想法的种类多", "e": "A part of creativity: the variety of ideas."}, {"t": "Fluency", "z": "流畅性：想法的数量多", "e": "A part of creativity: the number of ideas."}, {"t": "Groupshift", "z": "群体转移（群体极化）：讨论后更极端", "e": "Group polarization: the group's position becomes more extreme after discussion."}, {"t": "Groupthink", "z": "群体思维：为了和谐而不提反对意见", "e": "Members avoid disagreement to keep harmony, so the group does not evaluate alternatives well."}, {"t": "Heterogeneous group", "z": "异质群体：成员不同；最慢但最有效", "e": "A group of different members; slowest, most effective, use for the most complex problems."}, {"t": "Heuristics", "z": "启发法/判断捷径", "e": "Judgment shortcuts that make decisions faster but can cause biases."}, {"t": "Hindsight bias", "z": "后见之明偏差：“我早就知道”", "e": "After an outcome is known, believing it could have been accurately predicted beforehand."}, {"t": "Homogeneous group", "z": "同质群体：成员相似", "e": "A group of similar members; between individual and heterogeneous groups in speed and effectiveness."}, {"t": "Intuition", "z": "直觉：凭经验快速判断", "e": "Making a decision quickly from experience and feelings, not step-by-step analysis."}, {"t": "Justice criterion", "z": "公正标准：公平分配", "e": "Ethics criterion (fairness): use rules fairly to distribute benefits and costs equitably."}, {"t": "Likelihood of effect", "z": "发生可能性", "e": "An influence on ethical decisions: the probability of harm or benefit."}, {"t": "Originality", "z": "独创性：想法独特", "e": "A part of creativity: the uniqueness of ideas."}, {"t": "Overconfidence bias", "z": "过度自信偏差", "e": "Believing too much in our own ability to make good decisions, especially outside our expertise."}, {"t": "Randomness error", "z": "随机性错误：给随机事件找意义（迷信）", "e": "Creating meaning out of random events, e.g., superstitions."}, {"t": "Rational decision-making model", "z": "理性决策模型：6 步", "e": "Define problem → identify criteria → allocate weights → develop alternatives → evaluate → select best."}, {"t": "Reach of result", "z": "影响范围：多少人受影响", "e": "An influence on ethical decisions: how many people will be affected."}, {"t": "Relatedness", "z": "关联度：你多认同受影响的人", "e": "An influence on ethical decisions: how much you identify with the people affected."}, {"t": "Resource pooling", "z": "资源汇集：技能、知识、想法多样", "e": "A group strength: members bring diverse skills, knowledge and ideas."}, {"t": "Rights criterion", "z": "权利标准：尊重基本自由", "e": "Ethics criterion (duties): grant everyone their fundamental liberties and privileges."}, {"t": "Risk aversion", "z": "风险规避：宁要确定的结果", "e": "Preferring a sure thing over a risky outcome."}, {"t": "Satisficing", "z": "满意即可：选第一个“够好”的方案", "e": "Choosing the first acceptable (good-enough) solution instead of the best one."}, {"t": "Society's opinion", "z": "社会看法：别人怎么想", "e": "An influence on ethical decisions: what others think."}, {"t": "Synergy", "z": "协同效应：互相补充，减少不确定", "e": "A group strength: reduce uncertainty by building on each other's ideas."}, {"t": "Time to consequences", "z": "后果发生的快慢", "e": "An influence on ethical decisions: how fast the effect will happen."}, {"t": "Utilitarian criterion", "z": "功利标准：为最多人带来最大好处", "e": "Ethics criterion (consequences): the most good for the largest number of people."}]}]}</script>
<script>
const CFG=JSON.parse(document.getElementById('data').textContent);const D=CFG.units;const K=CFG.key;
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let known=new Set(store.get(K+'-known',[]));
const keyOf=(n,t)=>n+'|'+t;
const pad=n=>CFG.prefix+String(n).padStart(2,'0');
const examsOf=n=>CFG.exams.filter(x=>x.units.includes(n));
const scopeUnits=(s,L)=>s==='lesson'?[L]:s==='all'?D:D.filter(l=>(CFG.exams.find(x=>x.id===s)||{units:[]}).units.includes(l.n));
let cur=CFG.start, viewName='notes';
$('#brand').innerHTML=`${CFG.code} · ${CFG.short}<small>${CFG.sub}</small>`;
$('#examtag').innerHTML=CFG.exams.map(x=>`<b>${x.label}</b> = ${x.units.length?x.units.map(pad).join(', '):'—'}${x.note?` <em>${x.note}</em>`:''}`).join('<br>');

// lecture list
$('#lessons').innerHTML=D.map(l=>`<li><button data-n="${l.n}"><span class="no">${pad(l.n)}</span><span class="nm">${l.en}<em>${l.zh}</em></span></button></li>`).join('');
$('#lessons').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(+b.dataset.n,viewName)});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(cur,b.dataset.v)});

function go(n,v){location.hash=`l${n}`+(v==='notes'?'':'-'+v)}
function route(){
  const m=/^#l(\d+)(?:-(terms|cards))?$/.exec(location.hash);
  if(m&&D.some(l=>l.n===+m[1])){cur=+m[1];viewName=m[2]||'notes'} else {const s=store.get(K+'-last',CFG.start);cur=D.some(l=>l.n===s)?s:CFG.start;viewName='notes'}
  store.set(K+'-last',cur);render();
}
window.addEventListener('hashchange',()=>{route();window.scrollTo({top:0})});

function render(){
  const L=D.find(l=>l.n===cur);
  document.querySelectorAll('#lessons button').forEach(b=>b.setAttribute('aria-current',+b.dataset.n===cur));
  const act=document.querySelector(`#lessons button[data-n="${cur}"]`);act&&act.scrollIntoView({block:'nearest',inline:'center'});
  $('#eyebrow').textContent=[`${CFG.unitWord} ${pad(cur)}`.trim(),L.tag,...examsOf(cur).map(x=>x.label)].filter(Boolean).join(' · ');
  $('#title').textContent=L.en; $('#titlezh').textContent=L.zh; $('#ct').textContent=L.terms.length;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===viewName));
  if(viewName==='notes') renderNotes(L); else if(viewName==='terms') renderTerms(L); else renderCards(L);
}

function renderNotes(L){
  const v=$('#view'); v.innerHTML=`<article class="notes">${L.notes}</article>`;
  v.querySelectorAll('.notes table').forEach(t=>{if(t.parentElement.classList.contains('tw')||t.classList.contains('je'))return;const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t)});
}

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(s,q){s=esc(s);if(!q)return s;const i=s.toLowerCase().indexOf(q.toLowerCase());return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length)}
function renderTerms(L){
  const v=$('#view');
  v.innerHTML=`<div class="tools"><input class="search" id="q" type="search" placeholder="搜索关键词（英文或中文）" autocomplete="off"><label class="chk"><input type="checkbox" id="allq"> 搜全部 ${D.length} ${CFG.unitZh}</label><span class="count" id="n"></span></div><ul class="gl" id="gl"></ul>`;
  const draw=()=>{
    const q=$('#q').value.trim(), all=$('#allq').checked;
    const src=(all?D:[L]).flatMap(l=>l.terms.map(t=>({...t,n:l.n})));
    const rows=q?src.filter(t=>(t.t+' '+t.z+' '+t.e).toLowerCase().includes(q.toLowerCase())):src;
    $('#n').textContent=`${rows.length} 个`;
    $('#gl').innerHTML=rows.length?rows.map(t=>`<li><div><span class="gt">${all?`<span class="lsn">${pad(t.n)}</span>`:''}${hl(t.t,q)}</span><span class="gz">${hl(t.z,q)}</span></div><div class="ge">${hl(t.e,q)}</div></li>`).join(''):`<li class="empty">没有找到“${esc(q)}”。试试勾选“搜全部 ${D.length} ${CFG.unitZh}”。</li>`;
  };
  $('#q').addEventListener('input',draw);$('#allq').addEventListener('change',draw);draw();
}

// flashcards
let fc={scope:'lesson',rev:false,onlyNew:false,deck:[],i:0,flip:false};
function buildDeck(L){
  const src=scopeUnits(fc.scope,L);
  let deck=src.flatMap(l=>l.terms.map(t=>({...t,n:l.n})));
  if(fc.onlyNew) deck=deck.filter(t=>!known.has(keyOf(t.n,t.t)));
  fc.deck=deck; fc.i=0; fc.flip=false;
}
function renderCards(L){
  buildDeck(L);
  const v=$('#view');
  v.innerHTML=`<div class="fc-wrap">
   <div class="tools">
    <div class="seg" id="scope">${[['lesson','本课'],...CFG.exams.filter(x=>x.units.length>1).map(x=>[x.id,x.label]),['all','全部']].map(([k,t])=>`<button data-s="${k}" aria-pressed="${fc.scope===k}">${t}</button>`).join('')}</div>
    <label class="chk"><input type="checkbox" id="rev" ${fc.rev?'checked':''}> 反向（看释义猜词）</label>
    <label class="chk"><input type="checkbox" id="onlyNew" ${fc.onlyNew?'checked':''}> 只看还不熟的</label>
   </div>
   <div id="cardbox"></div>
   <p class="keys"><kbd>空格</kbd> 翻面 · <kbd>←</kbd><kbd>→</kbd> 上一张/下一张 · <kbd>1</kbd> 还不熟 · <kbd>2</kbd> 记住了</p>
  </div>`;
  $('#scope').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;fc.scope=b.dataset.s;renderCards(L)});
  $('#rev').addEventListener('change',e=>{fc.rev=e.target.checked;fc.flip=false;drawCard()});
  $('#onlyNew').addEventListener('change',e=>{fc.onlyNew=e.target.checked;renderCards(L)});
  drawCard();
}
function drawCard(){
  const box=$('#cardbox'); if(!box)return;
  const N=fc.deck.length, kn=fc.deck.filter(t=>known.has(keyOf(t.n,t.t))).length;
  if(!N){box.innerHTML=`<div class="done"><b>这一组都记住了</b>取消“只看还不熟的”，或换一个范围继续复习。<br><br><button class="btn" id="reset">清除这组的“记住了”标记</button></div>`;
    $('#reset').onclick=()=>{const L=D.find(l=>l.n===cur);fc.onlyNew=false;
      const src=scopeUnits(fc.scope,L);
      src.forEach(l=>l.terms.forEach(t=>known.delete(keyOf(l.n,t.t))));store.set(K+'-known',[...known]);renderCards(L)};return}
  if(fc.i>=N){box.innerHTML=`<div class="done"><b>这一轮看完了</b>${N} 张里记住了 ${kn} 张。<br><br><button class="btn" id="again">再来一轮</button> <button class="btn ghost" id="sh">打乱顺序再来</button></div>`;
    $('#again').onclick=()=>{fc.i=0;fc.flip=false;drawCard()};$('#sh').onclick=()=>{shuffle();drawCard()};return}
  const t=fc.deck[fc.i], isK=known.has(keyOf(t.n,t.t));
  const termSide=`<div class="big">${esc(t.t)}</div>`;
  const defSide=`<div class="zhbig">${esc(t.z)}</div><div class="def">${esc(t.e)}</div>`;
  const corner=`<div class="corner"><span>${pad(t.n)}</span><span>${isK?'<span class="known">✓ 记住了</span>':''}</span></div>`;
  box.innerHTML=`<div class="card${fc.flip?' flip':''}" id="card" role="button" tabindex="0" aria-label="翻面">
    <div class="card-in">
      <div class="face front">${corner}${fc.rev?defSide:termSide}<div class="hint">点卡片翻面</div></div>
      <div class="face back">${corner}${fc.rev?termSide+defSide.replace('<div class="def">'+esc(t.e)+'</div>',''):termSide+defSide}</div>
    </div></div>
   <div class="fc-bar">
    <button class="btn ghost" id="prev" ${fc.i===0?'disabled':''}>← 上一张</button>
    <span style="display:flex;gap:8px"><button class="btn no" id="no">还不熟</button><button class="btn yes" id="yes">记住了</button></span>
    <button class="btn ghost" id="shuf">打乱</button>
   </div>
   <div class="prog"><i style="width:${(fc.i/N*100).toFixed(1)}%"></i></div>
   <div class="fc-meta"><span>${fc.i+1} / ${N}</span><span>记住 ${kn} / ${N}</span></div>`;
  $('#card').onclick=flip; $('#card').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();flip()}};
  $('#prev').onclick=()=>step(-1); $('#no').onclick=()=>mark(false); $('#yes').onclick=()=>mark(true);
  $('#shuf').onclick=()=>{shuffle();drawCard()};
}
function flip(){fc.flip=!fc.flip;const c=$('#card');c&&c.classList.toggle('flip',fc.flip)}
function step(d){fc.i=Math.max(0,fc.i+d);fc.flip=false;drawCard()}
function mark(ok){const t=fc.deck[fc.i];if(!t)return;const k=keyOf(t.n,t.t);ok?known.add(k):known.delete(k);store.set(K+'-known',[...known]);step(1)}
function shuffle(){for(let i=fc.deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fc.deck[i],fc.deck[j]]=[fc.deck[j],fc.deck[i]]}fc.i=0;fc.flip=false}
document.addEventListener('keydown',e=>{
  if(viewName!=='cards'||e.target.matches('input,textarea'))return;
  if(e.key===' '){e.preventDefault();flip()} else if(e.key==='ArrowRight')step(1); else if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='1')mark(false); else if(e.key==='2')mark(true);
});
route();
</script>
