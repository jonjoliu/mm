<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>COMM 321 OB Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: lecture rail (left, desktop) / chip row (phone) + one reading column; three views per lecture: notes · terms · flashcards */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#13213a; --fg:#1d2433; --muted:#667085; --line:#e0e5ec;
  --term:#c2006b; --accent:#13213a; --green:#3f8a22; --green-bg:#eef7e6; --green-line:#d3e8c1;
  --hot:#c0392b; --tbg:#f9d4d0; --kbg:#d3e3fb; --blue:#1f5fa8; --blue-bg:#f1f6fd; --th:#e9edf4; --zebra:#f8f9fb;
  --chip:#e8ecf3; --gold:#a77800; --gold-bg:#fbf1d3;
  --display:"Archivo","Noto Sans SC",system-ui,sans-serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131d; --panel:#161d2b; --ink:#e7ebf3; --fg:#d9dee8; --muted:#97a1b4; --line:#273044;
  --term:#ff5aaa; --accent:#9db7ea; --green:#86c766; --green-bg:#18261a; --green-line:#2b4426;
  --hot:#ff7b6b; --tbg:#4a2328; --kbg:#1f3456; --blue:#8db8ee; --blue-bg:#152236; --th:#1f2839; --zebra:#1a2231;
  --chip:#222b3c; --gold:#e6bb4a; --gold-bg:#3a3018; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131d; --panel:#161d2b; --ink:#e7ebf3; --fg:#d9dee8; --muted:#97a1b4; --line:#273044;
  --term:#ff5aaa; --accent:#9db7ea; --green:#86c766; --green-bg:#18261a; --green-line:#2b4426;
  --hot:#ff7b6b; --tbg:#4a2328; --kbg:#1f3456; --blue:#8db8ee; --blue-bg:#152236; --th:#1f2839; --zebra:#1a2231;
  --chip:#222b3c; --gold:#e6bb4a; --gold-bg:#3a3018; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15.5px;line-height:1.7;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--term);outline-offset:2px;border-radius:4px}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1180px;margin:0 auto;gap:36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 60px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start}
.brand{font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink);letter-spacing:-.01em;line-height:1.15}
.brand small{display:block;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.lessons{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.lessons button{width:100%;display:grid;grid-template-columns:38px 1fr;align-items:baseline;gap:4px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.lessons button:hover{background:var(--chip)}
.lessons .no{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lessons .nm{font-size:14px;line-height:1.35;color:var(--fg)}
.lessons .nm em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.lessons button[aria-current="true"]{background:var(--panel);box-shadow:inset 3px 0 0 var(--term),0 1px 0 var(--line)}
.lessons button[aria-current="true"] .no{color:var(--term)}
.quiz-tag{margin:18px 10px 0;font-size:12px;color:var(--muted);line-height:1.5}
.quiz-tag b{color:var(--fg)}

main{min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:1px solid var(--line);padding-bottom:16px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--term);text-transform:uppercase}
h1{font-family:var(--display);font-weight:800;color:var(--ink);font-size:clamp(26px,4vw,36px);line-height:1.12;margin:4px 0 2px;text-wrap:balance;letter-spacing:-.015em}
.h1zh{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:10px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs .ct{font-family:var(--mono);font-size:11px;margin-left:4px;opacity:.75}
.view{padding-top:22px}

/* ---------- notes ---------- */
.notes{max-width:760px}
.notes h2{font-family:var(--display);font-weight:800;font-size:21px;color:var(--ink);margin:34px 0 10px;line-height:1.3;text-wrap:balance;padding-top:14px;border-top:2px solid var(--ink)}
.notes h2:first-child{margin-top:0}
.notes h3,.notes h4{display:inline-block;font-size:15.5px;color:var(--ink);background:var(--green-bg);border-left:4px solid var(--green);padding:1px 10px;margin:18px 0 8px;border-radius:0 4px 4px 0;line-height:1.5}
.notes p{margin:0 0 10px}
.notes ul,.notes ol{margin:0 0 12px;padding-left:22px}
.notes li{margin-bottom:3px}
.notes b{font-weight:700;color:var(--ink)}
.notes .t{background:var(--tbg);padding:0 4px;border-radius:3px}
.notes .k{background:var(--kbg);padding:0 4px;border-radius:3px}
.notes .hot{color:var(--hot);font-weight:700;font-size:13px;margin-left:6px;white-space:nowrap}
.notes .hot::before{content:"⚠ "}
.notes .sum{background:var(--green-bg);border:1px solid var(--green-line);border-radius:8px;padding:10px 14px;margin:12px 0 6px;font-size:14.5px}
.notes .sum::before{content:"✎ Exam summary · ";font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--green);font-weight:500}
.notes .formula{background:var(--th);border-radius:8px;text-align:center;font-weight:700;padding:10px;margin:8px 0 12px;color:var(--ink)}
.notes .muted{color:var(--muted);font-size:14px}
.notes .zh{color:var(--muted);font-size:.9em}
.notes p.zh,.notes div.zh{background:var(--zebra);border-radius:6px;padding:6px 10px}
.notes .bk{color:var(--blue);background:var(--blue-bg);border-radius:6px;padding:6px 10px}
.notes .bk::before{content:"课本 ";font-family:var(--mono);font-size:11px;font-weight:500}
.notes .bbox{color:var(--fg);border:1px solid var(--blue);border-radius:8px;padding:8px 12px;margin:10px 0;background:var(--blue-bg)}
.notes .bbox b{color:var(--blue)}
.notes .src{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--blue);border:1px solid currentColor;padding:0 5px;border-radius:4px;vertical-align:3px;white-space:nowrap}
.notes .trap{color:var(--hot)}
.notes .ans{color:var(--green);font-weight:700}
.tw{overflow-x:auto;margin:6px 0 14px;border:1px solid var(--line);border-radius:8px}
.notes table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px;background:var(--panel)}
.notes th{background:var(--th);text-align:left;font-weight:700;color:var(--ink);padding:7px 10px;border-bottom:1px solid var(--line)}
.notes td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.notes tr:nth-child(even) td{background:var(--zebra)}
.notes td.h{font-weight:700;color:var(--ink);white-space:nowrap}
.notes .grid2{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0 12px;font-size:14px}
.notes .grid2 div{padding:8px 12px;border:1px solid var(--line);min-width:0}
.notes .grid2 .lab{font-weight:700;color:var(--ink);border:0;padding:0}
/* L06 figures */
.tkifig{display:grid;grid-template-columns:22px 1fr;gap:4px;max-width:520px;margin:10px auto 14px}
.tkifig .yax{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.tkifig .xax{text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.quad{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.cell{border-radius:8px;padding:10px 12px;min-height:84px;display:flex;flex-direction:column;font-size:13px;background:var(--th)}
.cell b{font-size:15px;color:var(--ink)}
.cell.r{background:var(--tbg)} .cell.r b{color:var(--hot)}
.cell.g{background:var(--green-bg)} .cell.g b{color:var(--green)}
.ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1.5px solid var(--gold);border-radius:999px;padding:4px 12px;text-align:center;font-size:12.5px;white-space:nowrap;line-height:1.35}
.ctr b{color:var(--gold)}
.zfig{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 22px;margin:8px 0 6px}
.zfig svg{display:block;font-family:var(--mono)}
.zfig svg text[fill="#13213a"],.zfig svg text:not([fill]){fill:var(--fg)}
.zfig svg line[stroke="#333"]{stroke:var(--fg)}
.zfig svg text[fill="#8a5a00"]{fill:var(--gold)}
.zfig svg rect[fill="#f2b134"]{fill:var(--gold)}
.zfig + p{font-size:13px!important}

/* ---------- terms ---------- */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 12px;font:inherit;font-size:15px;color:var(--fg)}
.count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.gl{list-style:none;margin:0;padding:0;max-width:880px}
.gl li{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr);gap:4px 22px;padding:10px 0;border-bottom:1px solid var(--line)}
.gl .gt{color:var(--term);font-weight:700;line-height:1.35}
.gl .gz{display:block;color:var(--muted);font-size:13px;line-height:1.45;margin-top:2px}
.gl .ge{line-height:1.55}
.gl mark{background:var(--gold-bg);color:inherit;border-radius:2px}
.gl .lsn{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}
.empty{color:var(--muted);padding:20px 0}

/* ---------- flashcards ---------- */
.fc-wrap{max-width:640px}
.seg{display:inline-flex;gap:2px;background:var(--chip);padding:3px;border-radius:9px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:700}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.card{position:relative;margin:14px 0 12px;perspective:1400px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card-in{position:relative;display:grid;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:300px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 28px;display:flex;flex-direction:column;justify-content:center;gap:10px;box-shadow:0 1px 0 var(--line),0 10px 28px -18px rgba(19,33,58,.35)}
.face.back{transform:rotateY(180deg)}
.face .corner{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.face .big{font-family:var(--display);font-weight:800;font-size:clamp(24px,5vw,34px);color:var(--term);line-height:1.15;text-wrap:balance;text-align:center}
.face .zhbig{font-size:18px;color:var(--muted);text-align:center}
.face .def{font-size:17px;line-height:1.6;color:var(--fg);text-align:center;text-wrap:pretty}
.face .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.face .known{color:var(--green)}
@media (prefers-reduced-motion: reduce){.card-in{transition:none}}
.fc-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 16px;cursor:pointer;font-size:14.5px}
.btn:hover{border-color:var(--muted)}
.btn.no{color:var(--hot)} .btn.yes{color:var(--green)}
.btn.ghost{background:none}
.prog{height:4px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;background:var(--term);width:0;transition:width .25s}
.fc-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px}
.keys{font-size:12px;color:var(--muted);margin-top:14px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel)}
.done{text-align:center;padding:40px 10px}
.done b{font-family:var(--display);font-size:24px;color:var(--ink);display:block;margin-bottom:6px}

.home{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none;margin-bottom:10px}
.home:hover{color:var(--term)}
.quiz-tag em{font-style:normal;color:var(--term)}
.notes .je{font-family:var(--mono);font-size:13.5px;background:var(--zebra);border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:6px 0 14px;max-width:520px}
.notes .je div{display:grid;grid-template-columns:30px 1fr auto;gap:8px}
.notes .je div.cr{padding-left:26px}
.notes .je span{color:var(--muted)}
.notes .je em{font-style:normal;font-variant-numeric:tabular-nums;text-align:right}
.notes .je p{margin:2px 0 6px;color:var(--muted);font-size:12px;font-family:var(--body)}
/* ---------- phone ---------- */
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0;padding-block:14px 48px}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:8px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line)}
  .brand{font-size:17px}.brand small{display:none}
  .lessons{flex-direction:row;overflow-x:auto;margin-top:8px;gap:6px;scrollbar-width:none}
  .lessons::-webkit-scrollbar{display:none}
  .lessons button{display:block;width:auto;background:var(--chip);padding:5px 11px;border-radius:999px;white-space:nowrap}
  .lessons .nm{display:none}
  .lessons .no{color:var(--fg);font-size:13px}
  .lessons button[aria-current="true"]{background:var(--ink);box-shadow:none}
  .lessons button[aria-current="true"] .no{color:var(--bg)}
  .quiz-tag{display:none}
  .home{margin-bottom:4px}
  .head{padding-top:14px}
  .gl li{grid-template-columns:minmax(0,1fr)}
  .face{min-height:260px;padding:26px 18px}
}
</style>

</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Lectures">
    <a class="home" href="../">← 所有课程</a>
    <div class="brand" id="brand"></div>
    <ul class="lessons" id="lessons"></ul>
    <p class="quiz-tag" id="examtag"></p>
  </nav>
  <main>
    <div class="head">
      <div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><div class="h1zh" id="titlezh"></div></div>
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-v="notes">笔记</button>
        <button role="tab" data-v="terms">关键词<span class="ct" id="ct"></span></button>
        <button role="tab" data-v="cards">闪卡</button>
      </div>
    </div>
    <section class="view" id="view"></section>
  </main>
</div>

<script id="data" type="application/json">{"code": "COMM 321", "short": "OB", "sub": "Organizational Behaviour · Dr Svedic", "key": "ob321", "prefix": "L", "unitWord": "Lecture", "unitZh": "课", "start": 9, "exams": [{"id": "q1", "label": "Quiz 1", "units": [1, 2, 3, 4, 5]}, {"id": "q2", "label": "Quiz 2", "units": [6, 7, 8]}], "units": [{"n": 1, "en": "Intro to OB", "zh": "组织行为学导论", "notes": "<h2>Intro to OB <span class=\"src\">B Ch1<\/span><\/h2>\n<p><b>OB<\/b><span class=\"zh\">（组织行为学）<\/span> = impact of individuals, groups, structure on behaviour within organizations. <b>Organization<\/b><span class=\"zh\">（组织）<\/span> = consciously coordinated social unit, continuous basis, common goals.<br>\n<b>Effectiveness<\/b><span class=\"zh\">（效果）<\/span> = doing the right things (goals) · <b>efficiency<\/b><span class=\"zh\">（效率）<\/span> = doing things right (output/input).<br>\n<b>3 levels:<\/b> individual (differences, satisfaction, motivation) · group (working with others, diversity) · organization (productivity, work-life balance, globalization).<br>\n<b>Rigour:<\/b> consistencies · beyond common sense (systematic evidence) · few absolutes · contingency approach.<br>\n<span class=\"zh\">效果 = 做对的事；效率 = 把事做对。<\/span><\/p>\n<p class=\"bk\">Book: OB research methods — surveys, field studies, lab studies, case studies, meta-analysis. OB matters because \"people make the place\"; OB is not just common sense <span class=\"src\">B 1.2, 1.4<\/span>.<\/p>\n\n\n", "terms": [{"t": "Contingency approach", "z": "权变方法：看情况而定", "e": "OB has few absolutes; the right answer depends on the situation."}, {"t": "Effectiveness", "z": "效果：做对的事", "e": "Achieving goals; \"doing the right things\"."}, {"t": "Efficiency", "z": "效率：把事做对", "e": "The ratio of output to input; \"doing things right\"."}, {"t": "Group level", "z": "群体层面", "e": "OB level that studies working with others and diversity."}, {"t": "Individual level", "z": "个人层面", "e": "OB level that studies individual differences, job satisfaction and motivation."}, {"t": "Meta-analysis", "z": "元分析", "e": "Combining results from many studies to find an overall effect."}, {"t": "Organization", "z": "组织", "e": "A consciously coordinated social unit that works on a continuous basis toward common goals."}, {"t": "Organizational behaviour (OB)", "z": "组织行为学", "e": "Studies the impact of individuals, groups and structure on behaviour within organizations."}, {"t": "Organizational level", "z": "组织层面", "e": "OB level that studies productivity, work-life balance and globalization."}, {"t": "Systematic study", "z": "系统研究：超越常识", "e": "Using evidence, not only common sense, to explain behaviour."}]}, {"n": 2, "en": "Perception, Personality & Emotions", "zh": "知觉、人格与情绪", "notes": "<h2>Perception <span class=\"src\">B 3.4<\/span><\/h2>\n<p><b>Perception<\/b><span class=\"zh\">（知觉）<\/span> = interpretation of reality. Factors: situation · perceiver (attitudes, motives, interests, experience, expectations) · target (novelty, motion, size, background, proximity).<br>\n<b>Self-esteem<\/b><span class=\"zh\">（自尊）<\/span> · <b>self-efficacy<\/b><span class=\"zh\">（自我效能）<\/span> (specific task) · <b>locus of control<\/b><span class=\"zh\">（控制点）<\/span> (internal vs external).<\/p>\n<table><tr><th style=\"width:44%\">Attribution cue<\/th><th>High →<\/th><th>Low →<\/th><\/tr>\n<tr><td><b>Distinctiveness<\/b><span class=\"zh\">（区别性）<\/span>: same in <i>other<\/i> situations?<\/td><td>external<\/td><td>internal<\/td><\/tr>\n<tr><td><b>Consensus<\/b><span class=\"zh\">（共识性）<\/span>: others do the same?<\/td><td>external<\/td><td>internal<\/td><\/tr>\n<tr><td><b>Consistency<\/b><span class=\"zh\">（一致性）<\/span>: same over time?<\/td><td><b>internal<\/b><\/td><td>external<\/td><\/tr><\/table>\n<p class=\"bk\">Book example (Erin complains in finance): others complain too (high consensus), she doesn't complain elsewhere (high distinctiveness), rarely complains in finance (low consistency) → <b>external<\/b>. Reverse all → <b>internal<\/b>. Also: when a manager <b>likes<\/b> a subordinate, attributions are more favourable.<\/p>\n<p><b>Errors:<\/b> <b>self-serving bias<\/b><span class=\"zh\">（自利偏差）<\/span> (me: success internal, failure external) · <b>fundamental attribution error<\/b><span class=\"zh\">（基本归因错误）<\/span> (others: overestimate personality) · <b>selective perception<\/b><span class=\"zh\">（选择性知觉）<\/span> · <b>stereotyping<\/b><span class=\"zh\">（刻板印象）<\/span>/<b>prejudice<\/b><span class=\"zh\">（偏见）<\/span> · <b>self-fulfilling prophecy<\/b><span class=\"zh\">（自我实现预言）<\/span>.<\/p>\n<div class=\"bbox\"><b>Book additions<\/b><br>\n• <b>Self-enhancement bias<\/b><span class=\"zh\">（自我增强偏差）<\/span>: overestimate own ability (narcissists) · <b>self-effacement bias<\/b><span class=\"zh\">（自我贬低偏差）<\/span>: underestimate (low self-esteem).<br>\n• <b>False consensus error<\/b><span class=\"zh\">（虚假共识错误）<\/span>: overestimate how similar others are to us → may normalize unethical behaviour.<br>\n• Stereotypes <b>persist<\/b> via selective perception; contrary cases get sub-categorized (\"exception\") or discounted.<br>\n• Self-fulfilling prophecy example: \"young employees are slackers\" → given boring work → they goof off → confirms belief.<br>\n• <b>First impressions<\/b><span class=\"zh\">（第一印象）<\/span> are lasting and resist contrary information.<br>\n• Visual perception: we extrapolate and judge by contrast with surroundings.<\/div>\n<p class=\"zh\">书补充：自我高估/低估偏差、虚假共识、第一印象难改、刻板印象靠选择性知觉维持。<\/p>\n\n\n<h2>Personality & values <span class=\"src\">B 3.3<\/span><\/h2>\n<p><b>Personality<\/b><span class=\"zh\">（人格）<\/span> = enduring pattern of thoughts, feelings, behaviours. <b>MBTI<\/b><span class=\"zh\">（迈尔斯-布里格斯类型指标）<\/span> (E/I, S/N, T/F, J/P → 16 types). <b>Big Five (OCEAN)<\/b><span class=\"zh\">（大五人格）<\/span>.<\/p>\n<table><tr><th style=\"width:22%\">Trait<\/th><th>Textbook findings<\/th><\/tr>\n<tr><td><b>Openness<\/b><span class=\"zh\">（开放性）<\/span><\/td><td class=\"bk\">do well in training, adapt to change, creative when supported, more likely to start a business <span class=\"zh\">培训表现好、适应变化、有创造力、更可能创业<\/span><\/td><\/tr>\n<tr><td><b>Conscien&shy;tiousness<\/b><span class=\"zh\">（尽责性）<\/span><\/td><td class=\"bk\"><b>the one trait that predicts performance across all jobs<\/b>; most desired by recruiters; lower turnover & absenteeism; safer <span class=\"zh\">唯一能跨所有职业预测绩效的特质；招聘最看重；离职缺勤少<\/span><\/td><\/tr>\n<tr><td><b>Extraversion<\/b><span class=\"zh\">（外向性）<\/span><\/td><td class=\"bk\">effective in sales & management, inspirational leaders, happier at work — but <b>higher absenteeism<\/b> <span class=\"zh\">适合销售和管理、更快乐，但缺勤更多<\/span><\/td><\/tr>\n<tr><td><b>Agreeable&shy;ness<\/b><span class=\"zh\">（宜人性）<\/span><\/td><td class=\"bk\">help others, less retaliation, fair leaders — but <b>avoid change-oriented / constructive disagreement<\/b> <span class=\"zh\">乐于助人、不报复，但回避建设性异议<\/span><\/td><\/tr>\n<tr><td><b>Neuroticism<\/b><span class=\"zh\">（神经质）<\/span><\/td><td class=\"bk\">habitually unhappy, high intention to quit (but often stay), lower career success <span class=\"zh\">长期不快乐、常想辞职但未必真走、职业成就低<\/span><\/td><\/tr><\/table>\n<div class=\"bbox\"><b>Book additions<\/b><br>\n• Personality explains only ~<b>10–15%<\/b> of job performance; stronger predictor of <b>attitudes<\/b>; cognitive ability predicts performance better.<br>\n• Personality matters more when people have <b>freedom<\/b><span class=\"zh\">（工作自由度）<\/span> at work (weak situations).<br>\n• <b>MBTI<\/b> = types (not traits); designed for <b>team-building/development, not selection<\/b>.<br>\n• <b>Positive / negative affectivity<\/b><span class=\"zh\">（积极/消极情感特质）<\/span>: tendency toward good/bad moods; affects team helping & absenteeism.<br>\n• <b>Self-monitoring<\/b><span class=\"zh\">（自我监控）<\/span>: \"social chameleons\" — advance faster, but less accurate feedback, more stress, less commitment.<br>\n• <b>Proactive personality<\/b><span class=\"zh\">（主动型人格）<\/span>: fix problems, change status quo.<br>\n• <b>Values<\/b><span class=\"zh\">（价值观）<\/span> = stable life goals; Rokeach: <b>terminal<\/b><span class=\"zh\">（终极价值观）<\/span> (end states) vs <b>instrumental<\/b><span class=\"zh\">（工具性价值观）<\/span> (modes of conduct). Gen X: more individualistic, work less central than Boomers.<\/div>\n<p class=\"zh\">高频考点：尽责性是唯一能跨职业预测绩效的特质；外向的人缺勤更多；宜人性高的人回避建设性冲突；MBTI 不用于招聘。<\/p>\n\n\n<h2>Emotions <span class=\"src\">B 7.4–7.5<\/span><\/h2>\n<p><b>Emotions<\/b><span class=\"zh\">（情绪）<\/span> = intense, directed at something · <b>moods<\/b><span class=\"zh\">（心境）<\/span> = less intense, no contextual stimulus. 7 basic emotions.<br>\n<b>Emotional labour<\/b><span class=\"zh\">（情绪劳动）<\/span>: <b>surface acting<\/b><span class=\"zh\">（表层扮演）<\/span> (hide/fake) vs <b>deep acting<\/b><span class=\"zh\">（深层扮演）<\/span> (modify feelings). <b>Emotional dissonance<\/b><span class=\"zh\">（情绪失调）<\/span> = felt vs displayed. Higher labour: frequent/long, varied, intense displays.<br>\n<b>EI<\/b><span class=\"zh\">（情绪智力）<\/span>: self-awareness → self-management → social awareness → relationship management. <b>Deviance<\/b><span class=\"zh\">（员工越轨行为）<\/span>: production, property, political, personal aggression.<\/p>\n<div class=\"bbox\"><b>Book additions<\/b><br>\n• Emotion = <b>short, intense feeling resulting from an event<\/b>.<br>\n• <b>Emotional contagion<\/b><span class=\"zh\">（情绪传染）<\/span>: emotions spread; <b>negative emotions linger longer<\/b>; \"when the boss is happy, staff are happy\".<br>\n• <b>Affective Events Theory (AET)<\/b><span class=\"zh\">（情感事件理论）<\/span>: specific work events → emotions → affect-driven behaviours; small events accumulate into job satisfaction.<br>\n• <b>Burnout<\/b><span class=\"zh\">（职业倦怠）<\/span> = ongoing negative emotional state from dissatisfaction (passive); frustration = more active.<br>\n• 3 levels: surface acting → deep acting → <b>genuine acting<\/b><span class=\"zh\">（真实表演）<\/span> (display matches true feelings, least labour).<br>\n• <b>Surface acting → more stress<\/b>; deep acting → less. <b>Breaks<\/b><span class=\"zh\">（休息）<\/span> and <b>autonomy<\/b><span class=\"zh\">（自主性）<\/span> reduce strain.<br>\n• <b>Cognitive dissonance<\/b><span class=\"zh\">（认知失调）<\/span>: mismatch of beliefs & behaviour; reduce by changing behaviour, belief, or adding a new fact.<br>\n• Empathy = key EI component for teams; high EI → see challenges, not threats.<\/div>\n<p class=\"zh\">书补充：情绪传染（负面更持久）、情感事件理论、真实表演、表层扮演压力更大、休息和自主可减压。<\/p>\n\n\n", "terms": [{"t": "Big Five (OCEAN)", "z": "大五人格", "e": "Openness, conscientiousness, extraversion, agreeableness, neuroticism."}, {"t": "Conscientiousness", "z": "尽责性", "e": "Organized and dependable; the one trait that predicts performance across all jobs."}, {"t": "Consensus", "z": "共识性", "e": "Do others act the same way? High → external cause."}, {"t": "Consistency", "z": "一致性", "e": "Does the person act the same over time? High → internal cause."}, {"t": "Deep acting", "z": "深层扮演", "e": "Changing your real feelings to match the required display."}, {"t": "Distinctiveness", "z": "区别性", "e": "Does the person act the same in other situations? High → external cause."}, {"t": "Emotional contagion", "z": "情绪传染", "e": "Emotions spread to others; negative emotions last longer."}, {"t": "Emotional dissonance", "z": "情绪失调", "e": "Conflict between felt and displayed emotions."}, {"t": "Emotional intelligence (EI)", "z": "情绪智力", "e": "Self-awareness → self-management → social awareness → relationship management."}, {"t": "Emotional labour", "z": "情绪劳动", "e": "Showing the emotions the job requires."}, {"t": "Emotions", "z": "情绪", "e": "Intense feelings directed at something."}, {"t": "False consensus error", "z": "虚假共识错误", "e": "Overestimating how similar others are to us."}, {"t": "Fundamental attribution error", "z": "基本归因错误", "e": "Overestimating personality and underestimating the situation when judging others."}, {"t": "Locus of control", "z": "控制点（内控/外控）", "e": "Belief about who controls events: yourself (internal) or outside forces (external)."}, {"t": "MBTI", "z": "迈尔斯-布里格斯类型指标", "e": "Personality types (E/I, S/N, T/F, J/P → 16 types); for development, not selection."}, {"t": "Moods", "z": "心境", "e": "Less intense feelings with no clear cause."}, {"t": "Perception", "z": "知觉：对现实的解释", "e": "How people interpret reality; shaped by the situation, the perceiver and the target."}, {"t": "Personality", "z": "人格", "e": "An enduring pattern of thoughts, feelings and behaviours."}, {"t": "Prejudice", "z": "偏见", "e": "An unfounded dislike of a person based on their group."}, {"t": "Selective perception", "z": "选择性知觉", "e": "Noticing what fits our needs and ignoring the rest."}, {"t": "Self-efficacy", "z": "自我效能", "e": "Belief that one can do a specific task."}, {"t": "Self-esteem", "z": "自尊", "e": "How much a person likes and values themselves."}, {"t": "Self-fulfilling prophecy", "z": "自我实现预言", "e": "People behave the way others expect them to."}, {"t": "Self-monitoring", "z": "自我监控", "e": "Adapting behaviour to the social situation (\"social chameleons\")."}, {"t": "Self-serving bias", "z": "自利偏差", "e": "Taking credit for success (internal) and blaming failure on outside factors (external)."}, {"t": "Stereotyping", "z": "刻板印象", "e": "Judging someone based on the group they belong to."}, {"t": "Surface acting", "z": "表层扮演", "e": "Hiding or faking emotions; causes more stress."}]}, {"n": 3, "en": "Values, Attitudes & Diversity", "zh": "价值观、态度与多元化", "notes": "<h2>Values & culture <span class=\"src\">B 2.3<\/span><\/h2>\n<p><b>Values<\/b><span class=\"zh\">（价值观）<\/span> = beliefs guiding decisions; content + intensity; sources: generation, culture, profession. Cultural iceberg 10% visible / 90% hidden.<br>\n<b>Hofstede (6)<\/b><span class=\"zh\">（霍夫斯泰德六维度）<\/span>: PDI · IDV · MAS · UAI · LTO · IND. <b>Canada<\/b><span class=\"zh\">（加拿大）<\/span>: 39 · 80 · 52 · 48 · 36 · 68. <b>GLOBE (9)<\/b><span class=\"zh\">（GLOBE 九维度）<\/span>: see fill-in bank.<\/p>\n<div class=\"bbox\"><b>Book additions (Hofstede, 4 original dimensions, IBM study, 66 countries)<\/b><br>\n• <b>Collectivists<\/b><span class=\"zh\">（集体主义者）<\/span>: identity from group; broad family ties; sharper in-group/out-group line; generous to in-group in ratings; <b>avoid saying \"no\" directly<\/b> (\"this would be difficult\"); prefer <b>team-based rewards<\/b><span class=\"zh\">（团队奖励）<\/span>.<br>\n• <b>High power distance<\/b><span class=\"zh\">（高权力距离）<\/span>: respect for hierarchy; employees expect direction, less participation.<br>\n• <b>High uncertainty avoidance<\/b><span class=\"zh\">（高不确定性规避）<\/span>: prefer predictability, rules.<br>\n• <b>Masculinity<\/b><span class=\"zh\">（男性化）<\/span>: achievement, money · <b>femininity<\/b><span class=\"zh\">（女性化）<\/span>: relationships, quality of life.<br>\n• Managing cultural diversity: build <b>cultural intelligence<\/b><span class=\"zh\">（文化智商）<\/span> · avoid <b>ethnocentrism<\/b><span class=\"zh\">（民族中心主义）<\/span> · listen to locals · culture changes · culture isn't always the problem.<\/div>\n<p class=\"zh\">跨文化题：高权力距离、集体主义文化的员工开会不发言、不直接说\"不\"，偏好团队奖励。<\/p>\n\n<h2>Attitudes <span class=\"src\">B 4.2–4.3<\/span><\/h2>\n<p><b>Attitudes<\/b><span class=\"zh\">（态度）<\/span> = positive/negative feelings; less stable, more specific than values. Job satisfaction → productivity, OCB, customer satisfaction, life satisfaction. <b>Commitment<\/b><span class=\"zh\">（组织承诺）<\/span>: affective (want) · normative (ought) · continuance (need).<\/p>\n<div class=\"bbox\"><b>Book additions<\/b><br>\n• <b>Job satisfaction<\/b><span class=\"zh\">（工作满意度）<\/span> = feelings toward the job; <b>organizational commitment<\/b><span class=\"zh\">（组织承诺）<\/span> = emotional attachment to the company.<br>\n• Attitudes predict <b>intentions<\/b> better than actual behaviour (situational constraints).<br>\n• <b>Causes<\/b>: personality (positive affectivity) · person–job/org <b>fit<\/b><span class=\"zh\">（匹配度）<\/span> · job characteristics · <b>psychological contract<\/b><span class=\"zh\">（心理契约）<\/span> (breach → dissatisfaction; prevent with realistic job previews) · organizational <b>justice<\/b><span class=\"zh\">（公正）<\/span> · relationships with coworkers/manager · stress (role ambiguity, role conflict) · work–life balance.<br>\n• <b>Consequences<\/b>: satisfaction–performance correlation only ≈ <b>.30<\/b> (stronger in professional jobs); stronger links with <b>OCB<\/b><span class=\"zh\">（组织公民行为）<\/span>, lower absenteeism, turnover, aggression; life satisfaction.<br>\n• Track attitudes: confidential <b>attitude surveys<\/b><span class=\"zh\">（态度调查）<\/span>, <b>exit interviews<\/b><span class=\"zh\">（离职面谈）<\/span> (not by the manager).<\/div>\n<p class=\"zh\">考点：满意度与绩效相关只有中等（约 0.3），与组织公民行为、缺勤、离职关系更强；态度更能预测\"意向\"而非实际行为。<\/p>\n\n<h2>EDI <span class=\"src\">B 2.2<\/span><\/h2>\n<p>Inequality → equality → <b>equity<\/b> (custom tools) → <b>justice<\/b><span class=\"zh\">（公正）<\/span> (remove barrier). Diversity: surface vs deep; demographic, cultural, functional. <b>Inclusion<\/b><span class=\"zh\">（包容）<\/span> = valued, respected, supported. Employment Equity Act: women, Aboriginal peoples, persons w/ disabilities, visible minorities.<br>\n<b>Effective<\/b><span class=\"zh\">（有效措施）<\/span>: specialized outreach, transparency, mentoring. <b>Ineffective<\/b><span class=\"zh\">（无效措施）<\/span>: diversity/unconscious-bias training.<\/p>\n<div class=\"bbox\"><b>Book additions<\/b><br>\n• Benefits: creativity in decisions, serve customers, satisfaction, performance, lower litigation.<br>\n• Challenges: <b>similarity-attraction<\/b><span class=\"zh\">（相似吸引）<\/span> (less communication, more emotional conflict with dissimilar others) · <b>faultlines<\/b><span class=\"zh\">（群体断层）<\/span> (group splits into subgroups along combined attributes → less effective decisions) · stereotypes · <b>glass ceiling<\/b><span class=\"zh\">（玻璃天花板）<\/span>.<br>\n• Managing: culture of respect (everyone's job) · hold managers accountable · review recruitment (partner with minority professional groups) · affirmative action (controversial).<br>\n• Book on training: works better with top-management belief & rewards for diversity. <span class=\"trap\">For the quiz, follow the slide: training is listed as <b>ineffective<\/b>.<\/span><\/div><p class=\"zh\">书中：多元化好处——决策更有创意、更懂客户、满意度和绩效更高。挑战——相似吸引（与不同的人沟通少、情绪冲突多）、群体断层（按多个属性分裂成小团体）、刻板印象、玻璃天花板。管理——营造尊重文化（人人有责）、让经理问责、改进招聘渠道、平权行动（有争议）。<\/p>\n<p class=\"zh\">书与课件观点不同时，以课件为准（培训无效）。faultline = 多属性叠加形成的断层，会导致小团体。<\/p>\n\n\n", "terms": [{"t": "Affective commitment", "z": "情感承诺：想留", "e": "Staying because you want to."}, {"t": "Attitudes", "z": "态度", "e": "Positive or negative feelings; less stable and more specific than values."}, {"t": "Collectivism", "z": "集体主义", "e": "Identity comes from the group; prefer team rewards; avoid saying \"no\" directly."}, {"t": "Continuance commitment", "z": "持续承诺：需要留", "e": "Staying because you need to (cost of leaving)."}, {"t": "Deep-level diversity", "z": "深层多元", "e": "Differences in values, personality and attitudes."}, {"t": "Employment Equity Act", "z": "就业公平法（4 类群体）", "e": "Protects women, Aboriginal peoples, persons with disabilities and visible minorities."}, {"t": "Equity (EDI)", "z": "公平：按需提供工具", "e": "Giving people the custom tools they need to succeed."}, {"t": "Ethnocentrism", "z": "民族中心主义", "e": "Believing your own culture is superior."}, {"t": "Faultline", "z": "群体断层", "e": "Combined attributes that split a group into subgroups."}, {"t": "Glass ceiling", "z": "玻璃天花板", "e": "An invisible barrier that stops some groups from reaching top jobs."}, {"t": "GLOBE", "z": "GLOBE 九个文化维度", "e": "Nine culture dimensions, e.g., assertiveness, humane orientation, performance orientation."}, {"t": "Hofstede's dimensions", "z": "霍夫斯泰德文化维度", "e": "PDI, IDV, MAS, UAI, LTO, IND. Canada: 39 · 80 · 52 · 48 · 36 · 68."}, {"t": "Inclusion", "z": "包容", "e": "People feel valued, respected and supported."}, {"t": "Instrumental values", "z": "工具性价值观", "e": "Preferred ways of behaving to reach goals."}, {"t": "Job satisfaction", "z": "工作满意度", "e": "Feelings toward the job; linked to OCB, lower absenteeism and turnover."}, {"t": "Normative commitment", "z": "规范承诺：应该留", "e": "Staying because you feel you ought to."}, {"t": "Organizational citizenship behaviour (OCB)", "z": "组织公民行为", "e": "Helpful acts beyond the job description."}, {"t": "Power distance", "z": "权力距离", "e": "How much people accept unequal power."}, {"t": "Psychological contract", "z": "心理契约", "e": "Unwritten expectations of what the employer and employee owe each other."}, {"t": "Similarity-attraction", "z": "相似吸引", "e": "People are drawn to others who are similar to them."}, {"t": "Surface-level diversity", "z": "表层多元", "e": "Visible differences such as age, gender and ethnicity."}, {"t": "Terminal values", "z": "终极价值观", "e": "Desired end states (goals in life)."}, {"t": "Uncertainty avoidance", "z": "不确定性规避", "e": "Relying on rules and norms to reduce unpredictability."}, {"t": "Values", "z": "价值观", "e": "Basic beliefs that guide decisions; have content and intensity."}]}, {"n": 4, "en": "Teamwork & Communication", "zh": "团队与沟通", "notes": "<h2>Groups & teams <span class=\"src\">B 9.2–9.5<\/span><\/h2>\n<p><b>Group<\/b><span class=\"zh\">（群体）<\/span> = common relationship, act as individuals · <b>team<\/b> = mutual goals, shared accountability. Teams better when tasks need multiple skills & are interdependent.<br>\n<b>Tuckman<\/b><span class=\"zh\">（塔克曼团队发展五阶段）<\/span>: forming → storming → norming (team charter) → performing → adjourning. <b>Effectiveness<\/b><span class=\"zh\">（效果）<\/span>: composition, size (5–10 effective; 3–4 efficient), diversity. <b>Social loafing<\/b><span class=\"zh\">（社会惰化（搭便车））<\/span>. <b>Ineffective<\/b><span class=\"zh\">（无效措施）<\/span>: not sharing concerns, overdependence on leader, hidden/unresolved conflict, subgroups.<\/p>\n<div class=\"bbox\"><b>Book: stages & cohesion<\/b><br>\n• Leader moves from <b>directive<\/b><span class=\"zh\">（指导型）<\/span> (forming) → <b>coach<\/b> → <b>facilitator<\/b> (norming) → <b>delegator<\/b>. Skipped storming tends to return later.<br>\n• <b>Punctuated equilibrium<\/b><span class=\"zh\">（间断平衡模型）<\/span>: long stable periods broken by bursts of change (crisis); groups can cycle back to storming.<br>\n• <b>Cohesion<\/b><span class=\"zh\">（凝聚力）<\/span> = social glue. Drivers (5 S): <b>similarity, stability, size (small), support, satisfaction<\/b>.<br>\n• <b>Too much cohesion<\/b><span class=\"zh\">（凝聚力过高）<\/span> → pressure to conform, self-censorship, conflict avoidance → <b>groupthink<\/b> (most common in highly cohesive groups).<br>\n• Cohesion × task commitment: high cohesion + high task commitment = high performance; high cohesion + low task commitment = <b>low<\/b> performance.<br>\n• <b>Collective efficacy<\/b><span class=\"zh\">（集体效能）<\/span> = group's belief it can perform; stronger link to performance when interdependence is high.<\/div>\n<div class=\"bbox\"><b>Book: social loafing (Ringelmann effect)<\/b> — grows with group size (esp. 10+); not laziness but \"my effort won't be noticed/rewarded\". <b>Prevent<\/b>: right size · define each member's task publicly · evaluate each person's contribution (peer feedback) · build cohesion · engaging tasks · make everyone feel needed · fairness reduces loafing.<\/div>\n<div class=\"bbox\"><b>Book: team design<\/b><br>\n• Task types: production · idea-generation · problem-solving.<br>\n• <b>Task interdependence<\/b><span class=\"zh\">（任务相互依赖）<\/span>: <b>pooled<\/b><span class=\"zh\">（集合式依赖）<\/span> (work alone, combine) · <b>sequential<\/b><span class=\"zh\">（顺序式依赖）<\/span> (one's output = next input) · <b>reciprocal<\/b><span class=\"zh\">（交互式依赖）<\/span> (work together on every phase); also outcome interdependence.<br>\n• <b>10 roles<\/b> — task: contractor, creator, contributor, completer, <b>critic<\/b><span class=\"zh\">（批评者）<\/span> (devil's advocate) · social: cooperator, communicator, calibrator · boundary-spanning: consul, coordinator.<br>\n• Types: task force, cross-functional, <b>virtual<\/b><span class=\"zh\">（虚拟团队）<\/span> (trust & deliverables), top management, manager-led → <b>self-managed<\/b><span class=\"zh\">（自我管理团队）<\/span> → self-directed.<br>\n• Size: most teams ≤ 10; &gt;20 less cooperation; match size to goal. Diversity of expertise helps <b>avoid groupthink<\/b>.<br>\n• <b>Team contract<\/b><span class=\"zh\">（团队契约）<\/span>: values & goals, roles & leadership, decision making, communication, performance standards.<br>\n• <b>Barriers<\/b>: not knowing where to begin (floundering) · dominating members · poor performers (lack ability → train; lack motivation → motivate/reject) · poorly managed conflict (behavioural contract).<\/div><p class=\"zh\">任务类型：生产、创意、问题解决。任务依赖：集合式（各做各的再合并）、顺序式（上一人的产出是下一人的输入）、交互式（每阶段一起做）。10 种角色：任务类（组织者、创新者、贡献者、完成者、批评者）、社交类（合作者、沟通者、校准者）、跨边界类（对外联络、内部协调）。团队一般 ≤10 人，超过 20 人合作变差。多元专长有助避免群体思维。团队障碍：不知从何开始、有人霸占发言、成员表现差（能力问题 → 培训；动机问题 → 激励或排斥）、冲突处理不当。<\/p>\n<p class=\"zh\">书补充高频：凝聚力 5 因素、凝聚力过高 → 群体思维、社会惰化的对策、三种任务依赖、10 种团队角色、自我管理团队。<\/p>\n\n\n<h2>Communication <span class=\"src\">B 8.2–8.4<\/span><\/h2>\n<p>Process: sender → encoding → message → channel → decoding → receiver → feedback. Directions: downward, upward, horizontal, diagonal. <b>Media richness<\/b><span class=\"zh\">（媒介丰富度）<\/span> (rich for complex/ambiguous/sensitive). Body 55% / paralanguage 38% / words 7%. <b>Casse styles<\/b><span class=\"zh\">（Casse 沟通风格）<\/span>: Action (WHAT), Process (HOW), People (WHO), Idea (WHY).<br>\n<b>Barriers<\/b>: filtering (sender) · selective perception (receiver) · information overload · verbal/nonverbal differences · silence.<\/p>\n<div class=\"bbox\"><b>Book additions<\/b><br>\n• 3 functions of communication: <b>coordination, transmitting information, sharing emotions<\/b>.<br>\n• <b>Noise<\/b><span class=\"zh\">（噪音（干扰））<\/span> = anything distorting the message (environment, receiver, or sender).<br>\n• <b>Filtering<\/b><span class=\"zh\">（过滤（发送方））<\/span> happens most in <b>upward<\/b><span class=\"zh\">（向上沟通）<\/span> communication (bad news hidden) → reward those who report bad news; use multiple sources.<br>\n• More barriers: <b>emotional disconnects<\/b><span class=\"zh\">（情绪隔阂）<\/span> · lack of <b>source credibility<\/b><span class=\"zh\">（信息源可信度）<\/span>/familiarity · <b>grapevine<\/b><span class=\"zh\">（小道消息网络）<\/span> (~70% of org communication; counter with fast, accurate official messages) · <b>semantics & jargon<\/b><span class=\"zh\">（语义与行话）<\/span> · gender differences · biased language · <b>poor listening<\/b><span class=\"zh\">（倾听不良）<\/span>.<br>\n• <b>Active listening<\/b><span class=\"zh\">（积极倾听）<\/span> (Rogers): listen for content, listen for feelings, respond to feelings, note all cues, paraphrase & restate.<br>\n• <b>Communication freezers<\/b><span class=\"zh\">（沟通冻结语（让人防御的话））<\/span>: ordering, threatening, judging, insincere praise, psychoanalyzing, minimizing problems.<br>\n• <b>Written<\/b><span class=\"zh\">（书面沟通）<\/span> for facts, permanent record, complex ideas, no urgency · <b>verbal<\/b><span class=\"zh\">（口头沟通）<\/span> for emotions, urgency, immediate feedback.<br>\n• Richness: high = face-to-face, video, phone · medium = e-mail, memos · low = formal documents, spreadsheets. <b>Never deliver emotional/bad news by e-mail.<\/b><br>\n• Sender's status affects attention: messages down get attention; messages up get filtered.<\/div>\n<p class=\"zh\">考点：坏消息（裁员、没奖金）要用丰富媒介当面说；向上沟通最容易被过滤；积极倾听 5 原则。<\/p>\n\n\n", "terms": [{"t": "Active listening", "z": "积极倾听", "e": "Full attention, understand, ask questions, don't interrupt."}, {"t": "Casse styles", "z": "Casse 沟通风格", "e": "Action (WHAT), Process (HOW), People (WHO), Idea (WHY)."}, {"t": "Cohesion", "z": "凝聚力", "e": "The \"social glue\" that holds a group together."}, {"t": "Collective efficacy", "z": "集体效能", "e": "A group's belief that it can succeed."}, {"t": "Communication process", "z": "沟通过程", "e": "Sender → encoding → message → channel → decoding → receiver → feedback."}, {"t": "Filtering", "z": "过滤（发送方）", "e": "The sender distorts or withholds information; most common in upward communication."}, {"t": "Grapevine", "z": "小道消息", "e": "The informal gossip network."}, {"t": "Group", "z": "群体", "e": "People with a common relationship who act as individuals."}, {"t": "Groupthink", "z": "群体思维", "e": "Members avoid critical evaluation to keep agreement; common in highly cohesive groups."}, {"t": "Information overload", "z": "信息过载", "e": "Receiving more information than one can process."}, {"t": "Jargon", "z": "行话", "e": "Specialized terms used by a group or profession."}, {"t": "Kinesics", "z": "身体动作", "e": "Communication through body movement."}, {"t": "Media richness", "z": "媒介丰富度", "e": "Rich media (face-to-face) for complex, ambiguous or sensitive messages."}, {"t": "Noise", "z": "噪音", "e": "Anything that distorts the message."}, {"t": "Paralanguage", "z": "副语言", "e": "How something is said: tone, pitch, speed."}, {"t": "Pooled interdependence", "z": "集合依赖", "e": "Members' outputs are combined at the end."}, {"t": "Proxemics", "z": "空间距离", "e": "Communication through physical distance."}, {"t": "Punctuated equilibrium", "z": "间断平衡模型", "e": "Long stable periods broken by bursts of change."}, {"t": "Reciprocal interdependence", "z": "交互依赖", "e": "Members work jointly in every phase."}, {"t": "Sequential interdependence", "z": "顺序依赖", "e": "One member's output is the next member's input."}, {"t": "Social loafing", "z": "社会惰化（搭便车）", "e": "Putting in less effort when working in a group."}, {"t": "Team", "z": "团队", "e": "People with mutual goals and shared accountability."}, {"t": "Team charter", "z": "团队章程（norming 阶段）", "e": "A written agreement on team goals, roles and rules."}, {"t": "Tuckman's stages", "z": "塔克曼五阶段", "e": "Forming → storming → norming → performing → adjourning."}]}, {"n": 5, "en": "Motivation & Job Design", "zh": "激励与工作设计", "notes": "<h2>Need theories <span class=\"src\">B 5.2<\/span><\/h2>\n<p><b>Motivation<\/b><span class=\"zh\">（动机）<\/span> = intensity, direction, persistence. Extrinsic vs intrinsic.<br>\n<b>Maslow<\/b><span class=\"zh\">（马斯洛需求层次）<\/span> · <b>ERG<\/b><span class=\"zh\">（ERG 理论）<\/span> · <b>Herzberg<\/b><span class=\"zh\">（赫茨伯格双因素）<\/span> (hygiene → only dissatisfaction; motivators → satisfaction) · <b>McClelland<\/b><span class=\"zh\">（麦克利兰习得需要）<\/span> (nAch, nPow socialized/personalized, nAff).<\/p>\n<div class=\"bbox\"><b>Book additions<\/b><br>\n• <b>Maslow<\/b>: weak research support (order not fixed; satisfied needs may still motivate). Useful to see different needs: praise in public pleases esteem-seekers but may embarrass social-need employees. Levers: pay/benefits/security (safety), friendly climate (social), promotions/titles/recognition (esteem), growth & challenging work (self-actualization).<br>\n• <b>ERG<\/b>: no strict order, multiple needs at once, <b>frustration–regression<\/b><span class=\"zh\">（挫折-退化）<\/span>.<br>\n• <b>Herzberg<\/b>: motivators also include <b>interesting work<\/b>. Criticisms: people credit themselves for satisfaction, blame situation for dissatisfaction; <b>pay can be symbolic recognition<\/b>. Lesson: fixing context only goes so far → <b>enrich jobs<\/b>.<br>\n• <b>McClelland<\/b> (most research support; measured by TAT stories):<br>\n – <b>nAch<\/b><span class=\"zh\">（成就需要）<\/span>: stretch goals, immediate feedback, suits sales/entrepreneurs/scientists; <b>often poor managers<\/b> (micromanage, don't delegate).<br>\n – <b>nAff<\/b><span class=\"zh\">（亲和需要）<\/span>: want to be liked; good for social work/teaching; as managers avoid critical feedback → mediocrity.<br>\n – <b>nPow<\/b><span class=\"zh\">（权力需要）<\/span>: altruistic (socialized) form is key for managerial effectiveness; self-serving form is destructive.<\/div>\n<p class=\"zh\">考点：成就需要高的人常被提拔但不一定是好经理（不愿授权）；亲和需要高的经理不愿给批评；社会化权力需要是好领导的特征。<\/p>\n\n<h2>Process theories <span class=\"src\">B 5.3<\/span><\/h2>\n<p><b>Equity<\/b><span class=\"zh\">（公平理论）<\/span>: compare O/I ratio with referent (self-inside/outside, other-inside/outside). Responses: change input · change outcome · adjust perceptions of self/others · change referent · leave the field.<\/p>\n<div class=\"bbox\"><b>Book additions — Equity<\/b><br>\n• Inputs: effort, loyalty, tenure, education, skills · outcomes: pay (core), recognition, treatment.<br>\n• Perceptions are <b>subjective<\/b>; referent must be comparable.<br>\n• Extra responses: <b>increase referent's inputs<\/b> · reduce own input (or quality) · increase outcomes (raise — or theft) · <b>seek legal action<\/b>.<br>\n• <span class=\"trap\">Over-reward: theory predicted guilt, but research does NOT support it<\/span> — people rationalize.<br>\n• <b>Equity sensitivity<\/b><span class=\"zh\">（公平敏感性）<\/span>: equity-sensitives · <b>benevolents<\/b><span class=\"zh\">（仁慈型（付出不求回报））<\/span> (give without expecting much) · <b>entitleds<\/b><span class=\"zh\">（索取型（少付出多要求））<\/span> (expect a lot for little).<br>\n• <b>Organizational justice<\/b><span class=\"zh\">（组织公正）<\/span>: <b>distributive<\/b><span class=\"zh\">（分配公正）<\/span> (fair outcomes = equity theory) · <b>procedural<\/b><span class=\"zh\">（程序公正）<\/span> (fair process: advance notice, voice, explanations, consistency) · <b>interactional<\/b><span class=\"zh\">（互动公正）<\/span> (respect & dignity). Procedural justice matters most when the outcome is bad.<\/div>\n<p><b>Expectancy<\/b><span class=\"zh\">（期望）<\/span>: M = E × I × V.<\/p>\n<table><tr><th>Low…<\/th><th>Manager's fix (book Fig 5.10)<\/th><\/tr>\n<tr><td><b>Expectancy<\/b><\/td><td class=\"bk\">training/hiring for skills · remove obstacles, clarify roles, provide resources · encouragement (esp. external locus, low self-esteem) <span class=\"zh\">培训、扫除障碍、明确角色、给鼓励<\/span><\/td><\/tr>\n<tr><td><b>Instrumentality<\/b><span class=\"zh\">（工具性）<\/span><\/td><td class=\"bk\">tie pay/awards to performance · publicize rewards · remove non-performance influence (rotating \"employee of the month\" erodes it) <span class=\"zh\">奖励挂钩绩效、公开奖励规则；轮流评\"月度员工\"会破坏工具性<\/span><\/td><\/tr>\n<tr><td><b>Valence<\/b><span class=\"zh\">（效价）<\/span><\/td><td class=\"bk\">find rewards employees value (ask/survey) · fair rewards · offer choice <span class=\"zh\">了解员工想要什么、奖励公平、给选择<\/span><\/td><\/tr><\/table>\n<p><b>Reinforcement<\/b><span class=\"zh\">（强化理论）<\/span>: positive (add pleasant) · negative (remove unpleasant) · punishment (add unpleasant) · extinction (remove reinforcer).<\/p>\n<div class=\"bbox\"><b>Book additions — Reinforcement<\/b><br>\n• Book examples: +R = praise · −R = <b>manager stops nagging<\/b> once report is done · punishment = warning/demotion · extinction = <b>ignore<\/b> the behaviour (stop laughing at joke e-mails).<br>\n• <b>\"Folly of rewarding A while hoping for B\"<\/b> (Kerr): saying quality matters but rewarding speed.<br>\n• Schedules: <b>continuous<\/b><span class=\"zh\">（连续强化）<\/span> (every time; change temporary) · <b>fixed ratio<\/b><span class=\"zh\">（固定比率）<\/span> (every nth) · <b>variable ratio<\/b><span class=\"zh\">（可变比率）<\/span> (random; <b>most durable<\/b>).<br>\n• Discipline tips: punishment fits the crime, consistent, documented, timely; carrots often beat sticks.<br>\n• <b>OB Mod<\/b><span class=\"zh\">（组织行为矫正）<\/span>: identify behaviour → baseline → antecedents & consequences → intervene → measure & maintain.<\/div><p class=\"zh\">书中例子：正强化 = 表扬；负强化 = 报告交了经理就不再唠叨；惩罚 = 警告/降职；消退 = 无视（不再对恶搞邮件发笑）。\"奖励 A 却期待 B\"：口头强调质量却奖励速度。强化频率：连续（每次都给，效果短暂）、固定比率（每 N 次）、可变比率（随机，效果最持久）。<\/p>\n\n<h2>Job design & goals <span class=\"src\">B 6.2–6.3<\/span><\/h2>\n<p>Rotation · enlargement (horizontal) · enrichment (vertical) · <b>JCM<\/b><span class=\"zh\">（工作特征模型）<\/span>: SV, TI, TS → meaningfulness; A → responsibility; F → knowledge of results. <b>MPS<\/b><span class=\"zh\">（激励潜力分数）<\/span> = [(SV+TI+TS)/3] × A × F. Flexible work: compressed week, flextime, job sharing, telecommuting. Work-life conflict: time-, strain-, behaviour-based. SMARTER goals.<\/p>\n<div class=\"bbox\"><b>Book additions — Job design<\/b><br>\n• Job design is a <b>bigger motivator than pay<\/b>.<br>\n• <b>Scientific management<\/b><span class=\"zh\">（科学管理）<\/span> (Taylor): time-motion, <b>job specialization<\/b><span class=\"zh\">（工作专业化）<\/span> — efficient, cheap training, but boring → absenteeism; poor in changing environments.<br>\n• <b>Rotation<\/b><span class=\"zh\">（轮岗）<\/span>: cross-training, flexibility, knowledge transfer, less boredom & physical strain; used at all levels.<br>\n• <b>Enlargement<\/b><span class=\"zh\">（工作扩大化）<\/span>: adding <b>simple<\/b> tasks → lower satisfaction; adding <b>knowledge-based<\/b> tasks → positive.<br>\n• <b>Enrichment<\/b><span class=\"zh\">（工作丰富化）<\/span>: ↑ control & responsibility → lower turnover & absence; <b>not for everyone<\/b>; may raise pay expectations.<br>\n• <b>Meaningfulness<\/b><span class=\"zh\">（意义感）<\/span> = most important psychological state. Job characteristics are <b>perceived<\/b> (reframe significance: bricklayer \"building homes\").<br>\n• <b>Growth-need strength<\/b><span class=\"zh\">（成长需求强度）<\/span>: high GNS respond best; new employees may dislike high autonomy.<br>\n• Feedback is not always positive — ~1/3 of cases it hurt performance (depends on sign, readiness, delivery).<br>\n• <b>Empowerment<\/b><span class=\"zh\">（授权赋能）<\/span> = removing conditions that make people powerless; structural (discretion, information access) → felt empowerment; needs a climate of empowerment; not for low GNS / low nAch.<\/div><p class=\"zh\">书中观点：工作设计比薪酬更能激励人。科学管理（泰勒）强调专业化，效率高但枯燥。轮岗能交叉培训、减少枯燥和身体劳损。扩大化：加简单任务会降低满意度，加知识型任务才有正面效果。丰富化不适合所有人，还可能抬高薪资期望。意义感是最关键的心理状态；工作特征是\"主观感知\"的。成长需求强的人对高激励工作反应最好。授权赋能 = 消除让人无力的条件。<\/p>\n<div class=\"bbox\"><b>Book additions — Goal setting<\/b> (most important OB theory; +10–25% performance)<br>\n• Book SMART = specific, measurable, <b>aggressive<\/b><span class=\"zh\">（有挑战性的）<\/span>, realistic, time-bound. \"Do your best\" is not a goal.<br>\n• Why goals work: direction · energize/persistence · challenge · force new methods.<br>\n• More effective with: <b>feedback<\/b><span class=\"zh\">（反馈）<\/span> · <b>ability<\/b><span class=\"zh\">（能力）<\/span> (if lacking, set <b>learning goals<\/b><span class=\"zh\">（学习目标）<\/span>) · <b>goal commitment<\/b><span class=\"zh\">（目标承诺）<\/span> (public goals, participation, trust, rewards).<br>\n• Downsides: hurts if lacking skills · less adaptability · neglect of unmeasured areas (quality) · <b>unethical behaviour<\/b>.<br>\n• <b>MBO<\/b><span class=\"zh\">（目标管理）<\/span> (Drucker): company → team → individual goals → action plan → review.<\/div><p class=\"zh\">目标设定是最重要的 OB 理论之一，可提升绩效 10–25%。书中 SMART：具体、可衡量、有挑战性、现实、有期限。\"尽力而为\"不算目标。有效条件：反馈、能力（能力不足时设学习目标）、目标承诺（公开、参与、信任、奖励）。缺点：能力不足时反而有害、降低适应性、忽视未衡量的方面、诱发不道德行为。目标管理：公司 → 团队 → 个人目标层层分解。<\/p>\n<p class=\"zh\">高频：员工能力不够时，设\"学习目标\"而不是\"结果目标\"；只奖励达标会诱发作弊。<\/p>\n\n\n\n", "terms": [{"t": "Distributive justice", "z": "分配公正", "e": "Fair outcomes."}, {"t": "Empowerment", "z": "授权赋能", "e": "Removing conditions that make people feel powerless."}, {"t": "Equity theory", "z": "公平理论", "e": "Compare your outcome/input ratio with a referent's."}, {"t": "ERG theory", "z": "ERG 理论", "e": "Existence, relatedness, growth; no strict order; frustration-regression."}, {"t": "Expectancy", "z": "期望：努力 → 绩效", "e": "Belief that effort leads to performance."}, {"t": "Expectancy theory", "z": "期望理论：M = E × I × V", "e": "Motivation = expectancy × instrumentality × valence."}, {"t": "Extinction", "z": "消退：不再强化", "e": "Removing the reinforcer so the behaviour stops."}, {"t": "Extrinsic motivation", "z": "外在动机", "e": "Doing something for outside rewards such as pay."}, {"t": "Frustration-regression", "z": "挫折-退化", "e": "If a higher need is blocked, people go back to a lower need."}, {"t": "Growth need strength", "z": "成长需求强度", "e": "Desire for growth; high GNS people respond best to enriched jobs."}, {"t": "Hygiene factors", "z": "保健因素", "e": "Context factors (pay, policy) that only prevent dissatisfaction."}, {"t": "Instrumentality", "z": "工具性：绩效 → 奖励", "e": "Belief that performance leads to a reward."}, {"t": "Interactional justice", "z": "互动公正", "e": "Treating people with respect and dignity."}, {"t": "Intrinsic motivation", "z": "内在动机", "e": "Doing something because it is interesting or satisfying."}, {"t": "Job Characteristics Model (JCM)", "z": "工作特征模型", "e": "Skill variety, task identity, task significance, autonomy, feedback."}, {"t": "Job enlargement", "z": "工作扩大化（横向）", "e": "Adding more tasks at the same level."}, {"t": "Job enrichment", "z": "工作丰富化（纵向）", "e": "Adding more control and responsibility."}, {"t": "Job rotation", "z": "轮岗", "e": "Moving employees between jobs."}, {"t": "Management by objectives (MBO)", "z": "目标管理", "e": "Goals cascade from the company to teams to individuals."}, {"t": "Maslow's hierarchy", "z": "马斯洛需求层次", "e": "Physiological → safety → social → esteem → self-actualization."}, {"t": "Motivating potential score (MPS)", "z": "激励潜力分数", "e": "MPS = [(SV + TI + TS) / 3] × A × F."}, {"t": "Motivation", "z": "动机：强度、方向、持续", "e": "The intensity, direction and persistence of effort toward a goal."}, {"t": "Motivators", "z": "激励因素", "e": "Job content factors (achievement, recognition) that create satisfaction."}, {"t": "Need for achievement (nAch)", "z": "成就需要", "e": "Wants challenging goals and fast feedback; often a poor manager."}, {"t": "Need for affiliation (nAff)", "z": "亲和需要", "e": "Wants to be liked; avoids giving critical feedback."}, {"t": "Need for power (nPow)", "z": "权力需要", "e": "Wants influence; the socialized form makes good leaders."}, {"t": "Negative reinforcement", "z": "负强化：拿走不好的", "e": "Removing something unpleasant after a behaviour."}, {"t": "Positive reinforcement", "z": "正强化：给好的", "e": "Adding something pleasant after a behaviour."}, {"t": "Procedural justice", "z": "程序公正", "e": "Fair process; matters most when the outcome is bad."}, {"t": "Punishment", "z": "惩罚：给不好的", "e": "Adding something unpleasant after a behaviour."}, {"t": "SMART goals", "z": "SMART 目标", "e": "Specific, measurable, aggressive/achievable, realistic, time-bound."}, {"t": "Valence", "z": "效价：奖励的价值", "e": "How much a person values the reward."}, {"t": "Variable ratio", "z": "可变比率：最持久", "e": "Reinforcement at random times; the most durable schedule."}, {"t": "Work-life conflict", "z": "工作-生活冲突", "e": "Time-based, strain-based or behaviour-based."}]}, {"n": 6, "en": "Conflict & Negotiation", "zh": "冲突与谈判", "notes": "\n\n<h2>1. Conflict（冲突，p.3–4）<\/h2>\n<p><span class=\"t\">Conflict<\/span> = a process that involves people disagreeing（人们意见不合的过程）。<\/p>\n<div style=\"break-inside:avoid\"><h3>Functional vs. Dysfunctional<span class=\"hot\">高频考点<\/span><\/h3>\n<table>\n<tr><th><\/th><th>Functional（功能性）<\/th><th>Dysfunctional（功能失调）<\/th><\/tr>\n<tr><td class=\"h\">别名<\/td><td>Constructive conflict（建设性冲突），<b>cognitive<\/b>（认知）<\/td><td>Relationship conflict（关系冲突），<b>affective<\/b>（情感）<\/td><\/tr>\n<tr><td class=\"h\">针对<\/td><td>针对 <b>issue<\/b>（问题），不针对人<\/td><td>针对 <b>person<\/b>（人，比如对方的能力）<\/td><\/tr>\n<tr><td class=\"h\">结果<\/td><td>支持团队目标，提高绩效 ☺<\/td><td>阻碍团队绩效<\/td><\/tr>\n<\/table><\/div>\n<div style=\"break-inside:avoid\"><h3>Types of Conflict in Organizations（三种冲突）<\/h3>\n<ul>\n<li><b>Intrapersonal<\/b>（个人内部）：发生在一个人内心。来自角色差异：<b>role conflict<\/b>（角色冲突，比如两个上司要求相反）、<b>role ambiguity<\/b>（角色模糊，不清楚自己该做什么）<\/li>\n<li><b>Interpersonal<\/b>（人际）：个人之间。<b>Horizontal<\/b>（同事之间）、<b>Vertical<\/b>（经理和员工之间）<\/li>\n<li><b>Intergroup<\/b>（群体之间）：不同部门、工会和管理层、争同一批客户的竞争公司<\/li>\n<\/ul><\/div>\n<div class=\"sum\">Functional conflict is aimed at the issue and improves performance; dysfunctional conflict is aimed at the person and hurts performance. Conflict can be intrapersonal, interpersonal or intergroup.<\/div>\n\n<h2>2. Conflict-Handling Styles · TKI（p.5–10）<\/h2>\n<p>Thomas-Kilmann Conflict Mode Instrument：纵轴 = <span class=\"k\">Level of Competitiveness<\/span>（竞争程度/坚持自己），横轴 = <span class=\"k\">Level of Cooperation<\/span>（合作程度/照顾对方）。<\/p>\n<div class=\"tkifig\">\n<div class=\"yax\">Level of Competitiveness →<\/div>\n<div class=\"quad\">\n<div class=\"cell r\"><b>Competition<\/b><span>Win-Lose<\/span><\/div>\n<div class=\"cell g\" style=\"text-align:right\"><b>Collaboration<\/b><span>Win-Win<\/span><\/div>\n<div class=\"cell n\" style=\"justify-content:flex-end\"><b>Avoidance<\/b><span>Lose-Lose<\/span><\/div>\n<div class=\"cell n\" style=\"text-align:right;justify-content:flex-end\"><b>Accommodation<\/b><span>Lose-Win<\/span><\/div>\n<div class=\"ctr\"><b>Compromise<\/b><br>Lose-Lose<\/div>\n<\/div>\n<div><\/div><div class=\"xax\">Level of Cooperation →<\/div>\n<\/div>\n\n<div style=\"break-inside:avoid\"><h3>五种风格：定义和什么时候用<span class=\"hot\">高频考点<\/span><\/h3>\n<table>\n<tr><th>Style<\/th><th>定义<\/th><th>结果<\/th><th>When to use?<\/th><\/tr>\n<tr><td class=\"h\">Competition<\/td><td>把自己的意愿强加给对方<\/td><td>Win-Lose<\/td><td>紧急情况；重要问题且自己是对的；没有其他选择；<b>必须有权力基础<\/b><\/td><\/tr>\n<tr><td class=\"h\">Collaboration<\/td><td>双方都想完全满足所有人的关切<\/td><td>Win-Win<\/td><td>没有对立利益；问题对双方都重要；<b>时间够<\/b><\/td><\/tr>\n<tr><td class=\"h\">Compromise<\/td><td>每一方都愿意放弃一些东西<\/td><td>Lose-Lose（太快让步）<\/td><td>目标互相排斥；时间压力；资源有限<\/td><\/tr>\n<tr><td class=\"h\">Avoidance<\/td><td>忽视或淡化引起冲突的问题<\/td><td>Lose-Lose<\/td><td>问题不重要；不太可能解决；短期情况；缺少信息<\/td><\/tr>\n<tr><td class=\"h\">Accommodation<\/td><td>接受并采纳对方的意愿<\/td><td>Lose-Win<\/td><td>自己错了；权力基础小；为长期关系积累 social credit<\/td><\/tr>\n<\/table><\/div>\n<div style=\"break-inside:avoid\"><h3>Managing Conflict: Goals（按目标选风格，p.19）<span class=\"hot\">易错点<\/span><\/h3>\n<table>\n<tr><th>Issue Importance（问题重要）<\/th><th>Long-Term Relationships（长期关系）<\/th><th>Speedy Resolution（快速解决）<\/th><\/tr>\n<tr><td>Collaboration<\/td><td>Accommodation · Collaboration · Compromise · Avoidance<\/td><td>Competition · Accommodation · Compromise<\/td><\/tr>\n<\/table><\/div>\n<div class=\"sum\">TKI has five styles: competition (win-lose), collaboration (win-win), compromise and avoidance (lose-lose), and accommodation (lose-win). Choose by the goal: important issue → collaboration; speed → competition, accommodation or compromise.<\/div>\n\n<h2>3. Negotiation（谈判，p.22–25）<\/h2>\n<p><span class=\"t\">Negotiation<\/span> = 两方或多方交换商品或服务，并试图就 <b>exchange rate<\/b>（交换比例）达成一致的过程。<\/p>\n<ul>\n<li>是一种成熟的 <b>conflict-resolution strategy<\/b>（解决冲突的策略）<\/li>\n<li>是相互依赖、偏好不同的各方之间的 <b>decision-making process<\/b><\/li>\n<li>是决定各方给什么、拿什么的 <b>social process<\/b><\/li>\n<\/ul>\n<div style=\"break-inside:avoid\"><h3>Distributive vs. Integrative<span class=\"hot\">高频考点<\/span><\/h3>\n<table>\n<tr><th>Characteristic<\/th><th>Distributive（分配式 · divide the fixed pie）<\/th><th>Integrative（整合式 · expand the pie）<\/th><\/tr>\n<tr><td class=\"h\">Available resources<\/td><td>Fixed amount（固定）<\/td><td>Variable amount（可变）<\/td><\/tr>\n<tr><td class=\"h\">Primary motivations<\/td><td>I win, you lose<\/td><td>I win, you win<\/td><\/tr>\n<tr><td class=\"h\">Primary interests<\/td><td>Opposed（对立）<\/td><td>Congruent（一致）<\/td><\/tr>\n<tr><td class=\"h\">Focus of relationship<\/td><td>Short-term<\/td><td>Long-term<\/td><\/tr>\n<\/table><\/div>\n<p class=\"muted\">Bargaining &amp; TKI：distributive 对应 competition 一侧，integrative 对应 collaboration 一侧。<\/p>\n<div class=\"sum\">Negotiation is how parties agree on an exchange rate. Distributive bargaining divides a fixed pie (win-lose, short-term); integrative bargaining expands the pie (win-win, long-term).<\/div>\n\n<h2>4. Negotiation Process · Bargaining Zone（p.26–35）<\/h2>\n<div style=\"break-inside:avoid\"><h3>Issues, Positions, Interests<\/h3>\n<ul>\n<li><b>Issues<\/b>：公开谈的事情（disclosed）<\/li>\n<li><b>Positions<\/b>：你在这个问题上的立场（stand on the issue）<\/li>\n<li><b>Interests<\/b>：背后真正的关切（underlying concern）—— 谈判要关注这个<\/li>\n<\/ul><\/div>\n<div style=\"break-inside:avoid\"><h3>ZOPA &amp; BATNA<span class=\"hot\">高频考点<\/span><\/h3>\n<ul>\n<li><span class=\"t\">Target point<\/span>：你希望达到的结果<\/li>\n<li><span class=\"t\">Resistance point<\/span>：你能接受的最低结果（底线）<\/li>\n<li><span class=\"t\">ZOPA<\/span>（Zone Of Possible Agreement）= 双方 <b>resistance points 之间的重叠区<\/b>（卖方最低价 → 买方最高价）<\/li>\n<li><span class=\"t\">BATNA<\/span>（Best Alternative To a Negotiated Agreement，\"Plan B\"）：方案 <b>比 BATNA 好 → 接受<\/b>；<b>比 BATNA 差 → 拒绝<\/b><\/li>\n<li><b>Aspiration range<\/b>：自己的 target 到 resistance 之间<\/li>\n<\/ul><\/div>\n<div style=\"break-inside:avoid\"><h3>课件例子<\/h3>\n<table>\n<tr><th>例子<\/th><th>Buyer（T / R）<\/th><th>Seller（R / T）<\/th><th>结果<\/th><\/tr>\n<tr><td class=\"h\">Positive zone（p.30）<\/td><td>$800 / $1300<\/td><td>$1000 / $1500<\/td><td>重叠 → bargaining zone <b>$1000–$1300<\/b><\/td><\/tr>\n<tr><td class=\"h\">Negative zone（p.31）<\/td><td>$800 / $1100<\/td><td>$1200 / $1500<\/td><td>买方最高 &lt; 卖方最低 → <b>没有重叠，谈不成<\/b><\/td><\/tr>\n<tr><td class=\"h\">ZOPA（p.32）<\/td><td>$400 / $525<\/td><td>$475 / $600<\/td><td>ZOPA <b>$475–$525<\/b><\/td><\/tr>\n<tr><td class=\"h\">Job offer（p.33–35）<\/td><td>Company: $100K / BATNA $120K<\/td><td>Applicant: BATNA $110K / $130K<\/td><td>ZOPA <b>$110K–$120K<\/b><\/td><\/tr>\n<\/table><\/div>\n<div class=\"zfig\"><div><svg viewBox=\"0 0 330 112\" width=\"100%\"><text x=\"0\" y=\"11\" font-size=\"10\" font-weight=\"700\" fill=\"#13213a\">Positive zone (p.30)<\/text><rect x=\"139.66666666666666\" y=\"18\" width=\"87.66666666666666\" height=\"62\" fill=\"#f2b134\" opacity=\".35\" rx=\"3\"/><text x=\"183.5\" y=\"27\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#8a5a00\">ZOPA<\/text><text x=\"0\" y=\"42\" font-size=\"9\" fill=\"#2b6cb0\" font-weight=\"700\">Buyer<\/text><rect x=\"81.22222222222223\" y=\"33\" width=\"146.1111111111111\" height=\"11\" rx=\"5.5\" fill=\"#2b6cb0\"/><text x=\"0\" y=\"68\" font-size=\"9\" fill=\"#c0392b\" font-weight=\"700\">Seller<\/text><rect x=\"139.66666666666666\" y=\"59\" width=\"146.11111111111111\" height=\"11\" rx=\"5.5\" fill=\"#c0392b\"/><line x1=\"52\" y1=\"88\" x2=\"315\" y2=\"88\" stroke=\"#9aa3b2\"/><line x1=\"81.22222222222223\" y1=\"85\" x2=\"81.22222222222223\" y2=\"91\" stroke=\"#333\"/><text x=\"81.22222222222223\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\">$800<\/text><line x1=\"139.66666666666666\" y1=\"85\" x2=\"139.66666666666666\" y2=\"91\" stroke=\"#333\"/><text x=\"139.66666666666666\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\">$1000<\/text><line x1=\"227.33333333333331\" y1=\"85\" x2=\"227.33333333333331\" y2=\"91\" stroke=\"#333\"/><text x=\"227.33333333333331\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\">$1300<\/text><line x1=\"285.77777777777777\" y1=\"85\" x2=\"285.77777777777777\" y2=\"91\" stroke=\"#333\"/><text x=\"285.77777777777777\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\">$1500<\/text><\/svg><\/div><div><svg viewBox=\"0 0 330 112\" width=\"100%\"><text x=\"0\" y=\"11\" font-size=\"10\" font-weight=\"700\" fill=\"#13213a\">Negative zone (p.31)<\/text><text x=\"183.5\" y=\"58\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#c0392b\">✗<\/text><text x=\"183.5\" y=\"27\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c0392b\">no overlap<\/text><text x=\"0\" y=\"42\" font-size=\"9\" fill=\"#2b6cb0\" font-weight=\"700\">Buyer<\/text><rect x=\"81.22222222222223\" y=\"33\" width=\"87.66666666666666\" height=\"11\" rx=\"5.5\" fill=\"#2b6cb0\"/><text x=\"0\" y=\"68\" font-size=\"9\" fill=\"#c0392b\" font-weight=\"700\">Seller<\/text><rect x=\"198.11111111111111\" y=\"59\" width=\"87.66666666666666\" height=\"11\" rx=\"5.5\" fill=\"#c0392b\"/><line x1=\"52\" y1=\"88\" x2=\"315\" y2=\"88\" stroke=\"#9aa3b2\"/><line x1=\"81.22222222222223\" y1=\"85\" x2=\"81.22222222222223\" y2=\"91\" stroke=\"#333\"/><text x=\"81.22222222222223\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\">$800<\/text><line x1=\"168.88888888888889\" y1=\"85\" x2=\"168.88888888888889\" y2=\"91\" stroke=\"#333\"/><text x=\"168.88888888888889\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\">$1100<\/text><line x1=\"198.11111111111111\" y1=\"85\" x2=\"198.11111111111111\" y2=\"91\" stroke=\"#333\"/><text x=\"198.11111111111111\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\">$1200<\/text><line x1=\"285.77777777777777\" y1=\"85\" x2=\"285.77777777777777\" y2=\"91\" stroke=\"#333\"/><text x=\"285.77777777777777\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\">$1500<\/text><\/svg><\/div><div><svg viewBox=\"0 0 330 112\" width=\"100%\"><text x=\"0\" y=\"11\" font-size=\"10\" font-weight=\"700\" fill=\"#13213a\">ZOPA (p.32)<\/text><rect x=\"161.58333333333334\" y=\"18\" width=\"43.83333333333334\" height=\"62\" fill=\"#f2b134\" opacity=\".35\" rx=\"3\"/><text x=\"183.5\" y=\"27\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#8a5a00\">ZOPA<\/text><text x=\"0\" y=\"42\" font-size=\"9\" fill=\"#2b6cb0\" font-weight=\"700\">Buyer<\/text><rect x=\"95.83333333333333\" y=\"33\" width=\"109.58333333333336\" height=\"11\" rx=\"5.5\" fill=\"#2b6cb0\"/><text x=\"0\" y=\"68\" font-size=\"9\" fill=\"#c0392b\" font-weight=\"700\">Seller<\/text><rect x=\"161.58333333333334\" y=\"59\" width=\"109.58333333333334\" height=\"11\" rx=\"5.5\" fill=\"#c0392b\"/><line x1=\"52\" y1=\"88\" x2=\"315\" y2=\"88\" stroke=\"#9aa3b2\"/><line x1=\"95.83333333333333\" y1=\"85\" x2=\"95.83333333333333\" y2=\"91\" stroke=\"#333\"/><text x=\"95.83333333333333\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\">$400<\/text><line x1=\"161.58333333333334\" y1=\"85\" x2=\"161.58333333333334\" y2=\"91\" stroke=\"#333\"/><text x=\"161.58333333333334\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\">$475<\/text><line x1=\"205.41666666666669\" y1=\"85\" x2=\"205.41666666666669\" y2=\"91\" stroke=\"#333\"/><text x=\"205.41666666666669\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\">$525<\/text><line x1=\"271.1666666666667\" y1=\"85\" x2=\"271.1666666666667\" y2=\"91\" stroke=\"#333\"/><text x=\"271.1666666666667\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\">$600<\/text><\/svg><\/div><div><svg viewBox=\"0 0 330 112\" width=\"100%\"><text x=\"0\" y=\"11\" font-size=\"10\" font-weight=\"700\" fill=\"#13213a\">Job offer · BATNA (p.35)<\/text><rect x=\"150.625\" y=\"18\" width=\"65.75\" height=\"62\" fill=\"#f2b134\" opacity=\".35\" rx=\"3\"/><text x=\"183.5\" y=\"27\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#8a5a00\">ZOPA<\/text><text x=\"0\" y=\"42\" font-size=\"9\" fill=\"#2b6cb0\" font-weight=\"700\">Buyer<\/text><rect x=\"84.875\" y=\"33\" width=\"131.5\" height=\"11\" rx=\"5.5\" fill=\"#2b6cb0\"/><text x=\"0\" y=\"68\" font-size=\"9\" fill=\"#c0392b\" font-weight=\"700\">Seller<\/text><rect x=\"150.625\" y=\"59\" width=\"131.5\" height=\"11\" rx=\"5.5\" fill=\"#c0392b\"/><line x1=\"52\" y1=\"88\" x2=\"315\" y2=\"88\" stroke=\"#9aa3b2\"/><line x1=\"84.875\" y1=\"85\" x2=\"84.875\" y2=\"91\" stroke=\"#333\"/><text x=\"84.875\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\">$100K<\/text><line x1=\"150.625\" y1=\"85\" x2=\"150.625\" y2=\"91\" stroke=\"#333\"/><text x=\"150.625\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\">$110K<\/text><line x1=\"216.375\" y1=\"85\" x2=\"216.375\" y2=\"91\" stroke=\"#333\"/><text x=\"216.375\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\">$120K<\/text><line x1=\"282.125\" y1=\"85\" x2=\"282.125\" y2=\"91\" stroke=\"#333\"/><text x=\"282.125\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\">$130K<\/text><\/svg><\/div><\/div><p class=\"muted\" style=\"font-size:8.3pt\">蓝条 = 买方 aspiration range（target → resistance），红条 = 卖方 aspiration range（resistance → target），黄色 = ZOPA。<\/p><div class=\"formula\">ZOPA = Seller's resistance point → Buyer's resistance point<\/div>\n<p>BATNA 决定 resistance point：求职者有一份 $110K 的同等工作，所以低于 $110K 就拒绝；公司能用 $120K 请到同等候选人，所以高于 $120K 就不给。<\/p>\n<div class=\"sum\">Know your issues, positions and interests. The target point is what you want; the resistance point is the lowest you accept. ZOPA is the overlap between the two resistance points. Accept an offer better than your BATNA; reject one that is worse.<\/div>\n\n<h2>5. How to Negotiate · Tips（p.40–44）<\/h2>\n<div style=\"break-inside:avoid\"><h3>5 Easy Steps<\/h3>\n<ol>\n<li><b>Develop your strategy<\/b>（制定策略）<\/li>\n<li><b>Define ground rules<\/b>（确定基本规则）<\/li>\n<li><b>Clarify and justify<\/b>（说明并解释理由）<\/li>\n<li><b>Bargain and collaborate<\/b>（讨价还价、合作）<\/li>\n<li><b>Close and implement<\/b>（达成协议并执行）<\/li>\n<\/ol><\/div>\n<div style=\"break-inside:avoid\"><h3>Tips for Successful Negotiations<\/h3>\n<ul>\n<li>Begin with a <b>positive overture<\/b>（开头积极），一开始先让一点<\/li>\n<li>Address <b>issues, not personalities<\/b>（对事不对人）<\/li>\n<li>Pay little attention to <b>initial offers<\/b>（别太在意第一次出价）<\/li>\n<li>Focus on <b>interests, not positions<\/b>（关注利益而不是立场）<\/li>\n<li>Create an <b>open and trusting climate<\/b>（开放、信任的氛围）<\/li>\n<li>Emphasize <b>win-win<\/b> solutions<\/li>\n<\/ul><\/div>\n<p class=\"muted\">课堂案例：Case 06 · The Art of the Deal at TechFlow Solutions。<\/p>\n<div class=\"sum\">Negotiate in five steps: strategy, ground rules, clarify and justify, bargain and collaborate, close and implement. Focus on interests, not positions, and look for win-win solutions.<\/div>\n", "terms": [{"t": "Accommodation", "z": "迁就：接受对方意愿（Lose-Win）", "e": "Accepting and incorporating the will of the other party. Use when you are wrong, have a small power base, or want social credit."}, {"t": "Aspiration range", "z": "期望区间：自己的 target 到 resistance", "e": "The range between a party's target point and resistance point."}, {"t": "Avoidance", "z": "回避：忽视问题（Lose-Lose）", "e": "Ignoring or minimizing the issues. Use for unimportant issues, unlikely resolution, short-term situations or lack of information."}, {"t": "Bargaining zone", "z": "议价区", "e": "The range where the buyer's and seller's aspiration ranges overlap; can be positive or negative."}, {"t": "BATNA", "z": "最佳替代方案（Plan B）", "e": "Best Alternative To a Negotiated Agreement. Better than BATNA → accept; worse → reject."}, {"t": "Collaboration", "z": "合作：双赢（Win-Win）", "e": "Each party wants to fully satisfy the concerns of all parties. Use with no opposing interests, important issues and enough time."}, {"t": "Competition", "z": "竞争：强加自己意愿（Win-Lose）", "e": "Imposing one's will on the other party. Use in emergencies, vital issues when right, no other options; must have a power base."}, {"t": "Compromise", "z": "妥协：各让一步（Lose-Lose）", "e": "Each party gives up something. Use with mutually exclusive goals, time pressure or limited resources."}, {"t": "Conflict", "z": "冲突：意见不合的过程", "e": "A process that involves people disagreeing."}, {"t": "Distributive bargaining", "z": "分配式谈判：分固定的饼", "e": "Fixed resources; I win, you lose; opposed interests; short-term relationship."}, {"t": "Dysfunctional conflict", "z": "功能失调冲突：针对人（情感）", "e": "Relationship (affective) conflict aimed at the person; hinders group performance."}, {"t": "Functional conflict", "z": "功能性冲突：针对问题（认知）", "e": "Constructive (cognitive) conflict aimed at the issue; supports group goals and improves performance."}, {"t": "Horizontal conflict", "z": "横向冲突：同事之间", "e": "Interpersonal conflict between peers or coworkers."}, {"t": "Integrative bargaining", "z": "整合式谈判：把饼做大", "e": "Variable resources; I win, you win; congruent interests; long-term relationship."}, {"t": "Interests", "z": "利益：背后真正的关切", "e": "The underlying concern behind a position; focus on interests, not positions."}, {"t": "Intergroup conflict", "z": "群体间冲突", "e": "Conflict between groups, e.g., departments, union vs. management, competing companies."}, {"t": "Interpersonal conflict", "z": "人际冲突", "e": "Conflict among individuals; horizontal (peers) or vertical (manager vs. employee)."}, {"t": "Intrapersonal conflict", "z": "个人内部冲突", "e": "Conflict within a person, from role differences: role conflict or role ambiguity."}, {"t": "Issues", "z": "议题：公开谈的事", "e": "What is disclosed and discussed in a negotiation."}, {"t": "Negative bargaining zone", "z": "负议价区：没有重叠", "e": "The buyer's resistance point is lower than the seller's, so no agreement is possible."}, {"t": "Negotiation", "z": "谈判：商定交换比例", "e": "A process in which two or more parties exchange goods or services and try to agree on the exchange rate."}, {"t": "Positions", "z": "立场：对议题的主张", "e": "A party's stand on the issue."}, {"t": "Positive bargaining zone", "z": "正议价区：有重叠", "e": "The resistance points overlap, so an agreement is possible."}, {"t": "Resistance point", "z": "底线：最低可接受结果", "e": "The lowest outcome a party will accept."}, {"t": "Role ambiguity", "z": "角色模糊：不清楚该做什么", "e": "Intrapersonal conflict when a person is unclear about their role."}, {"t": "Role conflict", "z": "角色冲突：要求互相矛盾", "e": "Intrapersonal conflict when a person faces opposing role demands."}, {"t": "Target point", "z": "目标点：希望达到的结果", "e": "What one would like to achieve in a negotiation."}, {"t": "TKI", "z": "托马斯-基尔曼冲突模式（5 种风格）", "e": "Thomas-Kilmann Conflict Mode Instrument: competition, collaboration, compromise, avoidance, accommodation."}, {"t": "Vertical conflict", "z": "纵向冲突：上下级之间", "e": "Interpersonal conflict between managers and employees."}, {"t": "ZOPA", "z": "可能达成协议的区间", "e": "Zone Of Possible Agreement: the overlap between the seller's minimum and the buyer's maximum (resistance points)."}]}, {"n": 7, "en": "Leadership, Power & Politics", "zh": "领导、权力与政治", "notes": "<style>\n.f9{margin:12px 0 16px;overflow-x:auto}\n.f9 svg{display:block;width:100%;max-width:640px;height:auto;font-family:var(--body)}\n.f9 figcaption{font-size:13px;color:var(--muted);margin-top:4px}\n.f9 rect,.f9 circle,.f9 path{stroke-width:1}\n.f9 .bk{fill:var(--ink)} .f9 .tbk{fill:var(--bg);font-weight:700}\n.f9 .b1{fill:var(--kbg)} .f9 .b2{fill:var(--green-bg);stroke:var(--green)} .f9 .b3{fill:var(--th);stroke:var(--muted);stroke-opacity:.5} .f9 .b1{stroke:var(--blue);stroke-opacity:.35}\n.f9 .bs{fill:var(--chip);stroke:var(--muted);stroke-dasharray:3 2} .f9 .bh{fill:var(--tbg)}\n.f9 .hl{fill:var(--gold-bg);stroke:var(--gold);stroke-width:2.5} .f9 .hl2{fill:var(--tbg);stroke:var(--bg);stroke-width:2}\n.f9 .tb1,.f9 .tb2,.f9 .tb3,.f9 .tbh,.f9 .thl{fill:var(--fg)} .f9 .tbs{fill:var(--muted)}\n.f9 .tb{fill:var(--fg);font-weight:700} .f9 .tl{fill:var(--ink);font-weight:700} .f9 .tm{fill:var(--muted)}\n.f9 .ln{stroke:var(--blue);stroke-width:1.5;fill:none} .f9 .dash{stroke:var(--blue);stroke-width:2;stroke-dasharray:6 4;fill:none}\n.f9 .thick{stroke:var(--hot);stroke-width:2.5} .f9 .thin{stroke:var(--line);stroke-width:1}\n.f9 .arr,.f9 .arrh{stroke:var(--hot);stroke-width:1.6;fill:none} .f9 .arr2,.f9 .arrh2{stroke:var(--green);stroke-width:1.6;fill:none}\n<\/style>\n\n\n<h2>1. 什么是 Leadership（p.3–7）<\/h2>\n<p><span class=\"t\">Leadership<\/span> = the act of <span class=\"k\">leading<\/span> a group of people or an organization（带领一群人或一个组织）。<\/p>\n\n<h3>Kurt Lewin 的三种领导风格（p.4）<\/h3>\n<ul>\n<li><b>Autocratic（专制）<\/b>：\"Do X\"，领导一个人做所有决定<\/li>\n<li><b>Laissez-faire（放任）<\/b>：\"Do X or Y as you see fit\"，领导几乎不给意见<\/li>\n<li><b>Democratic（民主）<\/b>：\"Which is best, X or Y?\"，和团队一起决定<\/li>\n<\/ul>\n\n<h3>Managing vs. Leading（p.5–7）<\/h3>\n<table>\n<tr><th>Manager 管理者<\/th><th>Leader 领导者<\/th><\/tr>\n<tr><td>Transactional<\/td><td>Transformational<\/td><\/tr>\n<tr><td>Stability 稳定<\/td><td>Change 变革<\/td><\/tr>\n<tr><td>Managing work<\/td><td>Managing people<\/td><\/tr>\n<tr><td>Short-term goals<\/td><td>Long-term vision<\/td><\/tr>\n<tr><td>Head · formal authority<\/td><td>Heart · personal charisma<\/td><\/tr>\n<tr><td><b>Doing things right（How?）<\/b><\/td><td><b>Doing the right things（What?）<\/b><\/td><\/tr>\n<\/table>\n<div class=\"sum\">Managers focus on stability, work and formal authority (\"doing things right\"); leaders focus on change, people and vision (\"doing the right things\").<\/div>\n\n<h2>2. Full Range Leadership Model（p.8–10）<\/h2>\n<h3>Transactional Lead
