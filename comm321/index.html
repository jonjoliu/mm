e\">Division B<\/text><path class=\"ln\" d=\"M320 80 V88.0 H440 V96\" fill=\"none\"/><rect class=\"b1\" x=\"390\" y=\"96\" width=\"100\" height=\"26\" rx=\"4\"/><text class=\"tb1\" x=\"440.0\" y=\"112.5\" font-size=\"10\" text-anchor=\"middle\">Division C<\/text><path class=\"ln\" d=\"M320 122 V134.0 H115 V146\" fill=\"none\"/><rect class=\"b3\" x=\"70\" y=\"146\" width=\"90\" height=\"24\" rx=\"4\"/><text class=\"tb3\" x=\"115.0\" y=\"161.2\" font-size=\"9\" text-anchor=\"middle\">Purchasing<\/text><path class=\"ln\" d=\"M320 122 V134.0 H219 V146\" fill=\"none\"/><rect class=\"b3\" x=\"174\" y=\"146\" width=\"90\" height=\"24\" rx=\"4\"/><text class=\"tb3\" x=\"219.0\" y=\"161.2\" font-size=\"9\" text-anchor=\"middle\">Fabrication<\/text><path class=\"ln\" d=\"M320 122 V134.0 H323 V146\" fill=\"none\"/><rect class=\"b3\" x=\"278\" y=\"146\" width=\"90\" height=\"24\" rx=\"4\"/><text class=\"tb3\" x=\"323.0\" y=\"161.2\" font-size=\"9\" text-anchor=\"middle\">Assembly<\/text><path class=\"ln\" d=\"M320 122 V134.0 H427 V146\" fill=\"none\"/><rect class=\"b3\" x=\"382\" y=\"146\" width=\"90\" height=\"24\" rx=\"4\"/><text class=\"tb3\" x=\"427.0\" y=\"161.2\" font-size=\"9\" text-anchor=\"middle\">Sales<\/text><path class=\"ln\" d=\"M320 122 V134.0 H531 V146\" fill=\"none\"/><rect class=\"b3\" x=\"486\" y=\"146\" width=\"90\" height=\"24\" rx=\"4\"/><text class=\"tb3\" x=\"531.0\" y=\"161.2\" font-size=\"9\" text-anchor=\"middle\">Distribution<\/text><text class=\"tl\" x=\"20\" y=\"58\" font-size=\"10\" text-anchor=\"start\" >Staff<\/text><text class=\"tl\" x=\"20\" y=\"112\" font-size=\"10\" text-anchor=\"start\" >Line<\/text><line class=\"ln\" x1=\"430\" y1=\"186\" x2=\"470\" y2=\"186\"/><text class=\"tm\" x=\"476\" y=\"190\" font-size=\"9\" text-anchor=\"start\" >line = authority<\/text><line class=\"dash\" x1=\"140\" y1=\"186\" x2=\"180\" y2=\"186\"/><text class=\"tm\" x=\"186\" y=\"190\" font-size=\"9\" text-anchor=\"start\" >staff = advice only<\/text><\/svg><figcaption>实线是 line（有权力），虚线是 staff（只提建议，没有权力）。<\/figcaption><\/figure>\n\n<h3>Span of control 管理幅度（p.10–13）<span class=\"hot\">易错点<\/span><\/h3>\n<p>直接向一个经理汇报的人数。<\/p>\n<table>\n<tr><th><\/th><th>Narrow span（窄）→ <b>Tall<\/b> structure（高）<\/th><th>Wide span（宽）→ <b>Flat<\/b> structure（扁平）<\/th><\/tr>\n<tr><td class=\"h\">每个经理管<\/td><td>很少人<\/td><td>很多人<\/td><\/tr>\n<tr><td class=\"h\">工作类型<\/td><td>人少 → 更<b>常规<\/b>的工作<\/td><td>人多 → 更<b>多样<\/b>的工作<\/td><\/tr>\n<tr><td class=\"h\">成本<\/td><td><b>贵<\/b>，经理多<\/td><td>经理少<\/td><\/tr>\n<tr><td class=\"h\">效果<\/td><td>管得紧，<b>不鼓励自主<\/b><\/td><td><b>赋权<\/b>员工，<b>决策更快<\/b><\/td><\/tr>\n<tr><td class=\"h\">层级<\/td><td>例如 7 层<\/td><td>例如 3 层<\/td><\/tr>\n<\/table>\n<figure class=\"f9\"><svg viewBox=\"0 0 560 209\" role=\"img\" aria-label=\"Span of control: span 4 needs 1365 managers, span 8 needs 585\"><text class=\"tl\" x=\"120\" y=\"14\" font-size=\"11\" text-anchor=\"middle\" >Span of 4 → 7 levels<\/text><rect class=\"b1\" x=\"77.5\" y=\"24\" width=\"85.0\" height=\"18\" rx=\"3\"/><text class=\"tb1\" x=\"120\" y=\"37\" font-size=\"10\" text-anchor=\"middle\" >1<\/text><rect class=\"b1\" x=\"77.5\" y=\"45\" width=\"85.0\" height=\"18\" rx=\"3\"/><text class=\"tb1\" x=\"120\" y=\"58\" font-size=\"10\" text-anchor=\"middle\" >4<\/text><rect class=\"b1\" x=\"55.0\" y=\"66\" width=\"130.0\" height=\"18\" rx=\"3\"/><text class=\"tb1\" x=\"120\" y=\"79\" font-size=\"10\" text-anchor=\"middle\" >16<\/text><rect class=\"b1\" x=\"55.0\" y=\"87\" width=\"130.0\" height=\"18\" rx=\"3\"/><text class=\"tb1\" x=\"120\" y=\"100\" font-size=\"10\" text-anchor=\"middle\" >64<\/text><rect class=\"b1\" x=\"32.5\" y=\"108\" width=\"175.0\" height=\"18\" rx=\"3\"/><text class=\"tb1\" x=\"120\" y=\"121\" font-size=\"10\" text-anchor=\"middle\" >256<\/text><rect class=\"b1\" x=\"10.0\" y=\"129\" width=\"220.0\" height=\"18\" rx=\"3\"/><text class=\"tb1\" x=\"120\" y=\"142\" font-size=\"10\" text-anchor=\"middle\" >1,024<\/text><rect class=\"b3\" x=\"10 \/svg><figcaption>课件的矩阵例子：大学里\"学系 × 项目\"，每个格子里的人同时属于一个系和一个项目。<\/figcaption><\/figure><p class=\"muted\">注意：矩阵结构<b>违反了 unity of command<\/b>（一个人有两个上级）。\"典型\"一行是我补充的例子，不是课件内容。<\/p>\n\n<h2>4. Organic vs. Mechanistic（p.23–25）<span class=\"hot\">高频考点<\/span><\/h2><figure class=\"f9\"><svg viewBox=\"0 0 600 124\" role=\"img\" aria-label=\"Organic network versus mechanistic pyramid\"><text class=\"tl\" x=\"150\" y=\"14\" font-size=\"11\" text-anchor=\"middle\" >Organic: network<\/text><text class=\"tl\" x=\"450\" y=\"14\" font-size=\"11\" text-anchor=\"middle\" >Mechanistic: pyramid<\/text><line class=\"thin\" x1=\"210.0\" y1=\"70.0\" x2=\"180.0\" y2=\"104.64101615137754\"/><line class=\"thin\" x1=\"210.0\" y1=\"70.0\" x2=\"120.00000000000001\" y2=\"104.64101615137756\"/><line class=\"thin\" x1=\"210.0\" y1=\"70.0\" x2=\"90.0\" y2=\"70.0\"/><line class=\"thin\" x1=\"210.0\" y1=\"70.0\" x2=\"119.99999999999997\" y2=\"35.358983848622465\"/><line class=\"thin\" x1=\"210.0\" y1=\"70.0\" x2=\"180.0\" y2=\"35.35898384862246\"/><line class=\"thin\" x1=\"210.0\" y1=\"70.0\" x2=\"150\" y2=\"70\"/><line class=\"thin\" x1=\"180.0\" y1=\"104.64101615137754\" x2=\"120.00000000000001\" y2=\"104.64101615137756\"/><line class=\"thin\" x1=\"180.0\" y1=\"104.64101615137754\" x2=\"90.0\" y2=\"70.0\"/><line class=\"thin\" x1=\"180.0\" y1=\"104.64101615137754\" x2=\"119.99999999999997\" y2=\"35.358983848622465\"/><line class=\"thin\" x1=\"180.0\" y1=\"104.64101615137754\" x2=\"180.0\" y2=\"35.35898384862246\"/><line class=\"thin\" x1=\"180.0\" y1=\"104.64101615137754\" x2=\"150\" y2=\"70\"/><line class=\"thin\" x1=\"120.00000000000001\" y1=\"104.64101615137756\" x2=\"90.0\" y2=\"70.0\"/><line class=\"thin\" x1=\"120.00000000000001\" y1=\"104.64101615137756\" x2=\"119.99999999999997\" y2=\"35.358983848622465\"/><line class=\"thin\" x1=\"120.00000000000001\" y1=\"104.64101615137756\" x2=\"180.0\" y2=\"35.35898384862246\"/><line class=\"thin\" x1=\"120.00000000000001\" y1=\"104.64101615137756\" x2=\"150\" y2=\"70\"/><line class=\"thin\" x1=\"90.0\" y1=\"70.0\" x2=\"119.99999999999997\" y2=\"35.358983848622465\"/><line class=\"thin\" x1=\"90.0\" y1=\"70.0\" x2=\"180.0\" y2=\"35.35898384862246\"/><line class=\"thin\" x1=\"90.0\" y1=\"70.0\" x2=\"150\" y2=\"70\"/><line class=\"thin\" x1=\"119.99999999999997\" y1=\"35.358983848622465\" x2=\"180.0\" y2=\"35.35898384862246\"/><line class=\"thin\" x1=\"119.99999999999997\" y1=\"35.358983848622465\" x2=\"150\" y2=\"70\"/><line class=\"thin\" x1=\"180.0\" y1=\"35.35898384862246\" x2=\"150\" y2=\"70\"/><circle class=\"b1\" cx=\"210\" cy=\"70\" r=\"7\"/><circle class=\"b1\" cx=\"180\" cy=\"105\" r=\"7\"/><circle class=\"b1\" cx=\"120\" cy=\"105\" r=\"7\"/><circle class=\"b1\" cx=\"90\" cy=\"70\" r=\"7\"/><circle class=\"b1\" cx=\"120\" cy=\"35\" r=\"7\"/><circle class=\"b1\" cx=\"180\" cy=\"35\" r=\"7\"/><circle class=\"b1\" cx=\"150\" cy=\"70\" r=\"7\"/><circle class=\"bk\" cx=\"450\" cy=\"34\" r=\"7\"/><line class=\"ln\" x1=\"450\" y1=\"41\" x2=\"390\" y2=\"70\"/><circle class=\"b1\" cx=\"390\" cy=\"74\" r=\"6\"/><line class=\"ln\" x1=\"390\" y1=\"80\" x2=\"374\" y2=\"104\"/><circle class=\"b3\" cx=\"374\" cy=\"108\" r=\"5\"/><line class=\"ln\" x1=\"390\" y1=\"80\" x2=\"390\" y2=\"104\"/><circle class=\"b3\" cx=\"390\" cy=\"108\" r=\"5\"/><line class=\"ln\" x1=\"390\" y1=\"80\" x2=\"406\" y2=\"104\"/><circle class=\"b3\" cx=\"406\" cy=\"108\" r=\"5\"/><line class=\"ln\" x1=\"450\" y1=\"41\" x2=\"450\" y2=\"70\"/><circle class=\"b1\" cx=\"450\" cy=\"74\" r=\"6\"/><line class=\"ln\" x1=\"450\" y1=\"80\" x2=\"434\" y2=\"104\"/><circle class=\"b3\" cx=\"434\" cy=\"108\" r=\"5\"/><line class=\"ln\" x1=\"450\" y1=\"80\" x2=\"450\" y2=\"104\"/><circle class=\"b3\" cx=\"450\" cy=\"108\" r=\"5\"/><line class=\"ln\" x1=\"450\" y1=\"80\" x2=\"466\" y2=\"104\"/><circle class=\"b3\" cx=\"466\" cy=\"108\" r=\"5\"/><line class=\"ln\" x1=\"450\" y1=\"41\" x2=\"510\" y2=\"70\"/><circle class=\"b1\" cx=\"510\" cy=\"74\" r=\"6\"/><line class=\"ln\" x1=\"510\" y1=\"80\" x2=\"494\" y2=\"104\"/><circle class=\"b3\" cx=\"494\" cy=\"108\" r=\"5\"/><line class=\"ln\" x1=\"510\" y1=\"80\" x2=\"510\" y2=\"104\"/><circle class=\"b3\" cx=\"510\" cy=\"108\" r=\"5\"/><line class=\"ln\" x1=\"510\" y1=\"80\" x2=\"526\" y2=\"104\"/><circle class=\"b3\" cx=\"526\" cy=\"108\" r=\"5\"/><\/svg><figcaption>有机式像网：人人互相连接；机械式像金字塔：层层往上汇报。<\/figcaption><\/figure>\n<table>\n<tr><th>Organic structure（有机式）<\/th><th>Mechanistic structure（机械式）<\/th><\/tr>\n<tr><td>Cross-functional teams 跨职能团队<\/td><td>High specialization 高度专业化<\/td><\/tr>\n<tr><td>Cross-hierarchical teams 跨层级团队<\/td><td>Rigid departmentalization 僵化的部门<\/td><\/tr>\n<tr><td>Free flow of information 信息自由流动<\/td><td>Clear chain of command 清楚的指挥链<\/td><\/tr>\n<tr><td>Wide spans of control 宽幅度<\/td><td>Narrow spans of control 窄幅度<\/td><\/tr>\n<tr><td>Decentralization 分权<\/td><td>Centralization 集权<\/td><\/tr>\n<tr><td>Low formalization 低正规化<\/td><td>High formalization 高正规化<\/td><\/tr>\n<\/table>\n<h3>结构的权变因素：什么时候用哪种？<\/h3>\n<table>\n<tr><th>Contingency<\/th><th>Organic ←<\/th><th>→ Mechanistic<\/th><\/tr>\n<tr><td class=\"h\">Strategy 战略<\/td><td><b>Innovation<\/b> 创新<\/td><td><b>Cost minimization<\/b> 成本最小化（imitation 模仿介于中间）<\/td><\/tr>\n<tr><td class=\"h\">Size 规模<\/td><td><b>Smaller<\/b> 小<\/td><td><b>Larger<\/b> 大<\/td><\/tr>\n<tr><td class=\"h\">Technology 技术<\/td><td><b>Non-routine<\/b> 非常规<\/td><td><b>Routine<\/b> 常规<\/td><\/tr>\n<tr><td class=\"h\">Environment 环境<\/td><td><b>Uncertain<\/b> 不确定（变化大、复杂）<\/td><td><b>Certain<\/b> 确定<\/td><\/tr>\n<\/table>\n<figure class=\"f9\"><svg viewBox=\"0 0 620 206\" role=\"img\" aria-label=\"Four contingencies of structure\"><rect class=\"b1\" x=\"210\" y=\"10\" width=\"90\" height=\"90\" rx=\"4\"/><text class=\"tb1\" x=\"255.0\" y=\"59.2\" font-size=\"12\" text-anchor=\"middle\">Strategy<\/text><text class=\"tm\" x=\"200\" y=\"40\" font-size=\"10\" text-anchor=\"end\" >Innovation<\/text><text class=\"tm\" x=\"200\" y=\"56\" font-size=\"10\" text-anchor=\"end\" >Cost minimization<\/text><text class=\"tm\" x=\"200\" y=\"72\" font-size=\"10\" text-anchor=\"end\" >Imitation<\/text><rect class=\"b2\" x=\"310\" y=\"10\" width=\"90\" height=\"90\" rx=\"4\"/><text class=\"tb2\" x=\"355.0\" y=\"59.2\" font-size=\"12\" text-anchor=\"middle\">Size<\/text><text class=\"tm\" x=\"410\" y=\"40\" font-size=\"10\" text-anchor=\"start\" >Small organizations<\/text><text class=\"tm\" x=\"410\" y=\"56\" font-size=\"10\" text-anchor=\"start\" >Large organizations<\/text><rect class=\"bs\" x=\"210\" y=\"110\" width=\"90\" height=\"90\" rx=\"4\"/><text class=\"tbs\" x=\"255.0\" y=\"159.2\" font-size=\"12\" text-anchor=\"middle\">Environment<\/text><text class=\"tm\" x=\"200\" y=\"140\" font-size=\"10\" text-anchor=\"end\" >Capacity<\/text><text class=\"tm\" x=\"200\" y=\"156\" font-size=\"10\" text-anchor=\"end\" >Volatility<\/text><text class=\"tm\" x=\"200\" y=\"172\" font-size=\"10\" text-anchor=\"end\" >Complexity<\/text><rect class=\"hl\" x=\"310\" y=\"110\" width=\"90\" height=\"90\" rx=\"4\"/><text class=\"thl\" x=\"355.0\" y=\"159.2\" font-size=\"12\" text-anchor=\"middle\">Technology<\/text><text class=\"tm\" x=\"410\" y=\"140\" font-size=\"10\" text-anchor=\"start\" >Routine tech<\/text><text class=\"tm\" x=\"410\" y=\"156\" font-size=\"10\" text-anchor=\"start\" >Non-routine tech<\/text><text class=\"tm\" x=\"410\" y=\"172\" font-size=\"10\" text-anchor=\"start\" >Advanced digital tech<\/text><\/svg><figcaption>结构的四个权变因素：战略、规模、环境、技术。<\/figcaption><\/figure><p class=\"muted\">环境看三方面：capacity（容量）、volatility（波动性）、complexity（复杂性）。技术还包括 advanced digital tech。<\/p>\n<div class=\"sum\">Organic structures (teams, free information, wide spans, decentralization, low formalization) fit innovation, small size, non-routine technology and uncertain environments. Mechanistic structures fit cost minimization, large size, routine technology and certain environments.<\/div>\n\n<h2>5. 组织变革（Organizational change，p.45）<\/h2>\n<ul>\n<li>组织和员工常常<b>抗拒变革<\/b>，因为感到<b>威胁、恐惧、不确定<\/b><\/li>\n<li>抗拒也可以是<b>积极<\/b>的：如果它带来公开的讨论和辩论<\/li>\n<li><span class=\"t\">Change agent<\/span>（变革推动者）：负责推动和管理变革的人<\/li>\n<\/ul>\n\n<h2>6. Lewin 三步模型（p.46）<span class=\"hot\">高频考点<\/span><\/h2>\n<div class=\"formula\">Unfreezing → Moving → Refreezing<\/div>\n<table>\n<tr><th>步骤<\/th><th>做什么<\/th><\/tr>\n<tr><td class=\"h\">Unfreezing 解冻<\/td><td>打破现状（status quo），让人准备好接受变革：<b>增加 driving forces，减少 restraining forces<\/b><\/td><\/tr>\n<tr><td class=\"h\">Moving 变革<\/td><td>实施变革，往理想状态（desired state）移动<\/td><\/tr>\n<tr><td class=\"h\">Refreezing 再冻结<\/td><td>把新状态<b>固定<\/b>下来，防止退回旧习惯<\/td><\/tr>\n<\/table>\n\n<figure class=\"f9\"><svg viewBox=\"0 0 620 222\" role=\"img\" aria-label=\"Lewin three-step model\"><path class=\"bh\" d=\"M90 6 H240 L256 22 L240 38 H90 L106 22 Z\"/><text class=\"tb\" x=\"173\" y=\"26\" font-size=\"11\" text-anchor=\"middle\" >Unfreezing<\/text><path class=\"b1\" d=\"M260 6 H410 L426 22 L410 38 H260 L276 22 Z\"/><text class=\"tb\" x=\"343\" y=\"26\" font-size=\"11\" text-anchor=\"middle\" >Moving<\/text><path class=\"bs\" d=\"M430 6 H580 L596 22 L580 38 H430 L446 22 Z\"/><text class=\"tb\" x=\"513\" y=\"26\" font-size=\"11\" text-anchor=\"middle\" >Refreezing<\/text><line class=\"ln\" x1=\"80\" y1=\"60\" x2=\"80\" y2=\"200\"/><line class=\"ln\" x1=\"80\" y1=\"200\" x2=\"600\" y2=\"200\"/><text class=\"tm\" x=\"340\" y=\"216\" font-size=\"10\" text-anchor=\"middle\" >Time →<\/text><text class=\"tl\" x=\"74\" y=\"130\" font-size=\"10\" text-anchor=\"end\" >Status<\/text><text class=\"tl\" x=\"74\" y=\"143\" font-size=\"10\" text-anchor=\"end\" >quo<\/text><line class=\"thick\" x1=\"90\" y1=\"134\" x2=\"260\" y2=\"134\"/><path class=\"dash\" d=\"M260 134 L500 72 H600\"/><text class=\"tl\" x=\"560\" y=\"64\" font-size=\"10\" text-anchor=\"middle\" >Desired state<\/text><path class=\"arr\" d=\"M110 92 V128\"/><path class=\"arrh\" d=\"M106 122 L110 130 L114 122\"/><path class=\"arr2\" d=\"M110 178 V140\"/><path class=\"arrh2\" d=\"M106 146 L110 138 L114 146\"/><path class=\"arr\" d=\"M142 92 V128\"/><path class=\"arrh\" d=\"M138 122 L142 130 L146 122\"/><path class=\"arr2\" d=\"M142 178 V140\"/><path class=\"arrh2\" d=\"M138 146 L142 138 L146 146\"/><path class=\"arr\" d=\"M174 92 V128\"/><path class=\"arrh\" d=\"M170 122 L174 130 L178 122\"/><path class=\"arr2\" d=\"M174 178 V140\"/><path class=\"arrh2\" d=\"M170 146 L174 138 L178 146\"/><path class=\"arr\" d=\"M206 92 V128\"/><path class=\"arrh\" d=\"M202 122 L206 130 L210 122\"/><path class=\"arr2\" d=\"M206 178 V140\"/><path class=\"arrh2\" d=\"M202 146 L206 138 L210 146\"/><path class=\"arr\" d=\"M238 92 V128\"/><path class=\"arrh\" d=\"M234 122 L238 130 L242 122\"/><path class=\"arr2\" d=\"M238 178 V140\"/><path class=\"arrh2\" d=\"M234 146 L238 138 L242 146\"/><text class=\"tl\" x=\"174\" y=\"86\" font-size=\"10\" text-anchor=\"middle\" >Restraining forces ↓<\/text><text class=\"tl\" x=\"174\" y=\"194\" font-size=\"10\" text-anchor=\"middle\" >Driving forces ↑<\/text><\/svg><figcaption>红色向下的是阻力，绿色向上的是推动力；推动力大过阻力，现状线才会往理想状态走。<\/figcaption><\/figure><h3>Force field model（力场模型，p.47）<\/h3>\n<ul>\n<li><b>Driving forces<\/b>（推动力）：推动变革的力量<\/li>\n<li><b>Restraining forces<\/b>（阻力）：阻止变革、维持现状的力量<\/li>\n<li>两种力<b>平衡<\/b>时 → 维持现状。要变革：<b>推动力 &gt; 阻力<\/b><\/li>\n<li>课件图：变革前推动力小、阻力大 → 变革中推动力变大 → 变革后到达理想状态<\/li>\n<\/ul>\n<figure class=\"f9\"><svg viewBox=\"0 0 620 220\" role=\"img\" aria-label=\"Force field model before, during and after change\"><line class=\"ln\" x1=\"60\" y1=\"14\" x2=\"60\" y2=\"196\"/><text class=\"tm\" x=\"54\" y=\"24\" font-size=\"9\" text-anchor=\"end\" >Desired<\/text><text class=\"tm\" x=\"54\" y=\"192\" font-size=\"9\" text-anchor=\"end\" >Current<\/text><line class=\"thick\" x1=\"94\" y1=\"160\" x2=\"226\" y2=\"160\"/><rect class=\"b2\" x=\"100\" y=\"162\" width=\"56\" height=\"30\" rx=\"3\"/><text class=\"tb1\" x=\"128\" y=\"176\" font-size=\"9\" text-anchor=\"middle\" >Driving<\/text><rect class=\"bh\" x=\"164\" y=\"98\" width=\"56\" height=\"60\" rx=\"3\"/><text class=\"tb1\" x=\"192\" y=\"152\" font-size=\"9\" text-anchor=\"middle\" >Restrain.<\/text><text class=\"tl\" x=\"160\" y=\"212\" font-size=\"10\" text-anchor=\"middle\" >Before change<\/text><line class=\"thick\" x1=\"264\" y1=\"115\" x2=\"396\" y2=\"115\"/><rect class=\"b2\" x=\"270\" y=\"117\" width=\"56\" height=\"60\" rx=\"3\"/><text class=\"tb1\" x=\"298\" y=\"131\" font-size=\"9\" text-anchor=\"middle\" >Driving<\/text><rect class=\"bh\" x=\"334\" y=\"68\" width=\"56\" height=\"45\" rx=\"3\"/><text class=\"tb1\" x=\"362\" y=\"107\" font-size=\"9\" text-anchor=\"middle\" >Restrain.<\/text><text class=\"tl\" x=\"330\" y=\"212\" font-size=\"10\" text-anchor=\"middle\" >During change<\/text><line class=\"thick\" x1=\"434\" y1=\"60\" x2=\"566\" y2=\"60\"/><rect class=\"b2\" x=\"440\" y=\"62\" width=\"56\" height=\"50\" rx=\"3\"/><text class=\"tb1\" x=\"468\" y=\"76\" font-size=\"9\" text-anchor=\"middle\" >Driving<\/text><rect class=\"bh\" x=\"504\" y=\"18\" width=\"56\" height=\"40\" rx=\"3\"/><text class=\"tb1\" x=\"532\" y=\"52\" font-size=\"9\" text-anchor=\"middle\" >Restrain.<\/text><text class=\"tl\" x=\"500\" y=\"212\" font-size=\"10\" text-anchor=\"middle\" >After change<\/text><\/svg><figcaption>变革前阻力大于推动力；变革中推动力变大；变革后到达理想状态。<\/figcaption><\/figure><p class=\"muted\">个人应用（SMART goal 图）：current reality（现在的情况）→ 克服 restraining forces（障碍）→ 一步步走到 desired reality（理想的情况）。driving forces 就是你为改变必须采取的步骤。<\/p>\n\n<h2>7. Kotter 八步模型（p.50）<span class=\"hot\">高频考点<\/span><\/h2>\n<table>\n<tr><th>#<\/th><th>Step<\/th><th>中文<\/th><th>对应 Lewin<\/th><\/tr>\n<tr><td class=\"h\">1<\/td><td>Establish a sense of <b>urgency<\/b><\/td><td>建立紧迫感<\/td><td rowspan=\"4\"><b>Unfreezing<\/b><\/td><\/tr>\n<tr><td class=\"h\">2<\/td><td>Create a <b>guiding coalition<\/b><\/td><td>组建领导联盟<\/td><\/tr>\n<tr><td class=\"h\">3<\/td><td>Develop a change <b>vision<\/b><\/td><td>制定变革愿景<\/td><\/tr>\n<tr><td class=\"h\">4<\/td><td><b>Communicate<\/b> the vision for buy-in<\/td><td>传达愿景、争取认同<\/td><\/tr>\n<tr><td class=\"h\">5<\/td><td><b>Empower<\/b> broad-based action<\/td><td>授权广泛行动<\/td><td rowspan=\"3\"><b>Moving<\/b><\/td><\/tr>\n<tr><td class=\"h\">6<\/td><td>Generate <b>short-term wins<\/b><\/td><td>创造短期胜利<\/td><\/tr>\n<tr><td class=\"h\">7<\/td><td><b>Never let up<\/b><\/td><td>不松懈、持续推进<\/td><\/tr>\n<tr><td class=\"h\">8<\/td><td>Incorporate changes into <b>culture<\/b><\/td><td>把变革融入文化<\/td><td><b>Refreezing<\/b><\/td><\/tr>\n<\/table>\n<figure class=\"f9\"><svg viewBox=\"0 0 690 256\" role=\"img\" aria-label=\"Kotter eight steps as a staircase\"><rect class=\"bh\" x=\"20\" y=\"222\" width=\"580\" height=\"26\" rx=\"2\" opacity=\".9\"/><text class=\"tb\" x=\"30\" y=\"239\" font-size=\"11\" text-anchor=\"start\" >1<\/text><text class=\"tb\" x=\"48\" y=\"239\" font-size=\"11\" text-anchor=\"start\" >Establish a sense of urgency<\/text><rect class=\"bh\" x=\"54\" y=\"194\" width=\"546\" height=\"26\" rx=\"2\" opacity=\".9\"/><text class=\"tb\" x=\"64\" y=\"211\" font-size=\"11\" text-anchor=\"start\" >2<\/text><text class=\"tb\" x=\"82\" y=\"211\" font-size=\"11\" text-anchor=\"start\" >Create a guiding coalition<\/text><rect class=\"bh\" x=\"88\" y=\"166\" width=\"512\" height=\"26\" rx=\"2\" opacity=\".9\"/><text class=\"tb\" x=\"98\" y=\"183\" font-size=\"11\" text-anchor=\"start\" >3<\/text><text class=\"tb\" x=\"116\" y=\"183\" font-size=\"11\" text-anchor=\"start\" >Develop a change vision<\/text><rect class=\"bh\" x=\"122\" y=\"138\" width=\"478\" height=\"26\" rx=\"2\" opacity=\".9\"/><text class=\"tb\" x=\"132\" y=\"155\" font-size=\"11\" text-anchor=\"start\" >4<\/text><text class=\"tb\" x=\"150\" y=\"155\" font-size=\"11\" text-anchor=\"start\" >Communicate the vision for buy-in<\/text><rect class=\"b1\" x=\"156\" y=\"110\" width=\"444\" height=\"26\" rx=\"2\" opacity=\".9\"/><text class=\"tb\" x=\"166\" y=\"127\" font-size=\"11\" text-anchor=\"start\" >5<\/text><text class=\"tb\" x=\"184\" y=\"127\" font-size=\"11\" text-anchor=\"start\" >Empower broad-based action<\/text><rect class=\"b1\" x=\"190\" y=\"82\" width=\"410\" height=\"26\" rx=\"2\" opacity=\".9\"/><text class=\"tb\" x=\"200\" y=\"99\" font-size=\"11\" text-anchor=\"start\" >6<\/text><text class=\"tb\" x=\"218\" y=\"99\" font-size=\"11\" text-anchor=\"start\" >Generate short-term wins<\/text><rect class=\"b1\" x=\"224\" y=\"54\" width=\"376\" height=\"26\" rx=\"2\" opacity=\".9\"/><text class=\"tb\" x=\"234\" y=\"71\" font-size=\"11\" text-anchor=\"start\" >7<\/text><text class=\"tb\" x=\"252\" y=\"71\" font-size=\"11\" text-anchor=\"start\" >Never let up<\/text><rect class=\"bs\" x=\"258\" y=\"26\" width=\"342\" height=\"26\" rx=\"2\" opacity=\".9\"/><text class=\"tb\" x=\"268\" y=\"43\" font-size=\"11\" text-anchor=\"start\" >8<\/text><text class=\"tb\" x=\"286\" y=\"43\" font-size=\"11\" text-anchor=\"start\" >Incorporate changes into culture<\/text><path class=\"ln\" d=\"M606 140 h6 v108 h-6\"/><text class=\"tl\" x=\"618\" y=\"198\" font-size=\"10\" text-anchor=\"start\" >Unfreezing<\/text><text class=\"tm\" x=\"618\" y=\"211\" font-size=\"9\" text-anchor=\"start\" >(1–4)<\/text><path class=\"ln\" d=\"M606 56 h6 v82 h-6\"/><text class=\"tl\" x=\"618\" y=\"100\" font-size=\"10\" text-anchor=\"start\" >Moving<\/text><text class=\"tm\" x=\"618\" y=\"113\" font-size=\"9\" text-anchor=\"start\" >(5–7)<\/text><path class=\"ln\" d=\"M606 28 h6 v26 h-6\"/><text class=\"tl\" x=\"618\" y=\"40\" font-size=\"10\" text-anchor=\"start\" >Refreezing<\/text><text class=\"tm\" x=\"618\" y=\"53\" font-size=\"9\" text-anchor=\"start\" >(8)<\/text><\/svg><figcaption>Kotter 八步像爬楼梯：红色 1–4 = 解冻，蓝色 5–7 = 变革，紫色 8 = 再冻结。<\/figcaption><\/figure><p class=\"muted\">记法：<b>急 → 团 → 景 → 说 → 权 → 赢 → 不停 → 文化<\/b>。前 4 步解冻，5–7 步变革，第 8 步再冻结。<\/p>\n<p class=\"muted\">课堂案例：Case 09 · MegaCorp Industries — Restructuring for Growth。<\/p>\n<div class=\"sum\">People resist change because of threat, fear and uncertainty. Lewin's model is unfreeze, move, refreeze; change happens when driving forces outweigh restraining forces. Kotter's eight steps start with urgency and end with anchoring the change in culture.<\/div>\n", "terms": [{"t": "Authority", "z": "权力", "e": "The right to give orders and expect them to be obeyed."}, {"t": "Bureaucracy", "z": "官僚制", "e": "High departmentalization, narrow spans, centralized authority, clear chain of command, formal rules."}, {"t": "Centralization", "z": "集权", "e": "Formal decision-making authority is held by a small group."}, {"t": "Chain of command", "z": "指挥链", "e": "Continuous line of authority from the top to the lowest level; who reports to whom."}, {"t": "Change agent", "z": "变革推动者", "e": "The person who leads and manages a change."}, {"t": "Contingencies of structure", "z": "结构的权变因素", "e": "Strategy, size, technology and environment determine the best structure."}, {"t": "Customer departmentalization", "z": "客户部门化", "e": "Grouping by customers' needs, e.g., wholesale, retail, government."}, {"t": "Decentralization", "z": "分权", "e": "Decision-making authority is dispersed throughout the organization."}, {"t": "Delegation", "z": "授权", "e": "Assigning authority to another person so the employee can make some decisions."}, {"t": "Departmentalization", "z": "部门化", "e": "The basis on which jobs are grouped together."}, {"t": "Division of labour", "z": "劳动分工", "e": "Subdividing work into separate jobs assigned to different people."}, {"t": "Driving forces", "z": "推动力", "e": "Forces that push toward change."}, {"t": "Flat structure", "z": "扁平结构", "e": "Few hierarchical levels, e.g., 3 levels."}, {"t": "Force field model", "z": "力场模型", "e": "Change happens when driving forces outweigh restraining forces."}, {"t": "Formalization", "z": "正规化", "e": "Degree to which rules and procedures standardize behaviour; rises with age, size and regulation."}, {"t": "Functional departmentalization", "z": "职能部门化", "e": "Grouping by work performed, e.g., accounting, HR, engineering."}, {"t": "Geographic departmentalization", "z": "地区部门化", "e": "Grouping by location served, e.g., North, South."}, {"t": "Guiding coalition", "z": "领导联盟", "e": "Kotter step 2: a group with enough power to lead the change."}, {"t": "Kotter's eight-step model", "z": "科特八步模型", "e": "Urgency, coalition, vision, communicate, empower, short-term wins, never let up, culture."}, {"t": "Lewin's three-step model", "z": "勒温三步模型", "e": "Unfreezing → moving → refreezing."}, {"t": "Line vs. staff", "z": "直线与参谋", "e": "Line = direct chain of command with authority; staff = advisory role with no real authority."}, {"t": "Matrix structure", "z": "矩阵结构", "e": "Combines functional and product departmentalization; dual chain of command."}, {"t": "Mechanistic structure", "z": "机械式结构", "e": "High specialization, rigid departments, narrow spans, centralized, high formalization."}, {"t": "Narrow span of control", "z": "窄幅度 → 高结构", "e": "Few reports; tall structure; expensive, tight supervision, less autonomy."}, {"t": "Organic structure", "z": "有机式结构", "e": "Cross-functional teams, free information, wide spans, decentralized, low formalization."}, {"t": "Organizational structure", "z": "组织结构", "e": "How tasks are divided and allocated across people and how their efforts are coordinated."}, {"t": "Process departmentalization", "z": "流程部门化", "e": "Grouping by workflow, e.g., testing, payment."}, {"t": "Product departmentalization", "z": "产品部门化", "e": "Grouping by product areas, e.g., women's apparel, men's footwear."}, {"t": "Refreezing", "z": "再冻结", "e": "Stabilizing the new state so people don't slip back."}, {"t": "Resistance to change", "z": "变革阻力", "e": "Opposing change because of threat, fear and uncertainty; can be positive if it opens debate."}, {"t": "Restraining forces", "z": "阻力", "e": "Forces that hold the status quo in place."}, {"t": "Short-term wins", "z": "短期胜利", "e": "Kotter step 6: visible early successes that build momentum."}, {"t": "Simple structure", "z": "简单结构", "e": "Low departmentalization, wide spans, authority in one person, little formalization."}, {"t": "Span of control", "z": "管理幅度", "e": "Number of people reporting directly to a manager."}, {"t": "Specialization", "z": "专业化（劳动分工）", "e": "Degree to which tasks are subdivided into separate jobs; efficient but can cause boredom."}, {"t": "Tall structure", "z": "高耸结构", "e": "Many hierarchical levels, e.g., 7 levels."}, {"t": "Unfreezing", "z": "解冻", "e": "Preparing for change by moving away from the status quo."}, {"t": "Unity of command", "z": "统一指挥", "e": "Each subordinate should have only one superior."}, {"t": "Wide span of control", "z": "宽幅度 → 扁平结构", "e": "Many reports; flat structure; empowers workers and speeds decisions."}]}]}</script>
<script>
const CFG=JSON.parse(document.getElementById('data').textContent);const D=CFG.units;const K=CFG.key;
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let known=new Set(store.get(K+'-known',[]));
const keyOf=(n,t)=>n+'|'+t;
const pad=n=>CFG.prefix+String(n).padStart(2,'0');
const examsOf=n=>CFG.exams.filter(x=>x.units.includes(n));
const scopeUnits=(s,L)=>s==='lesson'?[L]:s==='all'?D:D.filter(l=>(CFG.exams.find(x=>x.id===s)||{units:[]}).units.includes(l.n));
let cur=CFG.start, viewName='notes';
$('#brand').innerHTML=`${CFG.code} · ${CFG.short}<small>${CFG.sub}</small>`;
$('#examtag').innerHTML=CFG.exams.map(x=>`<b>${x.label}</b> = ${x.units.length?x.units.map(pad).join(', '):'—'}${x.note?` <em>${x.note}</em>`:''}`).join('<br>');

// lecture list
$('#lessons').innerHTML=D.map(l=>`<li><button data-n="${l.n}"><span class="no">${pad(l.n)}</span><span class="nm">${l.en}<em>${l.zh}</em></span></button></li>`).join('');
$('#lessons').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(+b.dataset.n,viewName)});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(cur,b.dataset.v)});

function go(n,v){location.hash=`l${n}`+(v==='notes'?'':'-'+v)}
function route(){
  const m=/^#l(\d+)(?:-(terms|cards))?$/.exec(location.hash);
  if(m&&D.some(l=>l.n===+m[1])){cur=+m[1];viewName=m[2]||'notes'} else {const s=store.get(K+'-last',CFG.start);cur=D.some(l=>l.n===s)?s:CFG.start;viewName='notes'}
  store.set(K+'-last',cur);render();
}
window.addEventListener('hashchange',()=>{route();window.scrollTo({top:0})});

function render(){
  const L=D.find(l=>l.n===cur);
  document.querySelectorAll('#lessons button').forEach(b=>b.setAttribute('aria-current',+b.dataset.n===cur));
  const act=document.querySelector(`#lessons button[data-n="${cur}"]`);act&&act.scrollIntoView({block:'nearest',inline:'center'});
  $('#eyebrow').textContent=[`${CFG.unitWord} ${pad(cur)}`.trim(),L.tag,...examsOf(cur).map(x=>x.label)].filter(Boolean).join(' · ');
  $('#title').textContent=L.en; $('#titlezh').textContent=L.zh; $('#ct').textContent=L.terms.length;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===viewName));
  if(viewName==='notes') renderNotes(L); else if(viewName==='terms') renderTerms(L); else renderCards(L);
}

function renderNotes(L){
  const v=$('#view'); v.innerHTML=`<article class="notes">${L.notes}</article>`;
  v.querySelectorAll('.notes table').forEach(t=>{if(t.parentElement.classList.contains('tw')||t.classList.contains('je'))return;const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t)});
}

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(s,q){s=esc(s);if(!q)return s;const i=s.toLowerCase().indexOf(q.toLowerCase());return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length)}
function renderTerms(L){
  const v=$('#view');
  v.innerHTML=`<div class="tools"><input class="search" id="q" type="search" placeholder="搜索关键词（英文或中文）" autocomplete="off"><label class="chk"><input type="checkbox" id="allq"> 搜全部 ${D.length} ${CFG.unitZh}</label><span class="count" id="n"></span></div><ul class="gl" id="gl"></ul>`;
  const draw=()=>{
    const q=$('#q').value.trim(), all=$('#allq').checked;
    const src=(all?D:[L]).flatMap(l=>l.terms.map(t=>({...t,n:l.n})));
    const rows=q?src.filter(t=>(t.t+' '+t.z+' '+t.e).toLowerCase().includes(q.toLowerCase())):src;
    $('#n').textContent=`${rows.length} 个`;
    $('#gl').innerHTML=rows.length?rows.map(t=>`<li><div><span class="gt">${all?`<span class="lsn">${pad(t.n)}</span>`:''}${hl(t.t,q)}</span><span class="gz">${hl(t.z,q)}</span></div><div class="ge">${hl(t.e,q)}</div></li>`).join(''):`<li class="empty">没有找到“${esc(q)}”。试试勾选“搜全部 ${D.length} ${CFG.unitZh}”。</li>`;
  };
  $('#q').addEventListener('input',draw);$('#allq').addEventListener('change',draw);draw();
}

// flashcards
let fc={scope:'lesson',rev:false,onlyNew:false,deck:[],i:0,flip:false};
function buildDeck(L){
  const src=scopeUnits(fc.scope,L);
  let deck=src.flatMap(l=>l.terms.map(t=>({...t,n:l.n})));
  if(fc.onlyNew) deck=deck.filter(t=>!known.has(keyOf(t.n,t.t)));
  fc.deck=deck; fc.i=0; fc.flip=false;
}
function renderCards(L){
  buildDeck(L);
  const v=$('#view');
  v.innerHTML=`<div class="fc-wrap">
   <div class="tools">
    <div class="seg" id="scope">${[['lesson','本课'],...CFG.exams.filter(x=>x.units.length>1).map(x=>[x.id,x.label]),['all','全部']].map(([k,t])=>`<button data-s="${k}" aria-pressed="${fc.scope===k}">${t}</button>`).join('')}</div>
    <label class="chk"><input type="checkbox" id="rev" ${fc.rev?'checked':''}> 反向（看释义猜词）</label>
    <label class="chk"><input type="checkbox" id="onlyNew" ${fc.onlyNew?'checked':''}> 只看还不熟的</label>
   </div>
   <div id="cardbox"></div>
   <p class="keys"><kbd>空格</kbd> 翻面 · <kbd>←</kbd><kbd>→</kbd> 上一张/下一张 · <kbd>1</kbd> 还不熟 · <kbd>2</kbd> 记住了</p>
  </div>`;
  $('#scope').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;fc.scope=b.dataset.s;renderCards(L)});
  $('#rev').addEventListener('change',e=>{fc.rev=e.target.checked;fc.flip=false;drawCard()});
  $('#onlyNew').addEventListener('change',e=>{fc.onlyNew=e.target.checked;renderCards(L)});
  drawCard();
}
function drawCard(){
  const box=$('#cardbox'); if(!box)return;
  const N=fc.deck.length, kn=fc.deck.filter(t=>known.has(keyOf(t.n,t.t))).length;
  if(!N){box.innerHTML=`<div class="done"><b>这一组都记住了</b>取消“只看还不熟的”，或换一个范围继续复习。<br><br><button class="btn" id="reset">清除这组的“记住了”标记</button></div>`;
    $('#reset').onclick=()=>{const L=D.find(l=>l.n===cur);fc.onlyNew=false;
      const src=scopeUnits(fc.scope,L);
      src.forEach(l=>l.terms.forEach(t=>known.delete(keyOf(l.n,t.t))));store.set(K+'-known',[...known]);renderCards(L)};return}
  if(fc.i>=N){box.innerHTML=`<div class="done"><b>这一轮看完了</b>${N} 张里记住了 ${kn} 张。<br><br><button class="btn" id="again">再来一轮</button> <button class="btn ghost" id="sh">打乱顺序再来</button></div>`;
    $('#again').onclick=()=>{fc.i=0;fc.flip=false;drawCard()};$('#sh').onclick=()=>{shuffle();drawCard()};return}
  const t=fc.deck[fc.i], isK=known.has(keyOf(t.n,t.t));
  const termSide=`<div class="big">${esc(t.t)}</div>`;
  const defSide=`<div class="zhbig">${esc(t.z)}</div><div class="def">${esc(t.e)}</div>`;
  const corner=`<div class="corner"><span>${pad(t.n)}</span><span>${isK?'<span class="known">✓ 记住了</span>':''}</span></div>`;
  box.innerHTML=`<div class="card${fc.flip?' flip':''}" id="card" role="button" tabindex="0" aria-label="翻面">
    <div class="card-in">
      <div class="face front">${corner}${fc.rev?defSide:termSide}<div class="hint">点卡片翻面</div></div>
      <div class="face back">${corner}${fc.rev?termSide+defSide.replace('<div class="def">'+esc(t.e)+'</div>',''):termSide+defSide}</div>
    </div></div>
   <div class="fc-bar">
    <button class="btn ghost" id="prev" ${fc.i===0?'disabled':''}>← 上一张</button>
    <span style="display:flex;gap:8px"><button class="btn no" id="no">还不熟</button><button class="btn yes" id="yes">记住了</button></span>
    <button class="btn ghost" id="shuf">打乱</button>
   </div>
   <div class="prog"><i style="width:${(fc.i/N*100).toFixed(1)}%"></i></div>
   <div class="fc-meta"><span>${fc.i+1} / ${N}</span><span>记住 ${kn} / ${N}</span></div>`;
  $('#card').onclick=flip; $('#card').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();flip()}};
  $('#prev').onclick=()=>step(-1); $('#no').onclick=()=>mark(false); $('#yes').onclick=()=>mark(true);
  $('#shuf').onclick=()=>{shuffle();drawCard()};
}
function flip(){fc.flip=!fc.flip;const c=$('#card');c&&c.classList.toggle('flip',fc.flip)}
function step(d){fc.i=Math.max(0,fc.i+d);fc.flip=false;drawCard()}
function mark(ok){const t=fc.deck[fc.i];if(!t)return;const k=keyOf(t.n,t.t);ok?known.add(k):known.delete(k);store.set(K+'-known',[...known]);step(1)}
function shuffle(){for(let i=fc.deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fc.deck[i],fc.deck[j]]=[fc.deck[j],fc.deck[i]]}fc.i=0;fc.flip=false}
document.addEventListener('keydown',e=>{
  if(viewName!=='cards'||e.target.matches('input,textarea'))return;
  if(e.key===' '){e.preventDefault();flip()} else if(e.key==='ArrowRight')step(1); else if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='1')mark(false); else if(e.key==='2')mark(true);
});
route();
</script>
