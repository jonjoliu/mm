ers（交易型）<span class=\"hot\">高频考点<\/span><\/h3>\n<ul>\n<li><b>Contingent reward<\/b>：用奖励交换努力，表现好就给奖励<\/li>\n<li><b>Management by exception (active)<\/b>：主动找偏差，及时纠正<\/li>\n<li><b>Management by exception (passive)<\/b>：标准没达到才出手<\/li>\n<li><b>Laissez-faire<\/b>：放弃责任，回避做决定<\/li>\n<\/ul>\n<h3>Transformational Leaders（变革型）· 4 个 I<\/h3>\n<ul>\n<li><b>Idealized influence<\/b>：给愿景和使命感，赢得尊重和信任（类似 charismatic leadership）<\/li>\n<li><b>Inspirational motivation<\/b>：传达高期望，用简单的方式讲清重要目标<\/li>\n<li><b>Intellectual stimulation<\/b>：鼓励理性思考和认真解决问题<\/li>\n<li><b>Individual consideration<\/b>：关注每个员工，个别辅导和建议<\/li>\n<\/ul>\n\n<figure class=\"f9\"><svg viewBox=\"0 0 640 276\" role=\"img\" aria-label=\"Full range leadership model\"><line class=\"ln\" x1=\"60\" y1=\"250\" x2=\"620\" y2=\"250\"/><line class=\"ln\" x1=\"60\" y1=\"250\" x2=\"60\" y2=\"14\"/><text class=\"tm\" x=\"64\" y=\"268\" font-size=\"10\" text-anchor=\"start\" >Passive<\/text><text class=\"tm\" x=\"620\" y=\"268\" font-size=\"10\" text-anchor=\"end\" >Active<\/text><text class=\"tm\" x=\"52\" y=\"22\" font-size=\"10\" text-anchor=\"end\" >Effective<\/text><text class=\"tm\" x=\"52\" y=\"248\" font-size=\"10\" text-anchor=\"end\" >Ineffective<\/text><rect class=\"bs\" x=\"72\" y=\"212\" width=\"96\" height=\"32\" rx=\"4\"/><text class=\"tbs\" x=\"120.0\" y=\"231.2\" font-size=\"9\" text-anchor=\"middle\">Laissez-faire<\/text><rect class=\"b3\" x=\"138\" y=\"186\" width=\"96\" height=\"32\" rx=\"4\"/><text class=\"tb3\" x=\"186.0\" y=\"205.2\" font-size=\"9\" text-anchor=\"middle\">MBE (passive)<\/text><rect class=\"b3\" x=\"204\" y=\"160\" width=\"96\" height=\"32\" rx=\"4\"/><text class=\"tb3\" x=\"252.0\" y=\"179.2\" font-size=\"9\" text-anchor=\"middle\">MBE (active)<\/text><rect class=\"b1\" x=\"270\" y=\"134\" width=\"96\" height=\"32\" rx=\"4\"/><text class=\"tb1\" x=\"318.0\" y=\"153.2\" font-size=\"9\" text-anchor=\"middle\">Contingent reward<\/text><rect class=\"b2\" x=\"336\" y=\"108\" width=\"96\" height=\"32\" rx=\"4\"/><text class=\"tb2\" x=\"384.0\" y=\"122.2\" font-size=\"9\" text-anchor=\"middle\">Individual<\/text><text class=\"tb2\" x=\"384.0\" y=\"132.2\" font-size=\"9\" text-anchor=\"middle\">consideration<\/text><rect class=\"b2\" x=\"402\" y=\"82\" width=\"96\" height=\"32\" rx=\"4\"/><text class=\"tb2\" x=\"450.0\" y=\"96.2\" font-size=\"9\" text-anchor=\"middle\">Intellectual<\/text><text class=\"tb2\" x=\"450.0\" y=\"106.2\" font-size=\"9\" text-anchor=\"middle\">stimulation<\/text><rect class=\"b2\" x=\"468\" y=\"56\" width=\"96\" height=\"32\" rx=\"4\"/><text class=\"tb2\" x=\"516.0\" y=\"70.2\" font-size=\"9\" text-anchor=\"middle\">Inspirational<\/text><text class=\"tb2\" x=\"516.0\" y=\"80.2\" font-size=\"9\" text-anchor=\"middle\">motivation<\/text><rect class=\"b2\" x=\"534\" y=\"30\" width=\"96\" height=\"32\" rx=\"4\"/><text class=\"tb2\" x=\"582.0\" y=\"44.1\" font-size=\"9\" text-anchor=\"middle\">Idealized<\/text><text class=\"tb2\" x=\"582.0\" y=\"54.1\" font-size=\"9\" text-anchor=\"middle\">influence<\/text><text class=\"tl\" x=\"470\" y=\"236\" font-size=\"10\" text-anchor=\"middle\" >↖ Transactional (bottom 4)<\/text><text class=\"tl\" x=\"200\" y=\"60\" font-size=\"10\" text-anchor=\"middle\" >Transformational: the 4 I's ↘<\/text><\/svg><figcaption>从左下到右上：越主动、越有效。左下是交易型（放任 → 例外管理 → 权变奖励），右上是变革型的 4 个 I。<\/figcaption><\/figure><h3>五种风格总结（p.10）<\/h3>\n<table>\n<tr><th>Style<\/th><th>决策权<\/th><th>动力来源<\/th><th>什么时候用<\/th><\/tr>\n<tr><td class=\"h\">Autocratic<\/td><td>Tightly centralized<\/td><td>Fear of punishment<\/td><td>员工多且没经验<\/td><\/tr>\n<tr><td class=\"h\">Democratic<\/td><td>Decentralized<\/td><td>Opportunity to participate<\/td><td>员工有经验、专业<\/td><\/tr>\n<tr><td class=\"h\">Laissez-faire<\/td><td>Distributed<\/td><td>Self-motivation<\/td><td>员工训练有素、高度自我驱动<\/td><\/tr>\n<tr><td class=\"h\">Transformational<\/td><td>Moderately centralized<\/td><td>Inspiration<\/td><td>组织需要大变革<\/td><\/tr>\n<tr><td class=\"h\">Transactional<\/td><td>Centralized<\/td><td>Rewards<\/td><td>员工必须严格按指令做<\/td><\/tr>\n<\/table>\n<div class=\"sum\">Transactional leaders exchange rewards for performance; transformational leaders inspire change through the 4 I's. Choose the style that fits the staff and the situation.<\/div>\n\n<h2>3. Leadership Theories（领导理论，p.13–26）<\/h2><figure class=\"f9\"><svg viewBox=\"0 0 620 140\" role=\"img\" aria-label=\"Leadership theories: who, how, when\"><circle class=\"b1\" cx=\"110\" cy=\"60\" r=\"48\"/><text class=\"tl\" x=\"110\" y=\"56\" font-size=\"13\" text-anchor=\"middle\" >Who?<\/text><text class=\"tm\" x=\"110\" y=\"74\" font-size=\"11\" text-anchor=\"middle\" >Traits<\/text><text class=\"tm\" x=\"110\" y=\"128\" font-size=\"10\" text-anchor=\"middle\" >extraversion → emergence<\/text><circle class=\"b2\" cx=\"310\" cy=\"60\" r=\"48\"/><text class=\"tl\" x=\"310\" y=\"56\" font-size=\"13\" text-anchor=\"middle\" >How?<\/text><text class=\"tm\" x=\"310\" y=\"74\" font-size=\"11\" text-anchor=\"middle\" >Behaviour<\/text><text class=\"tm\" x=\"310\" y=\"128\" font-size=\"10\" text-anchor=\"middle\" >people- vs task-oriented<\/text><circle class=\"hl\" cx=\"510\" cy=\"60\" r=\"48\"/><text class=\"tl\" x=\"510\" y=\"56\" font-size=\"13\" text-anchor=\"middle\" >When?<\/text><text class=\"tm\" x=\"510\" y=\"74\" font-size=\"11\" text-anchor=\"middle\" >Situation<\/text><text class=\"tm\" x=\"510\" y=\"128\" font-size=\"10\" text-anchor=\"middle\" >Path-Goal · Situational<\/text><\/svg><figcaption>三类理论回答三个问题：谁当领导（特质）、怎么领导（行为）、什么时候用什么风格（情境）。<\/figcaption><\/figure>\n<p>三类理论回答三个问题：<span class=\"k\">Traits → Who?<\/span>　<span class=\"k\">Behaviour → How?<\/span>　<span class=\"k\">Situation → When?<\/span><\/p>\n\n<h3>Trait Theory（Who?）<\/h3>\n<p>最重要的领导特质：<b>Extraversion<\/b>（最能预测谁会<b>成为<\/b>领导，leadership emergence）、Conscientiousness、Emotional stability、Openness、Emotional intelligence / empathy、Intelligence。<\/p>\n<p class=\"muted\">注意：特质更能预测\"谁当上领导\"，而不是\"谁领导得好\"；效果还取决于行为、下属和情境。<\/p>\n\n<h3>Behavioural Theory（How?）<\/h3>\n<p>两类行为：<b>People-oriented<\/b>（关系导向）和 <b>Task-oriented<\/b>（任务导向）。<\/p>\n\n<h3>Blake &amp; Mouton's Managerial Grid（p.18–19）<span class=\"hot\">高频考点<\/span><\/h3>\n<p>横轴 = Concern for Production（关注任务），纵轴 = Concern for People（关注人）。<\/p>\n<table>\n<tr><th>风格<\/th><th>坐标<\/th><th>特点<\/th><\/tr>\n<tr><td class=\"h\">Impoverished<\/td><td>1,1<\/td><td>只付出保住工作的最低努力<\/td><\/tr>\n<tr><td class=\"h\">Country Club<\/td><td>1,9<\/td><td>很照顾人的需要 → 舒适友好的氛围<\/td><\/tr>\n<tr><td class=\"h\">Authority-Obedience<\/td><td>9,1<\/td><td>尽量排除情绪等人的因素，只看绩效<\/td><\/tr>\n<tr><td class=\"h\">Middle-of-the-Road<\/td><td>5,5<\/td><td>完成工作和维持士气之间取平衡<\/td><\/tr>\n<tr><td class=\"h\">Team<\/td><td>9,9<\/td><td>员工投入、利益共享 → 信任与尊重（最理想）<\/td><\/tr>\n<\/table>\n<figure class=\"f9\"><svg viewBox=\"0 0 560 294\" role=\"img\" aria-label=\"Blake and Mouton managerial grid\"><line class=\"thin\" x1=\"70\" y1=\"20\" x2=\"70\" y2=\"254\"/><line class=\"thin\" x1=\"70\" y1=\"20\" x2=\"304\" y2=\"20\"/><line class=\"thin\" x1=\"96\" y1=\"20\" x2=\"96\" y2=\"254\"/><line class=\"thin\" x1=\"70\" y1=\"46\" x2=\"304\" y2=\"46\"/><line class=\"thin\" x1=\"122\" y1=\"20\" x2=\"122\" y2=\"254\"/><line class=\"thin\" x1=\"70\" y1=\"72\" x2=\"304\" y2=\"72\"/><line class=\"thin\" x1=\"148\" y1=\"20\" x2=\"148\" y2=\"254\"/><line class=\"thin\" x1=\"70\" y1=\"98\" x2=\"304\" y2=\"98\"/><line class=\"thin\" x1=\"174\" y1=\"20\" x2=\"174\" y2=\"254\"/><line class=\"thin\" x1=\"70\" y1=\"124\" x2=\"304\" y2=\"124\"/><line class=\"thin\" x1=\"200\" y1=\"20\" x2=\"200\" y2=\"254\"/><line class=\"thin\" x1=\"70\" y1=\"150\" x2=\"304\" y2=\"150\"/><line class=\"thin\" x1=\"226\" y1=\"20\" x2=\"226\" y2=\"254\"/><line class=\"thin\" x1=\"70\" y1=\"176\" x2=\"304\" y2=\"176\"/><line class=\"thin\" x1=\"252\" y1=\"20\" x2=\"252\" y2=\"254\"/><line class=\"thin\" x1=\"70\" y1=\"202\" x2=\"304\" y2=\"202\"/><line class=\"thin\" x1=\"278\" y1=\"20\" x2=\"278\" y2=\"254\"/><line class=\"thin\" x1=\"70\" y1=\"228\" x2=\"304\" y2=\"228\"/><line class=\"thin\" x1=\"304\" y1=\"20\" x2=\"304\" y2=\"254\"/><line class=\"thin\" x1=\"70\" y1=\"254\" x2=\"304\" y2=\"254\"/><text class=\"tm\" x=\"83.0\" y=\"268\" font-size=\"9\" text-anchor=\"middle\" >1<\/text><text class=\"tm\" x=\"64\" y=\"244.0\" font-size=\"9\" text-anchor=\"end\" >1<\/text><text class=\"tm\" x=\"109.0\" y=\"268\" font-size=\"9\" text-anchor=\"middle\" >2<\/text><text class=\"tm\" x=\"64\" y=\"218.0\" font-size=\"9\" text-anchor=\"end\" >2<\/text><text class=\"tm\" x=\"135.0\" y=\"268\" font-size=\"9\" text-anchor=\"middle\" >3<\/text><text class=\"tm\" x=\"64\" y=\"192.0\" font-size=\"9\" text-anchor=\"end\" >3<\/text><text class=\"tm\" x=\"161.0\" y=\"268\" font-size=\"9\" text-anchor=\"middle\" >4<\/text><text class=\"tm\" x=\"64\" y=\"166.0\" font-size=\"9\" text-anchor=\"end\" >4<\/text><text class=\"tm\" x=\"187.0\" y=\"268\" font-size=\"9\" text-anchor=\"middle\" >5<\/text><text class=\"tm\" x=\"64\" y=\"140.0\" font-size=\"9\" text-anchor=\"end\" >5<\/text><text class=\"tm\" x=\"213.0\" y=\"268\" font-size=\"9\" text-anchor=\"middle\" >6<\/text><text class=\"tm\" x=\"64\" y=\"114.0\" font-size=\"9\" text-anchor=\"end\" >6<\/text><text class=\"tm\" x=\"239.0\" y=\"268\" font-size=\"9\" text-anchor=\"middle\" >7<\/text><text class=\"tm\" x=\"64\" y=\"88.0\" font-size=\"9\" text-anchor=\"end\" >7<\/text><text class=\"tm\" x=\"265.0\" y=\"268\" font-size=\"9\" text-anchor=\"middle\" >8<\/text><text class=\"tm\" x=\"64\" y=\"62.0\" font-size=\"9\" text-anchor=\"end\" >8<\/text><text class=\"tm\" x=\"291.0\" y=\"268\" font-size=\"9\" text-anchor=\"middle\" >9<\/text><text class=\"tm\" x=\"64\" y=\"36.0\" font-size=\"9\" text-anchor=\"end\" >9<\/text><text class=\"tl\" x=\"187.0\" y=\"284\" font-size=\"10\" text-anchor=\"middle\" >Concern for production (task) →<\/text><text class=\"tl\" font-size=\"10\" text-anchor=\"middle\" transform=\"translate(22 137.0) rotate(-90)\">Concern for people →<\/text><circle class=\"b2\" cx=\"83.0\" cy=\"33.0\" r=\"9\"/><text class=\"tl\" x=\"97.0\" y=\"37.0\" font-size=\"10\" text-anchor=\"start\" >1,9 Country club<\/text><circle class=\"hl\" cx=\"291.0\" cy=\"33.0\" r=\"9\"/><text class=\"tl\" x=\"320\" y=\"37.0\" font-size=\"10\" text-anchor=\"start\" >9,9 Team ★<\/text><circle class=\"b1\" cx=\"187.0\" cy=\"137.0\" r=\"9\"/><text class=\"tl\" x=\"201.0\" y=\"141.0\" font-size=\"10\" text-anchor=\"start\" >5,5 Middle-of-the-road<\/text><circle class=\"b3\" cx=\"83.0\" cy=\"241.0\" r=\"9\"/><text class=\"tl\" x=\"97.0\" y=\"245.0\" font-size=\"10\" text-anchor=\"start\" >1,1 Impoverished<\/text><circle class=\"bh\" cx=\"291.0\" cy=\"241.0\" r=\"9\"/><text class=\"tl\" x=\"320\" y=\"245.0\" font-size=\"10\" text-anchor=\"start\" >9,1 Authority-obedience<\/text><\/svg><figcaption>横轴关心任务，纵轴关心人。最理想是右上角 9,9 Team。<\/figcaption><\/figure><div class=\"sum\">Trait theories ask who leads (extraversion predicts emergence); behavioural theories ask how leaders act (people- vs task-oriented); the Managerial Grid's ideal is Team (9,9).<\/div>\n\n<h3>Path-Goal Theory（When?，p.21–23）<span class=\"hot\">高频考点<\/span><\/h3>\n<p>领导调整自己的行为，帮员工<b>扫清通往目标的障碍<\/b>。<\/p>\n<ul>\n<li><b>Directive<\/b>：给工作提供结构、讲清怎么做（task-oriented）<\/li>\n<li><b>Supportive<\/b>：给心理支持、关心员工（people-oriented）<\/li>\n<li><b>Participative<\/b>：鼓励员工参与、听取建议<\/li>\n<li><b>Achievement-oriented<\/b>：通过目标设定和积极的 self-fulfilling prophecy 激发最佳表现<\/li>\n<\/ul>\n<table>\n<tr><th>Subordinate contingencies 下属因素<\/th><th>Environmental contingencies 环境因素<\/th><th>Outcomes 结果<\/th><\/tr>\n<tr><td>Ability level · Locus of control · Motivation<\/td><td>Role ambiguity · Stress level · Unpleasant tasks<\/td><td>Employee motivation · performance · satisfaction<\/td><\/tr>\n<\/table>\n\n<figure class=\"f9\"><svg viewBox=\"0 0 620 262\" role=\"img\" aria-label=\"Path-goal theory model\"><rect class=\"b1\" x=\"10\" y=\"70\" width=\"150\" height=\"120\" rx=\"4\"/><text class=\"tb1\" x=\"85.0\" y=\"133.5\" font-size=\"10\" text-anchor=\"middle\"><\/text><text class=\"tl\" x=\"85\" y=\"90\" font-size=\"11\" text-anchor=\"middle\" >Leader behaviours<\/text><text class=\"tm\" x=\"22\" y=\"114\" font-size=\"10\" text-anchor=\"start\" >• Directive<\/text><text class=\"tm\" x=\"22\" y=\"132\" font-size=\"10\" text-anchor=\"start\" >• Supportive<\/text><text class=\"tm\" x=\"22\" y=\"150\" font-size=\"10\" text-anchor=\"start\" >• Participative<\/text><text class=\"tm\" x=\"22\" y=\"168\" font-size=\"10\" text-anchor=\"start\" >• Achievement-oriented<\/text><rect class=\"b2\" x=\"450\" y=\"70\" width=\"160\" height=\"120\" rx=\"4\"/><text class=\"tb2\" x=\"530.0\" y=\"133.5\" font-size=\"10\" text-anchor=\"middle\"><\/text><text class=\"tl\" x=\"530\" y=\"90\" font-size=\"11\" text-anchor=\"middle\" >Outcomes<\/text><text class=\"tm\" x=\"462\" y=\"118\" font-size=\"10\" text-anchor=\"start\" >• Employee motivation<\/text><text class=\"tm\" x=\"462\" y=\"138\" font-size=\"10\" text-anchor=\"start\" >• Employee performance<\/text><text class=\"tm\" x=\"462\" y=\"158\" font-size=\"10\" text-anchor=\"start\" >• Employee satisfaction<\/text><rect class=\"bs\" x=\"230\" y=\"4\" width=\"150\" height=\"56\" rx=\"4\"/><text class=\"tbs\" x=\"305.0\" y=\"25.1\" font-size=\"9\" text-anchor=\"middle\">Subordinate contingencies<\/text><text class=\"tbs\" x=\"305.0\" y=\"35.1\" font-size=\"9\" text-anchor=\"middle\">ability · locus of control<\/text><text class=\"tbs\" x=\"305.0\" y=\"45.1\" font-size=\"9\" text-anchor=\"middle\">motivation<\/text><rect class=\"bs\" x=\"230\" y=\"200\" width=\"150\" height=\"56\" rx=\"4\"/><text class=\"tbs\" x=\"305.0\" y=\"221.2\" font-size=\"9\" text-anchor=\"middle\">Environmental contingencies<\/text><text class=\"tbs\" x=\"305.0\" y=\"231.2\" font-size=\"9\" text-anchor=\"middle\">role ambiguity · stress<\/text><text class=\"tbs\" x=\"305.0\" y=\"241.2\" font-size=\"9\" text-anchor=\"middle\">unpleasant tasks<\/text><path class=\"ln\" d=\"M160 130 H446\"/><path class=\"ln\" d=\"M440 125 L448 130 L440 135\"/><path class=\"ln\" d=\"M305 60 V126\"/><path class=\"ln\" d=\"M300 120 L305 128 L310 120\"/><path class=\"ln\" d=\"M305 200 V134\"/><path class=\"ln\" d=\"M300 140 L305 132 L310 140\"/><\/svg><figcaption>领导选择四种行为之一，同时看下属和环境两类情境因素，最终影响员工的动机、绩效和满意度。<\/figcaption><\/figure><h3>Situational Leadership Theory（Hersey-Blanchard，p.24–26）<span class=\"hot\">易错点<\/span><\/h3>\n<p>关注下属的 <span class=\"t\">readiness<\/span> = 完成某项任务的 <span class=\"k\">ability（能力）<\/span> 和 <span class=\"k\">willingness（意愿）<\/span>。下属可以接受或拒绝领导，效果取决于下属的反应（像父母随孩子长大逐步放手）。<\/p>\n<div class=\"grid2\">\n<div><span class=\"lab\">3 Participating<\/span>（能力够、意愿低）<br>Low task · High relationship：支持 + 参与<\/div>\n<div><span class=\"lab\">4 Delegating<\/span>（能力够、意愿高）<br>Low task · Low relationship：放手（laissez-faire）<\/div>\n<div><span class=\"lab\">1 Telling<\/span>（没能力、没意愿）<br>High task · Low relationship：给清楚具体的指令<\/div>\n<div><span class=\"lab\">2 Selling<\/span>（没能力、有意愿）<br>High task · High relationship：说服下属\"买账\"<\/div>\n<\/div>\n<p class=\"muted\">纵轴 = Ability（competence），横轴 = Willingness（commitment）。<\/p>\n<figure class=\"f9\"><svg viewBox=\"0 0 580 276\" role=\"img\" aria-label=\"Situational leadership: ability by willingness\"><line class=\"ln\" x1=\"70\" y1=\"10\" x2=\"70\" y2=\"250\"/><line class=\"ln\" x1=\"70\" y1=\"250\" x2=\"560\" y2=\"250\"/><text class=\"tl\" font-size=\"10\" text-anchor=\"middle\" transform=\"translate(30 130) rotate(-90)\">Ability (competence) →<\/text><text class=\"tl\" x=\"315\" y=\"268\" font-size=\"10\" text-anchor=\"middle\" >Willingness (commitment) →<\/text><rect class=\"b2\" x=\"80\" y=\"14\" width=\"230\" height=\"110\" rx=\"6\"/><text class=\"tl\" x=\"195\" y=\"54\" font-size=\"13\" text-anchor=\"middle\" >3 Participating<\/text><text class=\"tm\" x=\"195\" y=\"76\" font-size=\"10\" text-anchor=\"middle\" >Able but unwilling<\/text><text class=\"tm\" x=\"195\" y=\"94\" font-size=\"10\" text-anchor=\"middle\" >Low task · High relationship<\/text><rect class=\"b1\" x=\"320\" y=\"14\" width=\"230\" height=\"110\" rx=\"6\"/><text class=\"tl\" x=\"435\" y=\"54\" font-size=\"13\" text-anchor=\"middle\" >4 Delegating<\/text><text class=\"tm\" x=\"435\" y=\"76\" font-size=\"10\" text-anchor=\"middle\" >Able and willing<\/text><text class=\"tm\" x=\"435\" y=\"94\" font-size=\"10\" text-anchor=\"middle\" >Low task · Low relationship<\/text><rect class=\"bh\" x=\"80\" y=\"134\" width=\"230\" height=\"110\" rx=\"6\"/><text class=\"tl\" x=\"195\" y=\"174\" font-size=\"13\" text-anchor=\"middle\" >1 Telling<\/text><text class=\"tm\" x=\"195\" y=\"196\" font-size=\"10\" text-anchor=\"middle\" >Unable and unwilling<\/text><text class=\"tm\" x=\"195\" y=\"214\" font-size=\"10\" text-anchor=\"middle\" >High task · Low relationship<\/text><rect class=\"hl\" x=\"320\" y=\"134\" width=\"230\" height=\"110\" rx=\"6\"/><text class=\"tl\" x=\"435\" y=\"174\" font-size=\"13\" text-anchor=\"middle\" >2 Selling<\/text><text class=\"tm\" x=\"435\" y=\"196\" font-size=\"10\" text-anchor=\"middle\" >Unable but willing<\/text><text class=\"tm\" x=\"435\" y=\"214\" font-size=\"10\" text-anchor=\"middle\" >High task · High relationship<\/text><\/svg><figcaption>纵轴是能力，横轴是意愿。按左下 1 → 右下 2 → 左上 3 → 右上 4 的顺序记：没能力没意愿 Telling，没能力有意愿 Selling，有能力没意愿 Participating，都有 Delegating。<\/figcaption><\/figure><div class=\"sum\">Path-Goal: the leader picks directive, supportive, participative or achievement-oriented behaviour to fit the employee and the environment. Situational Leadership: match Telling, Selling, Participating or Delegating to follower ability and willingness.<\/div>\n\n<h2>4. Leaders &amp; Followers（p.27）<\/h2>\n<p>无效的追随者可能比无效的领导者<b>更拖累<\/b>组织。有效追随者的特点：<\/p>\n<ul>\n<li>Manage themselves well（自我管理好）<\/li>\n<li>Committed to a purpose outside themselves（为更大的目标投入）<\/li>\n<li>Build competence and focus efforts for maximum impact（提升能力、集中发力）<\/li>\n<li>Courageous, honest, and credible（勇敢、诚实、可信）<\/li>\n<\/ul>\n<div class=\"sum\">Effective followers manage themselves, commit to a shared purpose, build competence, and are courageous, honest and credible.<\/div>\n\n<h2>5. Power（权力，p.32–41）<\/h2>\n<p><span class=\"t\">Power<\/span> = the capacity of a person, team, or organization to <span class=\"k\">influence<\/span> others（影响他人的能力）。<\/p>\n<h3>Sources of Power<span class=\"hot\">高频考点<\/span><\/h3>\n<table>\n<tr><th>Positional 职位权力（p.34）<\/th><th>Personal 个人权力（p.35）<\/th><\/tr>\n<tr><td><b>Coercive<\/b>：能惩罚别人<\/td><td><b>Expert<\/b>：专业知识和技能<\/td><\/tr>\n<tr><td><b>Reward<\/b>：能给奖励（如奖金）<\/td><td><b>Referent<\/b>：别人欣赏、认同你<\/td><\/tr>\n<tr><td><b>Legitimate<\/b>：正式职位带来的权力<\/td><td><b>Information<\/b>：掌握别人需要的信息<\/td><\/tr>\n<\/table>\n<p class=\"muted\">课件这两页只有图片和名称，上面的定义是通用教材的标准解释。<\/p>\n<figure class=\"f9\"><svg viewBox=\"0 0 600 180\" role=\"img\" aria-label=\"Positional and personal sources of power\"><text class=\"tl\" x=\"150\" y=\"16\" font-size=\"12\" text-anchor=\"middle\" >Positional power<\/text><rect class=\"b1\" x=\"20\" y=\"28\" width=\"260\" height=\"36\" rx=\"4\"/><text class=\"tb1\" x=\"150.0\" y=\"49.9\" font-size=\"11\" text-anchor=\"middle\">Coercive — can punish<\/text><rect class=\"b1\" x=\"20\" y=\"72\" width=\"260\" height=\"36\" rx=\"4\"/><text class=\"tb1\" x=\"150.0\" y=\"93.8\" font-size=\"11\" text-anchor=\"middle\">Reward — can give rewards<\/text><rect class=\"b1\" x=\"20\" y=\"116\" width=\"260\" height=\"36\" rx=\"4\"/><text class=\"tb1\" x=\"150.0\" y=\"137.8\" font-size=\"11\" text-anchor=\"middle\">Legitimate — formal position<\/text><text class=\"tl\" x=\"450\" y=\"16\" font-size=\"12\" text-anchor=\"middle\" >Personal power<\/text><rect class=\"b2\" x=\"320\" y=\"28\" width=\"260\" height=\"36\" rx=\"4\"/><text class=\"tb2\" x=\"450.0\" y=\"49.9\" font-size=\"11\" text-anchor=\"middle\">Expert — skills & knowledge<\/text><rect class=\"b2\" x=\"320\" y=\"72\" width=\"260\" height=\"36\" rx=\"4\"/><text class=\"tb2\" x=\"450.0\" y=\"93.8\" font-size=\"11\" text-anchor=\"middle\">Referent — admired, liked<\/text><rect class=\"b2\" x=\"320\" y=\"116\" width=\"260\" height=\"36\" rx=\"4\"/><text class=\"tb2\" x=\"450.0\" y=\"137.8\" font-size=\"11\" text-anchor=\"middle\">Information — has needed info<\/text><text class=\"tm\" x=\"310\" y=\"170\" font-size=\"10\" text-anchor=\"middle\" >Power ↑ when resources are important · scarce · have no substitutes<\/text><\/svg><figcaption>左边 3 种来自职位，右边 3 种来自个人。<\/figcaption><\/figure><h3>Your Power Will Increase if…（p.41）<\/h3>\n<ul>\n<li><b>Important<\/b>：你控制的资源有价值（importance）<\/li>\n<li><b>Scarce<\/b>：资源稀缺、独特（scarcity）<\/li>\n<li><b>No substitutes<\/b>：找不到同样好用的替代品（substitutability）<\/li>\n<\/ul>\n<div class=\"sum\">Power is the capacity to influence others. Positional power: coercive, reward, legitimate. Personal power: expert, referent, information. Power grows when resources are important, scarce and non-substitutable.<\/div>\n\n<h2>6. Influence（影响，p.44–46）<\/h2>\n<p><span class=\"t\">Influence<\/span> = 任何试图改变别人态度或行为的行为。<b>Influence tactics<\/b> = 人们如何运用自己的权力基础。<\/p>\n<h3>三种结果<\/h3>\n<ul>\n<li><b>Commitment<\/b>：热情接受，认真完成（最好）<\/li>\n<li><b>Compliance<\/b>：勉强照做，只出最少力气<\/li>\n<li><b>Resistance<\/b>：反对，设法逃避（最差）<\/li>\n<\/ul>\n<h3>Influence Tactics Use and Outcomes（p.46）<span class=\"hot\">易错点<\/span><\/h3>\n<table>\n<tr><th>Tactic<\/th><th>使用频率<\/th><th>Resistance<\/th><th>Compliance<\/th><th>Commitment<\/th><\/tr>\n<tr><td class=\"h\">Rational persuasion<\/td><td><b>54%<\/b><\/td><td><b>47%<\/b><\/td><td>30%<\/td><td>23%<\/td><\/tr>\n<tr><td class=\"h\">Legitimating<\/td><td>13%<\/td><td>44%<\/td><td>56%<\/td><td>0%<\/td><\/tr>\n<tr><td class=\"h\">Personal appeals<\/td><td>7%<\/td><td>25%<\/td><td>33%<\/td><td>42%<\/td><\/tr>\n<tr><td class=\"h\">Exchange<\/td><td>7%<\/td><td>24%<\/td><td>41%<\/td><td>35%<\/td><\/tr>\n<tr><td class=\"h\">Ingratiation<\/td><td>6%<\/td><td>41%<\/td><td>28%<\/td><td>31%<\/td><\/tr>\n<tr><td class=\"h\">Pressure<\/td><td>6%<\/td><td>56%<\/td><td>41%<\/td><td>3%<\/td><\/tr>\n<tr><td class=\"h\">Coalitions<\/td><td>3%<\/td><td>53%<\/td><td>44%<\/td><td>3%<\/td><\/tr>\n<tr><td class=\"h\">Inspirational appeals<\/td><td><b>2%<\/b><\/td><td>0%<\/td><td>10%<\/td><td><b>90%<\/b><\/td><\/tr>\n<tr><td class=\"h\">Consultation<\/td><td>2%<\/td><td>18%<\/td><td>27%<\/td><td>55%<\/td><\/tr>\n<\/table>\n<p>记住反差：<b>Rational persuasion<\/b> 用得最多（54%），但抵制也最多（47%）；<b>Inspirational appeals<\/b> 用得最少（2%），但 commitment 最高（90%）；<b>Legitimating<\/b> 的 commitment 是 0%。<\/p>\n<figure class=\"f9\"><svg viewBox=\"0 0 600 280\" role=\"img\" aria-label=\"Influence tactics: frequency and outcomes\"><text class=\"tl\" x=\"160\" y=\"14\" font-size=\"10\" text-anchor=\"end\" >Used<\/text><text class=\"tl\" x=\"200\" y=\"14\" font-size=\"10\" text-anchor=\"start\" >Resistance<\/text><text class=\"tl\" x=\"330\" y=\"14\" font-size=\"10\" text-anchor=\"start\" >Compliance<\/text><text class=\"tl\" x=\"470\" y=\"14\" font-size=\"10\" text-anchor=\"start\" >Commitment<\/text><text class=\"tl\" x=\"118\" y=\"38\" font-size=\"10\" text-anchor=\"end\" >Rational persuasion<\/text><text class=\"tl\" x=\"160\" y=\"38\" font-size=\"10\" text-anchor=\"end\" >54%<\/text><rect class=\"bh\" x=\"170.0\" y=\"24\" width=\"188.0\" height=\"18\"/><text class=\"tb1\" x=\"264.0\" y=\"37\" font-size=\"9\" text-anchor=\"middle\" >47<\/text><rect class=\"b3\" x=\"358.0\" y=\"24\" width=\"120.0\" height=\"18\"/><text class=\"tb1\" x=\"418.0\" y=\"37\" font-size=\"9\" text-anchor=\"middle\" >30<\/text><rect class=\"b2\" x=\"478.0\" y=\"24\" width=\"92.0\" height=\"18\"/><text class=\"tb1\" x=\"524.0\" y=\"37\" font-size=\"9\" text-anchor=\"middle\" >23<\/text><text class=\"tm\" x=\"118\" y=\"62\" font-size=\"10\" text-anchor=\"end\" >Legitimating<\/text><text class=\"tm\" x=\"160\" y=\"62\" font-size=\"10\" text-anchor=\"end\" >13%<\/text><rect class=\"bh\" x=\"170.0\" y=\"48\" width=\"176.0\" height=\"18\"/><text class=\"tb1\" x=\"258.0\" y=\"61\" font-size=\"9\" text-anchor=\"middle\" >44<\/text><rect class=\"b3\" x=\"346.0\" y=\"48\" width=\"224.0\" height=\"18\"/><text class=\"tb1\" x=\"458.0\" y=\"61\" font-size=\"9\" text-anchor=\"middle\" >56<\/text><text class=\"tm\" x=\"118\" y=\"86\" font-size=\"10\" text-anchor=\"end\" >Personal appeals<\/text><text class=\"tm\" x=\"160\" y=\"86\" font-size=\"10\" text-anchor=\"end\" >7%<\/text><rect class=\"bh\" x=\"170.0\" y=\"72\" width=\"100.0\" height=\"18\"/><text class=\"tb1\" x=\"220.0\" y=\"85\" font-size=\"9\" text-anchor=\"middle\" >25<\/text><rect class=\"b3\" x=\"270.0\" y=\"72\" width=\"132.0\" height=\"18\"/><text class=\"tb1\" x=\"336.0\" y=\"85\" font-size=\"9\" text-anchor=\"middle\" >33<\/text><rect class=\"b2\" x=\"402.0\" y=\"72\" width=\"168.0\" height=\"18\"/><text class=\"tb1\" x=\"486.0\" y=\"85\" font-size=\"9\" text-anchor=\"middle\" >42<\/text><text class=\"tm\" x=\"118\" y=\"110\" font-size=\"10\" text-anchor=\"end\" >Exchange<\/text><text class=\"tm\" x=\"160\" y=\"110\" font-size=\"10\" text-anchor=\"end\" >7%<\/text><rect class=\"bh\" x=\"170.0\" y=\"96\" width=\"96.0\" height=\"18\"/><text class=\"tb1\" x=\"218.0\" y=\"109\" font-size=\"9\" text-anchor=\"middle\" >24<\/text><rect class=\"b3\" x=\"266.0\" y=\"96\" width=\"164.0\" height=\"18\"/><text class=\"tb1\" x=\"348.0\" y=\"109\" font-size=\"9\" text-anchor=\"middle\" >41<\/text><rect class=\"b2\" x=\"430.0\" y=\"96\" width=\"140.0\" height=\"18\"/><text class=\"tb1\" x=\"500.0\" y=\"109\" font-size=\"9\" text-anchor=\"middle\" >35<\/text><text class=\"tm\" x=\"118\" y=\"134\" font-size=\"10\" text-anchor=\"end\" >Ingratiation<\/text><text class=\"tm\" x=\"160\" y=\"134\" font-size=\"10\" text-anchor=\"end\" >6%<\/text><rect class=\"bh\" x=\"170.0\" y=\"120\" width=\"164.0\" height=\"18\"/><text class=\"tb1\" x=\"252.0\" y=\"133\" font-size=\"9\" text-anchor=\"middle\" >41<\/text><rect class=\"b3\" x=\"334.0\" y=\"120\" width=\"112.0\" height=\"18\"/><text class=\"tb1\" x=\"390.0\" y=\"133\" font-size=\"9\" text-anchor=\"middle\" >28<\/text><rect class=\"b2\" x=\"446.0\" y=\"120\" width=\"124.0\" height=\"18\"/><text class=\"tb1\" x=\"508.0\" y=\"133\" font-size=\"9\" text-anchor=\"middle\" >31<\/text><text class=\"tm\" x=\"118\" y=\"158\" font-size=\"10\" text-anchor=\"end\" >Pressure<\/text><text class=\"tm\" x=\"160\" y=\"158\" font-size=\"10\" text-anchor=\"end\" >6%<\/text><rect class=\"bh\" x=\"170.0\" y=\"144\" width=\"224.0\" height=\"18\"/><text class=\"tb1\" x=\"282.0\" y=\"157\" font-size=\"9\" text-anchor=\"middle\" >56<\/text><rect class=\"b3\" x=\"394.0\" y=\"144\" width=\"164.0\" height=\"18\"/><text class=\"tb1\" x=\"476.0\" y=\"157\" font-size=\"9\" text-anchor=\"middle\" >41<\/text><rect class=\"b2\" x=\"558.0\" y=\"144\" width=\"12.0\" height=\"18\"/><text class=\"tm\" x=\"118\" y=\"182\" font-size=\"10\" text-anchor=\"end\" >Coalitions<\/text><text class=\"tm\" x=\"160\" y=\"182\" font-size=\"10\" text-anchor=\"end\" >3%<\/text><rect class=\"bh\" x=\"170.0\" y=\"168\" width=\"212.0\" height=\"18\"/><text class=\"tb1\" x=\"276.0\" y=\"181\" font-size=\"9\" text-anchor=\"middle\" >53<\/text><rect class=\"b3\" x=\"382.0\" y=\"168\" width=\"176.0\" height=\"18\"/><text class=\"tb1\" x=\"470.0\" y=\"181\" font-size=\"9\" text-anchor=\"middle\" >44<\/text><rect class=\"b2\" x=\"558.0\" y=\"168\" width=\"12.0\" height=\"18\"/><text class=\"tl\" x=\"118\" y=\"206\" font-size=\"10\" text-anchor=\"end\" >Inspirational appeals<\/text><text class=\"tl\" x=\"160\" y=\"206\" font-size=\"10\" text-anchor=\"end\" >2%<\/text><rect class=\"b3\" x=\"170.0\" y=\"192\" width=\"40.0\" height=\"18\"/><text class=\"tb1\" x=\"190.0\" y=\"205\" font-size=\"9\" text-anchor=\"middle\" >10<\/text><rect class=\"b2\" x=\"210.0\" y=\"192\" width=\"360.0\" height=\"18\"/><text class=\"tb1\" x=\"390.0\" y=\"205\" font-size=\"9\" text-anchor=\"middle\" >90<\/text><text class=\"tm\" x=\"118\" y=\"230\" font-size=\"10\" text-anchor=\"end\" >Consultation<\/text><text class=\"tm\" x=\"160\" y=\"230\" font-size=\"10\" text-anchor=\"end\" >2%<\/text><rect class=\"bh\" x=\"170.0\" y=\"216\" width=\"72.0\" height=\"18\"/><text class=\"tb1\" x=\"206.0\" y=\"229\" font-size=\"9\" text-anchor=\"middle\" >18<\/text><rect class=\"b3\" x=\"242.0\" y=\"216\" width=\"108.0\" height=\"18\"/><text class=\"tb1\" x=\"296.0\" y=\"229\" font-size=\"9\" text-anchor=\"middle\" >27<\/text><rect class=\"b2\" x=\"350.0\" y=\"216\" width=\"220.0\" height=\"18\"/><text class=\"tb1\" x=\"460.0\" y=\"229\" font-size=\"9\" text-anchor=\"middle\" >55<\/text><text class=\"tm\" x=\"300\" y=\"258\" font-size=\"10\" text-anchor=\"middle\" >Rational persuasion: used most, most resistance<\/text><text class=\"tm\" x=\"300\" y=\"272\" font-size=\"10\" text-anchor=\"middle\" >Inspirational appeals: used least, most commitment<\/text><\/svg><figcaption>红 = 抵制，灰 = 服从，绿 = 承诺。理性说服用得最多（54%）但抵制最多（47%）；感召用得最少（2%）但承诺最高（90%）；合法化的承诺是 0。<\/figcaption><\/figure><div class=\"sum\">Influence tactics lead to commitment, compliance or resistance. Rational persuasion is used most but meets the most resistance; inspirational appeals are used least but create the most commitment.<\/div>\n\n<h2>7. Politics（组织政治，p.42–50）<\/h2>\n<p><span class=\"t\">Political behaviour<\/span> = 影响或试图影响组织内<span class=\"k\">利益与不利分配<\/span>（distribution of advantages and disadvantages）的活动。<\/p>\n<h3>Types of Political Activity（p.48）<\/h3>\n<ul>\n<li>Impression management（印象管理）<\/li>\n<li>Attacking or blaming others（攻击或甩锅）<\/li>\n<li>Withholding or distorting information（隐瞒或歪曲信息）<\/li>\n<li>Building support for ideas（为想法争取支持）<\/li>\n<li>Praising others（称赞别人）<\/li>\n<li>Building coalitions（结盟）<\/li>\n<li>Associating with influential people（接近有影响力的人）<\/li>\n<li>Creating obligations（制造人情）<\/li>\n<\/ul>\n<h3>The Abuse of Power（p.49）<\/h3>\n<ul>\n<li><b>Workplace bullying<\/b>：physical、verbal、social、cyber；可以发生在任何层级之间，也可以在同事之间<\/li>\n<li><b>Sexual harassment<\/b>：工作场所中不受欢迎的性相关行为，影响工作环境或带来不利的工作后果。例如不必要的身体接触、侵入个人空间、多次被拒仍邀约、附带承诺或威胁的性要求<\/li>\n<\/ul>\n<h3>Controlling Political Behaviour（p.50）<\/h3>\n<ul>\n<li>Ensure sufficient resources（资源充足）<\/li>\n<li>Keep employees informed（信息透明）<\/li>\n<li>Empower employees（给员工授权）<\/li>\n<li>Foster norms to reject self-serving political behaviour（建立拒绝自私政治的规范）<\/li>\n<li>Be a good role model（以身作则）<\/li>\n<\/ul>\n<p class=\"muted\">课堂案例：Case 07 · Leadership Crisis at Meridian Manufacturing。<\/p>\n<div class=\"sum\">Political behaviour tries to influence who gets advantages. Managers can limit harmful politics with enough resources, open information, empowerment, clear norms and good role modelling.<\/div>\n\n", "terms": [{"t": "Achievement-oriented", "z": "成就导向：设定有挑战的目标（Path-Goal）", "e": "Path-Goal style: sets challenging goals and expects the best performance."}, {"t": "Associating with influential people", "z": "接近有影响力的人（政治行为）", "e": "A political activity: spending time with powerful people to gain advantage."}, {"t": "Attacking or blaming others", "z": "攻击或甩锅（政治行为）", "e": "A political activity: blaming others to avoid responsibility."}, {"t": "Authority-obedience (9,1)", "z": "权威-服从型：只看绩效", "e": "Managerial Grid: high concern for production, low for people; only results matter."}, {"t": "Autocratic", "z": "专制型：领导一人做决定", "e": "Lewin style: \"Do X\"; the leader makes all decisions. Motivation = fear of punishment; use with many inexperienced staff."}, {"t": "Building coalitions", "z": "结盟（政治行为）", "e": "A political activity: forming groups that support your position."}, {"t": "Building support for ideas", "z": "为想法争取支持（政治行为）", "e": "A political activity: getting others to back your ideas before a decision."}, {"t": "Coercive power", "z": "强制权：能惩罚", "e": "Positional power based on the ability to punish."}, {"t": "Commitment", "z": "承诺：热情接受、认真做", "e": "Best influence outcome: the person agrees and works hard on the request."}, {"t": "Compliance", "z": "服从：勉强照做", "e": "Influence outcome: the person does the request but with minimal effort."}, {"t": "Consultation", "z": "咨询：让对方参与（55% commitment）", "e": "Influence tactic: asking for the other person's input; often leads to commitment."}, {"t": "Contingent reward", "z": "权变奖励：表现好就奖励", "e": "Transactional behaviour: exchanging rewards for effort and good performance."}, {"t": "Country club (1,9)", "z": "乡村俱乐部型：只照顾人", "e": "Managerial Grid: high concern for people, low for production; friendly but little work."}, {"t": "Creating obligations", "z": "制造人情（政治行为）", "e": "A political activity: doing favours so others owe you."}, {"t": "Delegating (S4)", "z": "授权：能力够、意愿高", "e": "Situational style for able and willing followers: low task, low relationship."}, {"t": "Democratic", "z": "民主型：一起决定", "e": "Lewin style: \"Which is best, X or Y?\"; decisions with the team. Use with experienced professionals."}, {"t": "Directive", "z": "指导型：给结构、讲清怎么做（Path-Goal）", "e": "Path-Goal style: gives structure and tells employees how to do the work."}, {"t": "Expert power", "z": "专家权：专业知识技能", "e": "Personal power based on skills and knowledge."}, {"t": "Extraversion", "z": "外向性：最能预测谁当领导", "e": "The trait that best predicts leadership emergence (who becomes a leader)."}, {"t": "Idealized influence", "z": "理想化影响：愿景、信任（4 I's）", "e": "Transformational: gives vision and a sense of mission; earns respect and trust."}, {"t": "Impoverished (1,1)", "z": "贫乏型：最低努力", "e": "Managerial Grid: low concern for both; minimum effort to keep the job."}, {"t": "Impression management", "z": "印象管理（政治行为）", "e": "A political activity: controlling how others see you."}, {"t": "Individual consideration", "z": "个别关怀：一对一辅导（4 I's）", "e": "Transformational: gives personal attention, coaching and advice to each employee."}, {"t": "Influence", "z": "影响：改变别人的态度或行为", "e": "Any behaviour that tries to change another person's attitudes or behaviour."}, {"t": "Influence tactics", "z": "影响策略：如何使用权力", "e": "How people use their power bases to influence others."}, {"t": "Information power", "z": "信息权：掌握别人需要的信息", "e": "Personal power from having information that others need."}, {"t": "Inspirational appeals", "z": "感召：用得最少（2%）、commitment 最高（90%）", "e": "Influence tactic that appeals to values and emotions; used least but creates the most commitment."}, {"t": "Inspirational motivation", "z": "鼓舞激励：高期望（4 I's）", "e": "Transformational: communicates high expectations and important goals simply."}, {"t": "Intellectual stimulation", "z": "智力激发：理性解决问题（4 I's）", "e": "Transformational: encourages rational thinking and careful problem solving."}, {"t": "Laissez-faire", "z": "放任型：几乎不管", "e": "Lewin: \"Do X or Y as you see fit\"; in the full range model, the leader avoids responsibility and decisions."}, {"t": "Leadership", "z": "领导：带领一群人或组织", "e": "The act of leading a group of people or an organization."}, {"t": "Leadership emergence", "z": "领导涌现：谁会成为领导", "e": "Who becomes a leader; best predicted by extraversion."}, {"t": "Legitimate power", "z": "法定权：正式职位", "e": "Positional power from a formal position in the organization."}, {"t": "Legitimating", "z": "合法化：commitment 为 0%", "e": "Influence tactic: using authority or rules to justify a request; 0% commitment."}, {"t": "Management by exception (active)", "z": "主动例外管理：主动找偏差", "e": "Transactional: actively looks for mistakes and corrects them early."}, {"t": "Management by exception (passive)", "z": "被动例外管理：出问题才管", "e": "Transactional: acts only after standards are not met."}, {"t": "Manager vs. leader", "z": "管理者 vs 领导者", "e": "Managers: stability, work, \"doing things right\"; leaders: change, people, \"doing the right things\"."}, {"t": "Managerial Grid", "z": "管理方格（Blake & Mouton）", "e": "Model with concern for production (x) and concern for people (y); best style = Team (9,9)."}, {"t": "Middle-of-the-road (5,5)", "z": "中庸型：两边平衡", "e": "Managerial Grid: balances getting work done with keeping morale."}, {"t": "Participating (S3)", "z": "参与：能力够、意愿低", "e": "Situational style for able but unwilling followers: low task, high relationship."}, {"t": "Participative", "z": "参与型：让员工参与（Path-Goal）", "e": "Path-Goal style: asks for and uses employees' suggestions."}, {"t": "Path-Goal Theory", "z": "路径-目标理论：帮员工扫清障碍", "e": "The leader changes behaviour to clear the path to goals, based on subordinate and environmental contingencies."}, {"t": "Political behaviour", "z": "政治行为：争夺利益分配", "e": "Activities that influence the distribution of advantages and disadvantages in an organization."}, {"t": "Power", "z": "权力：影响他人的能力", "e": "The capacity of a person, team or organization to influence others."}, {"t": "Rational persuasion", "z": "理性说服：用得最多（54%）、抵制最多（47%）", "e": "Influence tactic using logic and facts; used most but meets the most resistance."}, {"t": "Readiness", "z": "准备度 = 能力 + 意愿", "e": "In Situational Leadership: the follower's ability and willingness to do a task."}, {"t": "Referent power", "z": "参照权：别人欣赏你", "e": "Personal power based on others liking and admiring you."}, {"t": "Resistance", "z": "抵制：反对、逃避", "e": "Worst influence outcome: the person opposes or avoids the request."}, {"t": "Reward power", "z": "奖赏权：能给奖励", "e": "Positional power based on the ability to give rewards."}, {"t": "Selling (S2)", "z": "推销：没能力、有意愿", "e": "Situational style for unable but willing followers: high task, high relationship."}, {"t": "Situational Leadership", "z": "情境领导（Hersey-Blanchard）", "e": "Match the style (telling, selling, participating, delegating) to the follower's readiness."}, {"t": "Supportive", "z": "支持型：关心员工（Path-Goal）", "e": "Path-Goal style: gives psychological support and care; good for stress or unpleasant tasks."}, {"t": "Team (9,9)", "z": "团队型：最理想", "e": "Managerial Grid: high concern for both; committed people and trust. The best style."}, {"t": "Telling (S1)", "z": "告知：没能力、没意愿", "e": "Situational style for unable and unwilling followers: high task, low relationship."}, {"t": "Trait theory", "z": "特质理论：谁当领导（Who?）", "e": "Looks at personal traits of leaders; better predicts emergence than effectiveness."}, {"t": "Transactional leadership", "z": "交易型领导：奖励换表现", "e": "Leading by exchanging rewards for performance (contingent reward, MBE)."}, {"t": "Transformational leadership", "z": "变革型领导：4 个 I", "e": "Leading change by inspiring people through the 4 I's."}, {"t": "Withholding or distorting information", "z": "隐瞒或歪曲信息（政治行为）", "e": "A political activity: hiding or changing information to gain advantage."}, {"t": "Workplace bullying", "z": "职场霸凌：身体、言语、社交、网络", "e": "Abuse of power: physical, verbal, social or cyber bullying at any level."}]}, {"n": 8, "en": "Decision-Making", "zh": "决策", "notes": "<style>\n.f9{margin:12px 0 16px;overflow-x:auto}\n.f9 svg{display:block;width:100%;max-width:640px;height:auto;font-family:var(--body)}\n.f9 figcaption{font-size:13px;color:var(--muted);margin-top:4px}\n.f9 rect,.f9 circle,.f9 path{stroke-width:1}\n.f9 .bk{fill:var(--ink)} .f9 .tbk{fill:var(--bg);font-weight:700}\n.f9 .b1{fill:var(--kbg)} .f9 .b2{fill:var(--green-bg);stroke:var(--green)} .f9 .b3{fill:var(--th);stroke:var(--muted);stroke-opacity:.5} .f9 .b1{stroke:var(--blue);stroke-opacity:.35}\n.f9 .bs{fill:var(--chip);stroke:var(--muted);stroke-dasharray:3 2} .f9 .bh{fill:var(--tbg)}\n.f9 .hl{fill:var(--gold-bg);stroke:var(--gold);stroke-width:2.5} .f9 .hl2{fill:var(--tbg);stroke:var(--bg);stroke-width:2}\n.f9 .tb1,.f9 .tb2,.f9 .tb3,.f9 .tbh,.f9 .thl{fill:var(--fg)} .f9 .tbs{fill:var(--muted)}\n.f9 .tb{fill:var(--fg);font-weight:700} .f9 .tl{fill:var(--ink);font-weight:700} .f9 .tm{fill:var(--muted)}\n.f9 .ln{stroke:var(--blue);stroke-width:1.5;fill:none} .f9 .dash{stroke:var(--blue);stroke-width:2;stroke-dasharray:6 4;fill:none}\n.f9 .thick{stroke:var(--hot);stroke-width:2.5} .f9 .thin{stroke:var(--line);stroke-width:1}\n.f9 .arr,.f9 .arrh{stroke:var(--hot);stroke-width:1.6;fill:none} .f9 .arr2,.f9 .arrh2{stroke:var(--green);stroke-width:1.6;fill:none}\n<\/style>\n\n\n<h2>1. Rational Decision-Making Model（理性决策模型，p.3–8）<\/h2>\n<p>理想情况下，决策按 <span class=\"t\">6 个步骤<\/span>进行：<\/p>\n<table>\n<tr><th>Step<\/th><th>Model<\/th><th>课件例子：招一名会计<\/th><\/tr>\n<tr><td class=\"h\">1<\/td><td>Define the problem（定义问题）<\/td><td>Hire a new accountant<\/td><\/tr>\n<tr><td class=\"h\">2<\/td><td>Identify the criteria（确定标准）· What is important?<\/td><td>certificate · work experience · education level · interpersonal skills<\/td><\/tr>\n<tr><td class=\"h\">3<\/td><td>Allocate weights to the criteria（给标准分配权重）· How important?<\/td><td>证书和经验 = 很重要；学历 = 重要；人际能力 = 不太重要<\/td><\/tr>\n<tr><td class=\"h\">4<\/td><td>Develop alternatives（列出备选方案）· What are the options?<\/td><td>100 job candidates<\/td><\/tr>\n<tr><td class=\"h\">5<\/td><td>Evaluate the alternatives（评估方案）<\/td><td>按 4 个加权标准给每位候选人打分<\/td><\/tr>\n<tr><td class=\"h\">6<\/td><td>Select the best alternative（选出最佳方案）<\/td><td>算总分，选分数最高的人<\/td><\/tr>\n<\/table>\n\n<figure class=\"f9\"><svg viewBox=\"0 0 600 262\" role=\"img\" aria-label=\"Six steps of the rational decision-making model\"><circle class=\"b3\" cx=\"300\" cy=\"130\" r=\"58\"/><text class=\"tl\" x=\"300\" y=\"126\" font-size=\"12\" text-anchor=\"middle\" >Rational<\/text><text class=\"tl\" x=\"300\" y=\"142\" font-size=\"11\" text-anchor=\"middle\" >decision-making<\/text><rect class=\"b1\" x=\"220.0\" y=\"14.0\" width=\"160\" height=\"32\" rx=\"4\"/><text class=\"tb1\" x=\"300.0\" y=\"33.9\" font-size=\"11\" text-anchor=\"middle\">1 Define the problem<\/text><rect class=\"b1\" x=\"384.54482671904333\" y=\"64.0\" width=\"160\" height=\"32\" rx=\"4\"/><text class=\"tb1\" x=\"464.54482671904333\" y=\"83.8\" font-size=\"11\" text-anchor=\"middle\">2 Identify criteria<\/text><rect class=\"b1\" x=\"384.5448267190434\" y=\"164.0\" width=\"160\" height=\"32\" rx=\"4\"/><text class=\"tb1\" x=\"464.5448267190434\" y=\"183.8\" font-size=\"11\" text-anchor=\"middle\">3 Allocate weights<\/text><rect class=\"b1\" x=\"220.0\" y=\"214.0\" width=\"160\" height=\"32\" rx=\"4\"/><text class=\"tb1\" x=\"300.0\" y=\"233.8\" font-size=\"11\" text-anchor=\"middle\">4 Develop alternatives<\/text><rect class=\"b1\" x=\"55.4551732809567\" y=\"164.00000000000003\" width=\"160\" height=\"32\" rx=\"4\"/><text class=\"tb1\" x=\"135.4551732809567\" y=\"183.9\" font-size=\"11\" text-anchor=\"middle\">5 Evaluate alternatives<\/text><rect class=\"b1\" x=\"55.45517328095667\" y=\"63.999999999999986\" width=\"160\" height=\"32\" rx=\"4\"/><text class=\"tb1\" x=\"135.45517328095667\" y=\"83.8\" font-size=\"11\" text-anchor=\"middle\">6 Select the best<\/text><circle class=\"b2\" cx=\"375\" cy=\"59\" r=\"4\"/><circle class=\"b2\" cx=\"450\" cy=\"130\" r=\"4\"/><circle class=\"b2\" cx=\"375\" cy=\"201\" r=\"4\"/><circle class=\"b2\" cx=\"225\" cy=\"201\" r=\"4\"/><circle class=\"b2\" cx=\"150\" cy=\"130\" r=\"4\"/><circle class=\"b2\" cx=\"225\" cy=\"59\" r=\"4\"/><\/svg><figcaption>理性决策的 6 步按顺时针走一圈。<\/figcaption><\/figure><h3>Decision Matrix（决策矩阵）<span class=\"hot\">高频考点<\/span><\/h3>\n<ul>\n<li>列出所有 <b>options<\/b>（备选方案）和 <b>criteria<\/b>（标准）<\/li>\n<li>给每个标准一个 <b>weight<\/b>，例如 1–3（1 = 不重要，3 = 很重要）<\/li>\n<li>给每个方案在每个标准上打 <b>rating<\/b>，例如 1–3（1 = 不理想，3 = 理想）<\/li>\n<li><b>Score = Weight × Rating<\/b>，加总后 <b>分数最高的方案胜出<\/b><\/li>\n<\/ul>\n<div class=\"formula\">Total score = Σ（Weight × Rating）<\/div>\n<p>课件例子：选餐厅<\/p>\n<table>\n<tr><th>Criteria<\/th><th>Weight<\/th><th>Thai（rating → score）<\/th><th>Pizza<\/th><th>Greek<\/th><\/tr>\n<tr><td class=\"h\">Allergies<\/td><td>3<\/td><td>3 → 9<\/td><td>1 → 3<\/td><td>2 → 6<\/td><\/tr>\n<tr><td class=\"h\">Cost<\/td><td>2<\/td><td>2 → 4<\/td><td>3 → 6<\/td><td>3 → 6<\/td><\/tr>\n<tr><td class=\"h\">Distance<\/td><td>3<\/td><td>1 → 3<\/td><td>2 → 6<\/td><td>1 → 3<\/td><\/tr>\n<tr><td class=\"h\">Cuisine<\/td><td>1<\/td><td>3 → 3<\/td><td>2 → 2<\/td><td>2 → 2<\/td><\/tr>\n<tr><td class=\"h\">Reviews<\/td><td>2<\/td><td>3 → 6<\/td><td>1 → 2<\/td><td>2 → 4<\/td><\/tr>\n<tr><td class=\"h\">Total<\/td><td><\/td><td><b>25 ✔<\/b><\/td><td>19<\/td><td>21<\/td><\/tr>\n<\/table>\n<p>结果：<b>Thai 得分最高（25）<\/b>，所以选 Thai。考试如果给数据，记得<b>先乘权重再加总<\/b>，不要直接加 rating。<\/p>\n<figure class=\"f9\"><svg viewBox=\"0 0 560 158\" role=\"img\" aria-label=\"Decision matrix scores for Thai, Greek and Pizza\"><text class=\"tl\" x=\"70\" y=\"32\" font-size=\"12\" text-anchor=\"end\" >Thai<\/text><rect class=\"bh\" x=\"80\" y=\"14\" width=\"144\" height=\"26\"/><text class=\"tb1\" x=\"152.0\" y=\"31\" font-size=\"10\" text-anchor=\"middle\" >9<\/text><rect class=\"b1\" x=\"224\" y=\"14\" width=\"64\" height=\"26\"/><text class=\"tb1\" x=\"256.0\" y=\"31\" font-size=\"10\" text-anchor=\"middle\" >4<\/text><rect class=\"b2\" x=\"288\" y=\"14\" width=\"48\" height=\"26\"/><text class=\"tb1\" x=\"312.0\" y=\"31\" font-size=\"10\" text-anchor=\"middle\" >3<\/text><rect class=\"hl\" x=\"336\" y=\"14\" width=\"48\" height=\"26\"/><text class=\"tb1\" x=\"360.0\" y=\"31\" font-size=\"10\" text-anchor=\"middle\" >3<\/text><rect class=\"bs\" x=\"384\" y=\"14\" width=\"96\" height=\"26\"/><text class=\"tb1\" x=\"432.0\" y=\"31\" font-size=\"10\" text-anchor=\"middle\" >6<\/text><text class=\"tl\" x=\"488\" y=\"32\" font-size=\"12\" text-anchor=\"start\" >= 25 ✓<\/text><text class=\"tl\" x=\"70\" y=\"72\" font-size=\"12\" text-anchor=\"end\" >Greek<\/text><rect class=\"bh\" x=\"80\" y=\"54\" width=\"96\" height=\"26\"/><text class=\"tb1\" x=\"128.0\" y=\"71\" font-size=\"10\" text-anchor=\"middle\" >6<\/text><rect class=\"b1\" x=\"176\" y=\"54\" width=\"96\" height=\"26\"/><text class=\"tb1\" x=\"224.0\" y=\"71\" font-size=\"10\" text-anchor=\"middle\" >6<\/text><rect class=\"b2\" x=\"272\" y=\"54\" width=\"48\" height=\"26\"/><text class=\"tb1\" x=\"296.0\" y=\"71\" font-size=\"10\" text-anchor=\"middle\" >3<\/text><rect class=\"hl\" x=\"320\" y=\"54\" width=\"32\" height=\"26\"/><text class=\"tb1\" x=\"336.0\" y=\"71\" font-size=\"10\" text-anchor=\"middle\" >2<\/text><rect class=\"bs\" x=\"352\" y=\"54\" width=\"64\" height=\"26\"/><text class=\"tb1\" x=\"384.0\" y=\"71\" font-size=\"10\" text-anchor=\"middle\" >4<\/text><text class=\"tl\" x=\"424\" y=\"72\" font-size=\"12\" text-anchor=\"start\" >= 21<\/text><text class=\"tl\" x=\"70\" y=\"112\" font-size=\"12\" text-anchor=\"end\" >Pizza<\/text><rect class=\"bh\" x=\"80\" y=\"94\" width=\"48\" height=\"26\"/><text class=\"tb1\" x=\"104.0\" y=\"111\" font-size=\"10\" text-anchor=\"middle\" >3<\/text><rect class=\"b1\" x=\"128\" y=\"94\" width=\"96\" height=\"26\"/><text class=\"tb1\" x=\"176.0\" y=\"111\" font-size=\"10\" text-anchor=\"middle\" >6<\/text><rect class=\"b2\" x=\"224\" y=\"94\" width=\"96\" height=\"26\"/><text class=\"tb1\" x=\"272.0\" y=\"111\" font-size=\"10\" text-anchor=\"middle\" >6<\/text><rect class=\"hl\" x=\"320\" y=\"94\" width=\"32\" height=\"26\"/><text class=\"tb1\" x=\"336.0\" y=\"111\" font-size=\"10\" text-anchor=\"middle\" >2<\/text><rect class=\"bs\" x=\"352\" y=\"94\" width=\"32\" height=\"26\"/><text class=\"tb1\" x=\"368.0\" y=\"111\" font-size=\"10\" text-anchor=\"middle\" >2<\/text><text class=\"tl\" x=\"392\" y=\"112\" font-size=\"12\" text-anchor=\"start\" >= 19<\/text><rect class=\"bh\" x=\"80\" y=\"138\" width=\"12\" height=\"12\"/><text class=\"tm\" x=\"96\" y=\"148\" font-size=\"10\" text-anchor=\"start\" >Allergies<\/text><rect class=\"b1\" x=\"176\" y=\"138\" width=\"12\" height=\"12\"/><text class=\"tm\" x=\"192\" y=\"148\" font-size=\"10\" text-anchor=\"start\" >Cost<\/text><rect class=\"b2\" x=\"272\" y=\"138\" width=\"12\" height=\"12\"/><text class=\"tm\" x=\"288\" y=\"148\" font-size=\"10\" text-anchor=\"start\" >Distance<\/text><rect class=\"hl\" x=\"368\" y=\"138\" width=\"12\" height=\"12\"/><text class=\"tm\" x=\"384\" y=\"148\" font-size=\"10\" text-anchor=\"start\" >Cuisine<\/text><rect class=\"bs\" x=\"464\" y=\"138\" width=\"12\" height=\"12\"/><text class=\"tm\" x=\"480\" y=\"148\" font-size=\"10\" text-anchor=\"start\" >Reviews<\/text><\/svg><figcaption>每一段 = 权重 × 评分。Thai 25 分最高，所以选 Thai。<\/figcaption><\/figure><div class=\"sum\">The rational model has six steps: define the problem, identify criteria, weight criteria, develop alternatives, evaluate them, and select the best. A decision matrix multiplies each rating by its weight and picks the highest total.<\/div>\n\n<h2>2. How We Actually Make Decisions（现实中的决策，p.10–13）<\/h2>\n<h3>理性的局限<\/h3>\n<ul>\n<li><b>Bounded rationality（有限理性）<\/b>：人的信息、时间和处理能力有限，只能在简化的范围内做\"理性\"决定<\/li>\n<li><b>Satisficing（满意即可）<\/b>：找到第一个\"够好\"的方案就停，而不是找最优方案<\/li>\n<li><b>Intuition（直觉）<\/b>：根据经验快速做判断，不经过完整的分析<\/li>\n<\/ul>\n<p class=\"muted\">课件这三页只有图片和名称，上面是标准解释。<\/p>\n\n<h3>Judgment Shortcuts / Heuristics（判断捷径与偏差）<span class=\"hot\">高频考点<\/span><\/h3>\n<table>\n<tr><th>Bias<\/th><th>意思<\/th><th>一句话辨认<\/th><\/tr>\n<tr><td class=\"h\">Overconfidence bias<\/td><td>太相信自己的判断，尤其是在自己不擅长的领域<\/td><td>\"我肯定没问题\"<\/td><\/tr>\n<tr><td class=\"h\">Anchoring bias<\/td><td>以最先得到的信息为基准做后续判断<\/td><td>被第一个数字\"锚住\"<\/td><\/tr>\n<tr><td class=\"h\">Confirmation bias<\/td><td>只挑选支持自己决定的事实<\/td><td>只看对自己有利的证据<\/td><\/tr>\n<tr><td class=\"h\">Availability bias<\/td><td>重视手边最容易想到的信息<\/td><td>最近、最印象深刻的事<\/td><\/tr>\n<tr><td class=\"h\">Escalation of commitment<\/td><td>明明证据显示决定错了，还继续加大投入，<b>尤其当自己对决定负责时<\/b><\/td><td>\"已经投了这么多，不能停\"<\/td><\/tr>\n<tr><td class=\"h\">Randomness error<\/td><td>给随机事件强加意义，比如迷信<\/td><td>\"穿这件衣服就会赢\"<\/td><\/tr>\n<tr><td class=\"h\">Risk aversion<\/td><td>宁愿要确定的结果，也不要有风险的结果<\/td><td>\"稳一点比较好\"<\/td><\/tr>\n<tr><td class=\"h\">Hindsight bias<\/td><td>结果出来后，觉得自己早就能预测到<\/td><td>\"我早就知道会这样\"<\/td><\/tr>\n<\/table>\n<p>易混：<b>Confirmation<\/b> 是\"挑证据\"，<b>Anchoring<\/b> 是\"被第一个信息锚住\"，<b>Availability<\/b> 是\"用最容易想到的信息\"。<\/p>\n<figure class=\"f9\"><svg viewBox=\"0 0 610 164\" role=\"img\" aria-label=\"Eight decision biases grouped by stage\"><rect class=\"b1\" x=\"6\" y=\"6\" width=\"140\" height=\"150\" rx=\"6\"/><text class=\"tl\" x=\"76\" y=\"26\" font-size=\"11\" text-anchor=\"middle\" >① Gathering info<\/text><text class=\"tm\" x=\"76\" y=\"42\" font-size=\"10\" text-anchor=\"middle\" >\"三个只用\"<\/text><text class=\"tl\" x=\"76\" y=\"70\" font-size=\"10\" text-anchor=\"middle\" >Anchoring<\/text><text class=\"tm\" x=\"76\" y=\"83\" font-size=\"9\" text-anchor=\"middle\" >first info<\/text><text class=\"tl\" x=\"76\" y=\"100\" font-size=\"10\" text-anchor=\"middle\" >Availability<\/text><text class=\"tm\" x=\"76\" y=\"113\" font-size=\"9\" text-anchor=\"middle\" >easiest info<\/text><text class=\"tl\" x=\"76\" y=\"130\" font-size=\"10\" text-anchor=\"middle\" >Confirmation<\/text><text class=\"tm\" x=\"76\" y=\"143\" font-size=\"9\" text-anchor=\"middle\" >info that agrees<\/text><text class=\"tl\" x=\"151\" y=\"84\" font-size=\"12\" text-anchor=\"middle\" >→<\/text><rect class=\"b2\" x=\"156\" y=\"6\" width=\"140\" height=\"150\" rx=\"6\"/><text class=\"tl\" x=\"226\" y=\"26\" font-size=\"11\" text-anchor=\"middle\" >② Judging<\/text><text class=\"tm\" x=\"226\" y=\"42\" font-size=\"10\" text-anchor=\"middle\" >太相信自己<\/text><text class=\"tl\" x=\"226\" y=\"70\" font-size=\"10\" text-anchor=\"middle\" >Overconfidence<\/text><text class=\"tl\" x=\"301\" y=\"84\" font-size=\"12\" text-anchor=\"middle\" >→<\/text><rect class=\"hl\" x=\"306\" y=\"6\" width=\"140\" height=\"150\" rx=\"6\"/><text class=\"tl\" x=\"376\" y=\"26\" font-size=\"11\" text-anchor=\"middle\" >③ Facing uncertainty<\/text><text class=\"tm\" x=\"376\" y=\"42\" font-size=\"10\" text-anchor=\"middle\" >怕冒险 / 乱找规律<\/text><text class=\"tl\" x=\"376\" y=\"70\" font-size=\"10\" text-anchor=\"middle\" >Risk aversion<\/text><text class=\"tl\" x=\"376\" y=\"100\" font-size=\"10\" text-anchor=\"middle\" >Randomness error<\/text><text class=\"tl\" x=\"451\" y=\"84\" font-size=\"12\" text-anchor=\"middle\" >→<\/text><rect class=\"bh\" x=\"456\" y=\"6\" width=\"140\" height=\"150\" rx=\"6\"/><text class=\"tl\" x=\"526\" y=\"26\" font-size=\"11\" text-anchor=\"middle\" >④ After deciding<\/text><text class=\"tm\" x=\"526\" y=\"42\" font-size=\"10\" text-anchor=\"middle\" >硬撑 / 事后先知<\/text><text class=\"tl\" x=\"526\" y=\"70\" font-size=\"10\" text-anchor=\"middle\" >Escalation of commitment<\/text><text class=\"tl\" x=\"526\" y=\"100\" font-size=\"10\" text-anchor=\"middle\" >Hindsight<\/text><\/svg><figcaption>按做决定的过程把 8 种偏差分成 4 组（我自己的分组记法，不是课件内容）。<\/figcaption><\/figure><div class=\"sum\">Real decisions use bounded rationality, satisficing and intuition, and are distorted by biases such as overconfidence, anchoring, confirmation, availability, escalation of commitment, randomness error, risk aversion and hindsight.<\/div>\n\n<h2>3. Group Decision-Making（群体决策，p.18–21）<\/h2>\n<h3>Individual vs. Group<\/h3>\n<table>\n<tr><th>Individual<\/th><th>Homogeneous group（同质群体）<\/th><th>Heterogeneous group（异质群体）<\/th><\/tr>\n<tr><td>最快 · 最 <b>efficient<\/b><br>用于最清楚的问题<\/td><td>介于两者之间<\/td><td>最慢 · 最 <b>effective<\/b><br>用于最复杂的问题<\/td><\/tr>\n<\/table>\n\n<figure class=\"f9\"><svg viewBox=\"0 0 600 126\" role=\"img\" aria-label=\"Individual versus group decision-making continuum\"><path class=\"ln\" d=\"M20 40 H580\"/><path class=\"ln\" d=\"M572 35 L580 40 L572 45\"/><path class=\"ln\" d=\"M28 35 L20 40 L28 45\"/><rect class=\"b1\" x=\"30\" y=\"24\" width=\"140\" height=\"32\" rx=\"4\"/><text class=\"tb1\" x=\"100.0\" y=\"43.9\" font-size=\"11\" text-anchor=\"middle\">Individual<\/text><rect class=\"b2\" x=\"230\" y=\"24\" width=\"140\" height=\"32\" rx=\"4\"/><text class=\"tb2\" x=\"300.0\" y=\"43.9\" font-size=\"11\" text-anchor=\"middle\">Homogeneous group<\/text><rect class=\"hl\" x=\"430\" y=\"24\" width=\"140\" height=\"32\" rx=\"4\"/><text class=\"thl\" x=\"500.0\" y=\"43.9\" font-size=\"11\" text-anchor=\"middle\">Heterogeneous group<\/text><text class=\"tl\" x=\"30\" y=\"76\" font-size=\"10\" text-anchor=\"start\" >Fastest · most efficient<\/text><text class=\"tm\" x=\"30\" y=\"92\" font-size=\"10\" text-anchor=\"start\" >clearest problems<\/text><text class=\"tl\" x=\"570\" y=\"76\" font-size=\"10\" text-anchor=\"end\" >Slowest · most effective<\/text><text class=\"tm\" x=\"570\" y=\"92\" font-size=\"10\" text-anchor=\"end\" >most complex problems<\/text><text class=\"tm\" x=\"300\" y=\"118\" font-size=\"10\" text-anchor=\"middle\" >Speed & efficiency → individual · Accuracy, creativity & acceptance → group<\/text><\/svg><figcaption>越往右人越多、越多元：越慢，但对复杂问题越有效。<\/figcaption><\/figure><h3>Group Decision-Making：优点与缺点<\/h3>\n<table>\n<tr><th>Strengths 优点<\/th><th>Weaknesses 缺点<\/th><\/tr>\n<tr><td><b>Synergy<\/b>：互相借鉴想法，降低不确定性<\/td><td><b>More time-consuming<\/b>：更花时间<\/td><\/tr>\n<tr><td><b>Resource pooling<\/b>：汇集不同的技能、知识和想法<\/td><td><b>Conformity pressures<\/b>：从众压力<\/td><\/tr>\n<tr><td><b>Easier implementation<\/b>：大家更理解、更接受决定<\/td><td>讨论被 1–2 个人主导<\/td><\/tr>\n<tr><td><\/td><td><b>Diffusion of responsibility<\/b>：责任分散<\/td><\/tr>\n<tr><td><\/td><td><b>Groupshift（group polarization）<\/b>：群体决策比个人更极端<\/td><\/tr>\n<tr><td><\/td><td><b>Groupthink<\/b>：为了和谐不去批判性评估<\/td><\/tr>\n<\/table>\n\n<h3>Individual vs. Group Decisions（谁更好？）<span class=\"hot\">易错点<\/span><\/h3>\n<table>\n<tr><th>标准<\/th><th>更好的是<\/th><\/tr>\n<tr><td class=\"h\">Accuracy 准确性<\/td><td>Group decisions<\/td><\/tr>\n<tr><td class=\"h\">Speed 速度<\/td><td>Individual decisions<\/td><\/tr>\n<tr><td class=\"h\">Creativity 创造性<\/td><td>Group decisions<\/td><\/tr>\n<tr><td class=\"h\">Acceptance 接受度<\/td><td>Group decisions<\/td><\/tr>\n<tr><td class=\"h\">Efficiency 效率<\/td><td>Individual decisions<\/td><\/tr>\n<\/table>\n<p>口诀：<b>速度和效率 → 个人<\/b>；<b>准确、创造、接受 → 群体<\/b>。<\/p>\n<div class=\"sum\">Individuals decide faster and more efficiently; groups are more accurate, creative and accepted, but risk conformity, diffusion of responsibility, groupshift and groupthink.<\/div>\n\n<h2>4. Creative Decision-Making（创造性决策，p.24–25）<\/h2>\n<p><span class=\"t\">Creativity<\/span> = the ability to produce <span class=\"k\">novel<\/span> and <span class=\"k\">useful<\/span> ideas（产生新颖且有用的想法的能力）。<\/p>\n<h3>衡量创造力的三个维度<\/h3>\n<ul>\n<li><b>Fluency（流畅性）<\/b>：想法的<b>数量<\/b>（number of ideas）<\/li>\n<li><b>Flexibility（灵活性）<\/b>：想法的<b>多样性<\/b>（variety of ideas）<\/li>\n<li><b>Originality（独创性）<\/b>：想法的<b>独特性<\/b>（uniqueness of ideas）<\/li>\n<\/ul>\n<h3>影响创造力的因素<\/h3>\n<table>\n<tr><th>Traits 特质<\/th><th>Attributes 个人条件<\/th><th>Context 环境<\/th><\/tr>\n<tr><td>Openness to experience · Risk taking<\/td><td>Expertise · Imagination · Motivation<\/td><td>Encouragement · Time pressure · Environment<\/td><\/tr>\n<\/table>\n<figure class=\"f9\"><svg viewBox=\"0 0 600 198\" role=\"img\" aria-label=\"Creativity: three measures and three factors\"><circle class=\"hl\" cx=\"300\" cy=\"96\" r=\"50\"/><text class=\"tl\" x=\"300\" y=\"92\" font-size=\"12\" text-anchor=\"middle\" >CREATIVITY<\/text><text class=\"tm\" x=\"300\" y=\"108\" font-size=\"10\" text-anchor=\"middle\" >novel + useful<\/text><rect class=\"b1\" x=\"20\" y=\"20\" width=\"150\" height=\"40\" rx=\"4\"/><text class=\"tb1\" x=\"95.0\" y=\"38.0\" font-size=\"10\" text-anchor=\"middle\">Fluency<\/text><text class=\"tb1\" x=\"95.0\" y=\"49.0\" font-size=\"10\" text-anchor=\"middle\">number of ideas<\/text><line class=\"thin\" x1=\"170\" y1=\"40\" x2=\"252\" y2=\"96\"/><rect class=\"b1\" x=\"20\" y=\"76\" width=\"150\" height=\"40\" rx=\"4\"/><text class=\"tb1\" x=\"95.0\" y=\"94.0\" font-size=\"10\" text-anchor=\"middle\">Flexibility<\/text><text class=\"tb1\" x=\"95.0\" y=\"105.0\" font-size=\"10\" text-anchor=\"middle\">variety of ideas<\/text><line class=\"thin\" x1=\"170\" y1=\"96\" x2=\"252\" y2=\"96\"/><rect class=\"b1\" x=\"20\" y=\"132\" width=\"150\" height=\"40\" rx=\"4\"/><text class=\"tb1\" x=\"95.0\" y=\"150.0\" font-size=\"10\" text-anchor=\"middle\">Originality<\/text><text class=\"tb1\" x=\"95.0\" y=\"161.0\" font-size=\"10\" text-anchor=\"middle\">uniqueness of ideas<\/text><line class=\"thin\" x1=\"170\" y1=\"152\" x2=\"252\" y2=\"96\"/><rect class=\"b2\" x=\"370\" y=\"20\" width=\"224\" height=\"40\" rx=\"4\"/><text class=\"tb2\" x=\"482.0\" y=\"38.0\" font-size=\"10\" text-anchor=\"middle\">Traits<\/text><text class=\"tb2\" x=\"482.0\" y=\"49.0\" font-size=\"10\" text-anchor=\"middle\">openness · risk taking<\/text><line class=\"thin\" x1=\"370\" y1=\"40\" x2=\"348\" y2=\"96\"/><rect class=\"b2\" x=\"370\" y=\"76\" width=\"224\" height=\"40\" rx=\"4\"/><text class=\"tb2\" x=\"482.0\" y=\"94.0\" font-size=\"10\" text-anchor=\"middle\">Attributes<\/text><text class=\"tb2\" x=\"482.0\" y=\"105.0\" font-size=\"10\" text-anchor=\"middle\">expertise · imagination · motivation<\/text><line class=\"thin\" x1=\"370\" y1=\"96\" x2=\"348\" y2=\"96\"/><rect class=\"b2\" x=\"370\" y=\"132\" width=\"224\" height=\"40\" rx=\"4\"/><text class=\"tb2\" x=\"482.0\" y=\"150.0\" font-size=\"10\" text-anchor=\"middle\">Context<\/text><text class=\"tb2\" x=\"482.0\" y=\"161.0\" font-size=\"10\" text-anchor=\"middle\">encouragement · time pressure · environment<\/text><line class=\"thin\" x1=\"370\" y1=\"152\" x2=\"348\" y2=\"96\"/><text class=\"tm\" x=\"95\" y=\"190\" font-size=\"10\" text-anchor=\"middle\" >How it is measured<\/text><text class=\"tm\" x=\"482\" y=\"190\" font-size=\"10\" text-anchor=\"middle\" >What shapes it<\/text><\/svg><figcaption>左边是衡量创造力的 3 个维度，右边是影响创造力的 3 类因素。<\/figcaption><\/figure><div class=\"sum\">Creativity is producing novel and useful ideas, measured by fluency (number), flexibility (variety) and originality (uniqueness), and shaped by traits, attributes and context.<\/div>\n\n<h2>5. Ethical Decision-Making（道德决策，p.27–41）<\/h2>\n<p>三个圈的交集：<b>What you can do<\/b>（能做的）∩ <b>What you may legally do<\/b>（合法的）∩ <b>What you can morally do<\/b>（道德的）= <span class=\"t\">What you should do<\/span>。<\/p>\n\n<figure class=\"f9\"><svg viewBox=\"0 0 580 280\" role=\"img\" aria-label=\"Ethics: can do, legally, morally, should do\"><circle class=\"b1\" cx=\"230\" cy=\"90\" r=\"85\" opacity=\".75\"/><text class=\"tl\" x=\"190\" y=\"40\" font-size=\"10\" text-anchor=\"middle\" >What you can do<\/text><circle class=\"b2\" cx=\"350\" cy=\"90\" r=\"85\" opacity=\".75\"/><text class=\"tl\" x=\"400\" y=\"40\" font-size=\"10\" text-anchor=\"middle\" >What you may legally do<\/text><circle class=\"bs\" cx=\"290\" cy=\"180\" r=\"85\" opacity=\".75\"/><text class=\"tl\" x=\"290\" y=\"250\" font-size=\"10\" text-anchor=\"middle\" >What you can morally do<\/text><circle class=\"hl\" cx=\"290\" cy=\"122\" r=\"22\"/><text class=\"tl\" x=\"290\" y=\"118\" font-size=\"10\" text-anchor=\"middle\" >Should<\/text><text class=\"tl\" x=\"290\" y=\"131\" font-size=\"10\" text-anchor=\"middle\" >do<\/text><\/svg><figcaption>三个圈的交集才是\"应该做的\"：能做 ∩ 合法 ∩ 道德。<\/figcaption><\/figure><h3>Influences of Ethical Decisions（影响道德决策的 6 个因素）<\/h3>\n<ol>\n<li><b>Consequences<\/b>：决定带来的伤害或好处<\/li>\n<li><b>Society's opinion<\/b>：别人怎么看<\/li>\n<li><b>Likelihood of effect<\/b>：发生伤害或好处的概率<\/li>\n<li><b>Time to consequences<\/b>：后果多快出现<\/li>\n<li><b>Relatedness<\/b>：你和受影响的人有多亲近<\/li>\n<li><b>Reach of result<\/b>：会影响多少人<\/li>\n<\/ol>\n\n<h3>Ethics Criteria for Decision-Making（四种道德标准）<span class=\"hot\">高频考点<\/span><\/h3>\n<table>\n<tr><th>Criterion<\/th><th>核心<\/th><th>意思<\/th><\/tr>\n<tr><td class=\"h\">Utilitarian<\/td><td>Consequences 结果<\/td><td>为最多的人带来最大的\"好\"<\/td><\/tr>\n<tr><td class=\"h\">Rights<\/td><td>Duties 义务<\/td><td>保障每个人的基本自由和权利<\/td><\/tr>\n<tr><td class=\"h\">Justice<\/td><td>Fairness 公平<\/td><td>公平地按规则分配利益和成本<\/td><\/tr>\n<tr><td class=\"h\">Care<\/td><td>Relationships 关系<\/td><td>特别照顾和你关系亲近的人<\/td><\/tr>\n<\/table>\n\n<h3>Ethical Decision-Making Framework（三个问题，p.35）<\/h3>\n<ol>\n<li><b>Is the decision motivated by self-serving interests?<\/b>（出于私利吗？）→ Yes = <b>Unethical<\/b>；No → 问题 2<\/li>\n<li><b>Does the decision respect the rights of the individuals affected?<\/b>（尊重相关人的权利吗？）→ No = <b>Unethical<\/b>；Yes → 问题 3<\/li>\n<li><b>Is the decision fair and equitable?<\/b>（公平吗？）→ Yes = <b>Ethical<\/b>；No = <b>Unethical<\/b><\/li>\n<\/ol>\n<figure class=\"f9\"><svg viewBox=\"0 0 600 180\" role=\"img\" aria-label=\"Ethical decision-making framework flowchart\"><rect class=\"b1\" x=\"10\" y=\"40\" width=\"150\" height=\"58\" rx=\"4\"/><text class=\"tb1\" x=\"85.0\" y=\"67.0\" font-size=\"10\" text-anchor=\"middle\">Q1 Self-serving<\/text><text class=\"tb1\" x=\"85.0\" y=\"78.0\" font-size=\"10\" text-anchor=\"middle\">interests?<\/text><rect class=\"b1\" x=\"225\" y=\"40\" width=\"150\" height=\"58\" rx=\"4\"/><text class=\"tb1\" x=\"300.0\" y=\"67.0\" font-size=\"10\" text-anchor=\"middle\">Q2 Respects the<\/text><text class=\"tb1\" x=\"300.0\" y=\"78.0\" font-size=\"10\" text-anchor=\"middle\">rights of those affected?<\/text><rect class=\"b1\" x=\"440\" y=\"40\" width=\"150\" height=\"58\" rx=\"4\"/><text class=\"tb1\" x=\"515.0\" y=\"67.0\" font-size=\"10\" text-anchor=\"middle\">Q3 Fair and<\/text><text class=\"tb1\" x=\"515.0\" y=\"78.0\" font-size=\"10\" text-anchor=\"middle\">equitable?<\/text><rect class=\"bh\" x=\"30\" y=\"140\" width=\"110\" height=\"30\" rx=\"4\"/><text class=\"tbh\" x=\"85.0\" y=\"158.8\" font-size=\"11\" text-anchor=\"middle\">Unethical<\/text><rect class=\"bh\" x=\"245\" y=\"140\" width=\"110\" height=\"30\" rx=\"4\"/><text class=\"tbh\" x=\"300.0\" y=\"158.8\" font-size=\"11\" text-anchor=\"middle\">Unethical<\/text><rect class=\"b2\" x=\"400\" y=\"140\" width=\"90\" height=\"30\" rx=\"4\"/><text class=\"tb2\" x=\"445.0\" y=\"158.8\" font-size=\"11\" text-anchor=\"middle\">Ethical<\/text><rect class=\"bh\" x=\"500\" y=\"140\" width=\"90\" height=\"30\" rx=\"4\"/><text class=\"tbh\" x=\"545.0\" y=\"158.8\" font-size=\"11\" text-anchor=\"middle\">Unethical<\/text><path class=\"ln\" d=\"M160 69 H221\"/><path class=\"ln\" d=\"M215 64 L223 69 L215 74\"/><text class=\"tm\" x=\"190\" y=\"62\" font-size=\"10\" text-anchor=\"middle\" >No<\/text><path class=\"ln\" d=\"M375 69 H436\"/><path class=\"ln\" d=\"M430 64 L438 69 L430 74\"/><text class=\"tm\" x=\"405\" y=\"62\" font-size=\"10\" text-anchor=\"middle\" >Yes<\/text><line class=\"ln\" x1=\"85\" y1=\"98\" x2=\"85\" y2=\"140\"/><text class=\"tm\" x=\"92\" y=\"124\" font-size=\"10\" text-anchor=\"start\" >Yes<\/text><line class=\"ln\" x1=\"300\" y1=\"98\" x2=\"300\" y2=\"140\"/><text class=\"tm\" x=\"307\" y=\"124\" font-size=\"10\" text-anchor=\"start\" >No<\/text><path class=\"ln\" d=\"M515 98 V119.0 H445 V140\" fill=\"none\"/><text class=\"tm\" x=\"452\" y=\"136\" font-size=\"10\" text-anchor=\"start\" >Yes<\/text><path class=\"ln\" d=\"M515 98 V119.0 H545 V140\" fill=\"none\"/><text class=\"tm\" x=\"552\" y=\"136\" font-size=\"10\" text-anchor=\"start\" >No<\/text><\/svg><figcaption>三个问题依次问：只有\"不是出于私利 → 尊重权利 → 公平\"全部通过，才是道德的。<\/figcaption><\/figure><h3>Additional Ethics Checks（p.40）<\/h3>\n<ul>\n<li>How would I feel if my <b>family<\/b> found out?（家人知道了我会怎么想？）<\/li>\n<li>How would I feel if it were splashed across the <b>front page of the newspaper<\/b>?（上了报纸头版我会怎么想？）<\/li>\n<\/ul>\n\n<h3>Culture and Ethics（p.41）<\/h3>\n<ul>\n<li>没有全球统一的道德标准（no global ethical standards）<\/li>\n<li>西方国家对对错的标准更清楚；在亚洲，很多问题不是非黑即白，而是灰色地带<\/li>\n<li>在很多国家，贿赂（bribery）很常见，被当作做生意的方式<\/li>\n<li>跨国公司制定道德原则时，可能需要根据当地文化规范调整<\/li>\n<\/ul>\n<p class=\"muted\">课堂案例：Case 08 · DataSecure Technologies — Navigating Ethical Decision-Making in Crisis。<\/p>\n<div class=\"sum\">Ethical decisions are judged by utilitarian (consequences), rights (duties), justice (fairness) and care (relationships) criteria. A decision is ethical only if it is not self-serving, respects people's rights, and is fair and equitable.<\/div>\n", "terms": [{"t": "Acceptance", "z": "接受度：群体决策更好", "e": "How much people agree with and support a decision. Group decisions are better."}, {"t": "Accuracy", "z": "准确性：群体决策更好", "e": "How correct a decision is. Group decisions are better for accuracy."}, {"t": "Allocate weights", "z": "给标准分配权重（理性模型第 3 步）", "e": "Step 3 of the rational model: decide how important each criterion is."}, {"t": "Anchoring bias", "z": "锚定偏差：被第一个信息“锚住”", "e": "Using early, first received information as the basis for making later judgments."}, {"t": "Availability bias", "z": "可得性偏差：只用手边/最近的信息", "e": "Emphasizing information that is most readily at hand."}, {"t": "Bounded rationality", "z": "有限理性：信息和时间有限", "e": "Making decisions with limited information, time and ability, so we simplify the problem."}, {"t": "Bribery", "z": "贿赂：在很多国家很常见", "e": "Giving money or gifts to get an unfair advantage; commonplace in many countries."}, {"t": "Care criterion", "z": "关怀标准：照顾关系亲近的人", "e": "Ethics criterion (relationships): especially consider those to whom you are closely connected."}, {"t": "Confirmation bias", "z": "确认偏差：只找支持自己的事实", "e": "Selecting and using only facts that support our decision."}, {"t": "Conformity pressure", "z": "从众压力：群体决策的缺点", "e": "Pressure to agree with the group; a weakness of group decision-making."}, {"t": "Consequences", "z": "后果：伤害或好处", "e": "An influence on ethical decisions: the harm or benefit from the decision."}, {"t": "Creativity", "z": "创造力：新颖且有用的想法", "e": "The ability to produce novel and useful ideas."}, {"t": "Criteria", "z": "标准：什么是重要的", "e": "What is important when choosing between alternatives (rational model step 2)."}, {"t": "Decision matrix", "z": "决策矩阵：权重 × 评分，加总最高者胜", "e": "Rate each option on each weighted criterion; multiply rating × weight, add up; highest score wins."}, {"t": "Diffusion of responsibility", "z": "责任分散：没人觉得要负责", "e": "In a group, no single person feels responsible for the decision."}, {"t": "Effective", "z": "有效：异质群体决策", "e": "Leads to the best result; heterogeneous groups are slowest but most effective."}, {"t": "Efficiency", "z": "效率：个人决策更好", "e": "Getting a decision with the least time and resources. Individual decisions are better."}, {"t": "Escalation of commitment", "z": "承诺升级：明知错了还继续投入", "e": "Increasing commitment to a decision despite evidence that it is wrong, especially if responsible for it."}, {"t": "Ethics", "z": "伦理/道德：对与错", "e": "Rules about right vs. wrong; what you should do = can do ∩ may legally do ∩ can morally do."}, {"t": "Flexibility", "z": "灵活性：想法的种类多", "e": "A part of creativity: the variety of ideas."}, {"t": "Fluency", "z": "流畅性：想法的数量多", "e": "A part of creativity: the number of ideas."}, {"t": "Groupshift", "z": "群体转移（群体极化）：讨论后更极端", "e": "Group polarization: the group's position becomes more extreme after discussion."}, {"t": "Groupthink", "z": "群体思维：为了和谐而不提反对意见", "e": "Members avoid disagreement to keep harmony, so the group does not evaluate alternatives well."}, {"t": "Heterogeneous group", "z": "异质群体：成员不同；最慢但最有效", "e": "A group of different members; slowest, most effective, use for the most complex problems."}, {"t": "Heuristics", "z": "启发法/判断捷径", "e": "Judgment shortcuts that make decisions faster but can cause biases."}, {"t": "Hindsight bias", "z": "后见之明偏差：“我早就知道”", "e": "After an outcome is known, believing it could have been accurately predicted beforehand."}, {"t": "Homogeneous group", "z": "同质群体：成员相似", "e": "A group of similar members; between individual and heterogeneous groups in speed and effectiveness."}, {"t": "Intuition", "z": "直觉：凭经验快速判断", "e": "Making a decision quickly from experience and feelings, not step-by-step analysis."}, {"t": "Justice criterion", "z": "公正标准：公平分配", "e": "Ethics criterion (fairness): use rules fairly to distribute benefits and costs equitably."}, {"t": "Likelihood of effect", "z": "发生可能性", "e": "An influence on ethical decisions: the probability of harm or benefit."}, {"t": "Originality", "z": "独创性：想法独特", "e": "A part of creativity: the uniqueness of ideas."}, {"t": "Overconfidence bias", "z": "过度自信偏差", "e": "Believing too much in our own ability to make good decisions, especially outside our expertise."}, {"t": "Randomness error", "z": "随机性错误：给随机事件找意义（迷信）", "e": "Creating meaning out of random events, e.g., superstitions."}, {"t": "Rational decision-making model", "z": "理性决策模型：6 步", "e": "Define problem → identify criteria → allocate weights → develop alternatives → evaluate → select best."}, {"t": "Reach of result", "z": "影响范围：多少人受影响", "e": "An influence on ethical decisions: how many people will be affected."}, {"t": "Relatedness", "z": "关联度：你多认同受影响的人", "e": "An influence on ethical decisions: how much you identify with the people affected."}, {"t": "Resource pooling", "z": "资源汇集：技能、知识、想法多样", "e": "A group strength: members bring diverse skills, knowledge and ideas."}, {"t": "Rights criterion", "z": "权利标准：尊重基本自由", "e": "Ethics criterion (duties): grant everyone their fundamental liberties and privileges."}, {"t": "Risk aversion", "z": "风险规避：宁要确定的结果", "e": "Preferring a sure thing over a risky outcome."}, {"t": "Satisficing", "z": "满意即可：选第一个“够好”的方案", "e": "Choosing the first acceptable (good-enough) solution instead of the best one."}, {"t": "Society's opinion", "z": "社会看法：别人怎么想", "e": "An influence on ethical decisions: what others think."}, {"t": "Synergy", "z": "协同效应：互相补充，减少不确定", "e": "A group strength: reduce uncertainty by building on each other's ideas."}, {"t": "Time to consequences", "z": "后果发生的快慢", "e": "An influence on ethical decisions: how fast the effect will happen."}, {"t": "Utilitarian criterion", "z": "功利标准：为最多人带来最大好处", "e": "Ethics criterion (consequences): the most good for the largest number of people."}]}, {"n": 9, "en": "Org Structure & Org Change", "zh": "组织结构与组织变革", "notes": "<style>\n.f9{margin:12px 0 16px;overflow-x:auto}\n.f9 svg{display:block;width:100%;max-width:640px;height:auto;font-family:var(--body)}\n.f9 figcaption{font-size:13px;color:var(--muted);margin-top:4px}\n.f9 rect,.f9 circle,.f9 path{stroke-width:1}\n.f9 .bk{fill:var(--ink)} .f9 .tbk{fill:var(--bg);font-weight:700}\n.f9 .b1{fill:var(--kbg)} .f9 .b2{fill:var(--green-bg);stroke:var(--green)} .f9 .b3{fill:var(--th);stroke:var(--muted);stroke-opacity:.5} .f9 .b1{stroke:var(--blue);stroke-opacity:.35}\n.f9 .bs{fill:var(--chip);stroke:var(--muted);stroke-dasharray:3 2} .f9 .bh{fill:var(--tbg)}\n.f9 .hl{fill:var(--gold-bg);stroke:var(--gold);stroke-width:2.5} .f9 .hl2{fill:var(--tbg);stroke:var(--bg);stroke-width:2}\n.f9 .tb1,.f9 .tb2,.f9 .tb3,.f9 .tbh,.f9 .thl{fill:var(--fg)} .f9 .tbs{fill:var(--muted)}\n.f9 .tb{fill:var(--fg);font-weight:700} .f9 .tl{fill:var(--ink);font-weight:700} .f9 .tm{fill:var(--muted)}\n.f9 .ln{stroke:var(--blue);stroke-width:1.5;fill:none} .f9 .dash{stroke:var(--blue);stroke-width:2;stroke-dasharray:6 4;fill:none}\n.f9 .thick{stroke:var(--hot);stroke-width:2.5} .f9 .thin{stroke:var(--line);stroke-width:1}\n.f9 .arr,.f9 .arrh{stroke:var(--hot);stroke-width:1.6;fill:none} .f9 .arr2,.f9 .arrh2{stroke:var(--green);stroke-width:1.6;fill:none}\n<\/style><h2>1. 什么是组织结构？（p.3）<\/h2>\n<p><span class=\"t\">Organizational structure<\/span> = 工作怎样<b>分工<\/b>给不同的人，以及他们的努力怎样<b>协调<\/b>起来。结构决定了<b>权力线和沟通线<\/b>（lines of authority and communication）。<\/p>\n<ul>\n<li>决定结构的四个因素：<b>strategy<\/b>（战略）、<b>size<\/b>（规模）、<b>technology<\/b>（技术）、<b>environment<\/b>（环境）<\/li>\n<li><b>没有一种最好的结构<\/b>；每个人喜欢的结构也不一样<\/li>\n<\/ul>\n\n<h2>2. 组织结构的六个要素（p.4）<span class=\"hot\">高频考点<\/span><\/h2>\n<table>\n<tr><th>Element<\/th><th>回答什么问题<\/th><\/tr>\n<tr><td class=\"h\">Specialization 专业化<\/td><td>任务被细分成多少个独立的工作？<\/td><\/tr>\n<tr><td class=\"h\">Departmentalization 部门化<\/td><td>工作按什么<b>分组<\/b>？<\/td><\/tr>\n<tr><td class=\"h\">Chain of command 指挥链<\/td><td>谁向谁<b>汇报<\/b>？<\/td><\/tr>\n<tr><td class=\"h\">Span of control 管理幅度<\/td><td>一个经理能有效管多少人？<\/td><\/tr>\n<tr><td class=\"h\">Centralization / Decentralization 集权/分权<\/td><td><b>决策权<\/b>在哪里？<\/td><\/tr>\n<tr><td class=\"h\">Formalization 正规化<\/td><td>有多少<b>规章制度<\/b>来指导员工和经理？<\/td><\/tr>\n<\/table>\n<p class=\"muted\">记法：<b>S-D-C-S-C-F<\/b>：分工 → 分组 → 汇报 → 管几个人 → 谁做决定 → 多少规则。<\/p>\n\n<h3>Specialization 专业化（p.5）<\/h3>\n<p><span class=\"t\">Division of labour<\/span>（劳动分工）：把工作拆成不同的岗位，分给不同的人。<\/p>\n<table>\n<tr><th>Pros ✓<\/th><th>Cons ✗<\/th><\/tr>\n<tr><td>提高效率（流程标准化）；员工容易培训<\/td><td>无聊、压力大、生产率下降、离职率高、缺勤增加<\/td><\/tr>\n<\/table>\n<p>公司变大、工作变复杂时，专业化是<b>必须的<\/b>。<\/p>\n<p class=\"muted\">联系 L05：太专业化 → 工作单调，用 job rotation / enlargement / enrichment 来补救。<\/p>\n\n<h3>Departmentalization 部门化（p.6–7）<\/h3>\n<table>\n<tr><th>按什么分<\/th><th>例子<\/th><\/tr>\n<tr><td class=\"h\">Functional（职能）<\/td><td>按做的工作：会计、人力资源、工程、信息系统<\/td><\/tr>\n<tr><td class=\"h\">Product（产品）<\/td><td>按产品线：女装、男鞋<\/td><\/tr>\n<tr><td class=\"h\">Geographic（地区）<\/td><td>按服务的地区：北区、南区、中西部<\/td><\/tr>\n<tr><td class=\"h\">Process（流程）<\/td><td>按工作流程：测试、付款<\/td><\/tr>\n<tr><td class=\"h\">Customer（客户）<\/td><td>按客户类型和需求：批发、零售、政府<\/td><\/tr>\n<\/table>\n<figure class=\"f9\"><svg viewBox=\"0 0 700 190\" role=\"img\" aria-label=\"Org chart mixing functional, geographic and product departmentalization\"><rect class=\"bk\" x=\"270\" y=\"8\" width=\"100\" height=\"26\" rx=\"4\"/><text class=\"tbk\" x=\"320.0\" y=\"24.5\" font-size=\"10\" text-anchor=\"middle\">President<\/text><path class=\"ln\" d=\"M320 34 V45.0 H110 V56\" fill=\"none\"/><rect class=\"b1\" x=\"60\" y=\"56\" width=\"100\" height=\"26\" rx=\"4\"/><text class=\"tb1\" x=\"110.0\" y=\"72.5\" font-size=\"10\" text-anchor=\"middle\">VP Marketing<\/text><path class=\"ln\" d=\"M320 34 V45.0 H320 V56\" fill=\"none\"/><rect class=\"b1\" x=\"270\" y=\"56\" width=\"100\" height=\"26\" rx=\"4\"/><text class=\"tb1\" x=\"320.0\" y=\"72.5\" font-size=\"10\" text-anchor=\"middle\">VP Production<\/text><path class=\"ln\" d=\"M320 34 V45.0 H530 V56\" fill=\"none\"/><rect class=\"b1\" x=\"480\" y=\"56\" width=\"100\" height=\"26\" rx=\"4\"/><text class=\"tb1\" x=\"530.0\" y=\"72.5\" font-size=\"10\" text-anchor=\"middle\">VP Finance<\/text><path class=\"ln\" d=\"M320 82 V93.0 H200 V104\" fill=\"none\"/><rect class=\"b2\" x=\"150\" y=\"104\" width=\"100\" height=\"30\" rx=\"4\"/><text class=\"tb2\" x=\"200.0\" y=\"117.0\" font-size=\"10\" text-anchor=\"middle\">Alberta<\/text><text class=\"tb2\" x=\"200.0\" y=\"128.0\" font-size=\"10\" text-anchor=\"middle\">Plant<\/text><path class=\"ln\" d=\"M320 82 V93.0 H320 V104\" fill=\"none\"/><rect class=\"b2\" x=\"270\" y=\"104\" width=\"100\" height=\"30\" rx=\"4\"/><text class=\"tb2\" x=\"320.0\" y=\"117.0\" font-size=\"10\" text-anchor=\"middle\">Quebec<\/text><text class=\"tb2\" x=\"320.0\" y=\"128.0\" font-size=\"10\" text-anchor=\"middle\">Plant<\/text><path class=\"ln\" d=\"M320 82 V93.0 H440 V104\" fill=\"none\"/><rect class=\"b2\" x=\"390\" y=\"104\" width=\"100\" height=\"30\" rx=\"4\"/><text class=\"tb2\" x=\"440.0\" y=\"117.0\" font-size=\"10\" text-anchor=\"middle\">Nova Scotia<\/text><text class=\"tb2\" x=\"440.0\" y=\"128.0\" font-size=\"10\" text-anchor=\"middle\">Plant<\/text><path class=\"ln\" d=\"M200 134 V145.0 H168 V156\" fill=\"none\"/><rect class=\"b3\" x=\"142\" y=\"156\" width=\"52\" height=\"24\" rx=\"4\"/><text class=\"tb3\" x=\"168.0\" y=\"171.2\" font-size=\"9\" text-anchor=\"middle\">Consumer<\/text><path class=\"ln\" d=\"M200 134 V145.0 H232 V156\" fill=\"none\"/><rect class=\"b3\" x=\"206\" y=\"156\" width=\"52\" height=\"24\" rx=\"4\"/><text class=\"tb3\" x=\"232.0\" y=\"171.2\" font-size=\"9\" text-anchor=\"middle\">Industrial<\/text><path class=\"ln\" d=\"M320 134 V145.0 H288 V156\" fill=\"none\"/><rect class=\"b3\" x=\"262\" y=\"156\" width=\"52\" height=\"24\" rx=\"4\"/><text class=\"tb3\" x=\"288.0\" y=\"171.2\" font-size=\"9\" text-anchor=\"middle\">Consumer<\/text><path class=\"ln\" d=\"M320 134 V145.0 H352 V156\" fill=\"none\"/><rect class=\"b3\" x=\"326\" y=\"156\" width=\"52\" height=\"24\" rx=\"4\"/><text class=\"tb3\" x=\"352.0\" y=\"171.2\" font-size=\"9\" text-anchor=\"middle\">Industrial<\/text><path class=\"ln\" d=\"M440 134 V145.0 H408 V156\" fill=\"none\"/><rect class=\"b3\" x=\"382\" y=\"156\" width=\"52\" height=\"24\" rx=\"4\"/><text class=\"tb3\" x=\"408.0\" y=\"171.2\" font-size=\"9\" text-anchor=\"middle\">Consumer<\/text><path class=\"ln\" d=\"M440 134 V145.0 H472 V156\" fill=\"none\"/><rect class=\"b3\" x=\"446\" y=\"156\" width=\"52\" height=\"24\" rx=\"4\"/><text class=\"tb3\" x=\"472.0\" y=\"171.2\" font-size=\"9\" text-anchor=\"middle\">Industrial<\/text><text class=\"tl\" x=\"600\" y=\"73\" font-size=\"10\" text-anchor=\"start\" >← Functional<\/text><text class=\"tl\" x=\"600\" y=\"123\" font-size=\"10\" text-anchor=\"start\" >← Geographic<\/text><text class=\"tl\" x=\"600\" y=\"172\" font-size=\"10\" text-anchor=\"start\" >← Product<\/text><\/svg><figcaption>一家公司可以同时用好几种部门化：第一层按职能，生产下面按地区，工厂下面按产品。<\/figcaption><\/figure>\n\n<h3>Chain of command 指挥链（p.8–9）<\/h3>\n<p>从最高层到最底层一条<b>连续的权力线<\/b>，说明谁向谁汇报。<\/p>\n<ul>\n<li><b>Authority<\/b>（权力）：有权下命令并期望被服从<\/li>\n<li><b>Unity of command<\/b>（统一指挥）：每个下属只应该有<b>一个<\/b>上级<\/li>\n<li><b>Delegation<\/b>（授权）：把权力交给别人去完成特定任务，让员工自己做一些决定<\/li>\n<li><b>Line vs. staff<\/b>：实线 = 直接指挥链，有权力；虚线 = staff（助理、顾问）提供建议，<b>没有真正的权力<\/b><\/li>\n<\/ul><figure class=\"f9\"><svg viewBox=\"0 0 640 198\" role=\"img\" aria-label=\"Line and staff chart\"><rect class=\"bk\" x=\"265\" y=\"8\" width=\"110\" height=\"26\" rx=\"4\"/><text class=\"tbk\" x=\"320.0\" y=\"24.5\" font-size=\"10\" text-anchor=\"middle\">CEO<\/text><path class=\"dash\" d=\"M320 34 V48 M140 48 H500\"/><rect class=\"bs\" x=\"60\" y=\"40\" width=\"80\" height=\"26\" rx=\"4\"/><text class=\"tbs\" x=\"100.0\" y=\"56.1\" font-size=\"9\" text-anchor=\"middle\">HR (staff)<\/text><rect class=\"bs\" x=\"500\" y=\"40\" width=\"95\" height=\"26\" rx=\"4\"/><text class=\"tbs\" x=\"547.5\" y=\"51.1\" font-size=\"9\" text-anchor=\"middle\">Engineering<\/text><text class=\"tbs\" x=\"547.5\" y=\"61.1\" font-size=\"9\" text-anchor=\"middle\">(staff)<\/text><line class=\"ln\" x1=\"320\" y1=\"48\" x2=\"320\" y2=\"80\"/><path class=\"ln\" d=\"M320 80 V88.0 H200 V96\" fill=\"none\"/><rect class=\"b1\" x=\"150\" y=\"96\" width=\"100\" height=\"26\" rx=\"4\"/><text class=\"tb1\" x=\"200.0\" y=\"112.5\" font-size=\"10\" text-anchor=\"middle\">Division A<\/text><path class=\"ln\" d=\"M320 80 V88.0 H320 V96\" fill=\"none\"/><rect class=\"b1\" x=\"270\" y=\"96\" width=\"100\" height=\"26\" rx=\"4\"/><text class=\"tb1\" x=\"320.0\" y=\"112.5\" font-size=\"10\" text-anchor=\"middl
